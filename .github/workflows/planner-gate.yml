name: planner-gate

# ADR 0047: a pull request that changes the Planner is scored on the real model through the AI
# Singapore gateway, on the reply set's gate cases and the verifier's red-team set.
#
# Budget. The gateway key is the team lead's, with a small budget ($32, used up on 15 Nov 2026).
# So each run is capped at 200 calls and $3, the gate refuses a run with higher caps, and there
# is no scheduled run. The nightly runs ADR 0047 asks for, the judge, and its calibration against
# the team lead's labels (REPLY_JUDGE_AGREED) all wait for the team lead to set a budget.
on:
  pull_request:
    paths:
      - agent-runtime/src/agent_runtime/**
      - agent-runtime/evals/cases/reply.json
      - agent-runtime/evals/cases/red_team.json
  workflow_dispatch:
    inputs:
      model:
        description: The gateway model to gate. Empty uses PLANNER_GATE_MODEL, else Claude Sonnet 5.5 (ADR 0048).
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: planner-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  AGENT_MODEL_BASE_URL: https://llm-gateway.aisg.sg

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # A repository secret, so a branch of this repository can read it (ADR 0047). Without it
      # the gate cannot run, and says so instead of passing quietly.
      - name: Check the gateway key is set
        env:
          AGENT_MODEL_API_KEY: ${{ secrets.AISG_API_KEY }}
        run: |
          if [ -z "${AGENT_MODEL_API_KEY}" ]; then
            echo "::error::AISG_API_KEY is not set, so the Planner gate cannot run."
            exit 1
          fi

      # One model, no judge, and the run's own marker, because the gateway answers a repeated
      # request from its store. The caps match evals.gate's GATE_MAX_CALLS and GATE_MAX_DOLLARS.
      - name: Score the gate cases and the red-team set
        env:
          AGENT_MODEL_API_KEY: ${{ secrets.AISG_API_KEY }}
          GATEWAY_MODELS: ${{ inputs.model || vars.PLANNER_GATE_MODEL || 'claude-sonnet-5-5' }}
          EVAL_TEMPERATURE: ${{ vars.EVAL_TEMPERATURE }}
          EVAL_JUDGE: ''
          EVAL_JOBS: reply_gate,red_team
          EVAL_MAX_CALLS: '200'
          EVAL_MAX_DOLLARS: '3'
          EVAL_MARKER: gate-${{ github.run_id }}-${{ github.run_attempt }}
        run: scripts/evals.sh

      - name: Hold the run to the ADR's bars
        working-directory: agent-runtime
        run: |
          uv run --locked python -m evals.gate evals/out/results.json | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"

      - name: Keep the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: planner-gate
          path: agent-runtime/evals/out/
          if-no-files-found: ignore
