# Temporary: hunts the stream-start flake on fresh runners. Removed before the fix lands.
name: stress-stream

on:
  push:
    branches: [fix/cosmos-stream-test-flake]

permissions:
  contents: read

concurrency:
  group: stress-stream-${{ github.sha }}
  cancel-in-progress: false

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mode: repeat, shard: 1, reps: 20 }
          - { mode: repeat, shard: 2, reps: 20 }
          - { mode: file, shard: 1, reps: 0 }
          - { mode: suite, shard: 1, reps: 5 }
          - { mode: suite, shard: 2, reps: 5 }
          - { mode: suite, shard: 3, reps: 5 }
          - { mode: suite, shard: 4, reps: 5 }
    services:
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
      cosmos:
        image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview@sha256:db53613dae19d0a3d5ad50688d14aa6e957af082dafea56b52e1bd3a6b3f1406
        env:
          ENABLE_EXPLORER: "false"
          ENABLE_TELEMETRY: "false"
        ports:
          - 8081:8081
        options: --add-host packages.microsoft.com:127.0.0.1
    env:
      PLATFORM_TEST_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Build the test image
        run: docker build --target test --tag platform-api:test platform-api

      - name: Stress
        env:
          MODE: ${{ matrix.mode }}
          STRESS_REPS: ${{ matrix.reps }}
        run: |
          nproc; free -m
          vmstat -t 1 > vmstat.log 2>&1 &
          run() {
            docker run --rm --network host \
              --env PLATFORM_TEST_DATABASE_URL \
              --env COSMOS_ENDPOINT=http://127.0.0.1:8081 \
              --env STRESS_PROBE=1 \
              --env STRESS_REPS \
              --env CONTRACT_FIXTURES=/contracts/fixtures \
              --volume "$PWD/contracts:/contracts:ro" \
              --env MOCK_OIDC_CONFIG=/mock-oidc/config.json \
              --volume "$PWD/deploy/mock-oidc:/mock-oidc:ro" \
              --env MOCK_GITHUB_DIR=/mock-github \
              --volume "$PWD/e2e/mock_github:/mock-github:ro" \
              platform-api:test pytest -p no:cacheprovider -s --tb=short -rf "$@"
          }
          failures=0
          case "$MODE" in
            repeat) run tests/test_stress_stream.py || failures=$((failures + 1)) ;;
            file) for i in 1 2 3 4 5 6 7 8; do run tests/test_monitoring_http.py || failures=$((failures + 1)); done ;;
            suite) run || failures=$((failures + 1)) ;;
          esac
          echo "pytest runs that failed: $failures"
          kill %1 || true
          echo "busy seconds (idle under 10% or iowait over 20% or swap in/out):"
          awk 'NR>2 && ($15 < 10 || $16 > 20 || $7 > 0 || $8 > 0)' vmstat.log | head -80
          test "$failures" = 0

      - name: Keep vmstat
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vmstat-${{ matrix.mode }}-${{ matrix.shard }}
          path: vmstat.log
