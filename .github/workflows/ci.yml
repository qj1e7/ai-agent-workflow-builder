name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      live_grep:
        description: Run only the live browser specs whose title matches this pattern, without the API suite unless api_k is set, DAST or the load test. Empty runs everything.
        required: false
        default: ''
        type: string
      api_k:
        description: Run only the API e2e tests that match this pytest -k expression, without the browser suite unless live_grep is set, DAST or the load test. Empty runs everything.
        required: false
        default: ''
        type: string

permissions:
  contents: read

# A newer push cancels an older run's jobs, each in its own group, except scans. Nothing cancels
# scans, so every pushed head has its commits scanned once, even when a force-push replaces it.

env:
  SEMGREP_IMAGE: semgrep/semgrep:1.179.0@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.21.2@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46

# Each job starts its own runner and checks out the repo again, so stages are steps, not jobs.
jobs:
  checks:
    concurrency:
      group: ci-checks-${{ matrix.project }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    # The platform-api suite passed 3,000 tests and took 12 to 15 minutes on 15 Nov 2026.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [platform-api, agent-runtime, e2e]
    services:
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
      # An empty image starts no service, so the other legs do not pull it.
      cosmos:
        image: ${{ matrix.project == 'platform-api' && 'mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview@sha256:db53613dae19d0a3d5ad50688d14aa6e957af082dafea56b52e1bd3a6b3f1406' || '' }}
        env:
          ENABLE_EXPLORER: "false"
          ENABLE_TELEMETRY: "false"
        ports:
          - 8081:8081
        # The emulator upgrades its own packages at each start unless this name goes nowhere.
        options: --add-host packages.microsoft.com:127.0.0.1
    env:
      # The platform-api tests migrate a throwaway database and skip without one.
      PLATFORM_TEST_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Install
        working-directory: ${{ matrix.project }}
        run: uv sync --locked

      - name: Lint
        working-directory: ${{ matrix.project }}
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        working-directory: ${{ matrix.project }}
        run: uv run pyright

      # The platform-api tests search what its image holds; this searches the rest of the
      # checkout. Only the design records under docs/ may still name the tick (ENGINE-PLAN D20).
      - name: Nothing asks for the retired schedule tick
        if: matrix.project == 'e2e'
        working-directory: .
        run: |
          if git grep -n "/internal/v1/schedules/""tick" -- . ':!docs'; then
            echo "The schedule tick went in ENGINE-PLAN E10. Nothing may ask for it." >&2
            exit 1
          fi

      - name: n8n and bootstrap get the same guards, and the task runner holds none of n8n's secrets
        if: matrix.project == 'e2e'
        working-directory: .
        run: scripts/n8n-guards.sh

      # ADR 0054. The unit tests show the check fails on a real key or a way out. The check then
      # reads deploy/compose.simulation.yaml as compose renders it. The simulation job checks the
      # running stack.
      - name: The simulation n8n holds no real key and reaches only the mocks, as compose renders it
        if: matrix.project == 'e2e'
        working-directory: .
        run: |
          python3 -I -B -m unittest discover -s scripts -p test_simulation_isolation.py
          python3 -I -B scripts/simulation_isolation.py

      - name: Check import rules
        if: matrix.project == 'platform-api'
        working-directory: ${{ matrix.project }}
        run: uv run lint-imports

      - name: Check the generated contracts are current
        if: matrix.project != 'e2e'
        working-directory: ${{ matrix.project }}
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          uv run python -m "${PROJECT//-/_}.contracts" ../contracts
          if [ -n "$(git status --porcelain -- ../contracts)" ]; then
            git status --short -- ../contracts
            echo "contracts/ is out of date. Run the commands in contracts/README.md and commit." >&2
            exit 1
          fi
          uv run pytest tests/test_contracts.py

      - name: Unit tests in the image
        if: matrix.project != 'e2e'
        env:
          COSMOS_ENDPOINT: ${{ matrix.project == 'platform-api' && 'http://127.0.0.1:8081' || '' }}
          COSMOS_REQUIRED: ${{ matrix.project == 'platform-api' && '1' || '' }}
        run: |
          docker build --target test --tag ${{ matrix.project }}:test ${{ matrix.project }}
          docker run --rm --network host \
            --env PLATFORM_TEST_DATABASE_URL \
            --env COSMOS_ENDPOINT \
            --env COSMOS_REQUIRED \
            --env CONTRACT_FIXTURES=/contracts/fixtures \
            --volume "$PWD/contracts:/contracts:ro" \
            --env MOCK_OIDC_CONFIG=/mock-oidc/config.json \
            --volume "$PWD/deploy/mock-oidc:/mock-oidc:ro" \
            --env MOCK_GITHUB_DIR=/mock-github \
            --volume "$PWD/e2e/mock_github:/mock-github:ro" \
            ${{ matrix.project }}:test

      - name: The emulator kept the pinned image's packages
        if: matrix.project == 'platform-api'
        env:
          EMULATOR: ${{ job.services.cosmos.id }}
        run: |
          docker exec "$EMULATOR" cat /logs/package-updates.log | tee package-updates.log
          if grep -q Upgrading package-updates.log; then
            echo "The emulator upgraded its own packages, so its digest no longer pins it." >&2
            exit 1
          fi

      # agent-runtime's image carries contracts/n8n/catalogue.json (ADR 0051). platform-api's
      # Dockerfile names no such context, so the flag changes nothing there.
      - name: Build the runtime image
        if: matrix.project != 'e2e'
        run: |
          docker build --target runtime --build-context contracts=contracts \
            --tag ${{ matrix.project }}:runtime ${{ matrix.project }}

      - name: The runtime image carries the n8n block catalogue
        if: matrix.project == 'agent-runtime'
        run: docker run --rm agent-runtime:runtime python -m agent_runtime.catalogue

      - name: Mock GitHub, mock model, mock Confluence and mock Slack tests in their images
        if: matrix.project == 'e2e'
        run: |
          docker build --target test --tag mock-github:test e2e/mock_github
          docker run --rm mock-github:test
          docker build --target test --tag mock-model:test e2e/mock_model
          docker run --rm mock-model:test
          docker build --target test --tag mock-confluence:test e2e/mock_confluence
          docker run --rm mock-confluence:test
          docker build --target test --tag mock-slack:test e2e/mock_slack
          docker run --rm mock-slack:test

  portal:
    concurrency:
      group: ci-portal-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: portal/.nvmrc
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Sign-in settings in the nginx config
        run: |
          docker pull --quiet nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
          sh nginx/render.test.sh

  n8n-node-pack:
    concurrency:
      group: ci-n8n-node-pack-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: n8n-node-pack
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: n8n-node-pack/.nvmrc
          cache: npm
          cache-dependency-path: n8n-node-pack/package-lock.json

      # n8n-workflow pulls in isolated-vm, whose native build the pack never needs.
      - name: Install
        run: npm ci --ignore-scripts

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: The image builds on the n8n pin in infra/public-images.json
        working-directory: .
        run: |
          pin=$(jq -r '.n8n | "\(.repository):\(.tag)@\(.digest)"' infra/public-images.json)
          if ! grep -qxF "FROM $pin" deploy/n8n/Dockerfile; then
            echo "deploy/n8n/Dockerfile does not build on $pin from infra/public-images.json." >&2
            exit 1
          fi

      # The pin checks and the catalogue in the pack smoke run platform-api's code against what
      # the image serves and holds.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      # One start of the image also checks contracts/n8n/catalogue.json, and the defaults and the
      # task runner's config that spike P9 rests on (scripts/n8n-catalogue.sh, ADR 0051).
      - name: Pack smoke, n8n loads every built-in block but seven, the pin checks hold, and the catalogue is current
        working-directory: .
        run: scripts/pack-smoke.sh

  # The simulation n8n (ADR 0054) on its own network, with keys made up at the start. deploy/.env
  # holds the platform's keys, made up too, so the check can show none of them reaches it.
  simulation:
    concurrency:
      group: ci-simulation-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # ADR 0054. Bootstrap, four scenarios run by hand through the simulation gateway and a
      # version's copy with only mock keys (scripts/simulation_drive.py), then the isolation check
      # on the running stack, which also sees the mock keys the copy made.
      - name: The simulation n8n and its gateway hold no real key, reach only the mocks and play each scenario
        run: |
          deploy/make-env.sh
          scripts/simulation.sh test

  scans:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          # The commit scans read every commit of the pull request, so they need its history.
          fetch-depth: 0

      - name: SAST with Semgrep
        run: |
          docker run --rm --volume "$PWD:/src" --workdir /src "$SEMGREP_IMAGE" \
            semgrep scan \
              --config p/python --config p/dockerfile --config p/github-actions \
              --config p/typescript --config p/javascript --config p/react --config p/nginx --config p/terraform \
              --metrics=off --error --exclude docs \
              --sarif-output=semgrep.sarif .

      - name: Keep the Semgrep report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-report
          path: semgrep.sarif
          if-no-files-found: ignore

      - name: Secret scan with gitleaks
        if: ${{ !cancelled() }}
        run: |
          docker run --rm --volume "$PWD:/repo" "$GITLEAKS_IMAGE" \
            detect --no-git --source /repo --redact --verbose

      # A key added in one commit and removed in a later one is not in the files, but GitHub
      # keeps every commit of a pull request, even after a squash merge. A pull request's range is
      # its commits that are not on its base branch. A push's range is what it pushed. A manual
      # run's range is its branch's commits that are not on main.
      - name: Find the commits to scan
        id: range
        if: ${{ !cancelled() }}
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) base=$(git rev-parse "origin/$BASE_REF") head=$PR_HEAD ;;
            push) base=$BEFORE head=$GITHUB_SHA ;;
            *) base=$(git merge-base origin/main HEAD) head=$GITHUB_SHA ;;
          esac
          case "$base" in
            "" | *[!0]*) ;;
            *) base= ;;
          esac
          if [ -z "$base" ]; then
            echo "No range of commits is known for this run, so the commit scans skip it."
          else
            echo "Scanning the commits $base..$head."
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"

      - name: Test the commit scans
        if: ${{ !cancelled() }}
        run: python3 -I -B -m unittest discover -s scripts -p test_scan_commits.py

      # The main check of the commits. It reads every added line of every commit in the range,
      # a merge's own lines included, against the agent runtime's key shapes.
      - name: Key shapes in every commit in the range
        if: ${{ !cancelled() }}
        env:
          BASE: ${{ steps.range.outputs.base }}
          HEAD: ${{ steps.range.outputs.head }}
        run: python3 -I -B scripts/scan_commits.py "$BASE" "$HEAD"

      # The second check. gitleaks' default rules miss some keys, such as an Atlassian API token,
      # and it doesn't read a merge's own lines. The script fails when gitleaks can't read the range.
      - name: Secret scan of every commit in the range with gitleaks
        if: ${{ !cancelled() && steps.range.outputs.base != '' }}
        env:
          BASE: ${{ steps.range.outputs.base }}
          HEAD: ${{ steps.range.outputs.head }}
        run: scripts/gitleaks-commits.sh "$BASE" "$HEAD"

  e2e:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    concurrency:
      group: ci-e2e-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    # The browser suite alone took 27 minutes on 13 Nov 2026, then ZAP and k6 need about 8 more,
    # and the move from an old-engine database about 8.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Run the API tests, then the browser suite, against the whole stack
        env:
          LIVE_GREP: ${{ inputs.live_grep }}
          API_K: ${{ inputs.api_k }}
          E2E_SUITES: ${{ inputs.api_k != '' && inputs.live_grep != '' && 'api ui' || inputs.api_k != '' && 'api' || inputs.live_grep != '' && 'ui' || '' }}
        run: scripts/e2e.sh

      - name: Keep the stack and test logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-logs
          path: e2e/out/
          if-no-files-found: ignore

      - name: Keep the browser screenshots and video
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portal-live-evidence
          path: portal/e2e/out/live/
          if-no-files-found: ignore

      # A run that picks tests runs the move only when api_k names it, as in -f api_k=old_engine.
      - name: Move an old-engine database to the new engine, with its history
        if: ${{ !cancelled() && inputs.live_grep == '' && (inputs.api_k == '' || contains(inputs.api_k, 'old_engine')) }}
        env:
          E2E_SEED: old-engine
        run: scripts/e2e.sh

      - name: Keep the logs of the move
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-old-engine-logs
          path: e2e/out/
          if-no-files-found: ignore

      # DAST and the load test share this job and its Docker layer cache. A failed e2e run does not hide them.
      - name: DAST with OWASP ZAP against the whole stack
        if: ${{ !cancelled() && inputs.live_grep == '' && inputs.api_k == '' }}
        run: scripts/dast.sh

      - name: Keep the ZAP reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-reports
          path: dast/out/
          if-no-files-found: ignore

      - name: Load test with k6 against the whole stack
        if: ${{ !cancelled() && inputs.live_grep == '' && inputs.api_k == '' }}
        run: scripts/load.sh

      - name: Keep the k6 summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: k6-summary
          path: load/out/
          if-no-files-found: ignore
