name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SEMGREP_IMAGE: semgrep/semgrep:1.179.0@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.21.2@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46

# The private repo is billed per job, each rounded up to a whole minute, so stages are steps, not jobs.
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [platform-api, agent-runtime, e2e]
    services:
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
      # An empty image starts no service, so the other legs do not pull it.
      cosmos:
        image: ${{ matrix.project == 'platform-api' && 'mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview@sha256:db53613dae19d0a3d5ad50688d14aa6e957af082dafea56b52e1bd3a6b3f1406' || '' }}
        env:
          ENABLE_EXPLORER: "false"
          ENABLE_TELEMETRY: "false"
        ports:
          - 8081:8081
        # The emulator upgrades its own packages at each start unless this name goes nowhere.
        options: --add-host packages.microsoft.com:127.0.0.1
    env:
      # The platform-api tests migrate a throwaway database and skip without one.
      PLATFORM_TEST_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Install
        working-directory: ${{ matrix.project }}
        run: uv sync --locked

      - name: Lint
        working-directory: ${{ matrix.project }}
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        working-directory: ${{ matrix.project }}
        run: uv run pyright

      - name: Check import rules
        if: matrix.project == 'platform-api'
        working-directory: ${{ matrix.project }}
        run: uv run lint-imports

      - name: Check the generated contracts are current
        if: matrix.project != 'e2e'
        working-directory: ${{ matrix.project }}
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          uv run python -m "${PROJECT//-/_}.contracts" ../contracts
          if [ -n "$(git status --porcelain -- ../contracts)" ]; then
            git status --short -- ../contracts
            echo "contracts/ is out of date. Run the commands in contracts/README.md and commit." >&2
            exit 1
          fi
          uv run pytest tests/test_contracts.py

      - name: Unit tests in the image
        if: matrix.project != 'e2e'
        env:
          COSMOS_ENDPOINT: ${{ matrix.project == 'platform-api' && 'http://127.0.0.1:8081' || '' }}
          COSMOS_REQUIRED: ${{ matrix.project == 'platform-api' && '1' || '' }}
        run: |
          docker build --target test --tag ${{ matrix.project }}:test ${{ matrix.project }}
          docker run --rm --network host \
            --env PLATFORM_TEST_DATABASE_URL \
            --env COSMOS_ENDPOINT \
            --env COSMOS_REQUIRED \
            --env CONTRACT_FIXTURES=/contracts/fixtures \
            --volume "$PWD/contracts:/contracts:ro" \
            --env MOCK_OIDC_CONFIG=/mock-oidc/config.json \
            --volume "$PWD/deploy/mock-oidc:/mock-oidc:ro" \
            ${{ matrix.project }}:test

      - name: The emulator kept the pinned image's packages
        if: matrix.project == 'platform-api'
        env:
          EMULATOR: ${{ job.services.cosmos.id }}
        run: |
          docker exec "$EMULATOR" cat /logs/package-updates.log | tee package-updates.log
          if grep -q Upgrading package-updates.log; then
            echo "The emulator upgraded its own packages, so its digest no longer pins it." >&2
            exit 1
          fi

      - name: Build the runtime image
        if: matrix.project != 'e2e'
        run: docker build --target runtime --tag ${{ matrix.project }}:runtime ${{ matrix.project }}

      - name: Mock GitHub and mock model tests in their images
        if: matrix.project == 'e2e'
        run: |
          docker build --target test --tag mock-github:test e2e/mock_github
          docker run --rm mock-github:test
          docker build --target test --tag mock-model:test e2e/mock_model
          docker run --rm mock-model:test

  portal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: portal/.nvmrc
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Sign-in settings in the nginx config
        run: |
          docker pull --quiet nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
          sh nginx/render.test.sh

  scans:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: SAST with Semgrep
        run: |
          docker run --rm --volume "$PWD:/src" --workdir /src "$SEMGREP_IMAGE" \
            semgrep scan \
              --config p/python --config p/dockerfile --config p/github-actions \
              --config p/typescript --config p/javascript --config p/react --config p/nginx --config p/terraform \
              --metrics=off --error --exclude docs \
              --sarif-output=semgrep.sarif .

      - name: Keep the Semgrep report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-report
          path: semgrep.sarif
          if-no-files-found: ignore

      - name: Secret scan with gitleaks
        if: ${{ !cancelled() }}
        run: |
          docker run --rm --volume "$PWD:/repo" "$GITLEAKS_IMAGE" \
            detect --no-git --source /repo --redact --verbose

  e2e:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Run the API tests, then the browser suite, against the whole stack
        run: scripts/e2e.sh

      - name: Keep the stack and test logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-logs
          path: e2e/out/
          if-no-files-found: ignore

      - name: Keep the browser screenshots and video
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portal-live-evidence
          path: portal/e2e/out/live/
          if-no-files-found: ignore

      # DAST and the load test share this job and its Docker layer cache. A failed e2e run does not hide them.
      - name: DAST with OWASP ZAP against the whole stack
        if: ${{ !cancelled() }}
        run: scripts/dast.sh

      - name: Keep the ZAP reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-reports
          path: dast/out/
          if-no-files-found: ignore

      - name: Load test with k6 against the whole stack
        if: ${{ !cancelled() }}
        run: scripts/load.sh

      - name: Keep the k6 summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: k6-summary
          path: load/out/
          if-no-files-found: ignore
