name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SEMGREP_IMAGE: semgrep/semgrep:1.179.0@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.21.2@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46

# The private repo is billed per job, each rounded up to a whole minute, so stages are steps, not jobs.
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [platform-api, agent-runtime]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Install
        working-directory: ${{ matrix.project }}
        run: uv sync --locked

      - name: Lint
        working-directory: ${{ matrix.project }}
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Check import rules
        if: matrix.project == 'platform-api'
        working-directory: ${{ matrix.project }}
        run: uv run lint-imports

      - name: Unit tests in the image
        run: |
          docker build --target test --tag ${{ matrix.project }}:test ${{ matrix.project }}
          docker run --rm ${{ matrix.project }}:test

      - name: Build the runtime image
        run: docker build --target runtime --tag ${{ matrix.project }}:runtime ${{ matrix.project }}

  scans:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: SAST with Semgrep
        run: |
          docker run --rm --volume "$PWD:/src" --workdir /src "$SEMGREP_IMAGE" \
            semgrep scan \
              --config p/python --config p/dockerfile --config p/github-actions \
              --metrics=off --error --exclude docs \
              --sarif-output=semgrep.sarif .

      - name: Keep the Semgrep report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-report
          path: semgrep.sarif
          if-no-files-found: ignore

      - name: Secret scan with gitleaks
        if: ${{ !cancelled() }}
        run: |
          docker run --rm --volume "$PWD:/repo" "$GITLEAKS_IMAGE" \
            detect --no-git --source /repo --redact --verbose
