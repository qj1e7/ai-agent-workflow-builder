  }

  function schedEditor(id) {
    return `<div class="panel" style="margin-top:16px"><h2>Change schedule</h2>
      ${schedFields('sf', S.schedForm, S.schedErr)}
      <div class="btns"><button class="btn primary sm" data-act="saveSched" data-arg="${id}">Save</button><button class="btn sm" data-act="cancelSched">Cancel</button></div>
      ${id === 'sw' ? `<p class="note">Saving makes you the owner of this schedule. Its checks then count as your work, so you won’t be able to approve them.${apprOf('sw') && apprOf('sw').steps.some((s) => s.first === S.user || s.backup === S.user) ? ' You’re one of its Approvers now, so you’d be taken off and need to choose someone else.' : ''}</p>` : ''}</div>`;
  }

  /* ---------- Software watchlist (spec 11) ---------- */
  const LS_OLD = 'langchain-ai/langserve';
  const LS_NEW = 'langchain-ai/langchain';
  /* What the sample check found for the software that is up to date: the version we run, and its GitHub project. */
  const FIRST_CHECK = ['Redis', 'Nginx', 'Node.js'];
  const UP_NOW = { n8n: ['2.42.6', 'n8n-io/n8n'], PostgreSQL: ['16.4', 'postgres/postgres'], 'Spring Framework': ['6.1.12', 'spring-projects/spring-framework'], Terraform: ['1.9.5', 'hashicorp/terraform'], Keycloak: ['25.0.4', 'keycloak/keycloak'], Redis: ['7.4.0', 'redis/redis'], Nginx: ['1.27.1', 'nginx/nginx'], 'Node.js': ['22.8.0', 'nodejs/node'], Python: ['3.12.6', 'python/cpython'] };
  /* Adding software by name: one name can match more than one project, and a name the Planner knows may be published
     elsewhere than GitHub. Only GitHub releases are read today, so the guess is always a GitHub project. */
  const AMBIGUOUS = { kubernetes: [['kubernetes/kubernetes', 'Kubernetes itself'], ['kubernetes-client/python', 'The Python client library for Kubernetes']] };
  const GH_OF = { log4j: 'apache/logging-log4j2', spring: 'spring-projects/spring-framework', jackson: 'FasterXML/jackson-databind', express: 'expressjs/express', django: 'django/django', newtonsoft: 'JamesNK/Newtonsoft.Json' };
  function findProjects(name) {
    const low = name.toLowerCase();
    const amb = Object.keys(AMBIGUOUS).find((k) => low.includes(k));
    if (amb) return AMBIGUOUS[amb].map(([repo, what]) => ({ repo, what, how: 'Found by name on GitHub.' }));
    const key = Object.keys(KNOWN).find((k) => low.includes(k));
    if (!key) return [];
    const [, repo, kind, pkg] = KNOWN[key];
    const gh = kind && kind !== 'github' ? GH_OF[key] : repo;
    return gh ? [{ repo: gh, what: '', how: pkg ? `Found by name. Its ${srcName(pkg[0])} page links to this project.` : 'Found by name, in the projects I know.' }] : [];
  }
  /* GitHub projects that publish no releases, only tags. The check reads releases, so it can't watch them (spec 11). */
  const NO_RELEASES = ['python/cpython', 'postgres/postgres'];
  /* The row a GitHub project already has on the list, by the repository it reads. */
  const rowOfRepo = (repo) => watchRows().concat(S.added.map((a, i) => ({ key: `add${i}`, name: a.name, repo: a.repo }))).filter((r) => !S.removed.includes(r.key)).find((r) => r.repo.toLowerCase() === repo.toLowerCase());
  function newSwForm() { return { name: '', repo: '', ours: '', kind: 'github', step: 'name', matches: [], pick: -1, change: false }; }
  const ticketNote = (st) => ({ waiting: 'Ticket waiting for a yes', approved: null, declined: 'Proposed again next Monday' }[st]);

  /* Every software on the list, in the order the table shows it: a new version, can't check, not checked yet, up to date. */
  function watchRows() {
    if (S.firstDay) return [];
    const full = shows('registries');
    const tick = (key) => (S.sw === 'approved' ? ticketBtn(key) : `<div class="src">${ticketNote(S.sw)}</div>`);
    const newv = (key) => `<span class="pill wait">${I.clock(12)}New version</span>${tick(key)}`;
    const next = (why) => `<span class="pill off">Not checked yet</span><div class="src">${why || `Next check ${R('sw').next}`}</div>`;
    const lsFixed = S.lsFixed;
    const base = [
      { key: 'lj', name: 'Log4j core', repo: 'org.apache.logging.log4j:log4j-core', gh: 'apache/logging-log4j2', kind: 'maven', ours: '2.14.1', from: 'Given when added', newest: '2.25.2', cross: full ? 'Maven Central and GitHub agree' : '', rank: 0, status: `${newv('MOCK-16')}${full ? `<div class="src vuln">${I.alert(13)}<button class="linkbtn" data-act="toRisk" data-arg="lj">Critical security risk</button> ${PLANNED_TAG}</div>` : ''}` },
      { key: 'lg', name: 'LangGraph', repo: 'langchain-ai/langgraph', ours: '1.2.14', from: 'From MOCK-6, marked Done', newest: '1.2.17', cross: full ? 'GitHub and PyPI agree' : '', rank: 0, status: newv('MOCK-14') },
      { key: 'fa', name: 'FastAPI', kind: 'pypi', repo: 'fastapi', gh: 'fastapi/fastapi', ours: '0.118.0', from: 'From MOCK-9, marked Done', newest: '0.120.1', cross: full ? 'GitHub shows 0.120.2, not on PyPI yet. You install it from PyPI, so 0.120.1 counts.' : '', rank: 0, status: newv('MOCK-15') },
      { key: 'gr', name: 'Grafana', kind: 'docker', repo: 'grafana/grafana', gh: 'grafana/grafana', ours: '12.1.0', from: 'Given when added', newest: '?', rank: 1, status: `<span class="pill bad">${I.x(12)}Can’t check</span><div class="src">${full ? 'Docker Hub and GitHub didn’t answer.' : 'GitHub’s hourly limit was reached.'} It tries again next Monday.</div>` },
      { key: 'ls', name: 'LangServe', repo: lsFixed ? LS_NEW : LS_OLD, ours: '0.3.1', from: 'Given when added', newest: '?', rank: lsFixed ? 2 : 1,
        status: lsFixed ? next('Now read from the new address.') : `<span class="pill bad">${I.x(12)}Can’t check</span><div class="src">GitHub can’t find this project. It moved.</div>`,
        hist: [...(lsFixed ? [['Today', `${me().name} used the new address ${LS_NEW}, as the AI troubleshooter suggested.`]] : []), ['Mon 26 Oct', `Couldn’t check: GitHub can’t find ${LS_OLD}. The project moved to ${LS_NEW}.`], ['Thu 1 Oct', `Added by Alice with our version 0.3.1.`]] },
    ].map((r) => ({ ...r, ...rowSrc(r), rank: r.rank }));
    /* Redis, Nginx and Node.js were added with no version. The first check read their newest release, and the page says
       so: We run stays Not known, and nothing is recorded as the version the team runs (spec 11). */
    const ok = UP_TO_DATE.map((n) => {
      const [v, gh] = UP_NOW[n];
      const row = { key: `ok:${n}`, name: n, repo: gh, kind: 'github', ours: v, from: 'Given when added', newest: v, rank: 3, status: `<span class="pill ok">${I.check(12)}Up to date</span>`, hist: [['Mon 26 Oct', `Up to date at ${v}.`], ['Thu 1 Oct', `Added by Carol with our version ${v}.`]] };
      if (NO_RELEASES.includes(gh)) return { ...row, ours: 'Not known', from: 'Not given when added', newest: '?', rank: 1, status: `<span class="pill bad">${I.x(12)}Can’t check</span><div class="src">No release has a plain version number. It tries again next Monday.</div>`, hist: [['Mon 26 Oct', 'Couldn’t check: no release has a plain version number.'], ['Thu 1 Oct', 'Added by Carol. Our version wasn’t given.']] };
      if (FIRST_CHECK.includes(n)) return { ...row, ours: 'Not known', from: `Telling you about releases newer than ${v}, the newest the first check read`, status: `<span class="pill ok">${I.check(12)}Nothing newer yet</span>`, hist: [['Mon 26 Oct', `Checked. Nothing is newer than ${v}.`], ['Thu 1 Oct', `Added by Carol. Our version wasn’t given, so the check tells us about releases newer than ${v}, the newest the first check read.`]] };
      return row;
    });
    return base.concat(ok);
  }

  /* The count line the page opens with: what has a newer version and what can't be checked, from the same rows as the list. */
  function watchLine() {
    const live = swLive().concat(S.added.map((a, i) => ({ key: `add${i}`, rank: 2 })).filter((r) => !S.removed.includes(r.key)));
    const newer = behindRows().length;
    const cant = live.filter((r) => r.rank === 1).length;
    if (!live.length) return 'Everything your team runs, in one list.';
    return newer || cant ? [newer ? `${newer} ${newer === 1 ? 'has' : 'have'} a newer version` : '', cant ? `${cant} can’t be checked` : ''].filter(Boolean).join(' · ') : 'Everything is up to date.';
  }
  function softwareView() {
    const day1 = S.firstDay;
    const q = S.find.software.trim().toLowerCase();
    const hit = (name, repo) => !q || `${name} ${repo}`.toLowerCase().includes(q);
    const full = shows('registries');
    const op = me().op;
    const addedRows = S.added.map((a, i) => ({
      key: `add${i}`, name: a.name, kind: a.kind, repo: a.repo, ours: a.ours || 'Not known', from: a.ours ? 'Given when added' : 'Not given when added', newest: '?', rank: 2,
      status: `<span class="pill off">Not checked yet</span><div class="src">Next check ${R('sw').next}</div>`,
      hist: [['Today', `Added by ${nm(a.by)}${a.planner ? ` from the Planner. ${nm(a.by)} ${a.planner} ${esc(a.repo)}.` : a.how ? `. ${a.how}` : '.'} ${a.ours ? `Our version ${esc(a.ours)}.` : 'Our version wasn’t given, so the check tells us about releases newer than today’s.'}`]],
    }));
    const rows = watchRows().concat(addedRows).filter((r) => !S.removed.includes(r.key) && hit(r.name, r.repo)).sort((a, b) => a.rank - b.rank);
    const table = `<div class="scroll-x"><table class="sw-table" role="table"><thead role="rowgroup"><tr role="row"><th role="columnheader">Software</th><th role="columnheader">We run</th><th role="columnheader">Newest</th><th role="columnheader">Status</th><th role="columnheader"><span class="vh">Actions</span></th></tr></thead><tbody role="rowgroup" data-flip-group="swt:all">${rows.map((r) => {
      const open = S.swOpen === r.key;
      const hist = r.hist || history(r.key);
      return `<tr role="row" data-flip="sw:${r.key}"><td role="cell"><b>${esc(r.name)}</b><div class="src">Checked on ${srcName(r.kind || 'github')} · ${srcLink(r.kind, r.repo, esc(r.repo))}</div></td><td role="cell" data-label="We run" data-val="swv:${r.key}:ours">${esc(r.ours)}<div class="src">${r.from}</div></td><td role="cell" data-label="Newest" data-val="swv:${r.key}:new">${r.newest}${r.cross ? `<div class="src">${r.cross}</div>` : ''}</td><td role="cell" data-val="swv:${r.key}:st">${r.status}</td>
        <td role="cell" class="sw-acts"><button class="linkbtn" data-act="swHist" data-arg="${r.key}" aria-expanded="${open}"${open ? ` aria-controls="hist-${r.key}"` : ''}>${open ? 'Hide history' : 'History'}<span class="vh"> of ${esc(r.name)}</span></button>${op ? ` <button class="linkbtn" data-act="removeSw" data-arg="${r.key}">Remove<span class="vh"> ${esc(r.name)}</span></button>` : ''}</td></tr>
        ${open ? `<tr role="row" class="hist" id="hist-${r.key}" data-flip="swh:${r.key}" data-enter="reveal"><td role="cell" colspan="5"><ol class="timeline">${hist.map(([d, t]) => `<li><b>${d}</b><span>${t}</span></li>`).join('')}</ol></td></tr>` : ''}`;
    }).join('')}</tbody></table></div>`;
    const r = R('sw');
    const owner = nm(ownerOf('sw'));

    /* Needs attention: a yes that waits, software the check couldn't read, and with Planned features the findings. */
    const waiting = has('sw') && S.sw === 'waiting';
    const moved = lsProblem();
    const attn = [];
    /* One primary per state (rule 1): the decision comes first, so the address fix is primary only when there is none. */
    const deciding = waiting && canApprove('sw');
    if (waiting) attn.push(`<div class="apprbar">${I.shield(20)}<div><b>This week’s check wants to raise 3 upgrade tickets${urgentNote(', 1 of them urgent')}.</b><span>Started by ${nm(starterOf('sw'))}’s schedule, Mon 26 Oct, 9:00. ${askLine(req('sw'), S.user)}${namedTag(req('sw'))}</span></div>${canApprove('sw') ? '<button class="btn primary sm" data-act="run" data-arg="sw">Review and decide</button>' : `<span class="note">Waiting for ${whoOr(req('sw').may)}</span>`}</div>`);
    if (moved) attn.push(`<div class="attn" id="attn-ls">${face('trouble', 40)}<div><b>${moved.title}</b><span>${moved.body.replace(/<[^>]+>/g, '')}</span></div>${op ? (deciding ? firstButton(moved.actions) : firstButton(moved.actions).replace('class="btn sm"', 'class="btn primary sm"')) : '<span class="note">An Operator can fix this.</span>'}</div>`);
    const findings = full && rows.some((x) => x.key === 'lj') ? `<h3 class="attn-h">Security risks ${PLANNED_TAG}</h3>${riskCard('lj', waiting ? '<span class="pill wait">Ticket waiting for a yes</span>' : S.sw === 'approved' ? ticketBtn('MOCK-16') : '<span class="pill off">Proposed again next Monday</span>')}` : '';
    const ending = full && !day1 ? SUPPORT_ENDING.filter((x) => hit(x.name, '')) : [];
    const endingHtml = ending.length ? `<h3 class="attn-h">Support ending ${PLANNED_TAG}</h3><div class="panel"><p class="note">From endoflife.date, read by the Version checker. After these dates, these versions get no more fixes, including security fixes.</p><div class="rows">${ending.map((x) => `<div class="row"><div><div class="row-name">${x.name}</div><div class="row-sub">Security fixes end ${x.ends}, ${x.left}. ${extLink(`https://endoflife.date/${x.slug}`, 'Dates on endoflife.date', 'endoflife.date')}</div></div><span class="pill wait">${I.clock(12)}Plan an upgrade</span></div>`).join('')}</div></div>` : '';
    const attnSec = attn.length || findings || endingHtml ? `<section class="section" aria-labelledby="sw-attn-h"><h2 id="sw-attn-h">Needs attention <span class="count">${swAttnCount(hit)}</span></h2>${attn.join('')}${findings}${endingHtml}</section>` : '';

    /* Add software: a name, then a guess that says where it came from and was checked. */
    const f = S.swForm;
    const step = f.step || 'name';
    const ours = `<div class="field"><label for="sw-ours">Version we run <span class="muted">(optional)</span></label><input type="text" id="sw-ours" data-sw="ours" value="${esc(f.ours)}" placeholder="1.2.14"${fieldErr('sw-ours', '', 'Left empty, the first check takes the newest.')}</div>`;
    const repoField = (help) => { const [label, ph, h] = SRC_FIELD[f.kind || 'github']; return `<div class="field"><label for="sw-repo">${label}</label><input type="text" id="sw-repo" data-sw="repo" value="${esc(f.repo)}" placeholder="${ph}"${fieldErr('sw-repo', S.swErr.repo, help || h)}</div>`; };
    const kindField = full ? `<div class="field"><label for="sw-kind">Published on ${PLANNED_TAG}</label><select id="sw-kind" data-sw="kind">${sourcesShown().map((v) => opt(v, srcName(v), f.kind || 'github')).join('')}</select></div>` : '';
    let add = '';
    if (step === 'name') {
      add = `<form class="addname" data-submit="swFind" novalidate><div class="field"><label for="sw-name">Software name</label><input type="text" id="sw-name" data-sw="name" value="${esc(f.name)}" placeholder="Kubernetes"${fieldErr('sw-name', S.swErr.name, 'Type the name. I’ll find its GitHub project.')}</div><button type="submit" class="btn">Find it</button></form>`;
    } else {
      const m = f.matches;
      const nameLine = `<h3 id="sw-guess" tabindex="-1">${m.length ? `Adding ${esc(f.name.trim())}` : `I couldn’t find “${esc(f.name.trim())}”`}</h3>`;
      let body;
      if (!m.length) body = `<p class="small muted">Paste its GitHub link, or type owner/name.</p>${repoField('For example langchain-ai/langgraph.')}`;
      else if (f.change) body = `<p class="small muted">You’re choosing the project yourself.</p>${kindField}${repoField()}`;
      else if (m.length === 1) {
        const listed = rowOfRepo(m[0].repo);
        const verdict = NO_RELEASES.includes(m[0].repo) ? `<li>${I.alert(14)}<span>${esc(m[0].repo)} doesn’t publish releases on GitHub, which is the only place this check reads. It can’t be watched here.</span></li>`
          : listed ? `<li>${I.info(14)}<span>${esc(m[0].repo)} is already on the list as ${esc(listed.name)}. <button type="button" class="linkbtn" data-act="swShowRow" data-arg="${esc(m[0].repo)}">Show it on the list</button></span></li>`
            : `<li>${I.check(14)}<span>Checked just now. The project is on GitHub and publishes releases.</span></li>`;
        body = `<p class="guess-line"><b>${srcLink('github', m[0].repo, esc(m[0].repo))}</b></p><ul class="guess-why"><li>${I.info(14)}<span>${m[0].how}</span></li>${verdict}</ul>`;
      }
      else body = `<fieldset class="pick"><legend>Which one do you mean?</legend>${m.map((x, i) => `<label class="pickrow"><input type="radio" name="sw-pick" data-sw="pick" value="${i}"${f.pick === i ? ' checked' : ''}><span><b>${esc(x.repo)}</b><span class="small muted">${x.what}. ${x.how}</span></span></label>`).join('')}</fieldset>`;
      const ready = !m.length || f.change || f.pick >= 0;
      /* A project with no releases, or one already on the list, has nothing to confirm: only Change and Start again. */
      const blocked = m.length === 1 && !f.change && (NO_RELEASES.includes(m[0].repo) || rowOfRepo(m[0].repo));
      add = `<form class="guess" data-submit="swAdd" novalidate data-flip="swadd" data-enter="reveal">${nameLine}${body}${blocked ? '' : ours}
        <div class="btns">${blocked ? '' : `<button type="submit" class="btn primary"${ready ? '' : ' disabled'}>${m.length && !f.change && m.length === 1 ? 'Looks right, add it' : `Add ${esc(f.name.trim())}`}</button>`}${m.length === 1 && !f.change ? '<button type="button" class="btn" data-act="swChange">Change</button>' : ''}${m.length > 1 && !f.change ? '<button type="button" class="btn" data-act="swChange">None of these</button>' : ''}<button type="button" class="linkbtn" data-act="swReset">Start again</button></div>${m.length > 1 && !f.change && f.pick < 0 ? '<p class="small muted">Choose one to add it.</p>' : ''}</form>`;
    }
    const watching = `<section class="section" aria-labelledby="sww-h"><h2 id="sww-h" tabindex="-1">Software we watch <span class="count" data-val="sw:n">${rows.length}</span></h2>
      ${day1 ? '' : `<div class="findbar"><span class="findbox">${I.search()}<label class="vh" for="find-software">Find software</label><input type="search" id="find-software" data-find="software" placeholder="Find software" value="${esc(S.find.software)}"></span></div>`}
      ${rows.length ? `<div class="panel">${table}</div>` : day1 ? `<div class="quiet"><b>No software yet</b>Add the tools your team runs. Each one is checked every Monday for new releases on GitHub.${op ? '<div class="btns quiet-act"><button class="btn sm primary" data-act="focusAdd">Add your first software</button></div>' : ''}</div>`
        : '<div class="quiet"><b>Nothing matches</b>Try another name, or add it below.<div class="btns quiet-act"><button class="btn sm" data-act="clearFind" data-arg="software">Clear the search</button></div></div>'}
      ${op ? `<div class="addsw"><h3>Add software</h3>${add}</div>` : ''}</section>`;

    /* How it's checked: the schedule, who says yes, and the sources, each with the state the registry gives it. */
    const srcRow = (n, id) => { const s = capState(id); return `<li><span>${n}</span>${s === 'planned' && full ? PLANNED_TAG : `<span class="pill ${s === 'ready' ? 'ok' : s === 'planned' ? 'off' : 'wait'}">${s === 'ready' ? I.check(12) : ''}${stateWord(s, { source: true })}</span>`}</li>`; };
    const how = `<section class="section" aria-labelledby="sw-how-h"><h2 id="sw-how-h">How it’s checked</h2><div class="panel">
      ${day1 ? '<p><b>Every Monday at 9:00, Singapore time</b>, once you add software. One approval covers all the upgrade tickets.</p>'
        : `<p><b>${cap(r.when)}, ${TZ}.</b> One approval covers all the upgrade tickets. Next check ${r.next}.</p>
        <p class="small muted">Set by ${owner}. Its checks count as the work of ${whoAnd(partiesOf('sw'))}, who can’t approve them. Who approves: ${r.approves}.${apprOf('sw') ? ` ${PLANNED_TAG}` : ''}</p>`}
      <ul class="srcs" aria-label="Sources">${srcRow('GitHub releases', 'ghReleases')}${srcRow('Package registries', 'registries')}${srcRow('Security advisories', 'registries')}${srcRow('Support end dates', 'registries')}</ul>
      ${day1 || !op ? '' : `<div class="btns"><button class="btn sm" data-act="editSched" data-arg="sw">${I.edit()}Change schedule</button>${changeApproversBtn('sw', 'editAppr', 'btn sm')}</div>`}
      ${S.editing === 'sw' ? `<div data-flip="ed:s:sw" data-enter="reveal">${schedEditor('sw')}</div>` : ''}
      ${S.vers.sw ? `<h3>Versions</h3>${versionsList('sw')}` : ''}
      ${S.editingAppr === 'sw' ? `<div data-flip="ed:a:sw" data-enter="reveal">${apprEditor('sw')}</div>` : ''}
    </div></section>`;
    return `<div class="pagehead"><div><h1 tabindex="-1">Software watchlist</h1><p>${watchLine()}</p></div>
        ${day1 ? '' : '<button class="btn" data-act="checkNow">Check now</button>'}</div>
      ${attnSec}${watching}${how}
      <p class="note" style="margin-top:24px">Ask the Planner on Home for a release check, and it adds the software here.</p>`;
  }

  /* What happened to a workflow in n8n: the warning when a change removed the yes step, and every published change. */
  function n8nWarn(id) {
    const chg = S.n8nChg[id];
    return chg ? `<article class="task" style="margin-top:16px" data-flip="n8nchg:${id}" data-enter="reveal"><span class="ico wait">${I.alert(22)}</span><div class="task-body"><h2 class="task-title">${nm(chg.by)}’s change in n8n removed Ask for a yes</h2><div class="task-meta">Published ${chg.when}</div><p>The next run will stop before it changes anything, because nothing is written without a yes.</p><div class="btns">${me().op ? `<button class="btn${actionFor(id) ? '' : ' primary'}" data-act="n8nUndo" data-arg="${id}">Undo ${nm(chg.by)}’s change</button>` : ''}</div></div></article>` : '';
  }

  /* The status banner (spec 9): one sentence on the workflow's state and its one primary action, from the same facts as
     the list row. */
  function banner(id) {
    const st = status(id);
    const r = R(id);
    const text = S.paused[id] ? 'Paused. It won’t run until you resume it.'
      : id === 'issues' && S.issues === 'failed' ? `Stopped today at 8:00. ${jiraDown() ? 'Jira didn’t answer, and it still isn’t answering.' : 'Jira didn’t answer, and it’s answering again now.'}`
        : id === 'nudge' && S.nudge === 'failed' ? `Stopped on Fri 23 Oct at 16:00, on a ticket the platform couldn’t read.${S.report > 0 && S.report < 4 ? ` Reported to support as ${S.supportCase.id}.` : S.report === 4 ? ' The fix from support is live.' : ''}`
          : st.tone === 'ok' ? `On. Next run ${r.next}.` : cap(st.last.replace(/^(Mon 26 Oct|Today, retried after the fix|Test run today): /, ''));
    const act = actionFor(id);
    const tone = S.paused[id] ? 'off' : st.tone;
    const held = act || S.paused[id] || !['bad', 'off'].includes(st.tone) ? '' : heldWhy(id);
    const icon = tone === 'bad' ? I.alert(20) : tone === 'wait' ? I.lock(20) : tone === 'off' ? I.pause(20) : I.check(20);
    return `<div class="banner ${tone}" data-val="banner:${id}"><span class="banner-ic">${icon}</span><p>${text}${held ? ` ${held}` : ''}</p>${act ? `<div class="btns">${act}</div>` : ''}</div>`;
  }
  /* More actions: a menu with the quieter actions, Delete last and in red (spec 9). */
  /* Which workflows this prototype has a sample run for. Run now and See the run show only on these. */
  const hasRun = (id) => ['sw', 'issues', 'nudge', 'access'].includes(id) || (id === 'conf' && S.conf !== 'on');
  function moreMenu(id) {
    const open = S.menu === id;

    const held = S.n8n[id];

          ? `<button class="row-btn" data-act="watch" data-arg="${id}"><div><div class="row-name">${when}</div><div class="row-sub">${what}</div></div><span class="btns small" style="font-weight:700">See the run ${I.right(16)}</span></button>`
          : `<div class="row"><div><div class="row-name">${when}</div><div class="row-sub">${what}</div></div></div>`).join('')}</div>` : `<p class="muted">No runs yet. The first one is ${r.next}.</p>`}
        ${!hasRun(id) && (madeOf(id) || id === 'conf') ? '<p class="mocknote" role="note"><b>Test note</b>This prototype doesn’t simulate runs for workflows made on Home, so this page has no Run now and no test run. It isn’t part of the product.</p>' : ''}</div>
      ${versionsPanel(id)}
      <details class="tech" style="margin-top:16px" data-unbuilt="Technical details"><summary>Technical details</summary><div class="tech-body">

        ${shows('n8n') ? `<section data-unbuilt="n8n changes in the Portal (ADR 0026, 0027)"><h3>In n8n ${PLANNED_TAG}</h3><p>${held ? `${held.by === S.user ? 'You have' : `${nm(held.by)} has`} it open in n8n since ${held.since}.` : 'Nobody has it open in n8n.'}</p>${held && held.by === S.user ? `<div class="btns"><button class="btn sm" data-act="n8nGiveBack" data-arg="${id}">Give it back</button></div>` : ''}</section>

  }
  /* The live activity view of one run (spec 10): the headline, the station strip in plain words, then what needs the
     person. The agents' conversation follows the run (F-15): open while it goes, folded once it waits for a yes, stops
     or is done, so the decision, the AI troubleshooter or the outcome comes first. Show what each agent did opens or
     folds it, and that choice holds for the rest of the visit. */
  const runDetailOpen = () => (S.runDetail && S.runDetail.view === S.view ? S.runDetail.open : !!P.run && P.at < runModel(P.run).end);
  function runView(id) {
    const m = runModel(id);
    const r = R(m.workflow);
    const n = m.stations.length;
    const finished = P.at >= m.end;
    const stateOf = (s, i) => {
      if (i === m.fail && P.at >= i) return 'fail';
      if (s.skip && (P.at >= i || finished)) return 'skip';
      if (s.gate && i === m.end && m.state === 'waiting' && P.at >= i) return 'wait';
      if (s.gate && m.state === 'expired' && P.at >= i) return 'noans';
      if (i < P.at || (finished && i <= m.end)) return 'done';
      if (i === P.at) return 'now';
      return 'todo';
    };
    /* Each face says what that agent is doing in this run. Only the step running now moves. */

    const rec = reqRecord(m.workflow);
    const declined = !!rec && rec.state === 'declined';
    let lastAgent = -1;

      return 'idle';

      const st = stateOf(s, i);
      const dot = s.gate ? (st === 'wait' ? I.lock(18) : st === 'noans' ? I.clock(18) : I.shield(18)) : st === 'done' ? I.check(14) : st === 'fail' ? I.x(14) : '';
      const sub = st === 'skip' ? 'Not needed' : st === 'fail' ? 'Stopped here' : st === 'wait' ? 'Waiting for a yes' : st === 'noans' ? 'No answer' : s.sub || '';

      return `<li class="st ${st}${s.gate ? ' gate' : ''}${i === P.at && P.shown < P.at ? ' arrive' : ''}"${st === 'now' ? ' aria-current="step"' : ''}><div class="st-who">${s.gate ? '' : whoAvatar(s.who, 44, faceOf(s, i, st), `st:${id}:${i}`)}</div><div class="st-dotwrap"><span class="st-dot">${dot}</span></div><div class="st-label">${said ? `<span class="vh">${said}</span>` : ''}${s.label}${sub ? `<small>${sub}</small>` : ''}</div></li>`;
    }).join('');
    const msgs = m.stations.slice(0, Math.min(P.at, m.end) + 1).map((s) => s.msg).filter(Boolean);
    P.feedNext = msgs.length;
    P.latest = msgs.length ? `${feedName(msgs[msgs.length - 1].who)}: ${msgs[msgs.length - 1].text}` : '';
    const open = runDetailOpen();
    const chat = open ? msgs.map((g, i) => chatItem(g, i >= P.feedSeen, m)).join('') + (finished ? '' : chatTyping(m)) : '';
    /* While a finished run replays, the heading describes the replay, so it never claims "Done" before the line gets there. */
    const pillTone = !finished ? { tone: 'ok', label: 'Replaying' } : m.state === 'waiting' ? { tone: 'wait', label: 'Waiting for a yes' } : m.state === 'failed' ? { tone: 'bad', label: 'Stopped' } : m.state === 'expired' ? { tone: 'off', label: 'No answer' } : { tone: 'ok', label: 'Done' };
    const headline = finished ? m.headline : 'Replaying the run';
    const test = m.workflow === 'conf' ? '<span class="tag">Test run</span>' : BASE[m.workflow] && BASE[m.workflow].planned ? PLANNED_TAG : '';
    return `<button class="back" data-act="workflow" data-arg="${m.workflow}">${I.left(16)}${m.workflow === 'sw' ? 'Software watchlist' : esc(r.name)}</button>
      <div class="runhead">
        <div class="runhead-top"><div class="runtitle"><h1 tabindex="-1">${headline}</h1>${finished ? pill(pillTone) : `<span class="tag">${I.play(12)}Replaying</span>`}${test}</div></div>
        <p class="muted">${esc(r.name)}</p>
      </div>
      <div class="stage"><ol class="line" style="--n:${n}" aria-label="Steps of this run"><li class="line-track" aria-hidden="true"></li><li class="line-fill" aria-hidden="true" style="--f:${P.shown / (n - 1)}"></li>${line}</ol></div>
      ${finished ? `<ol class="chat" aria-label="What needs you">${chatAct(id, m)}</ol>` : ''}
      <div class="run-detail"><button class="btn sm" data-act="runDetail" aria-expanded="${open}" aria-controls="run-detail" data-unbuilt="Show what each agent did (the built run page always shows the chat)">${open ? 'Hide what each agent did' : 'Show what each agent did'}</button>
        ${open ? `<div id="run-detail" class="run-detail-body" data-pres="detail:${id}">
          <div class="btns" data-unbuilt="Replay and speed">${finished ? `<button class="btn sm" data-act="replay">${I.play(12)}Replay the run</button>` : ''}<div class="seg" role="group" aria-label="Speed">${['1x', '2x', 'instant'].map((sp) => `<button data-act="speed" data-arg="${sp}" aria-pressed="${P.speed === sp}">${sp === 'instant' ? 'Instant' : sp}</button>`).join('')}</div></div>

  const joinList = (word) => (xs) => (xs.length < 2 ? xs.join('') : `${xs.slice(0, -1).join(', ')} ${word} ${xs[xs.length - 1]}`);
  const andList = joinList('and');
  const orList = joinList('or');
  const chatAvatar = (w, state = 'idle') => (w === 'portal' || w === 'platform' ? `<span class="sysav app">${I.mark()}</span>` : w === 'gate' ? `<span class="sysav gate">${I.shield(20)}</span>` : face(w, 40, state));
  /* The run as a group chat. Events from the platform and the approval gate are quiet markers; agents speak in bubbles.

  function chatItem(g, isNew, m) {

  function chatAct(id, m) {

    return `<li class="cmsg typing" aria-hidden="true"><span class="cmsg-av">${chatAvatar(next.msg.who, next.msg.who === 'lead' ? 'thinking' : 'working')}</span><div class="cmsg-body"><span class="cmsg-who">${feedName(next.msg.who)} is working</span><div class="cmsg-bubble"><span class="dots"><i></i><i></i><i></i></span></div></div></li>`;
  }

  /* The approval panel (spec 10.4): what will change, why, who asked, what happens, and the reader's part. The platform
     checks the decision again on the server. This summary helps the reader; it is not the check. */
  function approvePanel(id, short) {
    const ok = canApprove(id);
    const why = partyWhy(id, S.user);
    const sw = id === 'sw';
    const w = sw ? null : id === 'nudge' ? NUDGE_WRITE : id === 'access' ? ACCESS_WRITE : confWrite(S.nr);
    const m = runModel(id);
    const body = id === 'nudge' ? nudgePreview() : id === 'access' ? accessPreview() : sw
      ? releases().map((x) => `<div class="ticket${x.urgent ? ' urgent' : ''}"><b>Upgrade ${x.tool} from ${x.from} to ${x.to}</b>${x.urgent ? `<span class="pill bad">${I.alert(12)}Urgent security fix</span> ${PLANNED_TAG}<div class="risk compact">${riskFacts(x.row, true)}</div>` : ''}

    const first = m.stations[0];
    const q = req(id);

        : ok ? 'You can decide because you didn’t set this up.'
          : me().ap ? `Only ${whoOr(q.may)} can decide this one.${apprOf(id) ? ` ${nm(ownerOf(id))} chose who approves this workflow.` : ''}`
            : 'Only an Approver can decide.';

      <dl class="qa"><dt>What will change</dt><dd><b>${sw ? '3 tickets will be created in Jira project MOCK on the practice Jira' : w.panelTitle}</b>${body}<p class="note">This is exactly what will be written, and nothing else.</p></dd></dl>

      <dl class="qa" data-unbuilt="Who asked, in the approval panel"><dt>Who asked</dt><dd>${esc(R(m.workflow).name)}, set up by ${nm(ownerOf(m.workflow))}. ${first.msg ? first.msg.text : ''}${first.sub ? ` (${first.sub})` : ''}</dd></dl>`}
      <dl class="qa"><dt>What happens</dt><dd><span>Nothing is written until you say yes. ${askLine(q, S.user, true)}${namedTag(q)} ${sw ? 'You approve or decline the whole check. If you decline, the tickets are proposed again next Monday.' : 'If you decline, the run stops there.'}</span></dd></dl>

    </div>`;
  }
  function actPanel(id, m) {
    if (m.state === 'waiting') return approvePanel(id);
    if (id === 'edit') {
      const wf = S.editRun.wf;
      const live = S.n8nChg[wf];
      return `<div class="panel">
        <dl class="qa"><dt>What happened</dt><dd>Carol’s change in n8n at 9:12 removed <b>Ask for a yes</b>. This run reached the step that makes changes without a yes, so it stopped there. Nothing was written.</dd></dl>
        <dl class="qa"><dt>What to do</dt><dd>${live ? 'Undo Carol’s change, or put the step back yourself in n8n.' : 'Carol’s change has been undone. The next run asks for a yes again.'}</dd></dl>
        ${live ? (me().op ? `<div class="btns"><button class="btn primary" data-act="n8nUndo" data-arg="${wf}">Undo Carol’s change</button><button class="btn" data-act="n8nAsk" data-arg="${wf}">Fix it in n8n${I.ext(14)}</button></div>` : '<p class="note">An Operator can undo the change.</p>') : ''}

        <dl class="qa"><dt>Can it be fixed safely</dt><dd>${t.safe}</dd></dl>
        <dl class="qa"><dt>What to do</dt><dd>${t.next}</dd></dl>
        ${t.act ? `<div class="btns">${me().op ? troubleBtn(t) : `<p class="note">${t.deny}</p>`}</div>` : ''}

        ${me().op ? `<div class="btns">${testAgain('Do a test run again')}${changeApproversBtn('conf', 'apprFromRun')}</div>${heldWhy('conf') ? `<p class="note">${heldWhy('conf')}</p>` : ''}` : ''}</div>`;

      sw: S.sw === 'approved'
        ? `<h2><span class="ok-mark">${I.check(18)}</span>Done</h2><p>${nm(S.swBy)} approved, and the platform created the tickets.</p><div class="result-chips">${ticketBtn('MOCK-16', 'Log4j core')}${ticketBtn('MOCK-14', 'LangGraph')}${ticketBtn('MOCK-15', 'FastAPI')}</div>`
        : `<h2>Declined</h2><p>${nm(S.swBy)} declined, so nothing was written. The tickets will be proposed again next Monday.</p>`,
      issues: `<h2><span class="ok-mark">${I.check(18)}</span>Done</h2><p>The retry read Jira. No tickets were created in the last day, so there was nothing to write.</p>`,
      nudge: S.nudge === 'approved'
        ? `<h2><span class="ok-mark">${I.check(18)}</span>Back to normal</h2><p>The fix from support is live, MOCK-31 was read without stopping the run, and ${nm(S.nudgeBy)} approved the summary.</p><div class="result-chips"><span class="pill ok">${I.check(12)}MOCK-34 created</span></div>`
        : `<h2>Declined</h2><p>${nm(S.nudgeBy)} declined, so nothing was written. The next summary runs on Friday.</p>`,
      conf: S.conf === 'declined' ? `<h2>Declined</h2><p>${nm(S.confBy)} declined, so nothing was written. Change what it does, or run the test again.</p>${me().op ? (heldWhy('conf') ? `<p class="note">${heldWhy('conf')}</p>` : `<div class="btns">${testAgain('Do a test run again')}</div>`) : ''}`
        : S.nr ? `<h2><span class="ok-mark">${I.check(18)}</span>Done</h2><p>${yesWho('conf')} approved, and the platform ${confWrite(S.nr).doneText}.</p><div class="result-chips"><span class="pill ok">${I.check(12)}${confWrite(S.nr).result}</span></div>` : '',
      access: S.access === 'approved'
        ? `<h2><span class="ok-mark">${I.check(18)}</span>Done</h2><p>${yesWho('access')} approved, and the platform removed access for 3 people. Their managers were told in Teams.</p>`
        : `<h2>Declined</h2><p>${nm(S.accessBy)} declined, so nothing was removed. The 3 people keep their access until the next review.</p>`,
    }[id];
    return `<div class="panel">${done}<div class="btns"><button class="btn" data-act="go" data-arg="home">Back to Home</button></div></div>`;
  }

  /* ---------- The set-up card's parts: the read-back chips and the understood sentence ---------- */
  const lc = (s) => s.charAt(0).toLowerCase() + s.slice(1);
  /* The schedule picker opens after Change or Another time. Otherwise the card asks for the time with choices (ADR 0043). */
  const whenShown = () => !!S.wiz.sched && !!S.wiz.whenOpen;
  const CHIP_HINT = { ok: 'your words', changed: 'chosen by you', missing: 'please choose', cant: 'can’t do this yet', filled: 'filled in by me' };
  function sentenceChip(r, text) {
    const hint = CHIP_HINT[r.state];
    if (!r.options) return `<span class="schip ${r.state}" title="${cap(hint)}">${text}</span>`;
    const inOpts = r.options.some(([v]) => v === r.selected);
    return `<span class="schip ${r.state}" title="${cap(hint)}"><span data-val="chip:${r.key}">${text}</span>${I.down(14)}<select id="fix-${r.key}" data-fix="${r.key}" aria-label="${r.label}: ${r.value ? esc(r.value) : 'not sure'}, ${hint}. Change it">${opt('', r.value ? 'Change…' : 'Choose…', inOpts ? null : '')}${r.options.map(([v, l]) => opt(v, l, inOpts ? r.selected : null)).join('')}</select></span>`;
  }
  /* Where the result goes (spec 7.1). One new Jira ticket is the only place built today, so its chip has nothing to
     choose: its editor says so in place, and offers Ask the team for any other place. */
  const DEST_ASK = 'Other places for a workflow’s result';
  const destChip = (r) => `<button type="button" class="schip ${r.state}" data-act="destOpen" aria-expanded="${!!S.wiz.destOpen}" aria-controls="destpick" title="${cap(CHIP_HINT[r.state])}. It’s written after a yes." aria-label="${r.label}: ${lc(r.value)}, ${CHIP_HINT[r.state]}, written after a yes. Change">${lc(r.value)}</button>`;
  function destEditor() {
    const f = draftNr();
    return `<div class="whenpick" id="destpick">
      <p><b>${DEST}</b> in ${f.project ? `Jira project ${esc(f.project)}` : 'the Jira project you choose'}, created only after an Approver says yes.</p>
      <p class="small muted">It’s the only place I can put the ${thingOf(f)} today. Other places, such as Teams or email, aren’t built yet.</p>
      <div class="btns"><button class="btn sm" data-act="destDone">Done</button>${sentToTeam(DEST_ASK) ? '<span class="pill wait">Asked the team</span>' : `<button class="linkbtn" data-act="teamReq" data-arg="${DEST_ASK}|wiz">Ask the team</button>`}</div>
    </div>`;
  }
  /* ---------- Every part of a request, marked (ADR 0043) ----------
     A part is { key, mark, label, body }. The mark is ok, a tick with what the Planner will do; no, a cross with the
     reason; or ask, a question with choice buttons. A card asks one question at a time. */
  const MARKS = { ok: [() => I.check(13), 'Will do'], no: [() => I.x(13), 'Can’t do'], ask: [() => '?', 'Question'] };
  const partRow = (p) => `<li class="part${p.mark === 'no' ? ' wide' : ''}" data-mark="${p.mark}" data-part="${p.key}"><span class="pmark" aria-hidden="true">${MARKS[p.mark][0]()}</span><span class="pk"><span class="vh">${MARKS[p.mark][1]}: </span>${p.label}</span><span class="pv">${p.body}</span></li>`;
  const partsList = (parts) => `<ul class="parts" aria-label="Each part of your request">${parts.map(partRow).join('')}</ul>`;
  /* A question and its choices. The choices are named by the question for a screen reader. */
  const askBody = (q, id) => `<span class="pq" id="${id}">${q.q}</span><span class="pick" role="group" aria-labelledby="${id}">${q.choices.map(([v, l]) => `<button type="button" class="chip" data-act="${q.act || 'answer'}" data-arg="${esc(v)}"${q.mid ? ` data-mid="${q.mid}"` : ''}>${esc(l)}</button>`).join('')}${q.more || ''}</span>`;
  /* Every clause no rule read, as a cross that quotes it. */
  const leftoverParts = (text, spans) => unheard(text, spans).map((w, i) => ({ key: `left${i}`, mark: 'no', label: quote(w), body: 'I didn’t follow this part.' }));
  const hasCross = (parts) => parts.filter((p) => p.mark === 'no').length;

  /* The set-up card asks its questions in the footer's order: when it runs (how often, the day, then the time, which is
     never guessed), then which tickets, the Jira project and what it does. */
  const Q_TIMES = ['08:00', '09:00', '13:00', '17:00'];
  const QUESTION = { tickets: 'Which tickets should it find?', project: 'Which Jira project should it use?', action: 'What should it do with them?' };
  function setupAsk() {
    const s = S.wiz.sched;
    if (!s.freq) return { key: 'when', q: 'How often should it run?', choices: Object.entries(FREQ_WORD).filter(([v]) => v !== 'month' || shows('monthly')).map(([v, l]) => [`freq:${v}`, l]) };
    if (s.freq === 'week' && !s.day) return { key: 'when', q: 'Which day should it run?', choices: DAYS.map((d) => [`day:${d}`, d]) };
    if (!s.time) return { key: 'when', q: 'What time should it run?', choices: Q_TIMES.map((x) => [`time:${x}`, clock(x)]), more: '<button type="button" class="chip" data-act="whenOpen" aria-expanded="false" aria-controls="whenpick">Another time</button>' };
    const row = intentRows().find((r) => r.state === 'missing');
    return row ? { key: row.key, q: row.note || QUESTION[row.key], choices: row.options.map(([v, l]) => [`${row.key}:${v}`, l]) } : null;
  }
  /* The set-up card's parts, in the order of the request's sentence, then whatever it can't do. Only the current
     question shows; the footer counts the rest. */
  function setupParts(mid) {
    const w = S.wiz;
    const it = w.intent || {};
    const k = Object.fromEntries(intentRows().map((r) => [r.key, r]));
    const q = setupAsk();
    const s = w.sched;
    const timeOk = !Object.keys(schedProblems(s)).length;
    const picker = whenShown() ? `<div class="whenpick" id="whenpick">${schedFields('sched', s, w.schedErr)}<div class="btns"><button class="btn sm" data-act="whenDone">Done</button></div></div>` : '';
    const parts = [];
    if (q && q.key === 'when') parts.push({ key: 'when', mark: 'ask', label: 'When', body: picker || askBody(q, `q-${mid}`) });
    else if (timeOk) {
      parts.push({ key: 'when', mark: 'ok', label: 'When', body: `<span data-val="when">${schedText(s)}, Singapore time</span>${picker || '<button class="btn sm" data-act="whenOpen" aria-expanded="false" aria-controls="whenpick">Change</button>'}` });
    }
    ['tickets', 'project', 'action'].forEach((key) => {
      const r = k[key];
      if (r.state === 'missing') { if (q && q.key === key) parts.push({ key, mark: 'ask', label: r.label, body: askBody(q, `q-${mid}`) }); return; }
      const text = key === 'project' ? `Jira project ${esc(r.value)}` : esc(r.value);
      parts.push({ key, mark: 'ok', label: r.label, body: `${sentenceChip(r, text)}${r.state === 'changed' && r.note ? `<span class="pnote">${r.note}</span>` : ''}` });
    });
    parts.push({ key: 'dest', mark: 'ok', label: k.dest.label, body: `${destChip(k.dest)}<span>after a yes</span>${w.destOpen ? destEditor() : ''}` });
    if (k.source) parts.push({ key: 'source', mark: 'no', label: `Reads ${esc(k.source.value)}`, body: `${k.source.note} ${sentToTeam(k.source.value) ? '<span class="pill wait">Asked the team</span>' : `<button class="linkbtn" data-act="teamReq" data-arg="${esc(k.source.value)}|wiz">Ask the team</button>`}` });
    const monthly = it.monthly && (w.text.match(/\b(?:every|each) month\b|\bmonthly\b/i) || [])[0];
    if (monthly) parts.push({ key: 'monthly', mark: 'no', label: quote(monthly), body: 'I can’t run things monthly yet.' });
    return parts.concat(leftoverParts(w.text, spansOf(w.text, [...HEARD.when, ...HEARD.setup])));
  }

  /* ---------- Ask the Planner ----------
     Every request gets one of five answers. classify() turns the text into one answer record, whose `kind` picks a
     row of ANSWERS: what the Planner says, which card it shows and the face it makes. The record is the card's data,
     kept on the message. A set-up card has no data of its own: it edits the one live draft in S.wiz, so the read-back
     rows, the plan and the schedule and Approver fields are the same code the workflow page uses. */
  const PROJECTS = ['MOCK', 'OPS', 'SUP'];
  /* What the Planner can't do, and the nearest thing it can. Each answer points at the capability in the registry, which
     gives the verb and the reason, and keeps its own alternative: a request the Planner can set up, with the result in
     a Jira ticket, the one place it can write today. */
  const INSTEAD = 'The same thing, with the result put in one Jira ticket, after a yes.';
  const CANT = {
    email: { cap: 'email', sys: 'Outlook email', cant: 'send email', why: 'Email isn’t on the team’s plan. Ask the team if you need it.', instead: INSTEAD, next: (t) => t.replace(/\be-?mail(?:\s+(?:me|us))?\b/i, 'make') },
    slack: { cap: 'email', sys: 'Slack', cant: 'post in Slack', why: 'Slack isn’t on the team’s plan. Ask the team if you need it.', instead: INSTEAD, next: (t) => t.replace(/\s*\b(in|on|to|into) slack\b/i, '') },
    teams: { cap: 'teamsPost', sys: 'Posting in Teams', instead: INSTEAD, next: (t) => t.replace(/\s*\b(in|on|to|into|via) (teams|(the |our )?[\w-]+ channel|(the |our )?team chat|chat)\b/i, '') },
    /* "Update the Confluence page with the closed tickets" becomes "list the closed tickets". */
    confluence: { cap: 'confluence', sys: 'Confluence', instead: INSTEAD, next: (t) => t.replace(/\b(update|edit|fill in|write)\s+(the |a |our )?(confluence |wiki )?(page|wiki)(\s+with)?\b/i, 'list').replace(/\s*\b(in|on|to|into) (confluence|(the |our )?wiki|(a |the )?(confluence |wiki )?page)\b/i, '') },
    nudge: { cap: 'teamsPost', sys: 'Posting in Teams', cant: 'message ticket owners', instead: 'List the same tickets in one Jira ticket, after a yes. Someone can then message them.', next: (t, it) => `${whenAsked(it) || 'Every week'}, list ${(it.tickets ? ticketLabel(it.tickets.kind, it.tickets.period) : 'the open tickets').toLowerCase()}` },
    /* Only people change tickets here, and nothing the registry can do comes close, so there is no alternative to offer. */
    tickets: { cap: 'tickets', sys: 'Changing tickets' },
    security: { cap: 'registries', sys: 'Checking security advisories' },
  };
  const cantOf = (what) => `I can’t ${CANT[what].cant || CAPS[CANT[what].cap].cant}${capState(CANT[what].cap) === 'planned' ? ' yet' : ''}`;
  /* "I can make that list, but I can't send email. Email isn't on the team's plan." The first half names the part the
     registry can do, only when that part sets up as it is (a.next), or the release watch a release request keeps
     (a.watch). Any other part the request needs comes first, so every missing part is named (spec 6.2). */
  function cantSay(a) {
    const k = CANT[a.what];
    const it = a.it || {};
    const w = a.watch;
    const part = w ? `I ${w.listed ? 'already watch' : 'can watch'} ${w.name || 'software'} for new releases on the Software watchlist, but `
      : a.next && (it.tickets || it.action === 'list' || it.action === 'summary') ? `I can ${it.action === 'summary' ? 'write that summary' : 'make that list'}, but ` : '';
    const also = a.also ? `${cantOf(a.also)}, and ` : it.needs && it.needs.length ? `${cantYet(it.needs)}, and ` : '';
    return `${part}${also}${cantOf(a.what)}. ${k.why || CAPS[k.cap].why}`;
  }
  /* Whether words set up cleanly: a set-up card with nothing the platform can't do (spec 6.4). It reads the verdict
     alone, and the verdict never checks an alternative, so checking one can't recurse whatever an alternative says. */
  const isSetup = (text) => { const t = (text || '').trim(); if (!t || UNSAFE.test(t)) return false; const it = parseIntent(t); return !it.badSource && taskAnswer(t, it).kind === 'setup'; };
  const sameWords = (a, b) => a.trim().replace(/[.!?\s]+$/, '').toLowerCase() === b.trim().replace(/[.!?\s]+$/, '').toLowerCase();
  /* An alternative is offered only when it is a different request that sets up cleanly. Otherwise the answer offers
     only Ask the team. */
  const offer = (a) => ({ ...a, next: a.next && !sameWords(a.next, a.text) && isSetup(a.next) ? a.next : '' });
  const cantAnswer = (what, t, it) => { const k = CANT[what]; return { kind: 'cant', what, sys: k.sys, text: t, it, next: k.next ? k.next(t, it) : '' }; };
  /* A tool that would be new in a system that is already connected. Drafting one widens what the safety checker allows,
     so until its ADR is accepted the tool is the team's decision (ADR 0037). The verb keeps reads like "list high
     priority tickets" out of it. Those are a part answer (parseIntent's needs). */
  const toolAskIn = (t) => WRITE_ASK.test(t) && TOOL_ASKS.find((x) => x.draft && x.re.test(t));
  const watchFor = (hit, text, word) => {
    if (hit && onList(hit[0])) return { kind: 'listed', name: hit[0], text, said: namedKey(text) };
    const name = hit ? hit[0] : cap(text.trim().replace(/[.?!]+$/, '').replace(/^(watch|track|keep track of)\s+/i, '').slice(0, 40));
    /* A known project on a registry counts as known only when registries are a source; otherwise the person gives its GitHub project. */
    const known = hit && (shows('registries') || !hit[2] || hit[2] === 'github');
    return { kind: 'watch', name, text, said: hit ? namedKey(text) : '', src: known ? hit[2] || 'github' : 'github', repo: known ? hit[1] : '', via: known && shows('registries') ? hit[3] : null, repoState: known ? 'guess' : 'edit', repoDraft: known ? hit[1] : '', version: '', newest: false, word, done: false };
  };
  /* Every other part of a release request is checked before the watchlist route (F-02, F-10): a security check, or a
     destination other than Jira, gets the same can't as any other request. Watching for new releases is the
     alternative. For a destination it is the part I can do; for a security check it is near only when the software is
     named. */
  function watchCant(t, hit) {
    const it = parseIntent(t);
    const parts = [isSecurityAsk(t) && 'security', it.dest && it.dest !== 'jira' && it.dest].filter(Boolean);
    if (!parts.length) return null;
    const name = hit ? hit[0] : '';
    const watch = capState('ghReleases') === 'ready' && (name || parts[0] !== 'security') ? { name, listed: !!name && onList(name) } : null;
    return { kind: 'cant', what: parts[0], also: parts[1] || '', sys: CANT[parts[0]].sys, text: t, it: {}, watch, next: watch && !watch.listed ? `Keep track of ${name || 'new'} releases` : '' };
  }
  /* Where the guess came from, and that it was checked, so the person confirms a fact and not a hunch. */
  const guessNote = (c) => `${c.via ? `From ${srcName(c.via[0])}’s ${esc(c.via[1])} package, which points to ${esc(c.repo)}.` : 'From our list of known projects.'} Checked: it exists and publishes ${c.src === 'github' ? 'releases' : `versions on ${srcName(c.src)}`}.`;
  /* A reply to the one chat question that backs out of it. */
  const BACK_OUT = /^(never ?mind|cancel|no( thanks| thank you)?|forget it|skip( it)?|nothing|stop|leave it|not now|none)\b[.!]?$/i;
  function classify(text, force) {
    const t = text.trim();
    const c = S.chat;
    if (force === 'setup') return startDraft(t, parseIntent(t));
    if (UNSAFE.test(t)) { const rest = t.replace(UNSAFE, '').replace(/\s{2,}/g, ' ').replace(/[,\s]+(and|but|then|so)?[,\s]*$/i, ''); return offer({ kind: 'refuse', text: t, next: rest }); }
    const hit = namedIn(t);
    const word = (t.match(RELEASE_WORDS) || [''])[0];
    if (c.pending === 'software') {
      c.pending = null;
      if (BACK_OUT.test(t)) return { kind: 'back' };
      /* A known name, or a short name-like reply, answers the question. Anything longer is a new request. */
      if (hit || (t.split(/\s+/).length <= 3 && !/ticket|jira|every|list|sum/i.test(t))) return watchCant(t, hit) || watchFor(hit, t, word);
    }
    /* Questions about her workflows (spec 6.2) are answered from platform state. Word rules stand in for the model. */
    const follow = followUp(t);
    if (follow) return follow;
    const about = aboutWorkflows(t);
    if (about) return about;
    const edit = editAnswer(t);
    if (edit) return edit;
    if (word || isSecurityAsk(t) || (hit && /keep track|\bwatch\b|\btrack\b|monitor/i.test(t))) {
      const cant = watchCant(t, hit);
      if (cant) return cant;
      if (hit) return watchFor(hit, t, word);
      c.pending = 'software';
      return { kind: 'which', word };
    }
    const it = parseIntent(t);
    const a = taskAnswer(t, it);
    return a.kind === 'setup' ? startDraft(t, it) : 'next' in a ? offer(a) : a;
  }
  /* The verdict for a task request, with no side effects: a set-up card, a can't, a part, Jira down, or the abilities.
     A can't or a part carries the alternative it would offer, unchecked; offer() checks it with these same rules, so
     the Planner never offers what it can't set up. */
  function taskAnswer(t, it) {
    if (it.dest && it.dest !== 'jira') return cantAnswer(it.dest, t, it);
    if (it.action === 'nudge') return cantAnswer('nudge', t, it);
    if (/\b(close|closes|delete|remove|edit|move|assign|reassign|resolve|archive)\b/i.test(t) && /ticket|issue|bug|story|task/i.test(t)) return cantAnswer('tickets', t, it);
    /* A request that needs what the Jira read can't give comes first, so the part offered never needs it again. The
       nearest set drops every filter the agents can't see; without the last update or past the newest 50, that is all
       open tickets. */
    const needs = it.needs || [];
    if (needs.length) {
      const verb = it.action === 'summary' ? 'sum up' : 'list';
      const when = whenAsked(it) || 'Every week';
      const older = needs.includes('older');
      const alt = older || !it.tickets ? 'the open tickets' : ticketLabel(it.tickets.kind, it.tickets.period).toLowerCase();
      const instead = older || needs.includes('updated') ? `${cap(verb)} ${alt} instead${older ? ', from the 50 newest' : ''}, in one Jira ticket, after a yes.` : `The same tickets, ${andList(needs.map((n) => NEEDS_WITHOUT[n]))}, in one Jira ticket, after a yes.`;
      return { kind: 'part', cap: NEEDS_CAP[needs[0]], can: older ? `${verb} open tickets` : 'find tickets by when they were created or closed', cant: cantYet(needs), instead, next: `${when}, ${verb} ${alt}`, text: t, it };
    }
    const ta = toolAskIn(t);
    if (ta) return { kind: 'part', cap: ta.draft, can: 'find these Jira tickets', cant: `not ${CAPS[ta.draft].cant}`, instead: 'The same tickets, without the component, after a yes.', next: t.replace(/\s*\b(in|into|under|with|to) (the )?[\w-]+ component\b/i, ''), text: t, it };
    const jiraAsk = it.tickets || it.action || it.freq || it.monthly || it.badSource || /ticket|jira|bug|summar|report|list|stale|closed|open/i.test(t);
    /* Jira is down: the Planner says so and offers to keep the request as a draft, instead of a card it can't check. */
    if (jiraAsk && jiraDown()) return { kind: 'down', text: t, it };
    if (jiraAsk) return { kind: 'setup' };
    return { kind: 'abilities', unknown: !/what can|what do you|help|can you|abilit/i.test(t) };
  }
  /* ---------- Answers about her workflows (spec 6.2, the three new kinds) ----------
     Check my workflows, why it stopped and what needs me read the same state as Workflows and Needs you. In the
     prototype, word rules pick them; in the built app, the model picks the kind and code fills it from platform-api. */
  const workflowNamed = (t) => routineIds().find((id) => t.toLowerCase().includes(R(id).name.toLowerCase()));
  /* A word that asks for a change, or for something to run on a schedule. A text with one is a command: it takes the
     command path and never a read-only answer, however politely or question-like it is put (the lesson of 8 to 9 Nov).
     "The run" is a noun, not a command. */
  const COMMAND = /\b(make|set|change|turn|pause|stop|delete|remove|create|add|watch|track|monitor|run|move|rename|switch|schedule|reschedule|resume|start|cancel|edit|update|upgrade|put|enable|disable|close|approve|decline|retry|report|send|post|e-?mail|raise|file|assign|every|daily|weekly|monthly)\b/i;
  const isCommand = (t) => COMMAND.test(t.replace(/\b(?:the|a|this|that|last|next|each|its|my) runs?\b/gi, ' '));
  /* "Is LangGraph up to date?": a software on the watchlist, one that isn't on it, or all of them. */
  const IS_CURRENT = /\b(?:is|are)\s+(.+?)\s+(?:up to date|current|behind|out of date|outdated|on the (?:latest|newest)(?: version)?|the (?:latest|newest)(?: version)?)\b/i;
  function softAbout(t) {
    const words = (t.match(IS_CURRENT) || [])[1] || t;
    const row = liveSoftware().find((x) => words.toLowerCase().includes(x.name.toLowerCase()));
    if (row) return { kind: 'data', looked: ['watchlist'], about: row.key };
    if (/\b(?:we|our software|software|tools?|everything|all|anything)\b/i.test(words)) return { kind: 'data', looked: ['watchlist'], behind: true };
    const k = namedIn(words);
    const name = k ? k[0] : cap(words.replace(/^(?:the|our|my)\s+/i, '').trim());
    return name.split(/\s+/).length <= 3 ? { kind: 'data', looked: ['watchlist'], notOn: name } : null;
  }
  /* Questions about her workflows and software, in any wording (spec 6.2, ADR 0043). Each route reads platform state,
     so it fails closed: a text with a change word is a command and goes on down the command path. A route's own words,
     such as "stop" in "why did it stop", are not counted as a command. */
  const ABOUT = [
