<title>AI Workflow Builder prototype, version 4 (redesign proposal)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-17 -63.5 270 270'%3E%3Crect x='-17' y='-63.5' width='270' height='270' rx='60' fill='%23fff'/%3E%3Cpath d='M30 57C34.5 75.5 34.5 75.5 53 80C34.5 84.5 34.5 84.5 30 103C25.5 84.5 25.5 84.5 7 80C25.5 75.5 25.5 75.5 30 57Z' fill='%23121417'/%3E%3Cg fill='%2302a7e1' stroke='%2302a7e1' stroke-width='6' stroke-linejoin='round'%3E%3Cpolygon points='52,58 94,58 116.6,89.4 94.4,121.6'/%3E%3Cpolygon points='132.6,140 117.6,97.5 182.7,3.5 226.8,3.5'/%3E%3C/g%3E%3C/svg%3E">

<style>
/* v3 look, "framed sheet": the Taste skill's app-screen rules, Emil Kowalski's motion rules and ibelick's UI Skills baseline, on the real Portal's typeface.
   Light only, on purpose: the page stays light whatever the viewer's theme. Running text is at least 4.5:1, secondary text about 7:1.
   The header and a thin frame share one blue-grey; the work sits on a white sheet. Teal is the one accent: the current tab, links and data.
   Colour goes on status and data, never on chrome. Cards are flat (a 1px edge, no shadow); only what floats casts a shadow. */
:root {
  color-scheme: light;
  --frame: #eef1f4;
  --bg: #ffffff;
  --surface: #ffffff;
  --sunk: #f3f5f7;
  --active: #e7ebef;
  --ink: #121417;
  --on-ink: #ffffff;
  --primary: #121417;
  --primary-hover: #2e3238;
  --muted: #4d535b;
  --rail: #c5cbd2;
  --edge: #7d858e;  /* edges a person must see, such as form fields: 3:1 or more on white and grey */
  --hair: #e1e5e9;
  --rule: #eaedf0;
  --link: #1b6c80;
  --accent: #1b6c80;
  --accent-soft: #e2f0f3;
  --accent-ink: #0f4a59;
  --nav-mark: #1b6c80;
  --brand: #02a7e1; /* NCS blue, for the logo only */
  --info-bg: #e9f3f5;
  --info-ink: #0f4a59;
  --float: 0 1px 2px rgba(18, 20, 23, 0.06), 0 12px 32px rgba(18, 20, 23, 0.14);
  --focus: #2f6bff;
  --amber: #e89a0c;
  --amber-ink: #7e4a00;
  --amber-soft: #fff6e0;
  --amber-line: #efd08c;
  --red: #c4242a;
  --red-ink: #a51f1f;
  --red-soft: #fdeeed;
  --red-line: #f2c4c1;
  --green: #1d7a42;
  --green-ink: #1b6b3b;
  --green-soft: #e6f4eb;
  --green-line: #b2dbbf;
  --on-status: #ffffff;
  --lead: #3e5bd8;
  --lead-tint: #dfe5ff;
  --checker: #0a7068;
  --checker-tint: #d3f0ec;
  --trouble: #7a4bd6;
  --trouble-tint: #ece3ff;
  --agent-1: #b02a6b;
  --agent-1-tint: #fbe3ee;
  --agent-2: #1f6f9f;
  --agent-2-tint: #ddeffb;
  --agent-3: #526d10;
  --agent-3-tint: #ebf2d3;
  --agent-4: #b2520a;
  --agent-4-tint: #ffe7d3;
  --face-ink: #16233a;
  --face-lens: rgba(255, 255, 255, 0.55);
  --person-1-bg: #ffe0cc;
  --person-1-ink: #7a3410;
  --person-2-bg: #d7e3ff;
  --person-2-ink: #1e3b8a;
  --person-3-bg: #d8efdf;
  --person-3-ink: #1d5a33;
  --person-4-bg: #f9dde8;
  --person-4-ink: #7a1f45;
  --mock-bg: #2a2140;
  --mock-ink: #f3efff;
  --mock-dim: #b9addb;
  --mock-on: #f3efff;
  --mock-on-ink: #2a2140;
  --scrim: rgba(15, 20, 28, 0.4);

  /* Radius is tight and chosen once: cards 8, controls and wells 6, the sheet 16. */
  --r-card: 8px;
  --r-ctl: 6px;
  --r-well: 6px;
  --r-sheet: 16px;

  /* One stacking scale; nothing uses a z-index outside it. */
  --z-raised: 1;
  --z-nav: 20;
  --z-safe-area: 30;
  --z-mock: 35;
  --z-scrim: 40;
  --z-overlay: 41;
  --z-toast: 45;

  --font: 'Atkinson Hyperlegible Next', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  /* Emil Kowalski's curves: a strong ease-out for anything entering or answering a press, ease-in-out for things moving on screen. */
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
  --ease-move: var(--ease-in-out);
  /* Motion durations. Every animation and transition uses one of these. */
  --dur-press: 120ms;   /* a control answers a press, hover or focus */
  --dur-small: 200ms;   /* something small appears, moves or changes */
  --dur-panel: 260ms;   /* a dialog, drawer or section opens */
  --dur-attn: 380ms;    /* something needs a look: a new error, a request waiting */
  --dur-success: 560ms; /* a one-off positive reaction, never longer than 600ms */
  --stagger: 40ms;      /* gap between cards arriving on a new screen */
  --move: var(--dur-panel); /* the run line travelling to the next step */
}
* { box-sizing: border-box; }
/* Keeps focused and scrolled-to things clear of the sticky header, and of the tab bar on a phone. */
html { scroll-padding-top: 84px; }
@media (max-width: 900px) { html { scroll-padding-top: 56px; } }
body {
  margin: 0; background: var(--frame); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.5;
  font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: var(--z-safe-area); background: var(--frame); }
h1, h2, h3, p, ul, ol, dl, dd { margin: 0; }
h1, h2, h3 { font-weight: 700; line-height: 1.2; text-wrap: balance; }
p, li, dd { text-wrap: pretty; }
h1 { font-size: 1.75rem; letter-spacing: -0.015em; }
h2 { font-size: 1.125rem; }
h3 { font-size: 1rem; }
ul, ol { padding: 0; list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.skiplink { position: fixed; left: 16px; top: -80px; z-index: var(--z-toast); padding: 10px 16px; border: 0; border-radius: var(--r-ctl); background: var(--primary); color: var(--on-ink); font: inherit; font-weight: 700; cursor: pointer; }
.skiplink:focus { top: 12px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Header: part of the frame. No rule under it in the sheet look; the sheet's own edge does that job. */
.hdr { position: sticky; top: env(safe-area-inset-top, 0px); z-index: var(--z-nav); background: var(--frame); border-bottom: 1px solid transparent; }
.hdr-in {
  max-width: 1198px; margin: 0 auto; min-height: 60px; display: flex; align-items: center; gap: 8px 24px; flex-wrap: wrap;
  padding-left: max(25px, env(safe-area-inset-left, 0px)); padding-right: max(25px, env(safe-area-inset-right, 0px));
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 1.125rem; background: none; border: 0; padding: 6px 0; cursor: pointer; }
.tools { margin-left: auto; display: flex; gap: 4px; align-items: center; }
/* Header tools are quiet: no box until you point at them. */
.iconbtn {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 40px; height: 40px; padding: 0 10px;
  border: 1px solid transparent; border-radius: var(--r-ctl); background: transparent; cursor: pointer; font-weight: 600; font-size: 0.9rem; color: var(--ink);
  transition: background-color var(--dur-press) ease, transform var(--dur-press) var(--ease-out);
}
.iconbtn:active { transform: scale(0.96); }
.iconbtn[aria-current="page"] { background: var(--active); }
/* The waiting count sits after the label ("Teams 1"), not on a corner: the button has no box for a corner badge to sit on. */
.badge {
  min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--amber);
  color: #1d1400; font-size: 0.75rem; font-weight: 700; display: inline-grid; place-items: center;
}
.me { display: flex; align-items: center; gap: 10px; padding: 3px 10px 3px 3px; border-radius: 999px; margin-left: 4px; }
.me b { display: block; font-size: 0.9rem; line-height: 1.2; }
.me small { display: block; font-size: 0.8125rem; color: var(--muted); line-height: 1.2; }
.pav { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; font-weight: 700; font-size: 0.9rem; flex: none; }
.pav.t1 { background: var(--person-1-bg); color: var(--person-1-ink); }
.pav.t2 { background: var(--person-2-bg); color: var(--person-2-ink); }
.pav.t3 { background: var(--person-3-bg); color: var(--person-3-ink); }
.pav.t4 { background: var(--person-4-bg); color: var(--person-4-ink); }
/* The header gives up text in steps as the screen narrows, so it stays on one row. Hidden text is still read out.
   The signed-in person's role is always read out but not shown; it also shows on hover. */
.me small { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-width: 1150px) { .me-text { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; } .me { padding-right: 3px; } }
@media (max-width: 1100px) { .iconbtn .lbl { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; } }
@media (min-width: 901px) and (max-width: 1045px), (max-width: 380px) { .brand-text { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; } }
@media (max-width: 900px) {
  .hdr-in { padding-block: 8px; gap: 6px 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .me-text, .iconbtn .lbl { display: none; }
  .brand { font-size: 1rem; }
  .brand-ai { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
}
/* The rail (ADR 0043): a slim column on the left with Chat, Workflows and Watchlist. On a phone it is a bar across the top. */
.shell { display: grid; grid-template-columns: 88px minmax(0, 1fr); align-items: start; }
.rail { position: sticky; top: calc(60px + env(safe-area-inset-top, 0px)); display: grid; gap: 4px; padding: 6px 6px 0 12px; }
.rail-a {
  position: relative; display: grid; justify-items: center; align-content: center; gap: 2px; min-height: 62px; padding: 6px 2px; border: 0; border-radius: var(--r-ctl);
  background: none; color: var(--muted); font-size: 0.8125rem; font-weight: 600; cursor: pointer; transition: background-color var(--dur-press) ease, color var(--dur-press) ease;
}
.rail-a[aria-current="page"] { color: var(--ink); background: var(--active); font-weight: 700; }
.rail-a[aria-current="page"] svg { color: var(--nav-mark); }
.rail-a .badge { position: absolute; top: 4px; left: calc(50% + 6px); }
@media (max-width: 900px) {
  .hdr { position: static; }
  .shell { display: block; }
  .rail { position: sticky; top: env(safe-area-inset-top, 0px); z-index: var(--z-nav); grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; padding: 0; background: var(--surface); border-top: 1px solid var(--hair); border-bottom: 1px solid var(--hair); }
  .rail-a { grid-auto-flow: column; justify-content: center; gap: 8px; min-height: 46px; padding: 0 4px; border-radius: 0; }
  .rail-a[aria-current="page"] { background: none; box-shadow: inset 0 -3px 0 var(--nav-mark); }
  .rail-a .badge { position: static; }
}

/* The sheet: the page sits on white, inset 8px from the frame, with a hairline edge and no shadow. dvh, not vh, so phone toolbars don't cut it. */
.sheet { margin: 0 8px 8px; min-height: calc(100dvh - 68px); background: var(--bg); border: 1px solid var(--hair); border-radius: var(--r-sheet); }
@media (max-width: 900px) { .sheet { margin: 0; border-width: 0; border-radius: 0; min-height: calc(100dvh - 106px); } }

/* Page */
.wrap {
  max-width: 1180px; margin: 0 auto; padding-block: 32px 150px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.narrow { max-width: 860px; margin: 0 auto; }
.pagehead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 28px; }
.pagehead p { color: var(--muted); margin-top: 6px; font-size: 1.05rem; max-width: 65ch; }
.eyebrow { font-size: 0.875rem; font-weight: 600; color: var(--muted); }
.back { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 14px; background: none; border: 0; padding: 4px 0; color: var(--muted); font-weight: 600; cursor: pointer; transition: color var(--dur-press) ease; }
.section { display: grid; gap: 12px; }
.section + .section { margin-top: 40px; }
.section > h2 { display: flex; align-items: center; gap: 10px; }
.count { display: inline-grid; place-items: center; min-width: 24px; height: 24px; padding: 0 7px; border-radius: 999px; background: var(--active); font-size: 0.8125rem; font-weight: 700; }
.muted { color: var(--muted); }
.small { font-size: 0.875rem; }

/* Buttons. A press scales to 0.97 so the screen answers the finger at once (Emil Kowalski); transitions name their properties. */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 16px; border: 1px solid var(--rail);
  border-radius: var(--r-ctl); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 0.95rem; cursor: pointer; white-space: nowrap; text-align: center;
  transition: transform var(--dur-press) var(--ease-out), background-color var(--dur-press) ease, border-color var(--dur-press) ease;
}
.btn:active:not([disabled], [aria-disabled="true"]) { transform: scale(0.97); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-ink); }
.btn.good { background: var(--green); border-color: var(--green); color: var(--on-status); }
.btn.bad { color: var(--red-ink); border-color: var(--red-line); }
.btn.sm { min-height: 34px; padding: 0 12px; font-size: 0.875rem; }
/* Disabled stays readable. The words around it say why. */
.btn[disabled], .btn[aria-disabled="true"] { background: var(--sunk); border-color: var(--hair); color: var(--muted); cursor: not-allowed; }
.btn.mock { border: 1.5px dashed var(--trouble); color: var(--trouble); background: transparent; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.linkbtn { display: inline-flex; align-items: center; min-height: 32px; margin: 0 -4px; background: none; border: 0; padding: 0 4px; color: var(--muted); text-decoration: underline; text-decoration-color: var(--rail); text-underline-offset: 3px; font-weight: 600; cursor: pointer; font-size: 0.9rem; transition: color var(--dur-press) ease, text-decoration-color var(--dur-press) ease; }

/* Hover only where there is a real pointer, so a tap on a phone doesn't leave a stuck hover. */
@media (hover: hover) and (pointer: fine) {
  .rail-a:hover { color: var(--ink); background: var(--active); }
  .iconbtn:hover { background: var(--active); }
  .back:hover { color: var(--ink); }
  .btn:hover { border-color: var(--muted); background: var(--sunk); }
  .btn.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
  .btn.good:hover { background: #17673a; border-color: #17673a; }
  .btn.bad:hover { background: var(--red-soft); border-color: var(--red); }
  .btn[disabled]:hover { background: var(--sunk); border-color: var(--hair); }
  .linkbtn:hover { color: var(--ink); text-decoration-color: currentColor; }
  .row-btn:hover { background: var(--sunk); }
  .agent-lg:hover, .tool-row:hover { border-color: var(--rail); }
  .wf-row:hover, .wf-add:hover { background: var(--sunk); }
  .schip:has(select):hover { border-color: currentColor; }
  .agent-chip:hover, .chip:hover, .filters button:hover { border-color: var(--ink); }
}

@media (pointer: coarse) {
  .btn, .btn.sm, .chip, .seg button, .rail-a, .linkbtn, .back, .iconbtn { min-height: 44px; }
}

/* Pills: a pale tint with dark text of the same hue. "On" is the normal state, so it stays grey. */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 1px 10px 1px 8px; border: 1px solid var(--hair); border-radius: 999px; font-size: 0.8125rem; font-weight: 600; white-space: nowrap; line-height: 1.6; flex: none; background: var(--surface); }
.pill.wait { color: var(--amber-ink); background: var(--amber-soft); border-color: var(--amber-line); }
.pill.bad { color: var(--red-ink); background: var(--red-soft); border-color: var(--red-line); }
.pill.ok { color: var(--green-ink); background: var(--green-soft); border-color: var(--green-line); }
.pill.off, .pill.on { color: var(--muted); background: var(--sunk); border-color: var(--hair); }
.pill.new { color: var(--accent-ink); background: var(--accent-soft); border-color: transparent; }
.tag { display: inline-flex; align-items: center; gap: 6px; padding: 1px 8px; border-radius: 4px; font-size: 0.8125rem; font-weight: 600; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.tag.write { background: var(--amber-soft); color: var(--amber-ink); }
.tag.read { background: var(--sunk); color: var(--muted); }
/* A planned design shown by the test control, never claimed by the product (spec 16). */
.tag.planned, .sched .tag.planned, .apprbar .tag.planned { display: inline-flex; width: auto; background: var(--mock-bg, #2b2160); color: #fff; font-size: 0.7rem; letter-spacing: 0.04em; text-transform: uppercase; vertical-align: middle; }
/* Mark what isn't built: the test control outlines each screen part the built Portal lacks, with the reason. */
.mark-unbuilt [data-unbuilt] { outline: 2px dashed #b4489a; outline-offset: 3px; position: relative; }
/* The label sits above its part's top edge and is as wide as its words, within the screen, so it stays readable on a small button. */
.mark-unbuilt [data-unbuilt]::before { content: 'Not built: ' attr(data-unbuilt); position: absolute; left: 0; top: -17px; z-index: 1; padding: 0 6px; border-radius: 4px; background: #b4489a; color: #fff; font-size: 0.68rem; font-weight: 700; line-height: 1.6; letter-spacing: 0.02em; white-space: nowrap; width: max-content; max-width: min(70vw, 360px); overflow: hidden; text-overflow: ellipsis; pointer-events: none; }

/* Home */
/* Home is one column. The most urgent item is a full card; the rest are one-line rows with one button each. */
.home { max-width: 820px; margin: 0 auto; }
.hello { margin-bottom: 28px; }
.hello h1 { font-size: 1.875rem; }
.hello p { font-size: 1.1rem; color: var(--muted); margin-top: 6px; max-width: 65ch; }
/* A task card: the status is one plain coloured icon in the gutter, not an icon in a tinted circle. */
.task {
  display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 14px; padding: 20px 24px 22px 20px; background: var(--surface);
  border: 1px solid var(--hair); border-radius: var(--r-card);
}
.task .ico { width: 20px; height: 24px; display: grid; place-items: center; }
.task .ico svg { width: 20px; height: 20px; }
.ico.wait { color: var(--amber-ink); }
.ico.bad { color: var(--red); }
.ico.ok { color: var(--green); }
.ico.tool { color: var(--muted); }
.task-body { display: grid; gap: 8px; min-width: 0; }
.task-title { font-size: 1.125rem; font-weight: 700; }
.task-meta { font-size: 0.875rem; color: var(--muted); }
.task .btns { margin-top: 6px; }
.says { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 10px; align-items: start; padding: 10px 14px 12px 10px; border-radius: var(--r-well); background: var(--sunk); font-size: 0.95rem; }
.says b { display: block; font-size: 0.8125rem; font-weight: 700; color: var(--muted); }
.mini-list { display: grid; gap: 4px; font-size: 0.95rem; }
.mini-list li { display: flex; gap: 8px; align-items: baseline; }
.mini-list li::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--muted); flex: none; transform: translateY(-3px); }
.coming { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; align-items: center; gap: 4px 10px; margin-top: 16px; padding: 10px 16px; border-radius: var(--r-well); background: var(--sunk); font-size: 0.9rem; color: var(--muted); }
.coming b { color: var(--ink); font-weight: 600; }
.coming + .section, .quiet-line + .section { margin-top: 32px; }
@media (max-width: 600px) { .coming { grid-template-columns: 16px minmax(0, 1fr); align-items: start; } .coming > svg { margin-top: 3px; } .coming > .linkbtn { grid-column: 2; justify-self: start; } }
.queue { margin-top: 4px; border: 1px solid var(--hair); border-radius: var(--r-card); background: var(--surface); }
.qrow { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 20px; }
.qrow + .qrow { border-top: 1px solid var(--rule); }
.qrow .ico { width: 20px; height: 24px; display: grid; place-items: center; align-self: start; }
.qrow .ico svg { width: 20px; height: 20px; }
.qrow-text { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; min-width: 0; }
.qrow-meta { font-size: 0.875rem; color: var(--muted); }

.chatdock { padding-block: 8px 16px; }
.pinned { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto auto; gap: 4px 12px; align-items: center; padding: 10px 14px; border: 1px solid var(--hair); border-radius: var(--r-card); background: var(--surface); }

/* Run page: the live activity view */
.runhead { display: grid; gap: 10px; margin-bottom: 8px; }
.runhead-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px 20px; }
.runtitle { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; min-width: 0; }
.runhead h1 { font-size: 1.875rem; font-weight: 700; }
.seg { display: inline-flex; padding: 3px; border-radius: calc(var(--r-ctl) + 3px); background: var(--sunk); }
.seg button { border: 0; background: none; padding: 6px 14px; border-radius: var(--r-ctl); font-weight: 600; color: var(--muted); cursor: pointer; min-height: 34px; transition: background-color var(--dur-press) ease, color var(--dur-press) ease, transform var(--dur-press) var(--ease-out); }

#decision:focus, .gate-said:focus { outline: none; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink), 0 1px 2px rgba(18, 20, 23, 0.06); }
.stage { padding: 24px 20px 20px; background: var(--surface); border: 1px solid var(--hair); border-radius: var(--r-card); margin: 20px 0 24px; }
.line { --ty: 91px; position: relative; display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); padding-top: 8px; }
.line-track, .line-fill { position: absolute; top: var(--ty); height: 3px; border-radius: 3px; left: calc(100% / var(--n) / 2); }
.line-track { right: calc(100% / var(--n) / 2); background: var(--hair); }
.line-fill { width: calc(100% - 100% / var(--n)); background: var(--ink); transform-origin: left center; transform: scaleX(var(--f)); transition: transform var(--move) var(--ease-move); }
.line-fill.broken { background: var(--ink); }
.st { position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; min-width: 0; }
.st-who { height: 56px; display: flex; align-items: flex-end; justify-content: center; }
.st-dotwrap { height: 38px; display: grid; place-items: center; }
.st-dot { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 2px dashed var(--edge); color: var(--muted); }
.st-label { font-weight: 600; font-size: 0.95rem; line-height: 1.25; padding: 0 4px; }
/* Cause, then effect: the line travels for --move, then the step it reaches lands and its message arrives. */
.st.arrive .st-dot, .st.arrive .st-who { animation: land var(--dur-small) var(--ease-out) var(--move) backwards; }
@keyframes land { from { opacity: 0.45; transform: scale(0.85); } }
.chat > .in { animation-delay: var(--move); animation-fill-mode: backwards; }
.st-label small { display: block; font-weight: 400; font-size: 0.85rem; color: var(--muted); margin-top: 3px; }
.st.todo .st-who { opacity: 0.45; }
.st.todo .st-label { color: var(--muted); }
.st.skip .st-who { opacity: 0.25; }
.st.skip .st-label { color: var(--muted); }
.st.done .st-dot { background: var(--ink); border: 2px solid var(--ink); color: var(--on-ink); }
/* The step happening now gets a crisp ring, not a glow. */
.st.now .st-dot { border: 2px solid var(--accent); background: var(--surface); outline: 2px solid var(--accent); outline-offset: 3px; }
.st.now .st-label { color: var(--ink); font-weight: 700; }
.st.now .st-who .pav { animation: bob 1.2s var(--ease-in-out) infinite alternate; }
/* The bob is a loop, so it stops while the line is scrolled out of view. */
.stage.offscreen .face *, .stage.offscreen .pav { animation-play-state: paused; }
.st.gate .st-dot { width: 38px; height: 38px; border: 2px solid var(--ink); background: var(--surface); color: var(--ink); }
.st.gate.wait .st-dot { background: var(--amber-soft); border-color: var(--amber); color: var(--amber-ink); outline: 2px solid var(--amber); outline-offset: 3px; }
.st.gate.done .st-dot { background: var(--green); border-color: var(--green); color: var(--on-status); }
.st.gate.skip .st-dot, .st.gate.todo .st-dot { border-style: dashed; border-color: var(--edge); color: var(--muted); }
.st.fail .st-dot { background: var(--red); border: 2px solid var(--red); color: var(--on-status); outline: 2px solid var(--red); outline-offset: 3px; }
.st.fail .st-label { color: var(--red-ink); }
@keyframes bob { from { transform: translateY(0); } to { transform: translateY(-4px); } }
@media (max-width: 760px) {
  .line { grid-template-columns: minmax(0, 1fr); padding-top: 0; }
  .line-track, .line-fill { top: 32px; left: 17px; width: 3px; height: auto; right: auto; }
  .line-track { bottom: 32px; }
  .line-fill { height: calc(100% - 64px); width: 3px; transform-origin: center top; transform: scaleY(var(--f)); }
  .st { flex-direction: row; text-align: left; height: 64px; gap: 12px; }

  .st-who .pav { width: 32px !important; height: 32px !important; }
  .st-label { order: 3; }
  .runhead h1 { font-size: 1.5rem; }

.tool-row { position: relative; display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1.4fr) minmax(0, 1fr); align-items: center; gap: 14px; padding: 12px 18px; border: 1px solid var(--hair); border-radius: var(--r-card); background: var(--surface); transition: border-color var(--dur-press) ease; }
.tool-row.team { grid-template-columns: minmax(0, 1fr) auto; background: var(--sunk); }
.tool-name { display: grid; gap: 2px; min-width: 0; }
.tool-name .rcard-link { font-weight: 700; }
.tool-name .rcard-link::after { border-radius: var(--r-card); }
.tool-ic { display: grid; place-items: center; width: 24px; height: 24px; color: var(--muted); flex: none; }
.tool-ic.write { color: var(--amber-ink); }
.tool-ic.lg { width: 48px; height: 48px; border-radius: var(--r-card); background: var(--sunk); color: var(--ink); }
.tool-ic.lg.write { background: var(--amber-soft); color: var(--amber-ink); }
.health { display: inline-flex; align-items: center; gap: 6px; font-size: 0.875rem; font-weight: 600; }
.health.ok { color: var(--green-ink); }
.health.warn { color: var(--amber-ink); }
.tool-status { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; padding: 12px 16px; border-radius: var(--r-card); border: 1px solid var(--green-line); background: var(--green-soft); }
.tool-status.warn { border-color: var(--amber-line); background: var(--amber-soft); }
.tool-status > div { display: grid; gap: 4px; flex: 1 1 260px; }
.checks.cant svg { color: var(--muted); }
.agent-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.agent-chip { display: inline-flex; align-items: center; gap: 8px; padding: 4px 14px 4px 4px; border: 1px solid var(--rail); border-radius: 999px; background: var(--surface); font: inherit; font-weight: 600; cursor: pointer; min-height: 44px; transition: border-color var(--dur-press) ease, transform var(--dur-press) var(--ease-out); }
.agent-chip:active { transform: scale(0.97); }
.dlg-back { margin-bottom: -6px; }
.agent-dlg .timeline li { grid-template-columns: 136px minmax(0, 1fr); }
@media (max-width:600px) { .agent-dlg .timeline li { grid-template-columns: minmax(0, 1fr); gap: 2px; } }
.tool-ask h2 { font-size: 1.05rem; margin: 0; }
@media (max-width:760px) { .tool-row, .tool-row.team { grid-template-columns: minmax(0, 1fr); gap: 6px; } }
.agentgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 16px; }
.agentgrid.duo { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 700px) { .agentgrid.duo { grid-template-columns: minmax(0, 1fr); } }
.agent-lg { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 18px 20px; border: 1px solid var(--hair); border-radius: var(--r-card); background: var(--surface); transition: border-color var(--dur-press) ease; }
.agent-lg .linkbtn, .agent-lg .btn { position: relative; z-index: var(--z-raised); }
.agent-lg p { margin: 0; }
.agent-lg > .btns:last-child { margin-top: auto; padding-top: 4px; }
.agent-top { display: flex; gap: 12px; align-items: center; }
.agent-top h3 { margin: 0; font-size: 1.05rem; }
.agent-tools .lab { font-weight: 600; font-size: 0.875rem; }
.agent-tools ul { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 6px; }
.agent-tools li { display: flex; gap: 8px; align-items: baseline; font-size: 0.9rem; }
.agent-tools .tag { flex: none; }
.preview { padding: 14px 16px; border-radius: var(--r-well); background: var(--sunk); font-size: 0.95rem; }
.preview ul { margin-top: 6px; display: grid; gap: 2px; }
.lock { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 10px; padding: 12px 14px; border-radius: var(--r-well); background: var(--sunk); font-size: 0.95rem; }
.note { font-size: 0.875rem; color: var(--muted); max-width: 75ch; }
.qa { display: grid; gap: 4px; }
.qa dt { font-size: 0.875rem; font-weight: 600; color: var(--muted); }
.qa dd { overflow-wrap: anywhere; }
@media (max-width: 480px) { .btn { white-space: normal; } }
.result-chips { display: flex; flex-wrap: wrap; gap: 8px; }
@media (pointer: coarse) { .result-chips .pillbtn { min-height: 44px; } }

/* Software */
.sched, .apprbar { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 14px 18px; border-radius: var(--r-card); margin-bottom: 24px; }
.sched { background: var(--surface); border: 1px solid var(--hair); }
.apprbar { background: var(--amber-soft); border: 1px solid var(--amber-line); color: var(--amber-ink); }
.sched span, .apprbar span { display: block; font-size: 0.875rem; }
.sched span { color: var(--muted); }
@media (max-width: 560px) { .sched, .apprbar { grid-template-columns: 24px minmax(0, 1fr); } .sched > :last-child, .apprbar > :last-child { grid-column: 2; justify-self: start; } }
.sw-table tr.hist td { border-top: 0; padding-top: 0; }
.timeline { display: grid; margin: 0 0 6px; padding: 10px 16px; background: var(--sunk); border-radius: var(--r-well); }
.timeline li { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; padding: 6px 0; font-size: 0.9rem; }
/* Needs attention, the add-by-name flow and the sources list on the watchlist */
.section > .apprbar { margin-bottom: 0; }
.attn { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 14px 18px; border: 1px solid var(--amber-line); border-radius: var(--r-card); background: var(--surface); }
.attn b { display: block; }
.attn span { display: block; font-size: 0.875rem; color: var(--muted); }
.attn .face { width: 40px; height: 40px; }
@media (max-width: 560px) { .attn { grid-template-columns: 40px minmax(0, 1fr); } .attn > :last-child { grid-column: 2; justify-self: start; } }
.attn-h { margin: 12px 0 0; font-size: 1rem; }
.addsw { display: grid; gap: 10px; margin-top: 12px; }
.addsw h3 { margin: 0; font-size: 1rem; }
.addname { display: grid; grid-template-columns: minmax(0, 320px) max-content; justify-content: start; gap: 12px; align-items: end; }
@media (max-width: 560px) { .addname { grid-template-columns: minmax(0, 1fr); } }
.guess { display: grid; gap: 12px; padding: 16px; border: 1px solid var(--hair); border-radius: var(--r-card); background: var(--sunk); max-width: 640px; }
.guess h3 { margin: 0; font-size: 1.05rem; }
.guess h3:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.guess .field input { max-width: 320px; }
.guess-line { margin: 0; font-size: 1.05rem; }
.guess-why { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 0.9rem; }
.guess-why li { display: flex; gap: 8px; align-items: flex-start; }
.guess-why svg { flex: none; margin-top: 3px; color: var(--muted); }
.pick { border: 0; margin: 0; padding: 0; display: grid; gap: 8px; }
.pick legend { font-weight: 600; padding: 0; margin-bottom: 4px; }
.pickrow { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; min-height: 44px; border: 1px solid var(--hair); border-radius: var(--r-card); background: var(--surface); cursor: pointer; }
.pickrow input { flex: none; width: 18px; height: 18px; margin: 3px 0 0; accent-color: var(--primary); }
.pickrow > span { display: grid; gap: 2px; }
.srcs { list-style: none; margin: 0; padding: 0; display: grid; border-top: 1px solid var(--rule); max-width: 520px; }
.srcs li { display: flex; flex-wrap: wrap; gap: 4px 12px; justify-content: space-between; align-items: center; padding: 8px 2px; border-bottom: 1px solid var(--rule); }

/* Forms, the tool card and the pieces the set-up card is built from */
.field { display: grid; gap: 8px; }
.field label, .field .lab { font-weight: 600; }
.field .help { font-size: 0.875rem; color: var(--muted); }
.err { display: flex; gap: 6px; align-items: center; color: var(--red-ink); font-size: 0.875rem; font-weight: 600; }
[aria-invalid="true"] { border-color: var(--red) !important; }
textarea, input[type="text"], input[type="password"], input[type="url"], input[type="email"], select {
  width: 100%; border: 1px solid var(--edge); border-radius: var(--r-ctl); background: var(--surface); padding: 10px 12px; font-size: 1rem; line-height: 1.5;
  transition: border-color var(--dur-press) ease;
}
textarea { min-height: 150px; resize: vertical; }
select { padding: 9px 12px; width: auto; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--rail); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: border-color var(--dur-press) ease, transform var(--dur-press) var(--ease-out); }
.chip:active { transform: scale(0.97); }
.bubble { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 12px; align-items: start; }
.bubble p { padding: 12px 16px; background: var(--lead-tint); color: #1b2a6b; border-radius: 4px 14px 14px 14px; font-size: 1rem; }
.kv { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 8px 16px; font-size: 0.95rem; }
.kv dt { color: var(--muted); font-weight: 600; }
@media (max-width: 560px) { .kv { grid-template-columns: minmax(0, 1fr); } .kv dd { margin-bottom: 6px; } }
.checks { display: grid; gap: 6px; }
.checks li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; font-size: 0.95rem; }
.checks svg { color: var(--green); margin-top: 2px; }
.wfoot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: center; margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--rule); }
/* A finished mark grows from 0.9, never from nothing. */
@keyframes pop { from { transform: scale(0.9); opacity: 0; } to { transform: none; opacity: 1; } }

/* Teams drawer, modal, toast: the only things that float, so the only things with a shadow. */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: var(--z-scrim); }
.scrim.in { animation: fade var(--dur-small) var(--ease-out); }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100%); z-index: var(--z-overlay); background: var(--sunk); border-left: 1px solid var(--hair);
  display: grid; grid-template-rows: auto auto 1fr; box-shadow: var(--float);
  padding-top: env(safe-area-inset-top, 0px); padding-right: env(safe-area-inset-right, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
/* The drawer slides in by its own width, on the iOS drawer curve. */
.drawer.in { animation: slide var(--dur-panel) var(--ease-drawer); }
@keyframes slide { from { transform: translateX(100%); } to { transform: none; } }
.drawer-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 18px; background: #4b53bc; color: #fff; }
.drawer-head b { font-size: 1.05rem; }
.drawer-head small { display: block; opacity: 0.85; font-size: 0.8rem; }
.drawer-head .iconbtn { background: transparent; border-color: rgba(255,255,255,.4); color: #fff; }
.drawer-head .iconbtn:focus-visible { outline-color: #fff; }
.chan { padding: 10px 18px; font-weight: 700; border-bottom: 1px solid var(--hair); background: var(--surface); }
.msgs { overflow-y: auto; padding: 16px 18px 40px; display: grid; gap: 16px; align-content: start; }
.msg { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 10px; }
.msg-card { background: var(--surface); border: 1px solid var(--hair); border-radius: var(--r-card); padding: 12px 14px; display: grid; gap: 10px; }
.msg-meta { font-size: 0.85rem; color: var(--muted); }
.msg-meta b { color: var(--ink); }
.dialog {
  position: fixed; z-index: var(--z-overlay); left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(560px, calc(100% - 32px)); max-height: calc(100% - 48px);
  overflow-y: auto; background: var(--surface); border-radius: 12px; box-shadow: var(--float); padding: 24px; display: grid; gap: 16px;
}
/* A dialog has no trigger to grow from, so it stays centred and grows from 0.96. */
.dialog.in { animation: dlg var(--dur-panel) var(--ease-out); }
/* One dialog leading to another (an agent to its tool, and Back) swaps its content instead of closing and opening. */
.dialog.swap > * { animation: fade var(--dur-small) var(--ease-out); }
/* A toast never covers a dialog's buttons. */
.dialog:not(.leave) ~ .toast { top: calc(16px + env(safe-area-inset-top, 0px)); bottom: auto; }
@keyframes dlg { from { opacity: 0; transform: translate(-50%, -50%) scale(0.96); } to { opacity: 1; transform: translate(-50%, -50%); } }
.toast {
  position: fixed; z-index: var(--z-toast); left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px));
  background: var(--primary); color: var(--on-ink); padding: 12px 18px; border-radius: 10px; font-weight: 600; box-shadow: var(--float);
  max-width: calc(100% - 32px);
}
.toast.in { animation: toast var(--dur-small) var(--ease-out); }
@keyframes toast { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }


/* Mock controls: not part of the app */
.mockbar {
  position: fixed; z-index: var(--z-mock); left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 14px; padding: 10px 14px; width: max-content; max-width: calc(100% - 24px);
  background: var(--mock-bg); color: var(--mock-ink); border-radius: 16px; box-shadow: 0 10px 30px rgba(20, 10, 50, 0.35); font-size: 0.85rem;
}
.mockbar .tagm { font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; font-size: 0.72rem; color: var(--mock-dim); }
.mockbar .grp { display: flex; align-items: center; gap: 6px; }
.mockbar .grp > span { color: var(--mock-dim); font-weight: 600; }
.mseg { display: inline-flex; border: 1px solid var(--mock-dim); border-radius: 10px; padding: 2px; }
.mseg button { border: 0; background: none; color: var(--mock-ink); font-weight: 700; padding: 5px 10px; border-radius: 8px; cursor: pointer; font-size: 0.82rem; white-space: nowrap; }
.mseg button[aria-pressed="true"] { background: var(--mock-on); color: var(--mock-on-ink); }
.mreset { border: 1px solid var(--mock-dim); background: none; color: var(--mock-ink); border-radius: 10px; padding: 5px 10px; font-weight: 700; cursor: pointer; font-size: 0.82rem; }
@media (max-width: 560px) { .mockbar .grp > span, .mockbar .hide-sm { display: none; } }

@media (max-width: 900px) {
  .toast { bottom: calc(100px + env(safe-area-inset-bottom, 0px)); }
}

/* v2: checking what was understood, schedules, search, support cases, test controls */
a { color: var(--link); font-weight: 600; text-decoration-color: color-mix(in srgb, currentColor 40%, transparent); text-underline-offset: 3px; transition: text-decoration-color var(--dur-press) ease; }
@media (hover: hover) and (pointer: fine) { a:hover { text-decoration-color: currentColor; } }
a svg { vertical-align: -2px; margin-left: 3px; }
.links { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 4px; font-size: 0.9rem; }
.pillbtn { font-family: inherit; cursor: pointer; }
.pillbtn:hover { text-decoration: underline; }
.asked { margin: 0; padding: 12px 16px; background: var(--sunk); border-radius: var(--r-well); font-size: 0.95rem; }
.asked span { display: block; font-size: 0.8125rem; font-weight: 600; color: var(--muted); margin-bottom: 2px; }
/* The set-up card's "What I understood", as one sentence. Each chip is a real select laid over its text, so it opens the native picker. */
.sentence-line { font-size: 1.1rem; line-height: 2.3; }
.schip { position: relative; display: inline-flex; align-items: center; gap: 4px; padding: 1px 10px; border: 1px solid; border-radius: 999px; font-size: 1rem; font-weight: 600; line-height: 1.7; transition: border-color var(--dur-press) ease; }
.schip > svg { flex: none; opacity: 0.7; }
.schip select { position: absolute; inset: 0; width: 100%; height: 100%; padding: 0; border: 0; opacity: 0; font-size: 16px; cursor: pointer; }
.schip:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; }
.schip.ok { color: var(--green-ink); background: var(--green-soft); border-color: var(--green-line); }
.schip.changed { color: var(--accent-ink); background: var(--accent-soft); border-color: #b9d9e0; }
.schip.missing { color: var(--amber-ink); background: var(--amber-soft); border-style: dashed; border-color: var(--amber); }
.schip.cant { color: var(--red-ink); background: var(--red-soft); border-color: var(--red-line); }
.schip.filled { color: var(--muted); background: var(--sunk); border-color: var(--hair); }
/* A chip keeps the punctuation after it on its own line. */
.glue { display: inline-flex; align-items: baseline; max-width: 100%; }
.snotes { display: grid; gap: 6px; }
button.schip { cursor: pointer; }
.whenpick { display: grid; gap: 10px; padding: 12px; border: 1px solid var(--rule); border-radius: var(--r-ctl); background: var(--sunk); }
.similar { display: flex; gap: 8px; align-items: flex-start; font-size: 0.9rem; color: var(--info-ink); }
.similar svg { flex: none; margin-top: 3px; }
.snotes li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; font-size: 0.9rem; color: var(--muted); }
.snotes svg { margin-top: 3px; }
.snotes .cant { color: var(--red-ink); }
.snotes .missing { color: var(--amber-ink); }
/* The edit card shows only what changes, before and after (ADR 0043). */
.ba { display: grid; grid-template-columns: 4.5rem minmax(0, 1fr); gap: 4px 12px; margin: 0; }
.ba dt { color: var(--muted); font-weight: 600; font-size: 0.9375rem; }
.ba dd { margin: 0; }
/* Each part of a request on a set-up card (ADR 0043): a tick, a cross or a question, never colour alone. */
.parts { display: grid; }
.part { display: grid; grid-template-columns: 22px 8.5rem minmax(0, 1fr); gap: 6px 12px; padding: 10px 16px; border-top: 1px solid var(--rule); align-items: start; }
.pmark { display: grid; place-items: center; width: 22px; height: 22px; margin-top: 3px; border-radius: 50%; font-size: 0.8125rem; font-weight: 800; line-height: 1; }
.part[data-mark="ok"] .pmark { color: var(--green-ink); background: var(--green-soft); }
.part[data-mark="no"] .pmark { color: var(--red-ink); background: var(--red-soft); }
.part[data-mark="ask"] .pmark { color: var(--amber-ink); background: var(--amber-soft); box-shadow: inset 0 0 0 1px var(--amber); }
.part[data-mark="ask"] { background: color-mix(in srgb, var(--amber-soft) 45%, var(--surface)); }
.pk { padding-top: 4px; color: var(--muted); font-weight: 600; font-size: 0.9375rem; overflow-wrap: anywhere; }
.pv { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; min-width: 0; min-height: 30px; }
.pv .schip { font-size: 0.9375rem; }
.part.wide .pk { grid-column: 2 / -1; color: var(--ink); }
.part.wide .pv { grid-column: 2 / -1; min-height: 0; color: var(--muted); font-size: 0.9375rem; }
.pq { flex-basis: 100%; font-weight: 600; }
.pick { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.pnote, .pv > .whenpick { flex-basis: 100%; }
.pnote { color: var(--muted); font-size: 0.875rem; }
@media (max-width: 600px) { .part { grid-template-columns: 22px minmax(0, 1fr); } .part .pv { grid-column: 2; } }
.notice { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; padding: 14px 16px; border-radius: var(--r-card); background: var(--info-bg); color: var(--info-ink); }
.notice .btns { margin-top: 10px; }
.checklist { display: grid; gap: 8px; }
.checklist li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; }
.checklist li svg { margin-top: 3px; }
.checklist li.ok svg { color: var(--green); }
.checklist li.changed svg { color: var(--accent); }
.sched-grid { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: flex-start; }
.sched-grid .field { min-width: 170px; }
.sched-grid select { width: 100%; }
.sched-grid input[type="time"] { width: auto; padding: 9px 12px; border: 1px solid var(--edge); border-radius: var(--r-ctl); }
.note svg { vertical-align: -3px; }
.findbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 20px; }
.findbox { display: flex; align-items: center; gap: 8px; padding: 0 12px; border: 1px solid var(--edge); border-radius: var(--r-ctl); background: var(--surface); width: min(100%, 320px); color: var(--muted); }
.findbox input { border: 0; padding: 8px 0; background: transparent; width: 100%; color: var(--ink); }
.findbox:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; }
.findbox input:focus-visible { outline: none; }
.filters { gap: 6px; }
.filters button { border: 1px solid var(--rail); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-weight: 600; cursor: pointer; min-height: 36px; transition: background-color var(--dur-press) ease, border-color var(--dur-press) ease, color var(--dur-press) ease; }
/* On a phone the Workflows search box and its filters reach 44 px. Scoped, because .filters button above outranks the shared coarse-pointer rule. */
@media (pointer: coarse) { .findbar .findbox input, .findbar .filters button { min-height: 44px; } }
.filters button[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--on-ink); }
.casebox { padding: 14px 16px; border: 1px solid var(--hair); border-radius: var(--r-card); background: var(--sunk); display: grid; gap: 8px; }
.case-top { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
.tech summary { cursor: pointer; font-weight: 600; color: var(--muted); }
.tech .checks { margin-top: 10px; }
.toast-act { margin-left: 14px; background: transparent; border: 1px solid var(--on-ink); color: var(--on-ink); border-radius: var(--r-ctl); padding: 4px 12px; font-weight: 700; cursor: pointer; }

/* ---------- Motion system ----------
   The prototype redraws the whole page on every change. Motion compares the page before and after a redraw

@keyframes dlg-out { from { opacity: 1; transform: translate(-50%, -50%); } to { opacity: 0; transform: translate(-50%, -50%) scale(0.97); } }

.drawer.leave { animation: slide-out 220ms var(--ease-drawer) both; }
@keyframes slide-out { to { transform: translateX(100%); } }
.toast.leave { animation: toast-out 180ms ease-in both; }

.sent-mark.m-reveal { animation: pop var(--dur-success) var(--ease-out) both; animation-delay: var(--ad, 0ms); }

/* ---------- Agents: the Visor bot and the Orbs, driven by the real state of the work ----------
   The Planner is the Visor bot. Every other agent is a flat Orb in its own colour, with a badge for its job.
   idle      calm. Where one agent is the focus (.live): it breathes once when it appears, then holds still.
   listening the Visor bot leans in, its eyes follow the text and its ear lights pulse on each key. While you type.
   thinking  3 dots. They replace the Visor bot's mouth; an Orb's light swirls. The Planner reading a request.
   speaking  a sound-wave mouth on the visor, while the Planner's reply is written word by word.
   working   eyes scan, and an Orb's light circles. The step running now.
   waiting   eyes up, still, with an amber badge. Its work waits for a yes.
   success   happy eyes, one quick lift and a green check, then back to idle. Its work went through.
   sorry     slanted eyes for a moment, then idle. The Planner when it can't do a request.
   error     one worried flinch, then a red badge that stays. Its step stopped.
   stopped   eyes closed, grey. The workflow is paused, the step wasn't needed, or nobody answered.

.face { overflow: visible; transition: transform var(--dur-press) var(--ease-out); }

.face .f-b { transform-box: view-box; transform-origin: 24px 26px; transition: transform var(--dur-small) var(--ease-out); }
.face .f-spin { transform-box: view-box; transform-origin: 24px 25px; }

.face.fs-listening .f-eyes { transform: translate(var(--lx, 0px), var(--ly, 0px)); transition: transform 140ms var(--ease-out); }
.face .f-ear.on { animation: ping 320ms var(--ease-out); }

.face .f-think circle { fill: var(--muted); animation: think 1.5s ease-in-out infinite; }
.face .f-think circle:nth-child(2) { animation-delay: 0.2s; }
.face .f-think circle:nth-child(3) { animation-delay: 0.4s; }
@keyframes think { 0%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
.face.fs-thinking .f-spin, .face.fs-working .f-spin { animation: orbit 1.6s linear infinite; }
@keyframes orbit { to { transform: rotate(360deg); } }
.face.fs-working .f-eyes { animation: scan 1.6s var(--ease-in-out) infinite alternate; }
@keyframes scan { from { transform: translateX(-1.4px); } to { transform: translateX(1.4px); } }
.face .f-wave rect { animation: talk 300ms ease-in-out infinite alternate; }
.face .f-wave rect:nth-child(2) { animation-delay: 0.1s; }
.face .f-wave rect:nth-child(3) { animation-delay: 0.2s; }
.face .f-wave rect:nth-child(4) { animation-delay: 0.05s; }
.face .f-wave rect:nth-child(5) { animation-delay: 0.15s; }
@keyframes talk { from { transform: scaleY(0.3); } to { transform: scaleY(1); } }
.face.fs-sorry .f-b { transform: rotate(-6deg) translateY(1px); }
.face.react.fs-sorry .f-b { animation: tilt var(--dur-attn) var(--ease-out) both; animation-delay: var(--ad, 0ms); }
@keyframes tilt { from { transform: none; } to { transform: rotate(-6deg) translateY(1px); } }
.face.react.fs-waiting .f-badge, .face.react.fs-error .f-badge { animation: badge-in var(--dur-attn) var(--ease-out) both; animation-delay: var(--ad, 0ms); }
@keyframes badge-in { from { opacity: 0; transform: scale(0.4); } to { opacity: 1; transform: none; } }
.face.react.fs-error .f-b { animation: concern var(--dur-attn) var(--ease-out) both; animation-delay: var(--ad, 0ms); }

.face .f-ok, .face .f-happy { opacity: 0; }
.face.react.fs-success .f-ok { animation: ok-badge var(--dur-success) var(--ease-out) both; animation-delay: var(--ad, 0ms); }
@keyframes ok-badge { 0% { opacity: 0; transform: scale(0.4); } 30%, 75% { opacity: 1; transform: none; } 100% { opacity: 0; transform: none; } }
.face.react.fs-success .f-happy { animation: shown var(--dur-success) ease-out both; animation-delay: var(--ad, 0ms); }
.face.react.fs-success .f-eyes { animation: hidden var(--dur-success) ease-out both; animation-delay: var(--ad, 0ms); }
@keyframes shown { 0%, 100% { opacity: 0; } 15%, 80% { opacity: 1; } }

.facesfig .fs-success .f-eyes { opacity: 0; }

  const DAY_START = 9;
