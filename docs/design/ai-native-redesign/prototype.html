    const fixed = k === 'jiraRead' && S.report === 4;
    if (S.toolChecks[k] === 'done') return i.checkBad && !fixed && !S.firstDay ? { ok: false, text: `Checked just now. ${i.checkBad}` } : { ok: true, text: `Checked just now. ${i.check}` };
    if (i.problem && !fixed && !S.firstDay) return { ok: false, text: i.problem + (k === 'jiraRead' && S.report > 0 ? ` Reported to support as case ${S.supportCase.id}.` : '') };
    const l = toolLog(k);
    return { ok: true, text: l.length ? `Last used ${l[0][0].replace(/, \d+:\d+$/, '').replace('Today', 'today')}.` : 'Ready. Not used yet.' };
  }
  function toolRow(k) {
    const [n, kind, x] = TOOLS[k];
    const users = toolUsers(k);
    const st = toolState(k);
    const h = st === 'ok' && !toolPlanned(k) ? toolHealth(k) : null;
    return `<li class="tool-row">
      <div class="tool-name"><button class="rcard-link" data-act="toolOpen" data-arg="${k}">${n}</button><span class="small muted">${TOOL_INFO[k].sys}</span></div>
      <span class="small">${kind === 'write' ? `<span class="tag write">Needs a yes</span> <span class="muted">${x}</span>` : '<span class="tag read">Reads only</span>'}</span>
      <span class="small tool-users">${users.length ? `<span class="muted">Used by </span>${users.map((a) => AGENTS[a.id].name).join(', ')}` : '<span class="muted">No agent uses it yet</span>'}</span>
      ${toolPlanned(k) ? PLANNED_TAG : h ? `<span class="health ${h.ok ? 'ok' : 'warn'}" data-unbuilt="Tool health">${h.ok ? I.check(14) : I.alert(14)}${h.ok ? 'Working' : 'Had a problem'}</span>` : `<span class="pill wait">${st === 'asked' ? 'Waiting for an OK' : 'Draft, not sent'}</span>`}
    </li>`;
  }
  function toolsTab() {
    const live = Object.keys(TOOLS).filter(toolLive);
    const pending = shows('toolDraft') ? ['jiraComp'].filter((k) => toolState(k) === 'asked' || (S.jiraComp === 'draft' && me().op)) : [];
    const sec = (title, sub, keys) => (keys.length ? `<section class="section"><h2>${title} <span class="count">${keys.length}</span></h2><p class="small muted sec-sub">${sub}</p><ul class="tool-rows">${keys.map(toolRow).join('')}</ul></section>` : '');
    const team = S.teamReqs.length ? `<section class="section"><h2>Asked the team <span class="count">${S.teamReqs.length}</span></h2><p class="small muted sec-sub">New systems and anything that deletes data are the team’s decision.</p><ul class="tool-rows">${S.teamReqs.map((q) => `<li class="tool-row team"><div class="tool-name"><b>${esc(q.sys)}</b><span class="small muted">“${esc(q.text)}” Asked by ${q.by} today${q.for ? ` for the ${AGENTS[q.for].name}` : ''}.</span></div><span class="pill wait">With the team</span></li>`).join('')}</ul></section>` : '';
    return sec(`Waiting for an OK ${PLANNED_TAG}`, 'New tools the Planner drafted. Each one changes data, so an Approver must OK it once before any agent can use it.', pending)
      + sec('Tools that change data', 'Each one waits for a yes, every time.', live.filter((k) => TOOLS[k][1] === 'write'))
      + sec('Tools that only read', 'They never change anything, so they don’t need a yes.', live.filter((k) => TOOLS[k][1] === 'read'))
      + team + (me().op ? toolAskPanel() : '');
  }

  /* Asking for a tool in plain English. The Planner checks the tools you have first. A new tool on a system that's
     already connected is drafted for an Approver's OK. A new system, or deleting data, goes to the team. */
  const TOOL_ASKS = [
    { ex: 'Set a component on new Jira tickets', re: /component|label|epic|priorit|assignee|fix version/i, draft: 'jiraComp' },
    { ex: 'Open a ticket in ServiceNow', re: /servicenow|service now|slack|outlook|e-?mail|sharepoint|confluence|\bgo\b|golang|\baws\b|azure devops|jenkins|bitbucket/i, team: true },
    { ex: 'Find Jira tickets by status', re: /jira|ticket/i, exists: (t) => (/create|raise|open|new|add/i.test(t) ? 'jiraCreate' : 'jiraSearch') },
    { re: /teams|message|post/i, exists: () => 'teamsPost' },
    { re: /github|bug report|issue/i, exists: (t) => (/release|version/i.test(t) ? 'ghReleases' : 'ghIssues') },
    { re: /version|release|registry|maven|npm|pypi|nuget|docker/i, exists: () => 'registries' },
    { re: /vulnerab|cve|security/i, exists: () => 'vulns' },
  ];
  const SYS_NAMES = [[/servicenow|service now/i, 'ServiceNow'], [/slack/i, 'Slack'], [/outlook|e-?mail/i, 'Outlook email'], [/sharepoint/i, 'SharePoint'], [/confluence/i, 'Confluence'], [/\bgo\b|golang/i, 'Go modules'], [/\baws\b/i, 'AWS'], [/azure devops/i, 'Azure DevOps'], [/jenkins/i, 'Jenkins'], [/bitbucket/i, 'Bitbucket']];
  function askForTool(text) {
    if (UNSAFE.test(text)) return { type: 'refuse' };
    if (/delete|erase|wipe|purge/i.test(text)) return { type: 'team', sys: 'Deleting data', del: true };
    const c = TOOL_ASKS.find((x) => x.re.test(text));
    if (!c) return { type: 'unclear' };
    /* A tool that isn't built is the team's decision (I3). Drafting one is the ADR 0037 flow, shown only with Planned features. */
    if (c.draft) return toolLive(c.draft) ? { type: 'exists', key: c.draft } : shows('toolDraft') ? { type: 'draft', key: c.draft } : { type: 'newtool', key: c.draft };
    if (c.team) return { type: 'team', sys: SYS_NAMES.find(([re]) => re.test(text))[1] };
    const key = c.exists(text);
    return toolLive(key) ? { type: 'exists', key } : { type: 'newtool', key };
  }
  function toolAskPanel() {
    const d = S.toolAsk;
    const r = d.result;
    const say = (html) => `<div class="bubble small-bubble">${face('lead', 40)}<p><span class="vh">Planner: </span>${html}</p></div>`;
    let reply = '';
    if (r) {
      const users = r.key ? toolUsers(r.key) : [];
      const msg = {
        exists: r.key ? `That’s already here: <b>${TOOLS[r.key][0]}</b>.${users.length ? ` The ${users.map((a) => AGENTS[a.id].name).join(' and ')} ${users.length > 1 ? 'use' : 'uses'} it.` : ' No agent uses it yet.'}` : '',
        draft: r.key ? `${toolState(r.key) === 'asked' ? `I’ve already drafted <b>${TOOLS[r.key][0]}</b>. It’s waiting for an Approver’s OK.` : `I can draft this from Jira’s published API: <b>${TOOLS[r.key][0]}</b>. It changes data, so an Approver who isn’t you must OK it once. Nothing changes until then.`} ${PLANNED_TAG}` : '',
        newtool: `${NEW_TOOL}${r.key ? ` That would be <b>${TOOLS[r.key][0]}</b>.` : ''} ${sentToTeam(`A new tool: ${TOOLS[r.key][0]}`) ? 'You’ve already asked the team.' : 'I can pass your request to the team.'}`,
        team: r.del ? `Tools that delete things aren’t drafted here, because deleting can’t be undone. ${sentToTeam(r.sys) ? 'You’ve already sent this to the team.' : 'I can send your request to the team.'}`
          : `${r.sys} isn’t connected to the platform yet. A new system is a new outside service, so the team decides on it first. ${sentToTeam(r.sys) ? 'You’ve already sent this to the team.' : 'I can send your request to the team.'}`,
        refuse: 'I can’t draft a tool that skips a yes. Anything that changes data waits for a yes, every time. That’s a platform rule.',
        unclear: `I couldn’t tell which system it’s for, or what it should do. Try, for example: “${TOOL_ASKS[0].ex}”.`,
      }[r.type];
      const btn = r.type === 'exists' ? `<button class="btn" data-act="toolOpen" data-arg="${r.key}">Open ${TOOLS[r.key][0]}</button>`
        : r.type === 'draft' ? `<button class="btn primary" data-act="toolDraft" data-arg="${r.key}">${toolState(r.key) === 'asked' ? 'See the request' : 'See the draft'}</button>`
          : r.type === 'newtool' && !sentToTeam(`A new tool: ${TOOLS[r.key][0]}`) ? `<button class="btn" data-act="teamReq" data-arg="A new tool: ${esc(TOOLS[r.key][0])}|ask">Ask the team</button>`
            : r.type === 'team' && !sentToTeam(r.sys) ? `<button class="btn" data-act="teamReq" data-arg="${r.sys}|ask">Send to the team</button>` : '';
      reply = `<div class="proposal" id="tool-reply" tabindex="-1">${say(msg)}${btn ? `<div class="btns">${btn}</div>` : ''}</div>`;
    }
    return `<section class="section" data-unbuilt="Asking for a tool"><div class="agent-change tool-ask"><h2>Need a tool that isn’t here?</h2>
      <p class="small muted">Say what an agent should be able to do, in plain English. The Planner checks the tools you have first. ${shows('toolDraft') ? `If it’s new, the Planner drafts it for an Approver to OK, or sends your request to the team. ${PLANNED_TAG}` : 'If it’s new, the team decides, and the Planner passes your request on.'}</p>
      <div class="field"><label class="vh" for="tool-ask">What should the tool do?</label><textarea id="tool-ask" data-toolask="text" rows="2" placeholder="For example: ${esc(TOOL_ASKS[0].ex)}"${fieldAttrs('tool-ask', d.err)}>${esc(d.text)}</textarea>${fieldNotes('tool-ask', d.err)}</div>
      <div class="chips">${TOOL_ASKS.filter((x) => x.ex).map((x) => `<button class="chip" data-act="toolAskChip" data-arg="${esc(x.ex)}">${x.ex}</button>`).join('')}</div>
      <div class="btns"><button class="btn primary" data-act="toolAskGo">Ask the Planner</button></div>
      ${reply}
    </div></section>`;
  }

  const backBtn = () => { const top = S.modalBack[S.modalBack.length - 1]; return top ? `<button class="back dlg-back" data-act="modalBack">${I.left(16)}Back to ${top.kind === 'agent' ? AGENTS[top.arg].name : TOOLS[top.arg][0]}</button>` : ''; };
  /* One tool, in a dialog: what it does and can't do, whether it's working, which agents use it, and what it did. */
  function toolDialog(k) {
    const [n, kind, x] = TOOLS[k];
    const i = TOOL_INFO[k];
    const st = toolState(k);
    const head = `${backBtn()}<div class="agent-top"><span class="tool-ic lg ${kind}">${I.tool(26)}</span><div><h2 id="dlg-h">${n}</h2><span class="agent-role">${i.sys}</span></div><button class="iconbtn dlg-close" data-act="closeModal" aria-label="Close">${I.x(18)}</button></div>`;
    if (st !== 'ok') {
      const asker = k === 'jiraComp' ? S.jiraCompAsker : 'alice';
      let act = '';
      if (st !== 'asked' && me().op) act = `<div class="btns"><button class="btn primary" data-act="toolSend" data-arg="${k}">Ask an Approver to OK it</button></div>`;
      else if (st === 'asked' && canOkTool() && S.user !== asker) act = `<div class="btns"><button class="btn bad" data-act="toast" data-arg="${nm(asker)} sees on Tools that you said not now.">Not now</button><button class="btn good" data-act="toolOk" data-arg="${k}">${I.check(16)}OK this tool</button></div>`;
      else if (st === 'asked') act = `<p class="note">${S.user === asker ? 'You asked for this tool, so you can’t OK it. ' : ''}Bob and 2 other Approvers can OK it. It waits for them under Needs you.</p>`;
      return `<div class="agent-dlg">${head}
        <div>${st === 'asked' ? `<span class="pill wait">${I.lock(12)}Waiting for an Approver to OK it</span>` : `<span class="pill">${I.tool(12)}Draft, not sent yet</span>`}</div>
        <p>${i.does}</p>
        <dl class="kv"><dt>What it will do</dt><dd>${i.will}</dd><dt>What it can change</dt><dd>${i.change}</dd><dt>When it changes anything</dt><dd>${i.when}</dd><dt>Why it needs an OK</dt><dd>${i.why}</dd></dl>
        <details class="tech"><summary>Technical details</summary><ul class="checks">${i.tech.map((t) => `<li>${I.check(16)}<span>${t}</span></li>`).join('')}</ul></details>
        ${act}
      </div>`;
    }
    const h = toolHealth(k);
    const chk = S.toolChecks[k];
    const users = toolUsers(k);
    const wfs = toolWorkflows(k);
    const log = toolLog(k);
    const rule = kind === 'read' ? 'Only reads, so it never needs a yes' : `Needs a yes from ${x}, every time. No agent or workflow can lower that`;
    const give = k === 'jiraComp' && !users.length && me().op ? '<div class="btns"><button class="btn primary" data-act="toolAddTo" data-arg="writer">Give it to the Ticket writer</button></div>' : '';
    return `<div class="agent-dlg">${head}
      <p>${i.does}</p>
      ${toolPlanned(k) ? `<div class="tool-status"><div>${PLANNED_TAG}<p class="small">On the team’s plan. Not built, so it has no health yet.</p></div></div>` : `<div class="tool-status ${h.ok ? 'ok' : 'warn'}" data-unbuilt="Tool health checks"><div><span class="health ${h.ok ? 'ok' : 'warn'}">${h.ok ? I.check(16) : I.alert(16)}${h.ok ? 'Working' : 'Had a problem'}</span><p class="small">${h.text}</p></div>
        <button class="btn sm" data-act="toolCheck" data-arg="${k}"${chk === 'checking' ? ' disabled' : ''}>${chk === 'checking' ? 'Checking…' : 'Check it works'}</button></div>`}
      <div class="agent-cols">
        <section><h3>${kind === 'read' ? 'What it can reach' : 'What it can change'}</h3><ul class="checks"><li>${I.shield(16)}<span>${rule}</span></li><li>${I.shield(16)}<span>${i.reach}</span></li></ul></section>
        <section><h3>What it can’t do</h3><ul class="checks cant">${i.cant.map((c) => `<li>${I.x(14)}<span>${c}</span></li>`).join('')}</ul></section>
      </div>
      <section><h3>Agents that use it</h3>${users.length ? `<div class="agent-chips">${users.map((a) => `<button class="agent-chip" data-act="agent" data-arg="${a.id}">${face(a.id, 32)}<span>${AGENTS[a.id].name}</span></button>`).join('')}</div>${wfs.length ? `<p class="small muted">Used in ${wfs.map((w) => `<button class="linkbtn" data-act="agentWorkflow" data-arg="${w}">${esc(R(w).name)}</button>`).join(', ')}.</p>` : ''}` : '<p class="small muted">No agent uses it yet.</p>'}${give}</section>
      <section><h3>${kind === 'write' ? 'Recent changes, and who said yes' : 'Recent use'}</h3>${log.length ? `<ol class="timeline">${log.map(([w, t]) => `<li><b>${w}</b><span>${t}</span></li>`).join('')}</ol>` : '<p class="small muted">Not used yet.</p>'}</section>
      <p class="small muted">${i.origin ? i.origin() : 'Ships with the platform. The team built and tested it.'}</p>
    </div>`;
  }

  /* One agent, in a dialog: how it works, its limits, where it's used, and a plain-English way to change it. */
  function agentDialog(id) {
    const a = LIB(id);
    const now = agentNow(id);
    const vs = agentVersions(id);
    const d = S.agentDraft && S.agentDraft.id === id ? S.agentDraft : { text: '', result: null };
    const r = d.result;
    const name = AGENTS[id].name;
    const used = agentUsedBy(id);
    const say = (html) => `<div class="bubble small-bubble">${face('lead', 40)}<p><span class="vh">Planner: </span>${html}</p></div>`;
    let result = '';
    if (r && r.type === 'change') {
      result = `<div class="proposal" id="agent-proposal" tabindex="-1" data-pres="prop:${id}:${keyOf(d.text)}:${r.type}">
        ${say(`Here’s how I’d change the ${name}. The changed step is marked.`)}
        <ol class="plan">${r.plan.map((step, i) => (i !== r.changed ? `<li>${step}</li>` : r.added ? `<li class="chg"><span class="chip-new">New</span> <ins>${step}</ins></li>` : `<li class="chg"><del>${r.from}</del><ins>${step}</ins></li>`)).join('')}</ol>
        <ul class="checks"><li>${I.check(16)}<span>${r.addTool ? `Adds one tool from the tool list: <b>${TOOLS[r.addTool][0]}</b>. It still waits for a yes, every time` : 'Uses only the tools already on its card'}</span></li><li>${I.check(16)}<span>Doesn’t change what needs a yes, or who approves</span></li><li>${I.check(16)}<span>Doesn’t reach anything it couldn’t reach before</span></li></ul>
        ${S.firstDay ? '' : `<p><b>On its last run:</b> ${r.effect}</p>`}
        <p class="small muted">${used.length ? `${used.length === 1 ? '1 workflow uses' : `${used.length} workflows use`} this agent. Their next runs use version ${now.v + 1}. A run that’s already going keeps the version it started with.` : 'No workflow uses this agent yet.'}</p>
        <div class="btns"><button class="btn primary" data-act="agentSave">Save as version ${now.v + 1}</button><button class="btn" data-act="agentDiscard">Discard</button></div>
      </div>`;
    } else if (r) {
      const msg = {
        refuse: 'I can’t make that change. Anything that changes data always waits for a yes. That’s a platform rule, so no agent or workflow can change it.',
        tool: r.tool ? `${toolState(r.tool) === 'asked' ? `That needs a new tool, <b>${TOOLS[r.tool][0]}</b>, and it’s waiting for an Approver’s OK. Ask me again once it’s OK’d.`
          : `The ${name}’s tools can’t set a component today. I can draft a new tool from Jira’s published API: <b>${TOOLS[r.tool][0]}</b>. It changes data, so an Approver who isn’t you must OK it once.`} ${PLANNED_TAG}` : '',
        newtool: `The ${name}’s tools can’t do that today. ${NEW_TOOL} ${sentToTeam(r.sys) ? 'You’ve already asked the team. You can follow it on Tools.' : 'I can pass your request to the team.'}`,
        team: r.sys ? `${r.why} ${sentToTeam(r.sys) ? 'You’ve already sent this to the team. You can follow it on Tools.' : 'I can send your request to the team.'}` : '',
        target: `The Jira project comes from each workflow, not from the agent. That keeps every agent to the place its workflow names. To read OPS, change the project on that workflow, or set up a workflow for OPS.`,
        unclear: `I couldn’t turn that into a safe change. Say what the ${name} should do differently, for example: “${(changesFor(id)[0] || { ex: '' }).ex}”.`,
        same: `That’s already how the ${name} works.`,
      }[r.type];
      const next = r.type === 'tool' ? `<button class="btn" data-act="toolDraft" data-arg="${r.tool}">${toolState(r.tool) === 'asked' ? 'See the tool request' : 'Draft the tool'}</button>`
        : r.type === 'newtool' && !sentToTeam(r.sys) ? `<button class="btn" data-act="teamReq" data-arg="${esc(r.sys)}|${id}">Ask the team</button>`
          : r.type === 'team' && !sentToTeam(r.sys) ? `<button class="btn" data-act="teamReq" data-arg="${r.sys}|${id}">Send to the team</button>` : '';
      result = `<div class="proposal" id="agent-proposal" tabindex="-1" data-pres="prop:${id}:${keyOf(d.text)}:${r.type}">${say(msg)}${next ? `<div class="btns">${next}</div>` : ''}</div>`;
    }
    const change = canChangeAgent(id) ? `<section class="agent-change" data-unbuilt="Changing an agent (read only in the Portal)"><h3>Change how it works</h3>
        <p class="small muted">Say what should be different, in plain English. The Planner redrafts the agent, the platform checks the draft, and you decide whether to save it.</p>
        <div class="field"><label class="vh" for="agent-text">What should change?</label><textarea id="agent-text" data-agent="text" rows="2" placeholder="For example: ${esc((changesFor(id)[0] || { ex: '' }).ex)}"${fieldAttrs('agent-text', d.err)}>${esc(d.text)}</textarea>${fieldNotes('agent-text', d.err)}</div>
        <div class="chips">${changesFor(id).map((c) => `<button class="chip" data-act="agentChip" data-arg="${esc(c.ex)}">${c.ex}</button>`).join('')}</div>
        <div class="btns"><button class="btn primary" data-act="agentSuggest">Suggest a change</button></div>
        ${result}
      </section>`
      : `<p class="note">${a.platform ? 'This agent is part of the platform, so only the team that runs the platform can change it.' : 'Only Operators can change agents.'}</p>`;
    return `<div class="agent-dlg">${backBtn()}
      <div class="agent-top">${face(id, 56, 'idle', { live: true })}<div><h2 id="dlg-h">${name}${a.planned ? ` ${PLANNED_TAG}` : ''}</h2>${AGENTS[id].role ? `<span class="agent-role">${AGENTS[id].role}</span>` : ''}<span class="small muted">${versionText(id)}</span></div><button class="iconbtn dlg-close" data-act="closeModal" aria-label="Close">${I.x(18)}</button></div>
      <p>${a.what}</p>
      <section><h3>How it works</h3><ol class="plan" data-flip-group="aplan:${id}">${now.plan.map((step) => `<li data-flip="aplan:${id}:${keyOf(step)}">${step}</li>`).join('')}</ol></section>
      ${change}
      <div class="agent-cols">
        <section><h3>Tools it may use</h3>${toolKeysOf(id).length ? toolsList(toolKeysOf(id)) : `<p class="small muted">${a.none}</p>`}</section>
        <section><h3>Rules it always follows</h3><ul class="checks">${agentRules(a).map((x) => `<li>${I.shield(16)}<span>${x}</span></li>`).join('')}</ul></section>
      </div>
      <section><h3>Where it’s used</h3><p class="small">${usedByText(a)}</p><p class="small muted">Last run: ${S.firstDay ? 'Hasn’t run yet.' : a.last}</p></section>
      <details class="versions"><summary>Version history (${vs.length})</summary><ol class="timeline">${vs.slice().reverse().map((x) => `<li><b>Version ${x.v}</b><span>${x.when ? `${x.when}, ${x.by}: “${esc(x.text)}”` : esc(x.text)}${x.v !== now.v && canChangeAgent(id) ? ` <button class="linkbtn" data-act="agentRestore" data-arg="${id}:${x.v}">Go back to this version</button>` : ''}</span></li>`).join('')}</ol></details>
    </div>`;
  }

  /* ---------- Teams drawer ---------- */
  /* The approval card ADR 0036 describes (spec 14): what needs approval, the workflow and its owner, each change, what
     the agents found, who can decide, and one button that opens the approval page. Nobody approves inside Teams. After
     a decision the card shows the request's state, read from the platform. Teams carries nothing else. */
  const teamsCard = (c) => `<b>${c.what}</b><dl class="kv tcard"><dt>Workflow</dt><dd>${c.workflow}, set up by ${c.owner}</dd><dt>Changes</dt><dd><ul class="mini-list">${c.changes.map((x) => `<li>${x}</li>`).join('')}</ul></dd><dt>Found</dt><dd>${c.found}</dd><dt>Who can decide</dt><dd>${c.who}</dd></dl>`;
  const decidedAt = (by) => `${nm(by)} at ${hm(NOW)} today`;
  function teamsItems() {
    const list = [];
    if (has('sw')) {
      const q = req('sw');
      list.push({ time: 'Mon 9:41', id: 'sw', html: teamsCard({ what: 'Keep our software up to date wants to create 3 Jira tickets', workflow: 'Keep our software up to date', owner: 'Carol',
        changes: [`Upgrade Log4j core to 2.25.2${shows('registries') ? ' (urgent: critical and actively exploited)' : ''}`, 'Upgrade LangGraph to 1.2.17', 'Upgrade FastAPI to 0.120.1'],
        found: shows('registries') ? 'Newer versions on the registries and GitHub, and 4 known vulnerabilities in Log4j core 2.14.1.' : 'Newer releases on GitHub for 3 of the 14 projects on the Software watchlist.',
        who: q ? whoOr(q.may) : R('sw').approves }),
        decided: S.sw !== 'waiting' ? (S.sw === 'approved' ? `Approved by ${decidedAt(S.swBy)}` : `Declined by ${decidedAt(S.swBy)}`) : null, decidedTone: S.sw === 'declined' ? 'bad' : 'ok' });
      if (q && shows('namedApprovers') && q.backup) list.push({ time: `Mon ${hm(q.backupAt)}`, html: `${nm(q.first)} hasn’t answered yet, so ${nm(q.backup)} is asked as the backup for <b>Keep our software up to date</b>. ${PLANNED_TAG}` });
    }

  /* ---------- Render ---------- */
  const $live = document.createElement('div');

  /* PEOPLE carries the roles the rest of the prototype reads. Settings changes S.roles, and this copies them across. */
  function syncRoles() {
    Object.keys(PEOPLE).forEach((u) => { if (PEOPLE[u].added && !S.roles[u]) delete PEOPLE[u]; });
    Object.entries(S.roles).forEach(([u, r]) => {
      if (!PEOPLE[u]) PEOPLE[u] = { name: r.name, tone: 2, added: true };
      PEOPLE[u].op = r.op;

      const text = S.teamAskText.trim();
      if (!text) return;
      S.teamReqs.push({ sys: 'A request made while no AI model was connected', text, by: me().name, for: '' });
      S.teamAskText = '';
      toast('Sent to the team. You can follow it on Tools, in the Agent library.');
      render();
    },
    whenOpen: () => { S.wiz.whenOpen = true; render(); const f = document.getElementById('sched-freq'); if (f) f.focus(); },
    whenDone: () => {
      S.wiz.schedErr = schedProblems(S.wiz.sched);
      const keys = Object.keys(S.wiz.schedErr);
      if (keys.length) { render(); const first = document.getElementById(`sched-${keys[0]}`); if (first) first.focus(); return; }
      S.wiz.whenOpen = false; render(); const b = $app.querySelector('[data-act="whenOpen"]'); if (b) b.focus();
    },
    rename: () => { S.wiz.renaming = true; render(); const i = document.getElementById('rname'); if (i) { i.focus(); i.select(); } },
    renameDone: () => { S.wiz.renaming = false; render(); const b = $app.querySelector('[data-act="rename"]'); if (b) b.focus(); },
    /* One yes turns the workflow on. The card becomes its done box, the Planner is pleased, and the row glides into Workflows. */
    turnOn: () => {
      const m = liveSetup();
      if (!m || setupLeft().length) return;
      const f = draftNr();
      const newAgent = isNewAgent(writerOf(f)) ? writerOf(f) : null;
      /* A workflow already on from Home keeps its place on Workflows: it moves to the made list with its last state. */
      if (has('conf')) {
        S.made.push({ nr: S.nr, last: status('conf').last });
        const k = `made:${S.made.length - 1}`;
        if (S.sched.conf) S.sched[k] = S.sched.conf;
        if (S.paused.conf) S.paused[k] = true;
      }
      S.nr = { ...f, sched: { ...S.wiz.sched }, name: S.wiz.name.trim() || f.name };
      S.conf = 'on';
      delete S.deleted.conf; delete S.paused.conf; delete S.sched.conf; delete S.appr.conf;
      S.wiz = newWiz();
      m.card.done = { name: S.nr.name, next: R('conf').next, newAgent };
      m.mood = 'success';
      m.say = `${S.nr.name} is on. Its first run is ${R('conf').next}.`;
      S.justOn = 'conf';
      render();
      scrollToMsg(m.id, 'start');
      const b = $app.querySelector(`[data-mid="${m.id}"] .linkbtn`);
      if (b) b.focus();
    },
    testRun: () => { S.conf = 'waiting'; S.confYes = []; S.confAsk = 0; S.confReq = apprOf('conf') ? copyAppr(apprOf('conf')) : null; go('run', 'conf', { live: true }); },
    editSched: (id) => { S.editing = id; S.editingAppr = null; S.schedForm = { monthDay: '1', ...R(id).sched }; S.schedErr = {}; render(); const f = document.getElementById('sf-freq'); if (f) f.focus(); },
    cancelSched: () => { const id = S.editing; S.editing = null; render(); const b = $app.querySelector(`main [data-act="editSched"][data-arg="${id}"]`); if (b) b.focus(); },
    saveSched: (id) => {
      S.schedErr = schedProblems(S.schedForm);
      const keys = Object.keys(S.schedErr);
      if (keys.length) { render(); const first = document.getElementById(`sf-${keys[0]}`); if (first) first.focus(); return; }
      S.sched[id] = { ...S.schedForm };
      if (id === 'conf') S.nr = { ...S.nr, sched: { ...S.schedForm } };
      S.editing = null;
      let off = false;
      if (id === 'sw') {
        S.swOwner = S.user;
        /* The owner can't be one of its Approvers, so saving takes them off. */
        const a = copyAppr(apprOf('sw'));
        a.steps.forEach((s) => { if (s.first === S.user) { s.first = hasBackup(s) ? s.backup : ''; s.backup = 'none'; off = true; } else if (s.backup === S.user) { s.backup = 'none'; off = true; } });
        if (off) S.appr.sw = a;
      }
      toast(`Saved. Next run ${R(id).next}.${id === 'sw' ? ` You now own this schedule, so you can’t approve its checks.${off ? ' You’re no longer one of its Approvers, so choose a new backup under Change who approves.' : ''}` : ''}`);
      render();
    },
    n8nAsk: (id) => openModal('n8n', id, '.btn.primary'),
    n8nGiveBack: (id) => { delete S.n8n[id]; n8nLog(id, 'Today', `${me().name} gave it back. Anyone who may change it can open it in n8n now.`); toast(`Given back. Anyone who may change ${esc(R(id).name)} can open it in n8n now.`); render(); },
    n8nOpen: (id) => { S.n8n[id] = { by: S.user, since: 'today, 9:10' }; n8nLog(id, 'Today, 9:10', `${me().name} opened it in n8n. Only ${me().name} can change it there now.`); closeModal(); toast(`Opened in n8n in a new tab. Only you can change ${esc(R(id).name)} there now.`); render(); },
    n8nChange: (id) => { S.n8n[id] = { by: 'carol', since: 'today, 9:12' }; S.n8nChg[id] = { by: 'carol', when: 'today, 9:12' }; n8nLog(id, 'Today, 9:11', 'Carol opened it in n8n. Only Carol can change it there now.'); n8nLog(id, 'Today, 9:12', 'Carol published a change that removed Ask for a yes.'); toast(`Carol published a change to ${esc(R(id).name)} in n8n.`); render(); },
    n8nRun: (id) => { S.editRun = { wf: id }; go('run', 'edit', { live: true }); },
    n8nNew: () => openModal('n8nNew', null, '.btn.primary'),
    n8nNewOpen: () => { closeModal(); toast('Opened n8n in a new tab, with a new, empty workflow in your space.'); render(); },
    n8nUndo: (id) => { const c = S.n8nChg[id]; if (!c) return; delete S.n8nChg[id]; n8nLog(id, 'Today', `${me().name} undid ${nm(c.by)}’s change. The version before it is live again.`); toast(`Undone. The version before ${nm(c.by)}’s change is live again.`); render(); },
    pause: (id) => { S.paused[id] = true; toast(`Paused. ${esc(R(id).name)} won’t run until you resume it.`); render(); },
    resume: (id) => { delete S.paused[id]; toast(`Resumed. Next run ${R(id).next}.`); render(); },
    askDelete: (id) => openModal('delete', id, '[data-act="closeModal"].btn'),
    confirmDelete: (id) => {
      const name = R(id).name;
      S.deleted[id] = true;
      S.modal = null;
      toast(`Deleted ${esc(name)}.`, { label: 'Undo', act: 'undoDelete', arg: id });
      go('workflows');
    },
    undoDelete: (id) => { delete S.deleted[id]; toast('Put back.'); render(); },
    filter: (k) => { S.filter = k; render(); },
    clearFind: (k) => { S.find[k] = ''; if (k === 'workflows') S.filter = 'all'; render(); const i = $app.querySelector(`#find-${k}`); if (i) i.focus(); },
    focusAdd: () => { const i = $app.querySelector('#sw-name'); if (i) { i.scrollIntoView({ block: 'center' }); i.focus({ preventScroll: true }); } },
    testToggle: () => { S.testOpen = !S.testOpen; testNew = S.testOpen; render(); const t = $app.querySelector('.testctl-toggle'); if (t) t.focus(); },
    day: (d) => { S.firstDay = d === 'one'; S.conns = connsFor(S.firstDay); if (['workflow', 'run'].includes(S.view.name)) go('home'); else render(); },
    user: (u) => { S.user = u; if (!PEOPLE[u].op && S.view.name === 'agents') S.view = { name: 'home' }; render(); },
    /* The spec 16 controls. Planned features hidden means nothing planned shows, so a page about one goes back to its list. */
    modelOn: (v) => { S.modelOn = v === 'on'; render(); },
    preview: (v) => { S.preview = v === 'on'; if (!S.preview && ['workflow', 'run'].includes(S.view.name) && !has(S.view.id)) go('workflows'); else render(); },
    markUnbuilt: (v) => { S.markUnbuilt = v === 'on'; render(); },
    jiraDown: () => { S.conns.jira.down = true; toast('Jira stopped answering. Everything that reads or writes Jira waits until it’s back.'); render(); },
    jiraUp: () => { S.conns.jira.down = false; toast('Jira is answering again.'); render(); },
    reset: () => { stopTimer(); clearTimeout(toastTimer); P.run = null; const keep = { firstDay: S.firstDay, preview: S.preview, markUnbuilt: S.markUnbuilt, modelOn: S.modelOn }; S = fresh(); Object.assign(S, keep); S.conns = connsFor(S.firstDay); S.testOpen = true; focusHeading = true; render(); },
    toast: (t) => { toast(t); render(); },
  };

  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-act]');
    if (!t) return;
    if (e.detail > 1 && t.classList.contains('scrim')) return;
    if (t.getAttribute('aria-disabled') === 'true') { e.preventDefault(); return; }
    const fn = A[t.dataset.act];
    if (fn) { e.preventDefault(); fn(t.dataset.arg, t.dataset.mid ? msgById(t.dataset.mid) : undefined); }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { if (S.modal) closeModal(); else if (S.teams) A.teams(); else if (S.toast) hideToast(); else if (S.testOpen) A.testToggle(); return; }
    /* Enter sends to the Planner; Shift+Enter makes a new line. Enter in a card's text field presses its button. */
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.target.matches('[data-ask]')) { e.preventDefault(); A.ask(); return; }
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.target.matches('[data-askteam]')) { e.preventDefault(); A.askTeamOffline(); return; }
    if (e.key === 'Enter' && e.target.matches('input[data-input="name"]')) { e.preventDefault(); A.renameDone(); return; }
    if (e.key === 'Enter' && e.target.matches('input[data-card="repoDraft"]')) { e.preventDefault(); const b = $app.querySelector(`[data-act="repoUse"][data-mid="${e.target.dataset.mid}"]`); if (b) b.click(); return; }
    // Keep Tab inside an open dialog.
    if (e.key === 'Tab' && (S.modal || S.teams)) {
      const box = $app.querySelector(S.modal ? '.dialog:not(.leave)' : '.drawer:not(.leave)');
      const items = box ? [...box.querySelectorAll('button, [href], input, textarea, select, summary')].filter((x) => !x.disabled && shown(x)) : [];
      if (items.length) {
        const first = items[0];
        const last = items[items.length - 1];
        if (!box.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
        else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    }
  });
  let findTimer = null;
  let findRender = null;
  let cardRender = null;
  document.addEventListener('input', (e) => {
    const d = e.target.dataset;
    if (d.ask !== undefined) {
      const ta = e.target;
      S.chat.text = ta.value;
      ta.style.height = 'auto';
      ta.style.height = `${Math.min(ta.scrollHeight, 160)}px`;
      ta.closest('form').querySelector('.send').disabled = !ta.value.trim();
      listen(ta);
      return;
    }
    if (d.card) {
      const m = msgById(d.mid);
      m.card[d.card] = e.target.value;
      if (d.card === 'repoDraft') m.card.repoErr = '';
      clearTimeout(cardRender);
      cardRender = setTimeout(render, 250);
      return;
    }
    if (d.askteam !== undefined) { S.teamAskText = e.target.value; return; }
    if (d.sw) { S.swForm[d.sw] = e.target.value; return; }
    if (d.agent) { S.agentDraft.text = e.target.value; return; }
    if (d.toolask) { S.toolAsk.text = e.target.value; return; }
    if (d.mf && e.target.tagName !== 'SELECT') { S.modelForm[d.mf] = e.target.value; return; }
    if (d.ck) { S.connForm.key = e.target.value; return; }
    if (d.np === 'name') { S.newPerson.name = e.target.value; return; }
    if (d.limit) { S.limitForm.value = e.target.value; return; }
    if (d.find) {
      S.find[d.find] = e.target.value;
      clearTimeout(findRender);
      findRender = setTimeout(render, 250);
      clearTimeout(findTimer);
      findTimer = setTimeout(() => {
        const main = $app.querySelector('main');
        const n = d.find === 'workflows' ? new Set([...main.querySelectorAll('[data-act="workflow"]')].map((x) => x.dataset.arg)).size : main.querySelectorAll('tr[data-flip^="sw:"]').length;
        announce(n ? `${n} ${d.find === 'workflows' ? (n === 1 ? 'workflow' : 'workflows') : 'found'}` : 'Nothing matches');
      }, 600);
      return;
    }
    if (d.sched && e.target.type === 'time') { S.wiz.sched.time = e.target.value; S.wiz.whenOpen = true; return; }
    if (d.sf && e.target.type === 'time') { S.schedForm.time = e.target.value; return; }
    if (d.input) S.wiz[d.input] = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
  });
  document.addEventListener('submit', (e) => {
    e.preventDefault();
    if (e.submitter && e.submitter.getAttribute('aria-disabled') === 'true') return;
    const a = e.target.dataset.submit;
    if (a && A[a]) A[a]();
  });
  document.addEventListener('change', (e) => {
    const d = e.target.dataset;
    if (d.fix) { if (e.target.value) S.wiz.edits[d.fix] = e.target.value; else delete S.wiz.edits[d.fix]; render(); return; }
    if (d.sched) { S.wiz.sched[d.sched] = e.target.value; S.wiz.whenOpen = true; if (S.wiz.schedErr[d.sched]) delete S.wiz.schedErr[d.sched]; render(); return; }
    if (d.sf) { S.schedForm[d.sf] = e.target.value; if (S.schedErr[d.sf]) delete S.schedErr[d.sf]; render(); return; }
    if (d.sw === 'kind') { S.swForm.kind = e.target.value; delete S.swErr.repo; render(); return; }
    if (d.mf === 'provider') { const key = S.modelForm.key; S.modelForm = { ...freshModelForm(e.target.value), key }; render(); const el = document.getElementById('mf-provider'); if (el) el.focus(); return; }
    if (d.mf === 'model') { S.modelForm.model = e.target.value; return; }
    if (d.role) { A.roleToggle(d.role, e.target.checked); return; }
    if (d.np === 'op' || d.np === 'ap') { S.newPerson[d.np] = e.target.checked; return; }
    if (d.af) {
      const a = S.apprForm;
      const errs = S.apprErr;
      const [key, i] = d.af.split(':');
      if (i === undefined) a[key] = +e.target.value;
      else a.steps[+i][key] = e.target.value;
      cleanAppr(a);
      delete errs[i === undefined ? key : `${key}-${i}`];
      if (key === 'after' || key === 'expire') delete errs.after;
      render();
    }
  });

  render();
  /* For the check script only: the refusal rule and the plan-step renderer, called through page.evaluate. */
  window.mock = { UNSAFE, stepsList };
})();
</script>
