<title>AI Workflow Builder prototype, version 4 (redesign proposal)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-17 -63.5 270 270'%3E%3Crect x='-17' y='-63.5' width='270' height='270' rx='60' fill='%23fff'/%3E%3Cpath d='M30 57C34.5 75.5 34.5 75.5 53 80C34.5 84.5 34.5 84.5 30 103C25.5 84.5 25.5 84.5 7 80C25.5 75.5 25.5 75.5 30 57Z' fill='%23121417'/%3E%3Cg fill='%2302a7e1' stroke='%2302a7e1' stroke-width='6' stroke-linejoin='round'%3E%3Cpolygon points='52,58 94,58 116.6,89.4 94.4,121.6'/%3E%3Cpolygon points='132.6,140 117.6,97.5 182.7,3.5 226.8,3.5'/%3E%3C/g%3E%3C/svg%3E">

<style>
/* v3 look, "framed sheet": the Taste skill's app-screen rules, Emil Kowalski's motion rules and ibelick's UI Skills baseline, on the real Portal's typeface.
   Light only, on purpose: the page stays light whatever the viewer's theme. Running text is at least 4.5:1, secondary text about 7:1.
   The header and a thin frame share one blue-grey; the work sits on a white sheet. Teal is the one accent: the current tab, links and data.
   Colour goes on status and data, never on chrome. Cards are flat (a 1px edge, no shadow); only what floats casts a shadow. */
:root {
  color-scheme: light;
  --frame: #eef1f4;
  --bg: #ffffff;
  --surface: #ffffff;
  --sunk: #f3f5f7;
  --active: #e7ebef;
  --ink: #121417;
  --on-ink: #ffffff;
  --primary: #121417;
  --primary-hover: #2e3238;
  --muted: #4d535b;
  --rail: #c5cbd2;
  --edge: #7d858e;  /* edges a person must see, such as form fields: 3:1 or more on white and grey */
  --hair: #e1e5e9;
  --rule: #eaedf0;
  --link: #1b6c80;
  --accent: #1b6c80;
  --accent-soft: #e2f0f3;
  --accent-ink: #0f4a59;
  --nav-mark: #1b6c80;
  --brand: #02a7e1; /* NCS blue, for the logo only */
  --info-bg: #e9f3f5;
  --info-ink: #0f4a59;
  --float: 0 1px 2px rgba(18, 20, 23, 0.06), 0 12px 32px rgba(18, 20, 23, 0.14);
  --focus: #2f6bff;
  --amber: #e89a0c;
  --amber-ink: #7e4a00;
  --amber-soft: #fff6e0;
  --amber-line: #efd08c;
  --red: #c4242a;
  --red-ink: #a51f1f;
  --red-soft: #fdeeed;
  --red-line: #f2c4c1;
  --green: #1d7a42;
  --green-ink: #1b6b3b;
  --green-soft: #e6f4eb;
  --green-line: #b2dbbf;
  --on-status: #ffffff;
  --lead: #3e5bd8;
  --lead-tint: #dfe5ff;
  --checker: #0a7068;
  --checker-tint: #d3f0ec;
  --trouble: #7a4bd6;
  --trouble-tint: #ece3ff;
  --agent-1: #b02a6b;
  --agent-1-tint: #fbe3ee;
  --agent-2: #1f6f9f;
  --agent-2-tint: #ddeffb;
  --agent-3: #526d10;
  --agent-3-tint: #ebf2d3;
  --agent-4: #b2520a;
  --agent-4-tint: #ffe7d3;
  --face-ink: #16233a;
  --face-lens: rgba(255, 255, 255, 0.55);
  --person-1-bg: #ffe0cc;
  --person-1-ink: #7a3410;
  --person-2-bg: #d7e3ff;
  --person-2-ink: #1e3b8a;
  --person-3-bg: #d8efdf;
  --person-3-ink: #1d5a33;
  --person-4-bg: #f9dde8;
  --person-4-ink: #7a1f45;
  --mock-bg: #2a2140;
  --mock-ink: #f3efff;
  --mock-dim: #b9addb;
  --mock-on: #f3efff;
  --mock-on-ink: #2a2140;
  --scrim: rgba(15, 20, 28, 0.4);

  /* Radius is tight and chosen once: cards 8, controls and wells 6, the sheet 16. */
  --r-card: 8px;
  --r-ctl: 6px;
  --r-well: 6px;
  --r-sheet: 16px;

  /* One stacking scale; nothing uses a z-index outside it. */
  --z-raised: 1;
  --z-nav: 20;
  --z-safe-area: 30;
  --z-mock: 35;
  --z-scrim: 40;
  --z-overlay: 41;
  --z-toast: 45;

  --font: 'Atkinson Hyperlegible Next', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  /* Emil Kowalski's curves: a strong ease-out for anything entering or answering a press, ease-in-out for things moving on screen. */
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
  --ease-move: var(--ease-in-out);
  /* Motion durations. Every animation and transition uses one of these. */
  --dur-press: 120ms;   /* a control answers a press, hover or focus */
  --dur-small: 200ms;   /* something small appears, moves or changes */
  --dur-panel: 260ms;   /* a dialog, drawer or section opens */
  --dur-attn: 380ms;    /* something needs a look: a new error, a request waiting */
  --dur-success: 560ms; /* a one-off positive reaction, never longer than 600ms */
  --stagger: 40ms;      /* gap between cards arriving on a new screen */
  --move: var(--dur-panel); /* the run line travelling to the next step */
}
* { box-sizing: border-box; }
/* Keeps focused and scrolled-to things clear of the sticky header, and of the tab bar on a phone. */
html { scroll-padding-top: 84px; }
@media (max-width: 900px) { html { scroll-padding-top: 76px; scroll-padding-bottom: 84px; } }
body {
  margin: 0; background: var(--frame); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.5;
  font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: var(--z-safe-area); background: var(--frame); }
h1, h2, h3, p, ul, ol, dl, dd { margin: 0; }
h1, h2, h3 { font-weight: 700; line-height: 1.2; text-wrap: balance; }
p, li, dd { text-wrap: pretty; }
h1 { font-size: 1.75rem; letter-spacing: -0.015em; }
h2 { font-size: 1.125rem; }
h3 { font-size: 1rem; }
ul, ol { padding: 0; list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.skiplink { position: fixed; left: 16px; top: -80px; z-index: var(--z-toast); padding: 10px 16px; border: 0; border-radius: var(--r-ctl); background: var(--primary); color: var(--on-ink); font: inherit; font-weight: 700; cursor: pointer; }
.skiplink:focus { top: 12px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Header: part of the frame. No rule under it in the sheet look; the sheet's own edge does that job. */
.hdr { position: sticky; top: env(safe-area-inset-top, 0px); z-index: var(--z-nav); background: var(--frame); border-bottom: 1px solid transparent; }
.hdr-in {
  max-width: 1198px; margin: 0 auto; min-height: 60px; display: flex; align-items: center; gap: 8px 24px; flex-wrap: wrap;
  padding-left: max(25px, env(safe-area-inset-left, 0px)); padding-right: max(25px, env(safe-area-inset-right, 0px));
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 1.125rem; background: none; border: 0; padding: 6px 0; cursor: pointer; }
.nav { display: flex; gap: 2px; align-items: center; }
.nav-a {
  position: relative; display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 12px; border: 0; border-radius: var(--r-ctl);
  background: none; color: var(--muted); font-weight: 600; font-size: 0.95rem; cursor: pointer; white-space: nowrap;
  transition: background-color var(--dur-press) ease, color var(--dur-press) ease;
}
.nav-a[aria-current="page"] { color: var(--ink); }
.nav-a[aria-current="page"]::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -11px; height: 2px; border-radius: 2px; background: var(--nav-mark); }
.tools { margin-left: auto; display: flex; gap: 4px; align-items: center; }
/* Header tools are quiet: no box until you point at them. */
.iconbtn {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 40px; height: 40px; padding: 0 10px;
  border: 1px solid transparent; border-radius: var(--r-ctl); background: transparent; cursor: pointer; font-weight: 600; font-size: 0.9rem; color: var(--ink);
  transition: background-color var(--dur-press) ease, transform var(--dur-press) var(--ease-out);
}
.iconbtn:active { transform: scale(0.96); }
.iconbtn[aria-current="page"] { background: var(--active); }
/* The waiting count sits after the label ("Teams 1"), not on a corner: the button has no box for a corner badge to sit on. */
.badge {
  min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--amber);
  color: #1d1400; font-size: 0.75rem; font-weight: 700; display: inline-grid; place-items: center;
}
.me { display: flex; align-items: center; gap: 10px; padding: 3px 10px 3px 3px; border-radius: 999px; margin-left: 4px; }
.me b { display: block; font-size: 0.9rem; line-height: 1.2; }
.me small { display: block; font-size: 0.8125rem; color: var(--muted); line-height: 1.2; }
.pav { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; font-weight: 700; font-size: 0.9rem; flex: none; }
.pav.t1 { background: var(--person-1-bg); color: var(--person-1-ink); }
.pav.t2 { background: var(--person-2-bg); color: var(--person-2-ink); }
.pav.t3 { background: var(--person-3-bg); color: var(--person-3-ink); }
.pav.t4 { background: var(--person-4-bg); color: var(--person-4-ink); }
/* The header gives up text in steps as the screen narrows, so it stays on one row. Hidden text is still read out.
   The signed-in person's role is always read out but not shown; it also shows on hover. */
.me small { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-width: 1150px) { .me-text { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; } .me { padding-right: 3px; } }
@media (max-width: 1100px) { .iconbtn .lbl { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; } }
@media (min-width: 901px) and (max-width: 1045px), (max-width: 380px) { .brand-text { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; } }
@media (max-width: 900px) {
  .hdr-in { padding-block: 8px; gap: 6px 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .nav { display: none; }
  .me-text, .iconbtn .lbl { display: none; }
  .brand { font-size: 1rem; }
  .brand-ai { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
}
/* Phones and small tablets: the main menu moves to a tab bar at the bottom of the screen. */
.tabbar { display: none; }
@media (max-width: 900px) {
  .tabbar {
    position: fixed; z-index: var(--z-nav); left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(var(--tabs), minmax(0, 1fr));
    background: var(--surface); border-top: 1px solid var(--hair);
    padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
  }
  .tab { position: relative; display: grid; justify-items: center; align-content: center; gap: 2px; min-height: 58px; padding: 6px 2px; border: 0; background: none; color: var(--muted); font-size: 0.8125rem; font-weight: 600; cursor: pointer; }
  .tab[aria-current="page"] { color: var(--ink); font-weight: 700; }
  .tab[aria-current="page"] svg { color: var(--nav-mark); }
  /* The waiting count sits on the tab's icon, where a thumb can still see it. */
  .tab .badge { position: absolute; top: 6px; left: calc(50% + 6px); }
}

/* The sheet: the page sits on white, inset 8px from the frame, with a hairline edge and no shadow. dvh, not vh, so phone toolbars don't cut it. */
.sheet { margin: 0 8px 8px; min-height: calc(100dvh - 68px); background: var(--bg); border: 1px solid var(--hair); border-radius: var(--r-sheet); }
@media (max-width: 900px) { .sheet { margin: 0; border-width: 1px 0 0; border-radius: 0; } }

/* Page */
.wrap {
  max-width: 1180px; margin: 0 auto; padding-block: 32px 150px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.narrow { max-width: 860px; margin: 0 auto; }
.pagehead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 28px; }
.pagehead p { color: var(--muted); margin-top: 6px; font-size: 1.05rem; max-width: 65ch; }
.eyebrow { font-size: 0.875rem; font-weight: 600; color: var(--muted); }
.back { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 14px; background: none; border: 0; padding: 4px 0; color: var(--muted); font-weight: 600; cursor: pointer; transition: color var(--dur-press) ease; }
.section { display: grid; gap: 12px; }
.section + .section { margin-top: 40px; }
.section > h2 { display: flex; align-items: center; gap: 10px; }
.count { display: inline-grid; place-items: center; min-width: 24px; height: 24px; padding: 0 7px; border-radius: 999px; background: var(--active); font-size: 0.8125rem; font-weight: 700; }
.muted { color: var(--muted); }
.small { font-size: 0.875rem; }

/* Buttons. A press scales to 0.97 so the screen answers the finger at once (Emil Kowalski); transitions name their properties. */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 16px; border: 1px solid var(--rail);
  border-radius: var(--r-ctl); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 0.95rem; cursor: pointer; white-space: nowrap; text-align: center;
  transition: transform var(--dur-press) var(--ease-out), background-color var(--dur-press) ease, border-color var(--dur-press) ease;
}
.btn:active:not([disabled], [aria-disabled="true"]) { transform: scale(0.97); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-ink); }
.btn.good { background: var(--green); border-color: var(--green); color: var(--on-status); }
.btn.bad { color: var(--red-ink); border-color: var(--red-line); }
.btn.sm { min-height: 34px; padding: 0 12px; font-size: 0.875rem; }
/* Disabled stays readable. The words around it say why. */
.btn[disabled], .btn[aria-disabled="true"] { background: var(--sunk); border-color: var(--hair); color: var(--muted); cursor: not-allowed; }
.btn.mock { border: 1.5px dashed var(--trouble); color: var(--trouble); background: transparent; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.linkbtn { display: inline-flex; align-items: center; min-height: 32px; margin: 0 -4px; background: none; border: 0; padding: 0 4px; color: var(--muted); text-decoration: underline; text-decoration-color: var(--rail); text-underline-offset: 3px; font-weight: 600; cursor: pointer; font-size: 0.9rem; transition: color var(--dur-press) ease, text-decoration-color var(--dur-press) ease; }

/* Hover only where there is a real pointer, so a tap on a phone doesn't leave a stuck hover. */
@media (hover: hover) and (pointer: fine) {
  .nav-a:hover { color: var(--ink); background: var(--active); }
  .iconbtn:hover { background: var(--active); }
  .back:hover { color: var(--ink); }
  .btn:hover { border-color: var(--muted); background: var(--sunk); }
  .btn.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
  .btn.good:hover { background: #17673a; border-color: #17673a; }
  .btn.bad:hover { background: var(--red-soft); border-color: var(--red); }
  .btn[disabled]:hover { background: var(--sunk); border-color: var(--hair); }
  .linkbtn:hover { color: var(--ink); text-decoration-color: currentColor; }
  .row-btn:hover { background: var(--sunk); }
  .agent-lg:hover, .tool-row:hover { border-color: var(--rail); }
  .wf-row:hover, .wf-add:hover { background: var(--sunk); }
  .schip:has(select):hover { border-color: currentColor; }
  .agent-chip:hover, .chip:hover, .filters button:hover { border-color: var(--ink); }
}

@media (pointer: coarse) {
  .btn, .btn.sm, .chip, .seg button, .nav-a, .linkbtn, .back, .iconbtn { min-height: 44px; }
}

/* Pills: a pale tint with dark text of the same hue. "On" is the normal state, so it stays grey. */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 1px 10px 1px 8px; border: 1px solid var(--hair); border-radius: 999px; font-size: 0.8125rem; font-weight: 600; white-space: nowrap; line-height: 1.6; flex: none; background: var(--surface); }
.pill.wait { color: var(--amber-ink); background: var(--amber-soft); border-color: var(--amber-line); }
.pill.bad { color: var(--red-ink); background: var(--red-soft); border-color: var(--red-line); }
.pill.ok { color: var(--green-ink); background: var(--green-soft); border-color: var(--green-line); }
.pill.off, .pill.on { color: var(--muted); background: var(--sunk); border-color: var(--hair); }
.pill.new { color: var(--accent-ink); background: var(--accent-soft); border-color: transparent; }
.tag { display: inline-flex; align-items: center; gap: 6px; padding: 1px 8px; border-radius: 4px; font-size: 0.8125rem; font-weight: 600; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.tag.write { background: var(--amber-soft); color: var(--amber-ink); }
.tag.read { background: var(--sunk); color: var(--muted); }
/* A planned design shown by the test control, never claimed by the product (spec 16). */
.tag.planned, .sched .tag.planned, .apprbar .tag.planned { display: inline-flex; width: auto; background: var(--mock-bg, #2b2160); color: #fff; font-size: 0.7rem; letter-spacing: 0.04em; text-transform: uppercase; vertical-align: middle; }
/* Mark what isn't built: the test control outlines each screen part the built Portal lacks, with the reason. */
.mark-unbuilt [data-unbuilt] { outline: 2px dashed #b4489a; outline-offset: 3px; position: relative; }
.mark-unbuilt [data-unbuilt]::before { content: 'Not built: ' attr(data-unbuilt); position: absolute; right: 0; top: -11px; z-index: 1; padding: 0 6px; border-radius: 4px; background: #b4489a; color: #fff; font-size: 0.68rem; font-weight: 700; line-height: 1.6; letter-spacing: 0.02em; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }

/* Home */
/* Home is one column. The most urgent item is a full card; the rest are one-line rows with one button each. */
.home { max-width: 820px; margin: 0 auto; }
.hello { margin-bottom: 28px; }
.hello h1 { font-size: 1.875rem; }
.hello p { font-size: 1.1rem; color: var(--muted); margin-top: 6px; max-width: 65ch; }
/* A task card: the status is one plain coloured icon in the gutter, not an icon in a tinted circle. */
.task {
  display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 14px; padding: 20px 24px 22px 20px; background: var(--surface);
  border: 1px solid var(--hair); border-radius: var(--r-card);
}
.task .ico { width: 20px; height: 24px; display: grid; place-items: center; }
.task .ico svg { width: 20px; height: 20px; }
.ico.wait { color: var(--amber-ink); }
.ico.bad { color: var(--red); }
.ico.ok { color: var(--green); }
.ico.tool { color: var(--muted); }
.task-body { display: grid; gap: 8px; min-width: 0; }
.task-title { font-size: 1.125rem; font-weight: 700; }
.task-meta { font-size: 0.875rem; color: var(--muted); }
.task .btns { margin-top: 6px; }
.says { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 10px; align-items: start; padding: 10px 14px 12px 10px; border-radius: var(--r-well); background: var(--sunk); font-size: 0.95rem; }
.says b { display: block; font-size: 0.8125rem; font-weight: 700; color: var(--muted); }
.mini-list { display: grid; gap: 4px; font-size: 0.95rem; }
.mini-list li { display: flex; gap: 8px; align-items: baseline; }
.mini-list li::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--muted); flex: none; transform: translateY(-3px); }
.coming { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; align-items: center; gap: 4px 10px; margin-top: 16px; padding: 10px 16px; border-radius: var(--r-well); background: var(--sunk); font-size: 0.9rem; color: var(--muted); }
.coming b { color: var(--ink); font-weight: 600; }
.coming + .section, .quiet-line + .section { margin-top: 32px; }
@media (max-width: 600px) { .coming { grid-template-columns: 16px minmax(0, 1fr); align-items: start; } .coming > svg { margin-top: 3px; } .coming > .linkbtn { grid-column: 2; justify-self: start; } }
.queue { margin-top: 4px; border: 1px solid var(--hair); border-radius: var(--r-card); background: var(--surface); }
.qrow { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 20px; }
.qrow + .qrow { border-top: 1px solid var(--rule); }
.qrow .ico { width: 20px; height: 24px; display: grid; place-items: center; align-self: start; }
.qrow .ico svg { width: 20px; height: 20px; }
.qrow-text { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; min-width: 0; }

/* Needs you on Home: what happened, why in one line, and one primary action (spec 5.1). */

/* Check my workflows: one row per workflow with its state, next run and one action (spec 6.2). */

/* What I can do, and what I can't do yet. Built from the tool list, the same rule the Planner is held to. */

}
.rcard-link { background: none; border: 0; padding: 0; font: inherit; color: inherit; text-align: left; cursor: pointer; }

/* Workflow page */
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px 24px; padding: 18px 20px; background: var(--surface); border: 1px solid var(--hair); border-radius: var(--r-card); }

}
details summary { cursor: pointer; font-weight: 600; color: var(--muted); padding: 8px 0; }

/* Run page: the live activity view */

.st-who { height: 56px; display: flex; align-items: flex-end; justify-content: center; }

.st-dot { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 2px dashed var(--edge); color: var(--muted); }

/* Cause, then effect: the line travels for --move, then the step it reaches lands and its message arrives. */

.chat > .in { animation-delay: var(--move); animation-fill-mode: backwards; }

}
.runbody { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 24px; align-items: start; }
@media (max-width: 960px) { .runbody { grid-template-columns: minmax(0, 1fr); } .runbody .act { order: -1; } }

  padding-top: env(safe-area-inset-top, 0px); padding-right: env(safe-area-inset-right, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
/* The drawer slides in by its own width, on the iOS drawer curve. */
.drawer.in { animation: slide var(--dur-panel) var(--ease-drawer); }
@keyframes slide { from { transform: translateX(100%); } to { transform: none; } }
.drawer-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 18px; background: #4b53bc; color: #fff; }
.drawer-head b { font-size: 1.05rem; }
.drawer-head small { display: block; opacity: 0.85; font-size: 0.8rem; }
.drawer-head .iconbtn { background: transparent; border-color: rgba(255,255,255,.4); color: #fff; }
.drawer-head .iconbtn:focus-visible { outline-color: #fff; }
.chan { padding: 10px 18px; font-weight: 700; border-bottom: 1px solid var(--hair); background: var(--surface); }
.msgs { overflow-y: auto; padding: 16px 18px 40px; display: grid; gap: 16px; align-content: start; }
.msg { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 10px; }
.msg-card { background: var(--surface); border: 1px solid var(--hair); border-radius: var(--r-card); padding: 12px 14px; display: grid; gap: 10px; }
.msg-meta { font-size: 0.85rem; color: var(--muted); }
.msg-meta b { color: var(--ink); }
.dialog {
  position: fixed; z-index: var(--z-overlay); left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(560px, calc(100% - 32px)); max-height: calc(100% - 48px);
  overflow-y: auto; background: var(--surface); border-radius: 12px; box-shadow: var(--float); padding: 24px; display: grid; gap: 16px;
}
/* A dialog has no trigger to grow from, so it stays centred and grows from 0.96. */
.dialog.in { animation: dlg var(--dur-panel) var(--ease-out); }
/* One dialog leading to another (an agent to its tool, and Back) swaps its content instead of closing and opening. */
.dialog.swap > * { animation: fade var(--dur-small) var(--ease-out); }
/* A toast never covers a dialog's buttons. */
.dialog:not(.leave) ~ .toast { top: calc(16px + env(safe-area-inset-top, 0px)); bottom: auto; }
@keyframes dlg { from { opacity: 0; transform: translate(-50%, -50%) scale(0.96); } to { opacity: 1; transform: translate(-50%, -50%); } }
.toast {
  position: fixed; z-index: var(--z-toast); left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px));
  background: var(--primary); color: var(--on-ink); padding: 12px 18px; border-radius: 10px; font-weight: 600; box-shadow: var(--float);
  max-width: calc(100% - 32px);
}
.toast.in { animation: toast var(--dur-small) var(--ease-out); }
@keyframes toast { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }


/* Mock controls: not part of the app */
.mockbar {
  position: fixed; z-index: var(--z-mock); left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 14px; padding: 10px 14px; width: max-content; max-width: calc(100% - 24px);

.n8n-canvas { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 6px; margin: 16px 0; padding: 16px; border-radius: var(--r-well); background: var(--sunk); }

/* Reduced motion means gentler, not none (Emil Kowalski): things still fade in, but nothing travels, bounces or spins. */

/* ---------- Motion system ----------
   The prototype redraws the whole page on every change. Motion compares the page before and after a redraw
   (see "Motion" in the script), so only what really changed moves. Opacity and transform only, no bounce,
   no decorative loops. The real Portal (React) should use Motion for these and Rive for the agents. */
/* A new screen: its cards arrive one after another, 40ms apart, at most 6 steps. Once, never looping. */
.enter [data-stagger] { animation: rise var(--dur-small) var(--ease-out) both; animation-delay: calc(min(var(--i, 0), 6) * var(--stagger)); }
/* Within a screen: a new item fades up; a section that opens unfolds from its top. */
.m-appear { animation: rise var(--dur-small) var(--ease-out) both; animation-delay: var(--ad, 0ms); }
.m-reveal { animation: unfold var(--dur-panel) var(--ease-out) backwards; animation-delay: var(--ad, 0ms); }
@keyframes unfold { from { opacity: 0; transform: translateY(-4px); clip-path: inset(0 0 60% 0); } to { opacity: 1; transform: none; clip-path: inset(0 0 0 0); } }
/* A value that changed while you looked, or since you last looked: a soft tint that fades. Once. */
.m-changed { animation: changed 980ms ease-out both; animation-delay: var(--ad, 0ms); border-radius: 4px; }
@keyframes changed { 0%, 55% { background-color: var(--accent-soft); box-shadow: 0 0 0 3px var(--accent-soft); } 100% { background-color: transparent; box-shadow: 0 0 0 3px transparent; } }
.count.m-changed, .badge.m-changed { animation: bump var(--dur-small) var(--ease-out); }
@keyframes bump { 50% { transform: scale(1.18); } }
/* Exits: a closed dialog, drawer or toast leaves quickly, and never blocks the page under it. */
.leave { pointer-events: none; }
.dialog.leave { animation: dlg-out 180ms ease-in both; }
@keyframes dlg-out { from { opacity: 1; transform: translate(-50%, -50%); } to { opacity: 0; transform: translate(-50%, -50%) scale(0.97); } }
.scrim.leave { animation: fade-out 180ms ease-in both; }
.drawer.leave { animation: slide-out 220ms var(--ease-drawer) both; }
@keyframes slide-out { to { transform: translateX(100%); } }
.toast.leave { animation: toast-out 180ms ease-in both; }
@keyframes toast-out { from { opacity: 1; transform: translate(-50%, 0); } to { opacity: 0; transform: translate(-50%, 8px); } }
@keyframes fade-out { to { opacity: 0; } }
/* Expandable sections (details): the content unfolds on open and folds on close. */
details > .m-open { animation: rise var(--dur-panel) var(--ease-out) both; }
details > .m-close { animation: fold 140ms ease-in both; }
@keyframes fold { to { opacity: 0; transform: translateY(-4px); } }
/* A finished step: its mark pops once as the panel opens. */
.ok-mark { display: inline-flex; color: var(--green-ink); margin-right: 6px; vertical-align: -2px; }
.m-reveal .ok-mark { animation: pop var(--dur-success) var(--ease-out) both; animation-delay: calc(var(--ad, 0ms) + 120ms); }
/* Report to support, sent: the reference shows at once; the bar and the mark confirm it. */
.sent { display: grid; justify-items: center; gap: 12px; text-align: center; }
.sent-mark { width: 56px; height: 56px; border-radius: 50%; background: var(--green); color: var(--on-status); display: grid; place-items: center; }
.sent-mark.m-reveal { animation: pop var(--dur-success) var(--ease-out) both; animation-delay: var(--ad, 0ms); }
.sent-ref { font-size: 1.35rem; font-weight: 800; color: var(--ink); }
.sent-bar { width: min(320px, 100%); height: 6px; border-radius: 999px; background: var(--sunk); overflow: hidden; }
.sent-bar span { display: block; height: 100%; background: var(--green); transform-origin: left center; }
.sent-bar.m-reveal { animation: none; }
.sent-bar.m-reveal span { animation: fill var(--dur-attn) var(--ease-out) both; animation-delay: var(--ad, 0ms); }
@keyframes fill { from { transform: scaleX(0.12); } }
.sent .kv { text-align: left; width: 100%; }

/* ---------- Agents: the Visor bot and the Orbs, driven by the real state of the work ----------
   The Planner is the Visor bot. Every other agent is a flat Orb in its own colour, with a badge for its job.
   idle      calm. Where one agent is the focus (.live): it breathes once when it appears, then holds still.
   listening the Visor bot leans in, its eyes follow the text and its ear lights pulse on each key. While you type.
   thinking  3 dots. They replace the Visor bot's mouth; an Orb's light swirls. The Planner reading a request.
   speaking  a sound-wave mouth on the visor, while the Planner's reply is written word by word.
   working   eyes scan, and an Orb's light circles. The step running now.
   waiting   eyes up, still, with an amber badge. Its work waits for a yes.
   success   happy eyes, one quick lift and a green check, then back to idle. Its work went through.
   sorry     slanted eyes for a moment, then idle. The Planner when it can't do a request.
   error     one worried flinch, then a red badge that stays. Its step stopped.
   stopped   eyes closed, grey. The workflow is paused, the step wasn't needed, or nobody answered.
   hover     a small lift when its card or button is hovered or has keyboard focus.
   Text and the usual status icons always say the same thing; the face never says it alone. */
.face { overflow: visible; transition: transform var(--dur-press) var(--ease-out); }
.face .f-eyes, .face .f-badge, .face .f-ok, .face .f-happy, .face .f-ear, .face .f-wave rect { transform-box: fill-box; transform-origin: center; }
.face .f-b { transform-box: view-box; transform-origin: 24px 26px; transition: transform var(--dur-small) var(--ease-out); }
.face .f-spin { transform-box: view-box; transform-origin: 24px 25px; }
/* An idle agent breathes once when it appears, then holds still, so nothing moves for more than 5 seconds at rest. */
.face.live.fs-idle .f-b { animation: breathe 2.1s var(--ease-in-out) 2 alternate; }
@keyframes breathe { to { transform: scale(1.03); } }
/* Listening: --lx and --ly come from the script, from where the caret is in the text. */
.face.fs-listening .f-b { transform: rotate(-4deg) translateY(1px); }
.face.fs-listening .f-eyes { transform: translate(var(--lx, 0px), var(--ly, 0px)); transition: transform 140ms var(--ease-out); }
.face .f-ear.on { animation: ping 320ms var(--ease-out); }
@keyframes ping { 40% { transform: scale(1.5); } }
.face.fs-thinking .f-eyes { animation: look 2.4s var(--ease-in-out) infinite; }
@keyframes look { 0%, 100% { transform: translate(-1.2px, -0.6px); } 50% { transform: translate(1.2px, -0.6px); } }
.face .f-think circle { fill: var(--muted); animation: think 1.5s ease-in-out infinite; }
.face .f-think circle:nth-child(2) { animation-delay: 0.2s; }
.face .f-think circle:nth-child(3) { animation-delay: 0.4s; }
@keyframes think { 0%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
.face.fs-thinking .f-spin, .face.fs-working .f-spin { animation: orbit 1.6s linear infinite; }
@keyframes orbit { to { transform: rotate(360deg); } }
.face.fs-working .f-eyes { animation: scan 1.6s var(--ease-in-out) infinite alternate; }
@keyframes scan { from { transform: translateX(-1.4px); } to { transform: translateX(1.4px); } }
.face .f-wave rect { animation: talk 300ms ease-in-out infinite alternate; }
.face .f-wave rect:nth-child(2) { animation-delay: 0.1s; }
.face .f-wave rect:nth-child(3) { animation-delay: 0.2s; }
.face .f-wave rect:nth-child(4) { animation-delay: 0.05s; }
.face .f-wave rect:nth-child(5) { animation-delay: 0.15s; }
@keyframes talk { from { transform: scaleY(0.3); } to { transform: scaleY(1); } }
.face.fs-sorry .f-b { transform: rotate(-6deg) translateY(1px); }
.face.react.fs-sorry .f-b { animation: tilt var(--dur-attn) var(--ease-out) both; animation-delay: var(--ad, 0ms); }
@keyframes tilt { from { transform: none; } to { transform: rotate(-6deg) translateY(1px); } }
.face.react.fs-waiting .f-badge, .face.react.fs-error .f-badge { animation: badge-in var(--dur-attn) var(--ease-out) both; animation-delay: var(--ad, 0ms); }
@keyframes badge-in { from { opacity: 0; transform: scale(0.4); } to { opacity: 1; transform: none; } }

  const PEOPLE = {

  function ticketLinks(x) {

        workflow: 'conf', end: st === 'waiting' ? 4 : 6, state: st === 'waiting' ? 'waiting' : st === 'expired' ? 'expired' : 'done',
        headline: st === 'waiting' ? w.waitHead : st === 'expired' ? 'No answer, nothing was written' : st === 'declined' ? 'Declined, nothing was written' : w.doneHead,
        stations: [
          { label: 'Started', sub: 'Today, test', who: 'p:alice', msg: { who: 'portal', text: 'Alice started a test run.' } },
          { label: 'Pick agents', who: 'lead', msg: { who: 'lead', text: `I’m bringing in the Jira reader and the ${AGENTS[writer].name}.` } },
          { label: { closed: 'Find closed tickets', created: 'Find new tickets', old: 'Find old tickets', open: 'Find open tickets' }[f.tickets], who: 'jira', msg: { who: 'jira', text: { closed: `14 tickets were closed in ${f.project} this week.`, created: `9 tickets were created in ${f.project} this week${f.action === 'compare' ? ', and 12 the week before' : ''}.`, old: `5 open tickets in ${f.project} were created more than ${f.days} days ago.`, open: `18 tickets are open in ${f.project}.` }[f.tickets] } },
          { label: `Write ${thingOf(f)}`, who: writer, msg: { who: writer, text: `I wrote a short ${thingOf(f)}. Nothing is created yet.` } },
          { label: 'Approval gate', gate: true, msg: gateMsg },
          { label: w.stationWrite, who: 'platform', skip: st === 'expired' || st === 'declined', msg: st === 'expired' || st === 'declined' ? null : { who: 'platform', text: w.did } },
          { label: 'Done', msg: { who: 'portal', tone: 'ok', text: st === 'expired' ? 'Done. Nothing was written, because nobody said yes.' : st === 'declined' ? 'Done. Nothing was written, because it was declined.' : 'Done.' } },
        ],
      };
    }
  }

  const P = { run: null, at: 0, shown: 0, timer: null, speed: reduce ? 'instant' : '1x', feedSeen: 0, feedNext: 0 };
  let follow = false;
  const interval = () => (P.speed === '2x' ? 520 : 1050);
  function stopTimer() { if (P.timer) { clearInterval(P.timer); P.timer = null; } }
  function playTo(from) {
    stopTimer();
    follow = true;
    const m = runModel(P.run);
    P.at = from; P.shown = from;
    if (from === 0) P.feedSeen = 0;
    if (P.speed === 'instant') { P.at = m.end; P.shown = m.end; return; }
    P.timer = setInterval(() => {
      const end = runModel(P.run).end;
      if (P.at < end) { P.shown = P.at; P.at += 1; render(); } else stopTimer();
    }, interval());
  }
  function continueRun() {
    if (S.view.name !== 'run') return;
    playTo(P.at);
  }

  /* ---------- Small pieces ---------- */
  function whoAvatar(w, size = 36, state = 'idle', k = '') {
    if (!w) return '';
    if (w.startsWith('p:')) return pav(w.slice(2), size);
    if (w === 'platform') return `<span class="sysav app" style="width:${size}px;height:${size}px">${I.mark()}</span>`;
    return face(w, size + 12, state, { k });
  }
  const feedName = (w) => (w === 'portal' ? 'Workflow Builder' : w === 'platform' ? 'Platform' : w === 'gate' ? 'Approval gate' : AGENTS[w].name);
  const feedHue = (w) => (AGENTS[w] ? AGENTS[w].hue : 'var(--muted)');
  function fieldAttrs(id, err, help) {
    const ids = [help ? `${id}-help` : '', err ? `${id}-err` : ''].filter(Boolean).join(' ');
    return `${ids ? ` aria-describedby="${ids}"` : ''}${err ? ' aria-invalid="true"' : ''}`;
  }
  function fieldNotes(id, err, help) {
    return (help ? `<span class="help" id="${id}-help">${help}</span>` : '') + (err ? `<span class="err" id="${id}-err">${I.alert(16)}${err}</span>` : '');
  }
  const fieldErr = (id, err, help) => `${fieldAttrs(id, err, help)}>${fieldNotes(id, err, help)}`;
  const opt = (v, label, cur) => `<option value="${v}"${String(v) === String(cur) ? ' selected' : ''}>${label}</option>`;
  /* The same schedule fields in the set-up card and when changing a workflow's schedule. */
  function schedFields(attr, f, err) {
    const id = (k) => `${attr}-${k}`;
    return `<div class="sched-grid">
      <div class="field"><label for="${id('freq')}">How often</label><select id="${id('freq')}" data-${attr}="freq"${fieldAttrs(id('freq'), err.freq)}>${opt('', 'Choose…', f.freq)}${Object.entries(FREQ_WORD).map(([v, l]) => opt(v, l, f.freq)).join('')}</select>${fieldNotes(id('freq'), err.freq)}</div>
      ${f.freq === 'week' ? `<div class="field"><label for="${id('day')}">Day</label><select id="${id('day')}" data-${attr}="day"${fieldAttrs(id('day'), err.day)}>${opt('', 'Choose…', f.day)}${DAYS.map((d) => opt(d, d, f.day)).join('')}</select>${fieldNotes(id('day'), err.day)}</div>` : ''}
      ${f.freq === 'month' ? `<div class="field"><label for="${id('mday')}">Day of the month</label><select id="${id('mday')}" data-${attr}="monthDay">${Array.from({ length: 28 }, (_, i) => opt(i + 1, ordinal(i + 1), f.monthDay)).join('')}</select></div>` : ''}
      <div class="field"><label for="${id('time')}">Time</label><input type="time" id="${id('time')}" data-${attr}="time" value="${f.time || ''}"${fieldAttrs(id('time'), err.time, TZ)}>${fieldNotes(id('time'), err.time, TZ)}</div>
    </div>`;
  }
  /* The Approver fields on a workflow's page. The owner is never offered. */
  function apprFields(attr, a, err, owner, sched) {
    const id = (k) => `${attr}-${k}`;
    const pool = approverPool().filter((u) => u !== owner);
    const steps = a.steps.map((s, i) => {
      const elsewhere = a.steps.filter((_, j) => j !== i).flatMap((o) => [o.first, o.backup]);
      const firsts = pool.filter((u) => !elsewhere.includes(u));
      const backups = firsts.filter((u) => u !== s.first);
      const fk = `first-${i}`;
      const bk = `backup-${i}`;
      const legend = a.steps.length > 1 ? `<legend>${i === 0 ? 'First yes' : 'Second yes, after the first'}</legend>` : '<legend class="vh">Who is asked</legend>';
      return `<fieldset class="apstep">${legend}<div class="sched-grid">
        <div class="field"><label for="${id(fk)}">Asked first</label><select id="${id(fk)}" data-${attr}="first:${i}"${fieldAttrs(id(fk), err[fk])}>${opt('', 'Choose…', s.first)}${firsts.map((u) => opt(u, nm(u), s.first)).join('')}</select>${fieldNotes(id(fk), err[fk])}</div>
        <div class="field"><label for="${id(bk)}">Backup</label><select id="${id(bk)}" data-${attr}="backup:${i}"${fieldAttrs(id(bk), err[bk])}>${opt('', 'Choose…', s.backup)}${backups.map((u) => opt(u, nm(u), s.backup)).join('')}${opt('none', 'Nobody else', s.backup)}</select>${fieldNotes(id(bk), err[bk])}</div>
      </div></fieldset>`;
    });
    const more = S.apprMore || !!(err.after || err['first-1'] || err['backup-1']);
    return `${steps.join('')}
      <p class="apsum">${I.info(16)}<span>${apprSummary(a, sched)}</span></p>
      <details class="more"${more ? ' open' : ''}><summary data-act="moreAppr">More approval options</summary><div class="more-body">
        <div class="sched-grid">
          <div class="field"><label for="${id('after')}">Ask the backup after</label><select id="${id('after')}" data-${attr}="after"${fieldAttrs(id('after'), err.after)}>${AFTER.map(([v, l]) => opt(v, l, a.after)).join('')}</select>${fieldNotes(id('after'), err.after)}</div>
          <div class="field"><label for="${id('expire')}">Stop waiting after</label><select id="${id('expire')}" data-${attr}="expire">${EXPIRE.map(([v, l]) => opt(v, l, a.expire)).join('')}</select></div>
        </div>
        <p class="note">Working hours are Monday to Friday, 9:00 to 18:00, ${TZ}. Either the first person or the backup can say yes. A request never says yes by itself, and it always stops before the next run, so two never wait at once.</p>
      </div></details>`;
  }
  /* The whole approval rule in one sentence, so the default needs no extra reading. */
  function apprSummary(a, sched) {
    const [s0, s1] = a.steps;
    if (!s0.first || !s0.backup) return 'Choose who is asked first, and a backup or Nobody else.';
    if (s1 && (!s1.first || !s1.backup)) return 'Choose who gives the second yes, and their backup or Nobody else.';
    const who = s1 ? `${nm(s0.first)} is asked first, then ${nm(s1.first)} gives the second yes.` : `${nm(s0.first)} is asked first.`;
    return `${who} ${escalationSentence(a, sched)}`;
  }
  function apprEditor(id) {
    const steps = S.apprForm.steps.length;
    return `<div class="panel" style="margin-top:16px"><h2>Change who approves</h2>
      ${steps > 1 ? '<p class="note">This workflow needs 2 Approvers, one after the other.</p>' : ''}
      ${apprFields('af', S.apprForm, S.apprErr, ownerOf(id), R(id).sched)}
      <div class="btns"><button class="btn primary sm" data-act="saveAppr" data-arg="${id}">Save</button><button class="btn sm" data-act="cancelAppr">Cancel</button></div>
      <p class="note">${waitingReq(id) ? 'The request that’s waiting now keeps the people it was sent to. Your change starts with the next run.'
        : req(id) ? 'This change starts with the next run. The stopped test run isn’t started again by itself.' : 'This change starts with the next run.'}</p></div>`;
  }

  /* ---------- Views ---------- */
  function header() {
    const v = S.view.name;
    const swRun = v === 'run' && S.view.id === 'sw';
    const cur = (on) => (on ? ' aria-current="page"' : '');
    /* What needs you is counted on Workflows. An Approver who can't set up workflows sees it on Home, where their approvals are. */
    const k = needs().length;
    const count = (on) => (on && k ? `<span class="badge" data-val="needs-n"><span class="vh">, </span>${k}<span class="vh"> need you</span></span>` : '');
    const nav = [
      `<button class="nav-a" data-act="go" data-arg="home"${cur(v === 'home')}>Home${count(!me().op)}</button>`,
      `<button class="nav-a" data-act="go" data-arg="workflows"${cur(['workflows', 'workflow'].includes(v) || (v === 'run' && !swRun))}>Workflows${count(me().op)}</button>`,
      `<button class="nav-a" data-act="go" data-arg="software"${cur(v === 'software' || swRun)}>Software watchlist</button>`,
      me().op ? `<button class="nav-a" data-act="go" data-arg="agents"${cur(v === 'agents')}>Agent library</button>` : '',
    ].join('');
    const n = teamsCount();
    return `<header class="hdr"><div class="hdr-in">
      <button class="brand" data-act="go" data-arg="home">${I.mark(22)}<span class="brand-text"><span class="brand-ai">AI </span>Workflow Builder</span></button>
      <nav class="nav" aria-label="Main">${nav}</nav>
      <div class="tools">
        <button class="iconbtn" data-act="teams" aria-label="Teams, practice copy${n ? `, ${approvalsWord(n)} waiting for you` : ''}" title="${n ? `${approvalsWord(n)} waiting for you` : 'Teams, practice copy'}">${I.chat(20)}<span class="lbl">Teams</span>${n ? `<span class="badge" data-val="teams-n">${n}</span>` : ''}</button>
        <button class="iconbtn" data-act="go" data-arg="settings" aria-label="Settings" title="Settings"${v === 'settings' ? ' aria-current="page"' : ''}>${I.gear(20)}</button>
        <div class="me" title="${me().name}, ${me().role}">${pav(S.user)}<span class="me-text"><b>${me().name}</b><small>${me().role}</small></span></div>
      </div>
    </div></header>`;
  }
  const approvalsWord = (n) => (n === 1 ? '1 approval' : `${n} approvals`);

  /* Phones: the same menu as the header, as a tab bar at the bottom. */
  function tabbar() {
    const v = S.view.name;
    const swRun = v === 'run' && S.view.id === 'sw';
    const k = needs().length;
    const count = (on) => (on && k ? `<span class="badge"><span class="vh">, </span>${k}<span class="vh"> need you</span></span>` : '');
    const tabs = [
      ['home', 'Home', I.home(22), v === 'home', count(!me().op)],
      ['workflows', 'Workflows', I.grid(22), ['workflows', 'workflow'].includes(v) || (v === 'run' && !swRun), count(me().op)],
      ['software', 'Watchlist', I.box(22), v === 'software' || swRun, ''],
    ].concat(me().op ? [['agents', 'Agents', I.bot(22), v === 'agents', '']] : []);
    return `<nav class="tabbar" aria-label="Main" style="--tabs:${tabs.length}">${tabs.map(([arg, label, icon, on, n]) => `<button class="tab" data-act="go" data-arg="${arg}"${on ? ' aria-current="page"' : ''}>${icon}<span>${label}</span>${n}</button>`).join('')}</nav>`;
  }

  /* One main button per screen: only the first card keeps it. */
  const demote = (html) => html.replace(/btn primary/g, 'btn');

  function needs() {
    const out = [];
    const u = S.user;
    const op = PEOPLE[u].op;
    /* Stopped runs and a platform that can't run come first, then approvals, then keys and confirmations. */
    if (op) {
      if (!curModel()) out.push({ kind: 'bad', icon: I.alert(22), title: 'No AI model connected', meta: 'Settings, AI model', body: '<p class="small muted">The Planner can’t read new requests until a model is connected. Workflows that are already on keep running.</p>', actions: '<button class="btn primary" data-act="setGo" data-arg="model">Connect a model</button>' });
      if (jiraDown()) out.push({ kind: 'bad', icon: I.alert(22), title: 'Jira isn’t answering', meta: `Last seen working ${lastOk('jiraRead')}`, body: '<p class="small muted">Workflows that read or write Jira wait until it’s back. Nothing is lost.</p>', actions: '<button class="btn primary" data-act="setGo" data-arg="connections">See Connections</button>' });
      if (has('issues') && S.issues === 'failed') out.push({ kind: 'bad', icon: I.alert(22), title: 'Morning new-ticket check stopped', meta: 'Today, 8:00', body: '', why: 'Jira didn’t answer at 8:00. It was down for maintenance, and it’s working again now. A retry is safe: it reads the tickets again, and its ticket still waits for a yes.', actions: `<button class="btn primary" data-act="retryIssues">Retry the run</button><button class="btn" data-act="run" data-arg="issues">See the run</button>` });
      if (has('nudge') && S.nudge === 'failed' && S.report === 0) out.push({ kind: 'bad', icon: I.alert(22), title: 'Weekly closed-ticket summary stopped', meta: 'Fri 23 Oct, 16:00', body: '', why: 'This is a problem in the platform, not in your workflow. You can’t fix it from here. Report it and support gets everything they need.', actions: `<button class="btn primary" data-act="report" data-unbuilt="Report to support">Report to support</button><button class="btn" data-act="run" data-arg="nudge">See the run</button>` });
      if (has('nudge') && S.nudge === 'failed' && S.report === 4) out.push({ kind: 'ok', icon: I.check(22), title: 'The fix for Weekly closed-ticket summary is live', meta: `Case ${S.supportCase.id} · fixed by Dana`, body: `<p class="small muted">Retry the run to catch up on last week.</p>`, actions: `<button class="btn primary" data-act="retryNudge">Retry the run</button>` });
    }
    if (has('sw') && S.sw === 'waiting' && canApprove('sw')) out.push({ kind: 'wait', rank: urgentNote() ? 1 : 2, icon: I.shield(22), title: `3 upgrade tickets are waiting for your yes${urgentNote()}`, meta: 'Keep our software up to date · Software watchlist, Mon 26 Oct, 9:00', body: `<ul class="mini-list"><li>${shows('registries') ? '<b>Log4j core 2.14.1 → 2.25.2, urgent: critical and actively exploited</b>' : 'Log4j core 2.14.1 → 2.25.2'}</li><li>LangGraph 1.2.14 → 1.2.17</li><li>FastAPI 0.118.0 → 0.120.1</li></ul>${askLineHtml(req('sw'), u)}`, actions: `<button class="btn primary" data-act="run" data-arg="sw">Review and decide</button>` });
    if (has('nudge') && S.nudge === 'waiting' && canApprove('nudge')) out.push({ kind: 'wait', icon: I.shield(22), title: '1 summary ticket is waiting for your yes', meta: 'Weekly closed-ticket summary · retried today after the fix', body: askLineHtml(req('nudge'), u), actions: `<button class="btn primary" data-act="run" data-arg="nudge">Review and decide</button>` });
    if (has('conf') && S.conf === 'waiting' && canApprove('conf')) out.push({ kind: 'wait', icon: I.shield(22), title: confWrite(S.nr).needTitle, meta: `${esc(S.nr.name)} · test run by Alice`, body: askLineHtml(req('conf'), u), actions: `<button class="btn primary" data-act="run" data-arg="conf">Review and decide</button>` });
    if (has('conf') && S.conf === 'declined' && u === 'alice') out.push({ kind: 'wait', rank: 4, icon: I.x(22), title: `${nm(S.confBy)} declined your test run`, meta: `${esc(S.nr.name)} · nothing was written`, body: '', actions: '<button class="btn primary" data-act="run" data-arg="conf">See the run</button><button class="btn" data-act="testRun">Do a test run again</button>' });
    if (has('conf') && S.conf === 'expired' && u === 'alice') out.push({ kind: 'wait', rank: 4, icon: I.clock(22), title: 'Nobody answered on your test run', meta: `${esc(S.nr.name)} · stopped ${at(req('conf').expiresAt)}`, body: `<p class="small muted">${whoAnd(askedOf(req('conf')))} didn’t answer in time, so nothing was written. Run it again${shows('namedApprovers') ? ', or choose other Approvers' : ''}.</p>`, actions: `<button class="btn primary" data-act="testRun">Do a test run again</button>${changeApproversBtn('conf', 'apprFromRun')}` });
    Object.entries(S.roles).filter(([w, r]) => r.pendingAp && PEOPLE[u].ap && u !== r.pendingBy && u !== w).forEach(([w]) => out.push({ kind: 'tool', icon: I.shield(22), title: `Confirm ${nm(w)} as an Approver`, meta: `Asked by ${nm(S.roles[w].pendingBy)}`, body: '<p class="small muted">Approvers say yes or no to the changes a workflow wants to make.</p>', actions: '<button class="btn primary" data-act="setGo" data-arg="people">Review in Settings</button>' }));
    if (op) expiring().forEach((k) => out.push({ kind: 'wait', rank: 3, icon: I.clock(22), title: `The ${CONNS[k].name} key expires in ${S.conns[k].days} days`, meta: `Expires ${S.conns[k].expires}`, body: `<p class="small muted">Replace it before then, or everything that uses ${CONNS[k].name} stops.</p>`, actions: '<button class="btn primary" data-act="setGo" data-arg="connections">Replace it in Settings</button>' }));
    if (op && usagePct() >= 80) out.push({ kind: 'wait', rank: 3, icon: I.alert(22), title: usagePct() >= 100 ? 'The AI usage limit is reached' : `AI usage is at ${usagePct()}% of this month’s limit`, meta: `US$${usage().cost.toFixed(2)} of US$${S.usageLimit}`, body: `<p class="small muted">${usagePct() >= 100 ? 'Agents have stopped asking the AI model until the 1st of next month, or until someone raises the limit.' : 'At 100%, agents stop asking the AI model until the 1st of next month.'}</p>`, actions: '<button class="btn primary" data-act="setGo" data-arg="usage">See usage in Settings</button>' });
    if (S.modelPending && PEOPLE[u].ap && u !== S.modelPending.byId) out.push({ kind: 'tool', icon: I.shield(22), title: 'Confirm a new AI model address', meta: `${esc(S.modelPending.address)} · entered by ${nm(S.modelPending.byId)}`, body: '<p class="small muted">Agents would send their prompts to this address. Until you confirm it, runs keep using the current model.</p>', actions: '<button class="btn primary" data-act="go" data-arg="settings">Review in Settings</button>' });
    if (shows('toolDraft') && S.jiraComp === 'asked' && canOkTool() && u !== S.jiraCompAsker) out.push({ kind: 'tool', icon: I.tool(22), title: `OK a new tool: ${TOOLS.jiraComp[0]}`, meta: `Asked by ${nm(S.jiraCompAsker)} for the Ticket writer`, body: `<p class="small muted">It changes data, so an Approver must OK it once before any agent can use it.</p>${PLANNED_TAG}`, actions: '<button class="btn primary" data-act="toolOpen" data-arg="jiraComp">Review the tool</button>' });
    if (shows('toolDraft') && S.jiraComp === 'ok' && u === S.jiraCompAsker && !S.jiraCompSeen) out.push({ kind: 'ok', icon: I.check(22), title: `${nm(S.jiraCompBy)} OK’d the new tool. You can give it to the Ticket writer.`, meta: TOOLS.jiraComp[0], body: PLANNED_TAG, actions: '<button class="btn primary" data-act="toolAddTo" data-arg="writer">Give it to the Ticket writer</button>' });
    if (op) Object.entries(S.n8nChg).forEach(([id, c]) => out.push({ kind: 'wait', icon: I.alert(22), title: `${nm(c.by)}’s change in n8n removed Ask for a yes`, meta: `${esc(R(id).name)} · published ${c.when}`, body: '<p class="small muted">The next run will stop before it changes anything. Undo the change, or put the step back in n8n.</p>', actions: `<button class="btn primary" data-act="n8nUndo" data-arg="${id}">Undo ${nm(c.by)}’s change</button><button class="btn" data-act="workflow" data-arg="${id}">See the workflow</button>` }));
    /* Most urgent first (spec 5.1): stopped runs, then approvals (urgent ones first), then keys and usage, then confirmations. */
    return out.sort((a, b) => (a.rank ?? NEED_RANK[a.kind]) - (b.rank ?? NEED_RANK[b.kind]));
  }
  const NEED_RANK = { bad: 0, wait: 2, ok: 2, tool: 4 };
  /* Change who approves exists only with named Approvers (ADR 0024), so it is tagged Planned wherever it shows. */
  const changeApproversBtn = (id, act = 'editAppr', cls = 'btn') => (shows('namedApprovers') ? `<button class="${cls}" data-act="${act}" data-arg="${id}" data-unbuilt="Named Approvers (ADR 0024)">${cls.includes('sm') ? I.edit() : ''}Change who approves ${PLANNED_TAG}</button>` : '');
  function says(text) { return `<div class="says">${face('trouble', 32)}<div><b>AI troubleshooter</b>${text}</div></div>`; }
  function taskCard(t, i = 0) {
    return `<article class="task" data-flip="h:${keyOf(t.title)}" data-stagger style="--i:${i}"><span class="ico ${t.kind}">${t.icon}</span><div class="task-body"><h3 class="task-title">${t.title}</h3><div class="task-meta">${t.meta}</div>${t.body}${t.why ? says(t.why) : ''}<div class="btns">${t.actions}</div></div></article>`;
  }
  /* A compact row keeps only its item's first button, as a small secondary one. */
  const firstButton = (html) => ((html.match(/<button[\s\S]*?<\/button>/) || [''])[0]).replace(/class="btn[^"]*"/, 'class="btn sm"');
  function queueRow(t, i = 1) {
    return `<li class="qrow" data-flip="h:${keyOf(t.title)}" data-stagger style="--i:${i}"><span class="ico ${t.kind}">${t.icon}</span><div class="qrow-text"><b>${t.title}</b><span class="qrow-meta">${t.meta}</span>${t.why ? `<span class="qrow-why"><b>AI troubleshooter:</b> ${t.why}</span>` : ''}</div>${firstButton(t.actions)}</li>`;
  }

  const REPORT_STAGES = [
    ['Reported', 'Sent to support with the run and the troubleshooter’s notes.'],
    ['Agents are writing a fix', 'Coding agents found the cause and are testing a fix.'],
    ['Fix ready, waiting for the support developer', 'Dana reads the fix and decides. Agents can’t put it live themselves.'],
    ['Fixed', 'The fix is live. Retry the run.'],
  ];
  function reportTrack(compact) {
    return `<ol class="track4">${REPORT_STAGES.map(([t, d], i) => {
      const n = i + 1;
      const cls = n < S.report || S.report === 4 ? 'done' : n === S.report ? 'now' : 'todo';
      return `<li class="${cls}"><span class="dot">${cls === 'done' ? I.check(13) : ''}</span><div><b>${t}</b>${compact && cls !== 'now' ? '' : `<span>${d}</span>`}</div></li>`;
    }).join('')}</ol>`;
  }
  function caseBox() {
    const c = S.supportCase;
    return `<div class="casebox"><div class="case-top"><b>Case ${c.id}</b><span class="tag">Owner: ${c.owner}</span></div>
      <dl class="kv"><dt>Sent</dt><dd>${c.sent}</dd><dt>First reply by</dt><dd>${c.target}</dd><dt>Updates</dt><dd>Shown here, under Following up on Workflows</dd>${c.note ? `<dt>Your note</dt><dd>${esc(c.note)}</dd>` : ''}</dl></div>`;
  }

  /* What needs the person reading, as one full card and then one-line rows. Shared by Workflows and an Approver's Home. */
  function needsSection(items) {
    const n = items.length;
    return `<section class="section" aria-labelledby="needs-h" data-flip-group="needs">
      <h2 id="needs-h">Needs you <span class="count" data-val="needs-count">${n}</span></h2>
      ${taskCard(items[0])}${n > 1 ? `<ul class="queue" aria-label="Also needs you" data-flip-group="queue">${items.slice(1).map((x, i) => queueRow(x, i + 1)).join('')}</ul>` : ''}
    </section>`;
  }
  /* The workflows in the order they run next, paused ones last. */
  const comingUp = () => routineIds().map((id) => [id, R(id)]).sort((a, b) => (S.paused[a[0]] ? 1 : 0) - (S.paused[b[0]] ? 1 : 0) || a[1].sort - b[1].sort);
  const nextUp = (first) => `<button class="linkbtn" data-act="workflow" data-arg="${first[0]}">${esc(first[1].name)}</button>, ${first[1].next}`;

  /* Needs you on Home (spec 5.1): one line each, most urgent first, with one primary action. The "what" is the item's
     title; the "why" is the troubleshooter's first sentence, or where it came from. Also the Planner's "what needs me". */
  const firstSentence = (s) => s.replace(/<[^>]+>/g, '').split(/(?<=\.)\s/)[0];
  const oneAction = (html) => firstButton(html).replace('class="btn sm"', 'class="btn primary sm"');
  function needRow(t, i) {
    return `<li class="nrow" data-flip="n:${keyOf(t.title)}" data-stagger style="--i:${i}"><span class="ico ${t.kind}">${t.icon}</span><div class="nrow-text"><b>${t.title}</b><span class="nrow-why">${t.why ? firstSentence(t.why) : t.meta}</span></div>${oneAction(t.actions)}</li>`;
  }
  function needsStrip(items, max = 3, unbuilt = 'Needs you on Home') {
    const n = items.length;
    return `<section class="section needs" aria-labelledby="needs-h" data-flip-group="needs" data-unbuilt="${unbuilt}">
      <h2 id="needs-h">Needs you <span class="count" data-val="needs-count">${n}</span></h2>
      <ul class="queue" data-flip-group="nrows">${items.slice(0, max).map(needRow).join('')}</ul>
      ${n > max ? `<p class="small"><button class="linkbtn" data-act="go" data-arg="workflows">See all ${n} on Workflows</button></p>` : ''}
    </section>`;
  }

  /* Home for an Approver who can't set up workflows (spec 5.3): what waits for their yes, with no box. */
  function approverHome() {
    const items = needs();
    const n = items.length;
    const waits = items.filter((t) => t.kind === 'wait').length;
    const coming = comingUp();
    const firstLive = coming.find(([id]) => !S.paused[id]);
    const line = !coming.length ? 'Nothing needs you yet. When a workflow wants to change something, it shows up here and in Teams.'
      : n === 0 ? 'Nothing needs you right now.' : n === waits ? `${n === 1 ? '1 request is' : `${n} requests are`} waiting for your yes.` : `${n === 1 ? '1 thing needs' : `${n} things need`} you.`;
    return `<div class="home">
      <div class="hello"><h1 tabindex="-1">Good morning! ${me().name}</h1><p>${line}</p></div>
      ${n ? needsSection(items) : `<div class="quiet"><b>All quiet</b>${firstLive ? `Next up: ${nextUp(firstLive)}.` : 'Nothing is scheduled yet.'}</div>`}
      <p class="note" style="margin-top:28px">You’re an Approver, so you decide on requests. Operators set up workflows.</p>
    </div>`;
  }

  /* Home for an Operator (spec 5): a greeting with the state in one line, the Planner's box, three suggestions from that
     state, and Needs you while something needs her. Day one has three starting points and the capability lists instead. */
  const DAY_ONE = ['Every Friday, sum up the tickets we closed this week', 'Keep track of the React version', 'What can you do?'];
  const stoppedIds = () => routineIds().filter((id) => !S.paused[id] && status(id).tone === 'bad');
  function suggestions() {
    if (!routineIds().length) return DAY_ONE;
    const stopped = stoppedIds()[0];
    return ['Check my workflows', stopped ? `Why did ${R(stopped).name} stop?` : 'What can I ask for?', 'Set up another workflow'];
  }
  /* Starting points for "Set up another workflow": the first three she doesn't already have. */
  const STARTS = [
    ['Every Friday, sum up the tickets we closed this week', /closed/i],
    ['Every weekday at 8:00, sum up the new tickets', /new.ticket/i],
    ['Every Monday, compare last week’s new tickets with the week before', /comparison/i],
    ['Every Monday, list open tickets created more than 30 days ago', /old.ticket/i],
    ['Keep track of the React version', () => onList('React')],
  ];
  const starts = () => STARTS.filter(([, had]) => !(typeof had === 'function' ? had() : routineIds().some((id) => had.test(R(id).name)))).map(([t]) => t).slice(0, 3);
  function stateLine(items) {
    const n = items.length;
    const first = comingUp().find(([id]) => !S.paused[id]);
    if (!n) return `Nothing needs you. ${first ? `Next up: ${nextUp(first)}.` : 'Nothing is scheduled yet.'}`;
    const fine = routineIds().some((id) => !S.paused[id] && status(id).tone === 'ok');
    return `${n === 1 ? '1 thing needs' : `${n} things need`} you.${fine ? ' Your other workflows are running.' : ''}`;
  }
  function plannerHome() {
    const c = S.chat;
    const empty = !c.msgs.length;
    const dayOne = !routineIds().length;
    if (!curModel()) return offlineHome();
    const items = dayOne ? [] : needs();
    const hello = !empty ? '<h1 tabindex="-1">Planner</h1>'
      : dayOne ? '<h1 tabindex="-1">What does your team do again and again?</h1><p class="lead">Tell me a task in plain English. I’ll set it up to run by itself. Anything that changes data waits for a yes from an Approver in Teams.</p>'
        : `<h1 tabindex="-1">Good morning! ${me().name}</h1><p class="lead">${stateLine(items)}</p>`;
    return `<div class="home planner" data-unbuilt="The Planner’s box on Home (ADR 0037)">
      <div class="welcome${empty ? '' : ' compact'}">${face('lead', empty ? 96 : 52, c.hero, { live: empty && c.hero === 'idle', id: 'hero' })}<div class="hello-text">${hello}</div></div>
      ${empty ? '' : threadHTML()}
      <form class="composer" data-submit="ask"><label class="vh" for="ask">Describe a task for the Planner</label><textarea id="ask" data-ask rows="1" placeholder="${empty ? 'What would you like to automate, check or fix?' : 'Ask for something else'}" enterkeyhint="send">${esc(c.text)}</textarea><button class="send" type="submit" aria-label="Send to the Planner"${c.text.trim() ? '' : ' disabled'}>${I.send(20)}</button></form>
      ${empty ? `<div class="chips examples" role="group" aria-label="${dayOne ? 'Starting points' : 'Suggestions'}"${dayOne ? '' : ' data-unbuilt="Suggestions from your state"'}>${suggestions().map((e, i) => `<button class="chip" data-act="example" data-arg="${i}">${e}</button>`).join('')}</div>` : '<div class="btns"><button class="linkbtn" data-act="newChat">New chat</button></div>'}
      ${empty && items.length ? needsStrip(items) : ''}
      ${empty && (dayOne || c.abil) ? abilitiesHTML() : ''}
      ${empty && !dayOne ? `<p class="small muted" style="text-align:center"><button class="linkbtn" data-act="abil">${c.abil ? 'Hide what I can do' : 'What can I ask for?'}</button></p>` : ''}
    </div>`;
  }
  /* Home with no AI model (spec 5.4): the Planner can't read new requests, so it says so. What it can do, and asking the
     team, still work, because neither needs the model. Needs you still shows, because it is read from the platform. */
  function offlineHome() {
    const items = needs();
    return `<div class="home planner">
      <div class="welcome offline">${face('lead', 96, 'sorry', { id: 'hero' })}<div class="hello-text"><h1 tabindex="-1">I can’t read new requests until an AI model is connected</h1><p class="lead">Your workflows that are already on keep running, and Approvers can still decide.</p>
        <div class="btns"><button class="btn primary" data-act="setGo" data-arg="model">Connect a model</button></div></div></div>
      ${items.length ? needsStrip(items) : ''}
      ${abilitiesHTML()}
      <form class="composer team-ask" data-submit="askTeamOffline"><label class="vh" for="ask-team">Ask the team for something that isn’t here</label><textarea id="ask-team" data-askteam rows="1" placeholder="Ask the team for something that isn’t here" enterkeyhint="send">${esc(S.teamAskText)}</textarea><button class="send" type="submit" aria-label="Ask the team">${I.send(20)}</button></form>
    </div>`;
  }

  function actionFor(id) {
    if (id === 'sw' && S.sw === 'waiting' && canApprove('sw')) return `<button class="btn primary sm" data-act="run" data-arg="sw">Review and decide</button>`;
    if (id === 'conf' && S.conf === 'waiting' && canApprove('conf')) return `<button class="btn primary sm" data-act="run" data-arg="conf">Review and decide</button>`;
    if (id === 'nudge' && S.nudge === 'waiting' && canApprove('nudge')) return `<button class="btn primary sm" data-act="run" data-arg="nudge">Review and decide</button>`;
    if (!me().op) return '';
    if (id === 'conf' && S.conf === 'expired') return `<button class="btn primary sm" data-act="testRun">Test it again</button>`;
    if (id === 'issues' && S.issues === 'failed') return `<button class="btn primary sm" data-act="retryIssues">Retry the run</button>`;
    if (id === 'nudge' && S.nudge === 'failed' && S.report === 0) return `<button class="btn primary sm" data-act="report" data-unbuilt="Report to support">Report to support</button>`;
    if (id === 'nudge' && S.nudge === 'failed' && S.report === 4) return `<button class="btn primary sm" data-act="retryNudge">Retry the run</button>`;
    return '';
  }

  /* Workflows opens with what needs you, what you're waiting on, any report you follow, and what runs next. */
  function attention() {
    const items = needs();
    const n = items.length;
    const coming = comingUp();
    const firstLive = coming.find(([id]) => !S.paused[id]);
    const waitingOn = [];
    if (S.user === 'alice') {
      if (shows('toolDraft') && S.jiraComp === 'asked' && S.jiraCompAsker === 'alice') waitingOn.push(['An Approver to OK the new tool', `${TOOLS.jiraComp[0]} · for the Ticket writer`, 'toolOpen', 'jiraComp']);
      if (S.conf === 'waiting' && has('conf')) {
        const q = req('conf');
        const who = q.team ? 'A yes from any Approver' : q.escalated && q.backup ? `A yes from ${whoOr(askedOf(q))}` : `${nm(q.first)}’s yes`;
        const next = q.team ? 'waits until an Approver decides' : q.escalated || !q.backup || !q.backupInTime ? `stops waiting ${at(q.expiresAt)}` : `${nm(q.backup)} is asked ${on(q.backupAt)} if there’s no answer`;
        waitingOn.push([`${who} on your test run`, `${esc(S.nr.name)} · ${next}`, 'run', 'conf']);
      }
    }
    const following = has('nudge') && S.report > 0 && S.report < 4 && S.user === 'alice' ? `<section class="section" aria-labelledby="fu-h" data-pres="follow" data-stagger style="--i:3" data-unbuilt="Support cases"><h2 id="fu-h">Following up</h2>
          <article class="panel"><div><div class="task-title">Weekly closed-ticket summary: reported to support</div><div class="task-meta">Support has the run and the troubleshooter’s notes. Updates show here.</div></div>${caseBox()}${reportTrack(true)}</article></section>` : '';
    const drafts = me().op ? draftRows() : [];
    if (!n && !waitingOn.length && !following && !drafts.length) {
      return `<p class="quiet-line">${!coming.length ? (me().op ? 'Nothing needs you yet. Ask the Planner on Home, and your first workflow shows up here.' : 'Nothing needs you yet. An Operator sets up workflows, and you approve their changes.')
        : `Nothing needs you right now. Your workflows are running.${firstLive ? ` Next up: ${nextUp(firstLive)}.` : ''}`}</p>`;
    }
    const rowList = (items) => `<div class="rows">${items.map(([a, b, act, arg]) => `<button class="row-btn" data-act="${act}" data-arg="${arg}"><div><div class="row-name">${a}</div><div class="row-sub">${b}</div></div>${I.right(16)}</button>`).join('')}</div>`;
    return `${n ? needsSection(items) : ''}
      ${waitingOn.length ? `<section class="section"><h2>Waiting on others</h2>${rowList(waitingOn)}</section>` : ''}
      ${drafts.length ? `<section class="section" aria-labelledby="drafts-h" data-unbuilt="Drafts here (the built app lists them on Home)"><h2 id="drafts-h">Drafts <span class="count">${drafts.length}</span></h2><p class="small muted sec-sub">Set-up cards you haven’t turned on yet. Resume one to carry on with it on Home.</p>
        <div class="rows">${drafts.map((d) => `<div class="row draft-row" data-flip="draft:${d.id}"><div><div class="row-name">${esc(d.name)}</div><div class="row-sub">${d.left ? leftWords(d.left) : 'Nothing is unclear. One yes turns it on.'}</div></div><span class="btns"><button class="btn sm" data-act="openDraft" data-arg="${d.id}">Resume<span class="vh"> ${esc(d.name)}</span></button><button class="btn sm" data-act="discardDraft" data-arg="${d.id}">Discard<span class="vh"> ${esc(d.name)}</span></button></span></div>`).join('')}</div></section>` : ''}
      ${following}
      ${firstLive ? `<div class="coming">${I.clock(16)}<span><b>Coming up next:</b> ${nextUp(firstLive)}${coming.length > 1 ? `, and ${coming.length - 1} more` : ''}.</span></div>` : ''}`;
  }

  const FILTERS = [['all', 'All'], ['stopped', 'Stopped'], ['paused', 'Paused']];
  function boardView() {
    const ids = routineIds();
    const q = S.find.workflows.trim().toLowerCase();
    const shown = ids.filter((id) => {
      const r = R(id);
      if (q && !`${r.name} ${r.what}`.toLowerCase().includes(q)) return false;
      if (S.filter === 'stopped') return status(id).tone === 'bad';
      if (S.filter === 'paused') return !!S.paused[id];
      return true;
    });
    const order = shown.sort((a, b) => (actionFor(b) ? 1 : 0) - (actionFor(a) ? 1 : 0) || R(a).sort - R(b).sort);
    const justOn = S.justOn;
    S.justOn = null;
    let mainUsed = false;
    const rows = order.map((id, i) => {
      const r = R(id);
      let act = actionFor(id);
      if (act) { if (mainUsed) act = demote(act); mainUsed = true; }
      return `<li class="wf-row${S.paused[id] ? ' paused' : ''}${justOn === id ? ' m-changed' : ''}" data-flip="wf:${id}" data-stagger style="--i:${i}">
        <span class="wf-pills">${pills(id)}${BASE[id] && BASE[id].planned ? PLANNED_TAG : ''}</span>
        <div class="wf-main"><h2><button class="rcard-link" data-act="workflow" data-arg="${id}">${esc(r.name)}</button></h2><p>${status(id).last}</p></div>
        ${faces(r.agents, 26, agentStates(id), `wf:${id}`)}
        <span class="wf-next">Next: ${r.next}</span>
        <span class="wf-act">${act}</span>
      </li>`;
    }).join('');
    const canAdd = me().op && !q && S.filter === 'all';
    const add = canAdd ? `<li data-flip="wf:add"><button class="wf-add" data-act="askPlanner">${I.plus(18)}<b>Ask the Planner for a new one</b><span>Describe it in plain English, on Home</span></button></li>` : '';
    return `<div class="pagehead"><div><h1 tabindex="-1">Workflows</h1><p>Your team’s repeated tasks. Each one runs by itself and asks before it changes anything.</p></div></div>
      ${attention()}
      <section class="section" aria-labelledby="all-h"><h2 id="all-h">All workflows <span class="count">${ids.length}</span></h2>
      ${ids.length ? `<div class="findbar"><span class="findbox">${I.search()}<label class="vh" for="find-workflows">Find a workflow</label><input type="search" id="find-workflows" data-find="workflows" placeholder="Find a workflow" value="${esc(S.find.workflows)}"></span>
        <div class="filters btns" role="group" aria-label="Show">${FILTERS.map(([k, l]) => `<button data-act="filter" data-arg="${k}" aria-pressed="${S.filter === k}">${l}</button>`).join('')}</div></div>` : ''}
      ${ids.length === 0 && !me().op ? '<p class="quiet"><b>No workflows yet</b>An Operator sets them up. You approve their changes.</p>' : ''}
      ${ids.length && !order.length ? '<div class="quiet"><b>No workflows match</b>Try other words, or see them all.<div class="btns quiet-act"><button class="btn sm" data-act="clearFind" data-arg="workflows">Show all workflows</button></div></div>' : ''}
      ${rows || add ? `<ul class="wf-list" aria-label="Workflows" data-flip-group="wf-list">${rows}${add}</ul>` : ''}
      ${canAdd ? '<p class="small muted n8n-start" data-unbuilt="Start in n8n (ADR 0026, 0027)">Prefer to build it yourself? <button class="linkbtn" data-act="n8nNew">Start in n8n</button></p>' : ''}
      </section>`;
  }

  /* A plan's steps. Each step keeps its place by position, so a step that changes is highlighted, and an added or removed one slides the rest. */
  function stepsList(steps, inline, key = 'steps') {
    const who = (w) => (!w ? '' : w === 'platform' ? `<span class="sysav app" style="width:26px;height:26px">${I.mark()}</span>` : face(w, 26));
    const newTag = '<span class="tag">New agent, saved to the Agent library when you turn this on</span>';
    return `<ol class="steps${inline ? ' inline' : ''}" data-flip-group="${key}">${steps.map(([what, kind, how, w, isNew], i) => `<li data-flip="${key}:${i}"><div>${who(w)}<div class="what" data-val="${key}:${i}">${what}</div><div class="how"><span class="tag ${kind || ''}">${how}</span>${isNew ? newTag : ''}</div></div></li>`).join('')}</ol>`;
  }

  /* What happened to one tool over time. The backend already records where each "ours" came from. */
  function history(key) {
    const by = nm(S.swBy);
    const found = (v, t) => (S.sw === 'waiting' ? `Found ${v}. Upgrade ticket proposed, waiting for a yes.` : S.sw === 'approved' ? `Found ${v}. ${t} created, approved by ${by}.` : `Found ${v}. Ticket declined by ${by}, so it is proposed again next Monday.`);
    const full = shows('registries');
    return {
      lj: [['Mon 26 Oct', `${found('2.25.2', 'MOCK-16')}${full ? ' The Vulnerability checker found 4 known vulnerabilities in our version, one of them actively exploited, so the ticket is urgent.' : ''}`], ['Thu 15 Oct', `Added by Carol from ${full ? 'Maven Central' : 'GitHub'}, with our version 2.14.1.`]],
      lg: [['Mon 26 Oct', found('1.2.17', 'MOCK-14')], ['Thu 8 Oct', 'Our version set to 1.2.14, because MOCK-6 was marked Done.'], ['Mon 5 Oct', 'Found 1.2.14. MOCK-6 created, approved by Bob.'], ['Thu 1 Oct', 'Added by Alice with our version 1.2.11.']],
      fa: [['Mon 26 Oct', found('0.120.1', 'MOCK-15')], ['Thu 22 Oct', 'Our version set to 0.118.0, because MOCK-9 was marked Done.'], ['Mon 19 Oct', 'Found 0.118.0. MOCK-9 created, approved by Alice.'], ['Thu 1 Oct', 'Added by Alice. Our version was left empty, so the first check took 0.117.1.']],
      gr: [['Mon 26 Oct', `Couldn’t check: ${full ? 'Docker Hub didn’t answer, and ' : ''}GitHub’s hourly limit was reached. It tries again next Monday.`], ['Mon 19 Oct', 'Up to date at 12.1.0.'], ['Thu 1 Oct', 'Added by Carol with our version 12.1.0.']],
    }[key];
  }

  function schedEditor(id) {
    return `<div class="panel" style="margin-top:16px"><h2>Change schedule</h2>
      ${schedFields('sf', S.schedForm, S.schedErr)}
      <div class="btns"><button class="btn primary sm" data-act="saveSched" data-arg="${id}">Save</button><button class="btn sm" data-act="cancelSched">Cancel</button></div>
      ${id === 'sw' ? `<p class="note">Saving makes you the owner of this schedule. Its checks then count as your work, so you won’t be able to approve them.${apprOf('sw') && apprOf('sw').steps.some((s) => s.first === S.user || s.backup === S.user) ? ' You’re one of its Approvers now, so you’d be taken off and need to choose someone else.' : ''}</p>` : ''}</div>`;
  }

  function softwareView() {
    const day1 = S.firstDay;
    const q = S.find.software.trim().toLowerCase();
    const hit = (name, repo) => !q || `${name} ${repo}`.toLowerCase().includes(q);
    const full = shows('registries');
    const vulnNote = full ? `<div class="src vuln">${I.alert(13)}<button class="linkbtn" data-act="toRisk" data-arg="lj">Critical security risk</button> ${PLANNED_TAG}</div>` : '';
    const st = (key) => (S.sw === 'waiting' ? '<span class="pill wait">Ticket waiting for a yes</span>' : S.sw === 'approved' ? ticketBtn(key) : '<span class="pill off">Proposed again next Monday</span>');
    const needRows = (day1 ? [] : [
      { key: 'lj', name: 'Log4j core', kind: 'maven', repo: 'org.apache.logging.log4j:log4j-core', gh: 'apache/logging-log4j2', ours: '2.14.1', from: 'Given when added', newest: '2.25.2', cross: full ? 'Maven Central and GitHub agree' : '', status: `${st('MOCK-16')}${vulnNote}` },
      { key: 'lg', name: 'LangGraph', repo: 'langchain-ai/langgraph', ours: '1.2.14', from: 'From MOCK-6, marked Done', newest: '1.2.17', cross: full ? 'GitHub and PyPI agree' : '', status: st('MOCK-14') },
      { key: 'fa', name: 'FastAPI', kind: 'pypi', repo: 'fastapi', gh: 'fastapi/fastapi', ours: '0.118.0', from: 'From MOCK-9, marked Done', newest: full ? '0.120.1' : '0.120.2', cross: full ? 'GitHub shows 0.120.2, not on PyPI yet. You install it from PyPI, so 0.120.1 counts.' : '', status: st('MOCK-15') },
      { key: 'gr', name: 'Grafana', kind: 'docker', repo: 'grafana/grafana', gh: 'grafana/grafana', ours: '12.1.0', from: 'Given when added', newest: '?', cross: full ? 'Docker Hub and GitHub didn’t answer' : 'GitHub’s hourly limit was reached', status: `<span class="pill bad">${I.x(12)}Can’t check</span>` },
    ]).map((r) => ({ ...r, ...rowSrc(r) })).filter((r) => !S.removed.includes(r.key) && hit(r.name, r.repo));
    const newRows = S.added.map((a, i) => ({
      key: `add${i}`, name: a.name, kind: a.kind, repo: a.repo, ours: a.ours || '?', from: a.ours ? 'Given when added' : 'Taken from the first check', newest: '?',
      status: a.kind !== 'unknown' ? '<span class="pill off">Checked next Monday</span>'
        : a.suggest ? `<span class="pill wait">Source to confirm</span><div class="src suggest">The Version checker found it on the project’s official site: ${srcName(a.suggest[2] || 'github')} · ${srcLink(a.suggest[2], a.suggest[1], esc(a.suggest[1]))}.<span class="btns"><button class="btn sm" data-act="confirmSrc" data-arg="${i}">Confirm</button><button class="btn sm" data-act="chooseSrc" data-arg="${i}">Choose another</button></span></div>`
          : `<span class="pill bad">${I.x(12)}No trusted source found</span><div class="src suggest">The Version checker searched the vendor’s official site, but found no version list it can read.<span class="btns"><button class="btn sm" data-act="chooseSrc" data-arg="${i}">Choose where it’s published</button></span></div>`,
      hist: [['Today', `Added by ${nm(a.by)}${a.planner ? ` from the Planner. ${nm(a.by)} ${a.planner} ${esc(a.repo)}.` : '.'} ${a.ours ? `Our version ${esc(a.ours)}.` : 'Our version was left empty, so the first check takes the newest.'}`]],
    })).filter((r) => !S.removed.includes(r.key) && hit(r.name, r.repo));
    const upToDate = UP_TO_DATE.filter((u) => hit(u, ''));
