    const table = (rows, name) => `<div class="scroll-x"><table class="sw-table" role="table"><thead role="rowgroup"><tr role="row"><th role="columnheader">Software</th><th role="columnheader">Ours</th><th role="columnheader">Newest</th><th role="columnheader">Status</th><th role="columnheader"><span class="vh">Actions</span></th></tr></thead><tbody role="rowgroup" data-flip-group="swt:${name}">${rows.map((r) => {
      const open = S.swOpen === r.key;
      const hist = r.hist || history(r.key);
      return `<tr role="row" data-flip="sw:${r.key}"><td role="cell"><b>${esc(r.name)}</b><div class="src">${r.kind === 'unknown' ? 'Source not confirmed yet' : `${srcName(r.kind || 'github')} · ${srcLink(r.kind, r.repo, esc(r.repo))}`}</div></td><td role="cell" data-label="Ours" data-val="swv:${r.key}:ours">${esc(r.ours)}<div class="src">${r.from}</div></td><td role="cell" data-label="Newest" data-val="swv:${r.key}:new">${r.newest}${r.cross ? `<div class="src">${r.cross}</div>` : ''}</td><td role="cell" data-val="swv:${r.key}:st">${r.status}</td>
        <td role="cell" class="sw-acts"><button class="linkbtn" data-act="swHist" data-arg="${r.key}" aria-expanded="${open}"${open ? ` aria-controls="hist-${r.key}"` : ''}>${open ? 'Hide history' : 'History'}<span class="vh"> of ${esc(r.name)}</span></button>${me().op ? ` <button class="linkbtn" data-act="removeSw" data-arg="${r.key}">Remove<span class="vh"> ${esc(r.name)}</span></button>` : ''}</td></tr>
        ${open ? `<tr role="row" class="hist" id="hist-${r.key}" data-flip="swh:${r.key}" data-enter="reveal"><td role="cell" colspan="5"><ol class="timeline">${hist.map(([d, t]) => `<li><b>${d}</b><span>${t}</span></li>`).join('')}</ol></td></tr>` : ''}`;
    }).join('')}</tbody></table></div>`;
    const appr = has('sw') && S.sw === 'waiting';
    const r = R('sw');
    const owner = nm(S.swOwner);
    /* Sources, from the registry: GitHub releases today, the ADR 0025 sources as Planned. */
    const sourceStates = [['GitHub releases', capState('ghReleases')], ['Package registries, security advisories and support end dates', capState('registries')]];
    const sourcesLine = `<span>Sources: ${sourceStates.map(([n, s]) => `${s === 'planned' && full ? `${PLANNED_TAG} ` : ''}${n} (${s === 'ready' ? 'working' : s === 'down' ? 'not working right now' : s === 'setup' ? 'needs setup' : s})`).join('. ')}.</span>`;
    return `<div class="pagehead"><div><h1 tabindex="-1">Software watchlist</h1><p>Everything your team runs, in one list. ${full ? 'Each check cross-checks versions, support dates and known vulnerabilities across trusted sources' : 'Each check reads the newest release of each one on GitHub'}, and its upgrade tickets go out in one approval.</p></div>
        ${day1 ? '' : '<button class="btn" data-act="checkNow">Check now</button>'}</div>
      <div class="sched">${I.clock(20)}<div>${day1 ? '<b>Checks run every Monday at 9:00 once you add software.</b><span>Each check sends one approval for all its tickets.</span>' : `<b>${esc(r.name)} checks this list ${r.when.charAt(0).toLowerCase()}${r.when.slice(1)}, set by ${owner}.</b> Next check ${r.next}. <span>${TZ}. Scheduled checks count as ${owner}’s work, so ${owner} can’t approve them.</span><span>Who approves: ${r.approves}.${apprOf('sw') ? ` ${PLANNED_TAG}` : ''}</span>`}${sourcesLine}</div>
        ${day1 || !me().op ? '' : `<div class="btns"><button class="btn sm" data-act="editSched" data-arg="sw">${I.edit()}Change schedule</button>${changeApproversBtn('sw', 'editAppr', 'btn sm')}</div>`}</div>
      ${S.editing === 'sw' ? `<div data-flip="ed:s:sw" data-enter="reveal">${schedEditor('sw')}</div>` : ''}
      ${S.editingAppr === 'sw' ? `<div data-flip="ed:a:sw" data-enter="reveal">${apprEditor('sw')}</div>` : ''}
      ${appr ? `<div class="apprbar">${I.shield(20)}<div><b>This week’s check wants to raise 3 upgrade tickets${urgentNote(', 1 of them urgent')}.</b><span>Started by Carol’s schedule, Mon 26 Oct, 9:00. ${askLine(req('sw'), S.user)}</span></div>${canApprove('sw') ? '<button class="btn primary sm" data-act="run" data-arg="sw">Review and decide</button>' : `<span class="note">Waiting for ${whoOr(req('sw').may)}</span>`}</div>` : ''}
      ${day1 ? '' : `<div class="findbar"><span class="findbox">${I.search()}<label class="vh" for="find-software">Find software</label><input type="search" id="find-software" data-find="software" placeholder="Find software" value="${esc(S.find.software)}"></span></div>`}
      ${full && needRows.some((x) => x.key === 'lj') ? `<section class="section"><h2>Security risks <span class="count">1</span> ${PLANNED_TAG}</h2>${riskCard('lj', st('MOCK-16'))}</section>` : ''}
      ${needRows.length ? `<section class="section"><h2>Needs a person <span class="count" data-val="sw:need-n">${needRows.length}</span></h2><div class="panel">${table(needRows, 'need')}</div></section>` : ''}
      ${day1 || !full ? '' : (() => { const ending = SUPPORT_ENDING.filter((x) => hit(x.name, '')); return ending.length ? `<section class="section"><h2>Support ending <span class="count">${ending.length}</span> ${PLANNED_TAG}</h2><div class="panel"><p class="note">From endoflife.date, read by the Version checker. After these dates, these versions get no more fixes, including security fixes.</p><div class="rows">${ending.map((x) => `<div class="row"><div><div class="row-name">${x.name}</div><div class="row-sub">Security fixes end ${x.ends}, ${x.left}. ${extLink(`https://endoflife.date/${x.slug}`, 'Dates on endoflife.date', 'endoflife.date')}</div></div><span class="pill wait">${I.clock(12)}Plan an upgrade</span></div>`).join('')}</div></div></section>` : ''; })()}
      ${newRows.length ? `<section class="section"><h2>Not checked yet <span class="count" data-val="sw:new-n">${newRows.length}</span></h2><div class="panel">${table(newRows, 'new')}</div></section>` : ''}
      ${day1 ? (newRows.length ? '' : `<div class="quiet"><b>No software yet</b>Add the tools your team runs. Each one is checked every Monday for new ${full ? 'versions and known vulnerabilities' : 'releases on GitHub'}.${me().op ? '<div class="btns quiet-act"><button class="btn sm primary" data-act="focusAdd">Add your first software</button></div>' : ''}</div>`)
        : `<section class="section"><h2>Up to date <span class="count">${upToDate.length}</span></h2>${upToDate.length ? `<details${q ? ' open' : ''}><summary>Show all ${upToDate.length}</summary><div class="uptodate">${upToDate.map((u) => `<span class="tag">${u}</span>`).join('')}</div></details>` : '<p class="muted">None match.</p>'}</section>`}
      ${q && !needRows.length && !newRows.length && !upToDate.length ? '<div class="quiet"><b>Nothing matches</b>Try another name, or add it below.<div class="btns quiet-act"><button class="btn sm" data-act="clearFind" data-arg="software">Clear the search</button></div></div>' : ''}
      ${me().op ? `<section class="section"><h2>Add software</h2><div class="panel"><div class="addgrid">
          <div class="field"><label for="sw-name">Name</label><input type="text" id="sw-name" data-sw="name" value="${esc(S.swForm.name)}" placeholder="LangGraph"${fieldErr('sw-name', S.swErr.name)}</div>
          <div class="field"><label for="sw-kind">Published on</label><select id="sw-kind" data-sw="kind">${sourcesShown().map((v) => opt(v, srcName(v), S.swForm.kind || 'github')).join('')}${full ? opt('unknown', 'Not sure: let the Version checker find it', S.swForm.kind || 'github') : ''}</select></div>
          ${(() => { const k = S.swForm.kind || 'github'; if (k === 'unknown') return '<div class="field"><span class="lab">Where it’s published</span><span class="help">The Version checker searches the vendor’s official site and suggests a source. You confirm it before any check uses it.</span></div>'; const [label, ph, help] = SRC_FIELD[k]; return `<div class="field"><label for="sw-repo">${label}</label><input type="text" id="sw-repo" data-sw="repo" value="${esc(S.swForm.repo)}" placeholder="${ph}"${fieldErr('sw-repo', S.swErr.repo, help)}</div>`; })()}
          <div class="field"><label for="sw-ours">Our version <span class="muted">(optional)</span></label><input type="text" id="sw-ours" data-sw="ours" value="${esc(S.swForm.ours)}" placeholder="1.2.14"${fieldErr('sw-ours', '', 'Left empty, the first check takes the newest.')}</div>
        </div><div class="btns"><button class="btn" data-act="addSoftware">Add</button></div></div></section>` : ''}
      <p class="note" style="margin-top:24px">Asking the Planner on Home for a release${full ? ' or vulnerability' : ''} check adds the software here instead of making a new workflow.</p>`;
  }

  /* What happened to a workflow in n8n: the warning when a change removed the yes step, and every published change. */
  function n8nWarn(id) {
    const chg = S.n8nChg[id];
    return chg ? `<article class="task" style="margin-top:16px" data-flip="n8nchg:${id}" data-enter="reveal"><span class="ico wait">${I.alert(22)}</span><div class="task-body"><h2 class="task-title">${nm(chg.by)}’s change in n8n removed Ask for a yes</h2><div class="task-meta">Published ${chg.when}</div><p>The next run will stop before it changes anything, because nothing is written without a yes.</p><div class="btns">${me().op ? `<button class="btn${actionFor(id) ? '' : ' primary'}" data-act="n8nUndo" data-arg="${id}">Undo ${nm(chg.by)}’s change</button>` : ''}</div></div></article>` : '';
  }
  function n8nPanel(id) {
    const held = S.n8n[id];
    return (S.n8nLog[id] || []).length ? `<div class="panel" style="margin-top:16px" data-pres="n8nlog:${id}" data-unbuilt="n8n changes in the Portal (ADR 0026, 0027)"><h2>Changes in n8n</h2><ol class="timeline">${S.n8nLog[id].map((e) => `<li><b>${e.when}</b><span>${e.text}</span></li>`).join('')}</ol>${held && held.by === S.user ? '<div class="btns"><button class="btn sm" data-act="n8nGiveBack" data-arg="' + id + '">Give it back</button></div>' : ''}<p class="note">The Portal keeps every version published in n8n, with who published it.</p></div>` : '';
  }

  function routineView(id) {
    const r = R(id);
    const st = status(id);
    const hasRun = ['sw', 'issues', 'nudge'].includes(id) || (id === 'conf' && S.conf !== 'on');
    const caseId = S.supportCase ? S.supportCase.id : '';
    const recent = {
      sw: [['Mon 26 Oct, 9:00', cap(st.last.replace(/^Mon 26 Oct: /, '')), true], ['Mon 19 Oct, 9:00', '1 ticket created (MOCK-9)'], ['Mon 12 Oct, 9:00', 'Nothing to write']],
      issues: S.issues === 'fixed'
        ? [['Today, retry', 'No new tickets. Nothing to write.', true], ['Today, 8:00', 'Stopped: Jira didn’t answer.'], ['Mon 26 Oct, 8:00', '1 ticket created (MOCK-12), approved by Bob']]
        : [['Today, 8:00', 'Stopped: Jira didn’t answer.', true], ['Mon 26 Oct, 8:00', '1 ticket created (MOCK-12), approved by Bob'], ['Fri 23 Oct, 8:00', 'Nothing to write']],
      nudge: S.nudge !== 'failed'
        ? [['Today, retry', cap(st.last.replace(/^Today, retried after the fix: /, '')), true], ['Fri 23 Oct, 16:00', `Stopped on a ticket the platform couldn’t read. Reported as ${caseId}.`], ['Fri 16 Oct, 16:00', '1 ticket created (MOCK-11), approved by Bob']]
        : [['Fri 23 Oct, 16:00', S.report ? `Stopped on a ticket the platform couldn’t read. Reported as ${caseId}.` : 'Stopped on a ticket the platform couldn’t read.', true], ['Fri 16 Oct, 16:00', '1 ticket created (MOCK-11), approved by Bob']],
      access: [['Mon 5 Oct, 9:00', '3 people lost access, approved by Bob, then Alice']],
      conf: S.conf === 'on' ? [] : [['Today, test run', cap(st.last.replace(/^Test run today: /, '')), true]],
    }[id] || [];
    const manage = me().op && id !== 'sw' ? `<div class="rowacts">
        ${BASE[id] && BASE[id].fixedSchedule ? '' : `<button class="btn sm" data-act="editSched" data-arg="${id}">${I.edit()}Change schedule</button>`}
        ${changeApproversBtn(id, 'editAppr', 'btn sm')}
        <button class="btn sm" id="pause-${id}" data-act="${S.paused[id] ? 'resume' : 'pause'}" data-arg="${id}">${S.paused[id] ? `${I.play()}Resume` : `${I.pause()}Pause`}</button>
        <button class="btn sm" data-act="n8nAsk" data-arg="${id}" data-unbuilt="Open in n8n (ADR 0026, 0027)">Open in n8n${I.ext(14)}</button>
        <button class="btn sm bad" data-act="askDelete" data-arg="${id}">${I.trash()}Delete</button></div>` : '';
    const held = S.n8n[id];
    const chg = S.n8nChg[id];
    return `<button class="back" data-act="go" data-arg="workflows">${I.left(16)}Workflows</button>
      <div class="pagehead"><div><div style="margin-bottom:8px">${pills(id)}${BASE[id] && BASE[id].planned ? ` ${PLANNED_TAG}` : ''}</div><h1 tabindex="-1">${esc(r.name)}</h1><p>${r.what}</p></div><div class="btns">${actionFor(id)}</div></div>
      ${manage}
      <dl class="facts" style="margin-top:16px">
        <div><dt>When</dt><dd>${r.when}</dd></div>
        <div><dt>Next run</dt><dd>${r.next}</dd></div>
        <div><dt>Who approves</dt><dd>${r.approves}${apprOf(id) ? ` ${PLANNED_TAG}` : ''}<small>${timingText(apprOf(id), r.sched)}</small></dd></div>
        <div class="fact-wide"><dt>Agents</dt><dd><div class="agent-chips">${r.agents.map((a) => { const st = agentStates(id)[a]; return `<button class="agent-chip" data-act="agent" data-arg="${a}">${face(a, 28, st || 'idle', { k: `wfp:${id}:${a}` })}<span>${AGENTS[a].name}${st ? `<span class="vh">, ${STATE_WORD[st]}</span>` : ''}</span></button>`; }).join('')}</div></dd></div>
        ${held ? `<div><dt>In n8n</dt><dd>${held.by === S.user ? 'You have it' : `${nm(held.by)} has it`}<small>Since ${held.since}</small></dd></div>` : ''}
      </dl>
      ${n8nWarn(id)}
      ${n8nPanel(id)}
      ${S.editing === id ? `<div data-flip="ed:s:${id}" data-enter="reveal">${schedEditor(id)}</div>` : ''}
      ${S.editingAppr === id ? `<div data-flip="ed:a:${id}" data-enter="reveal" data-unbuilt="Named Approvers (ADR 0024)">${apprEditor(id)}</div>` : ''}
      ${id === 'nudge' && S.report > 0 && S.nudge === 'failed' ? `<div class="panel" style="margin-top:16px" data-unbuilt="Support cases"><h2>Support case</h2>${caseBox()}${reportTrack(true)}</div>` : ''}
      <div class="runbody" style="margin-top:24px">
        <div class="panel"><h2>What it does</h2>${stepsList(planFor(id), false, `plan:${id}`)}</div>
        <div class="panel"><h2>Recent runs</h2>${S.editRun && S.editRun.wf === id ? `<div class="rows"><button class="row-btn" data-act="watch" data-arg="edit"><div><div class="row-name">Today, 9:15</div><div class="row-sub">Stopped before changing anything: Carol’s change removed Ask for a yes.</div></div><span class="btns small" style="font-weight:700">Watch ${I.right(16)}</span></button></div>` : ''}${recent.length ? `<div class="rows">${recent.map(([when, what, live]) => live && hasRun
          ? `<button class="row-btn" data-act="watch" data-arg="${id}"><div><div class="row-name">${when}</div><div class="row-sub">${what}</div></div><span class="btns small" style="font-weight:700">Watch ${I.right(16)}</span></button>`
          : `<div class="row"><div><div class="row-name">${when}</div><div class="row-sub">${what}</div></div></div>`).join('')}</div>` : `<p class="muted">No runs yet. The first one is ${r.next}.</p>`}</div>
      </div>`;
  }

  /* The live activity view of one run. */
  function runView(id) {
    const m = runModel(id);
    const r = R(m.workflow);
    const n = m.stations.length;
    const finished = P.at >= m.end;
    const stateOf = (s, i) => {
      if (i === m.fail && P.at >= i) return 'fail';
      if (s.skip && (P.at >= i || finished)) return 'skip';
      if (s.gate && i === m.end && m.state === 'waiting' && P.at >= i) return 'wait';
      if (s.gate && m.state === 'expired' && P.at >= i) return 'noans';
      if (i < P.at || (finished && i <= m.end)) return 'done';
      if (i === P.at) return 'now';
      return 'todo';
    };
    /* Each face says what that agent is doing in this run. Only the step running now moves. */
    const gi = m.stations.findIndex((s) => s.gate);
    const declined = (m.workflow === 'sw' && S.sw === 'declined') || (m.workflow === 'conf' && S.conf === 'declined') || (m.workflow === 'nudge' && S.nudge === 'declined');
    let lastAgent = -1;
    m.stations.forEach((s, i) => { if (i <= m.end && AGENTS[s.who] && !s.skip) lastAgent = i; });
    const faceOf = (s, i, st) => {
      if (st === 'now') return s.who === 'lead' ? 'thinking' : 'working';
      if (st === 'fail') return 'error';
      if (st === 'skip') return 'stopped';
      if (finished && i === gi - 1 && m.state === 'waiting') return 'waiting';
      if (finished && i === gi - 1 && m.state === 'expired') return 'stopped';
      if (finished && m.state === 'done' && !declined && i === lastAgent) return 'success';
      return 'idle';
    };
    const line = m.stations.map((s, i) => {
      const st = stateOf(s, i);
      const dot = s.gate ? (st === 'wait' ? I.lock(18) : st === 'noans' ? I.clock(18) : I.shield(18)) : st === 'done' ? I.check(14) : st === 'fail' ? I.x(14) : '';
      const sub = st === 'skip' ? 'Not needed' : st === 'fail' ? 'Stopped here' : st === 'wait' ? 'Waiting for a yes' : st === 'noans' ? 'No answer' : s.sub || '';
      const said = { done: 'Done: ', now: 'Now: ', todo: 'Not reached yet: ' }[st];
      return `<li class="st ${st}${s.gate ? ' gate' : ''}${i === P.at && P.shown < P.at ? ' arrive' : ''}"${st === 'now' ? ' aria-current="step"' : ''}><div class="st-who">${s.gate ? '' : whoAvatar(s.who, 44, faceOf(s, i, st), `st:${id}:${i}`)}</div><div class="st-dotwrap"><span class="st-dot">${dot}</span></div><div class="st-label">${said ? `<span class="vh">${said}</span>` : ''}${s.label}${sub ? `<small>${sub}</small>` : ''}</div></li>`;
    }).join('');
    const msgs = m.stations.slice(0, Math.min(P.at, m.end) + 1).map((s) => s.msg).filter(Boolean);
    P.feedNext = msgs.length;
    P.latest = msgs.length ? `${feedName(msgs[msgs.length - 1].who)}: ${msgs[msgs.length - 1].text}` : '';
    const chat = msgs.map((g, i) => chatItem(g, i >= P.feedSeen, m)).join('');
    /* While a finished run replays, the heading describes the replay, so it never claims "Done" before the line gets there. */
    const pillTone = !finished ? { tone: 'ok', label: 'Replaying' } : m.state === 'waiting' ? { tone: 'wait', label: 'Waiting for a yes' } : m.state === 'failed' ? { tone: 'bad', label: 'Stopped' } : m.state === 'expired' ? { tone: 'off', label: 'No answer' } : { tone: 'ok', label: 'Done' };
    const headline = finished ? m.headline : 'Replaying the run';
    return `<button class="back" data-act="workflow" data-arg="${m.workflow}">${I.left(16)}${m.workflow === 'sw' ? 'Software watchlist' : esc(r.name)}</button>
      <div class="runhead">
        <div class="runhead-top"><div class="runtitle"><h1 tabindex="-1">${headline}</h1>${finished ? pill(pillTone) : `<span class="tag">${I.play(12)}Replaying</span>`}</div>
          <div class="btns">${finished ? `<button class="btn sm" data-act="replay">${I.play(12)}Replay the run</button>` : ''}<div class="seg" role="group" aria-label="Speed">${['1x', '2x', 'instant'].map((sp) => `<button data-act="speed" data-arg="${sp}" aria-pressed="${P.speed === sp}">${sp === 'instant' ? 'Instant' : sp}</button>`).join('')}</div></div></div>
      </div>
      <div class="stage"><ol class="line" style="--n:${n}" aria-label="Steps of this run"><li class="line-track" aria-hidden="true"></li><li class="line-fill" aria-hidden="true" style="--f:${P.shown / (n - 1)}"></li>${line}</ol></div>
      <ol class="chat" aria-label="What the agents said">${chat}${finished ? chatAct(id, m) : chatTyping(m)}</ol>`;
  }

  const andList = (xs) => (xs.length < 2 ? xs.join('') : `${xs.slice(0, -1).join(', ')} and ${xs[xs.length - 1]}`);
  const chatAvatar = (w, state = 'idle') => (w === 'portal' || w === 'platform' ? `<span class="sysav app">${I.mark()}</span>` : w === 'gate' ? `<span class="sysav gate">${I.shield(20)}</span>` : face(w, 40, state));
  /* The run as a group chat. Events from the platform and the approval gate are quiet markers; agents speak in bubbles.
     When the Planner speaks, the agents it brings in join the chat. */
  function chatItem(g, isNew, m) {
    const cls = `${g.tone || ''}${isNew ? ' in' : ''}`;
    if (g.who === 'portal' || g.who === 'platform') return `<li class="chat-marker ${cls}"><span>${g.text}</span></li>`;
    if (g.who === 'gate') return `<li class="chat-marker gate-said ${cls}" data-gate="1" tabindex="-1"><span>${I.shield(14)}${g.text}</span></li>`;
    const joined = g.who === 'lead' ? R(m.workflow).agents.filter((a) => a !== 'lead') : [];
    return `<li class="cmsg ${cls}"><span class="cmsg-av">${face(g.who, 40, g.tone === 'bad' ? 'error' : 'idle', { k: `chat:${keyOf(g.text)}` })}</span><div class="cmsg-body"><span class="cmsg-who" style="color:${feedHue(g.who)}">${feedName(g.who)}</span><div class="cmsg-bubble">${g.text}</div></div></li>${joined.length ? `<li class="chat-marker${isNew ? ' in' : ''}"><span>${faces(joined, 22)}${andList(joined.map((a) => AGENTS[a].name))} joined</span></li>` : ''}`;
  }
  /* The last word goes to whoever needs the person: the approval gate with the buttons, the AI troubleshooter with the fix, or Workflow Builder when it's done. */
  function chatAct(id, m) {
    const w = m.state === 'waiting' || m.state === 'expired' ? 'gate' : m.state === 'failed' ? 'trouble' : 'portal';
    return `<li class="cmsg" id="decision" tabindex="-1" data-pres="act:${id}:${m.state}:${id === 'sw' ? S.sw : ''}"><span class="cmsg-av">${chatAvatar(w)}</span><div class="cmsg-body"><span class="cmsg-who"${w === 'trouble' ? ` style="color:${feedHue(w)}"` : ''}>${feedName(w)}</span>${actPanel(id, m)}</div></li>`;
  }
  /* While a run replays, the next speaker shows as working. */
  function chatTyping(m) {
    const next = m.stations.slice(P.at + 1, m.end + 1).find((s) => s.msg);
    if (!next) return '';
    return `<li class="cmsg typing" aria-hidden="true"><span class="cmsg-av">${chatAvatar(next.msg.who, next.msg.who === 'lead' ? 'thinking' : 'working')}</span><div class="cmsg-body"><span class="cmsg-who">${feedName(next.msg.who)} is working</span><div class="cmsg-bubble"><span class="dots"><i></i><i></i><i></i></span></div></div></li>`;
  }

  function approvePanel(id) {
    const ok = canApprove(id);
    const self = starterOf[id] === S.user;
    const sw = id === 'sw';
    const w = sw ? null : id === 'nudge' ? NUDGE_WRITE : confWrite(S.nr);
    const body = id === 'nudge' ? nudgePreview() : sw
      ? releases().map((x) => `<div class="ticket${x.urgent ? ' urgent' : ''}"><b>Upgrade ${x.tool} from ${x.from} to ${x.to}</b>${x.urgent ? `<span class="pill bad">${I.alert(12)}Urgent security fix</span> ${PLANNED_TAG}<div class="risk compact">${riskFacts(x.row, true)}</div>` : ''}
          <span>Newest release ${x.date}. ${x.count} releases since our version, on ${srcName(x.kind || 'github')}.</span>
          ${x.urgent ? '' : `<span>${x.notes}</span>`}
          <span class="links">${ticketLinks(x)}</span></div>`).join('')
      : confPreview(S.nr);
    const q = req(id);
    const why = self ? `You started this run, so you can’t approve it. Nobody approves their own work. ${askLine(q, null)}`
      : me().ap ? `Only ${whoOr(q.may)} can decide this one.${apprOf(id) ? ` ${nm(ownerOf(id))} chose who approves this workflow.` : ''}`
        : 'Only an Approver can decide.';
    return `<div class="panel"><h2>${sw ? '3 tickets will be created in Jira project MOCK' : w.panelTitle}</h2>
      ${body}
      <p class="note">This is exactly what will be written, and nothing else.</p>
      ${ok ? `${askLineHtml(q, S.user)}<div class="btns"><button class="btn good" data-act="approve" data-arg="${id}">${I.check(16)}${sw ? 'Approve 3 tickets' : w.approveLabel}</button><button class="btn bad" data-act="decline" data-arg="${id}">Decline</button></div>`
        : `<div class="lock">${I.lock(20)}<div>${why}</div></div>`}
      ${sw ? '<p class="note">You approve or decline the whole check. If you decline, nothing is written and the tickets are proposed again next Monday. Carol’s schedule started this run, so Carol can’t approve it.</p>' : ''}
    </div>`;
  }

  function actPanel(id, m) {
    if (m.state === 'waiting') return approvePanel(id);
    if (id === 'edit') {
      const wf = S.editRun.wf;
      const live = S.n8nChg[wf];
      return `<div class="panel">
        <dl class="qa"><dt>What happened</dt><dd>Carol’s change in n8n at 9:12 removed <b>Ask for a yes</b>. This run reached the step that makes changes without a yes, so it stopped there. Nothing was written.</dd></dl>
        <dl class="qa"><dt>What to do</dt><dd>${live ? 'Undo Carol’s change, or put the step back yourself in n8n.' : 'Carol’s change has been undone. The next run asks for a yes again.'}</dd></dl>
        ${live ? (me().op ? `<div class="btns"><button class="btn primary" data-act="n8nUndo" data-arg="${wf}">Undo Carol’s change</button><button class="btn" data-act="n8nAsk" data-arg="${wf}">Fix it in n8n${I.ext(14)}</button></div>` : '<p class="note">An Operator can undo the change.</p>') : ''}
      </div>`;
    }
    /* The AI troubleshooter's four answers (spec 10.3): what happened, what was affected, whether a fix is safe, what to do. */
    if (id === 'issues' && S.issues === 'failed') {
      return `<div class="panel">
        <dl class="qa"><dt>What happened</dt><dd>Jira didn’t answer at 8:00. It was down for maintenance, and it’s working again now.</dd></dl>
        <dl class="qa"><dt>What was affected</dt><dd>Today’s check didn’t run. Nothing was written.</dd></dl>
        <dl class="qa"><dt>Can it be fixed safely</dt><dd>Yes. A retry reads the tickets again, and its ticket still waits for a yes.</dd></dl>
        <dl class="qa"><dt>What to do</dt><dd>Retry the run. You can do this yourself.</dd></dl>
        ${me().op ? '<div class="btns"><button class="btn primary" data-act="retryIssues">Retry the run</button></div>' : '<p class="note">An Operator can retry the run.</p>'}
      </div>`;
    }
    if (id === 'nudge' && S.nudge === 'failed') {
      return `<div class="panel">
        <dl class="qa"><dt>What happened</dt><dd>The step that reads tickets stopped on <b>MOCK-31</b>. Its description is in a form the platform couldn’t read. The platform should skip a ticket like this, but it crashed.</dd></dl>
        <dl class="qa"><dt>What was affected</dt><dd>Last Friday’s summary wasn’t made. Nothing was written.</dd></dl>
        <dl class="qa"><dt>Can it be fixed safely</dt><dd>Not from here. This is a problem in the platform, not in your workflow, so a retry would stop in the same place.</dd></dl>
        <dl class="qa"><dt>What to do</dt><dd>Report it. Support gets the run and this explanation, and you can follow the case under Following up on Workflows.</dd></dl>
        ${S.report === 0 ? `<div class="btns">${me().op ? '<button class="btn primary" data-act="report" data-unbuilt="Report to support">Report to support</button>' : '<p class="note">An Operator can report this to support.</p>'}</div>`
          : `<div data-pres="case:${S.supportCase.id}" data-unbuilt="Support cases"><h3>Reported to support</h3>${caseBox()}${reportTrack(false)}${S.report === 4 && me().op ? '<div class="btns"><button class="btn primary" data-act="retryNudge">Retry the run</button></div>' : ''}</div>`}
      </div>`;
    }
    if (id === 'conf' && S.conf === 'expired') {
      const q = req('conf');
      return `<div class="panel"><h2>No answer</h2>
        <p>${whoAnd(askedOf(q))} didn’t answer by ${at(q.expiresAt)}, so the request stopped. Nothing was written. A request never says yes by itself.</p>
        ${me().op ? `<div class="btns"><button class="btn primary" data-act="testRun">Do a test run again</button>${changeApproversBtn('conf', 'apprFromRun')}</div>` : ''}</div>`;
    }
    const done = {
      sw: S.sw === 'approved'
        ? `<h2><span class="ok-mark">${I.check(18)}</span>Done</h2><p>${nm(S.swBy)} approved, and the platform created the tickets.</p><div class="result-chips">${ticketBtn('MOCK-16', 'Log4j core')}${ticketBtn('MOCK-14', 'LangGraph')}${ticketBtn('MOCK-15', 'FastAPI')}</div>`
        : `<h2>Declined</h2><p>${nm(S.swBy)} declined, so nothing was written. The tickets will be proposed again next Monday.</p>`,
      issues: `<h2><span class="ok-mark">${I.check(18)}</span>Done</h2><p>The retry read Jira. No tickets were created since the last run, so there was nothing to write.</p>`,
      nudge: S.nudge === 'approved'
        ? `<h2><span class="ok-mark">${I.check(18)}</span>Back to normal</h2><p>The fix from support is live, MOCK-31 was read without stopping the run, and ${nm(S.nudgeBy)} approved the summary.</p><div class="result-chips"><span class="pill ok">${I.check(12)}MOCK-34 created</span></div>`
        : `<h2>Declined</h2><p>${nm(S.nudgeBy)} declined, so nothing was written. The next summary runs on Friday.</p>`,
      conf: S.conf === 'declined' ? `<h2>Declined</h2><p>${nm(S.confBy)} declined, so nothing was written. Change what it does, or run the test again.</p>${me().op ? '<div class="btns"><button class="btn primary" data-act="testRun">Do a test run again</button></div>' : ''}`
        : S.nr ? `<h2><span class="ok-mark">${I.check(18)}</span>Done</h2><p>${confYesWho()} approved, and the platform ${confWrite(S.nr).doneText}.</p><div class="result-chips"><span class="pill ok">${I.check(12)}${confWrite(S.nr).result}</span></div>` : '',
    }[id];
    return `<div class="panel">${done}<div class="btns"><button class="btn" data-act="go" data-arg="home">Back to Home</button></div></div>`;
  }

  /* ---------- The set-up card's parts: the read-back chips and the understood sentence ---------- */
  const lc = (s) => s.charAt(0).toLowerCase() + s.slice(1);
  /* The schedule picker opens after Change, or by itself when the schedule is the one thing left (spec 7.1). */
  const whenShown = () => !!S.wiz.sched && (S.wiz.whenOpen || (Object.keys(schedProblems(S.wiz.sched)).length > 0 && setupLeft().length === 1));
  const CHIP_HINT = { ok: 'your words', changed: 'chosen by you', missing: 'please choose', cant: 'can’t do this yet', later: 'please choose when it runs', filled: 'filled in by me' };
  function sentenceChip(r, text) {
    const hint = CHIP_HINT[r.state];
    if (r.key === 'when') return `<button type="button" class="schip ${r.state}" title="${cap(hint)}" data-act="whenOpen" aria-expanded="${whenShown()}" aria-label="${r.label}: ${text}, ${hint}. Change it">${text}${I.down(14)}</button>`;
    if (!r.options) return `<span class="schip ${r.state}" title="${cap(hint)}">${text}</span>`;
    const inOpts = r.options.some(([v]) => v === r.selected);
    return `<span class="schip ${r.state}" title="${cap(hint)}"><span data-val="chip:${r.key}">${text}</span>${I.down(14)}<select id="fix-${r.key}" data-fix="${r.key}" aria-label="${r.label}: ${r.value ? esc(r.value) : 'not sure'}, ${hint}. Change it">${opt('', r.value ? 'Change…' : 'Choose…', inOpts ? null : '')}${r.options.map(([v, l]) => opt(v, l, inOpts ? r.selected : null)).join('')}</select></span>`;
  }
  /* What will happen, as one sentence (spec 7.1). The time is plain words here; the When section holds its control.
     Notes under it only for a changed part or one the platform can't do. */
  function understoodSentence(rows) {
    const k = Object.fromEntries(rows.map((r) => [r.key, r]));
    const chip = (key, fallback, keepCase) => sentenceChip(k[key], k[key].value ? (keepCase ? esc(k[key].value) : lc(esc(k[key].value))) : fallback);
    const notes = rows.filter((r) => r.note && r.key !== 'when' && ['changed', 'cant'].includes(r.state));
    const icon = { cant: I.alert(16), changed: I.edit(16) };
    const glue = (html, mark) => `<span class="glue">${html}${mark}</span>`;
    const when = k.when.value ? `${esc(k.when.value)}, find` : 'Find';
    const the = /^tickets/i.test(k.tickets.value || '') ? 'the ' : '';
    const project = sentenceChip(k.project, k.project.value ? `Jira project ${esc(k.project.value)}` : 'a Jira project');
    return `<p class="sentence-line">${when} ${the}${chip('tickets', 'which tickets')} in ${glue(project, ',')} ${glue(chip('action', 'what it does'), ',')} and ${glue(chip('dest', 'where it goes'), '.')}</p>
      ${notes.length ? `<ul class="snotes">${notes.map((r) => `<li class="${r.state}">${icon[r.state]}<span><b>${r.label}:</b> ${r.note}${r.key === 'source' ? ` ${sentToTeam(r.value) ? '<span class="pill wait">Asked the team</span>' : `<button class="linkbtn" data-act="teamReq" data-arg="${esc(r.value)}|wiz">Ask the team</button>`}` : ''}</span></li>`).join('')}</ul>` : ''}`;
  }

  /* ---------- Ask the Planner ----------
     Every request gets one of five answers. classify() turns the text into one answer record, whose `kind` picks a
     row of ANSWERS: what the Planner says, which card it shows and the face it makes. The record is the card's data,
     kept on the message. A set-up card has no data of its own: it edits the one live draft in S.wiz, so the read-back
     rows, the plan and the schedule and Approver fields are the same code the workflow page uses. */
  const PROJECTS = ['MOCK', 'OPS', 'SUP'];
  /* What the Planner can't do, and the nearest thing it can. Each answer points at the capability in the registry, which
     gives the verb and the reason, and keeps its own alternative: a request the Planner can set up, with the result in
     a Jira ticket, the one place it can write today. */
  const INSTEAD = 'The same thing, with the result put in one Jira ticket, after a yes.';
  const CANT = {
    email: { cap: 'email', sys: 'Outlook email', cant: 'send email', instead: INSTEAD, next: (t) => t.replace(/\be-?mail(?:\s+(?:me|us))?\b/i, 'make') },
    slack: { cap: 'email', sys: 'Slack', cant: 'post in Slack', instead: INSTEAD, next: (t) => t.replace(/\s*\b(in|on|to|into) slack\b/i, '') },
    teams: { cap: 'teamsPost', sys: 'Posting in Teams', instead: INSTEAD, next: (t) => t.replace(/\s*\b(in|on|to|into|via) (teams|(the |our )?[\w-]+ channel|(the |our )?team chat|chat)\b/i, '') },
    confluence: { cap: 'confluence', sys: 'Confluence', instead: INSTEAD, next: (t) => t.replace(/\s*\b(in|on|to|into) (confluence|(the |our )?wiki|(a |the )?(confluence |wiki )?page)\b/i, '') },
    nudge: { cap: 'teamsPost', sys: 'Posting in Teams', cant: 'message ticket owners', instead: 'List the same tickets, with their owners, in one Jira ticket, after a yes. Someone can then message them.', next: (t, it) => `${whenAsked(it) || 'Every week'}, list ${(it.tickets ? ticketLabel(it.tickets.kind, it.tickets.days) : 'open tickets').toLowerCase()}` },
    tickets: { cap: 'tickets', sys: 'Changing tickets', instead: 'Every Friday, list the tickets with no update for 30 days in one Jira ticket, so someone can close them.', next: () => 'Every Friday, list tickets with no update for 30 days' },
  };
  /* "I can make that list, but I can't send email. Email isn't connected to the platform." The first half names the part
     the registry can do, when the request has one (spec 6.2). */
  function cantSay(a) {
    const k = CANT[a.what];
    const c = CAPS[k.cap];
    const it = a.it || {};
    const part = it.tickets || it.action === 'list' || it.action === 'summary' ? `I can ${it.action === 'summary' ? 'write that summary' : 'make that list'}, but ` : '';
    const verb = k.cant || c.cant;
    return `${part}I can’t ${verb}${capState(k.cap) === 'planned' ? ' yet' : ''}. ${c.why}`;
  }
  /* A tool that would be new in a system that is already connected. Drafting one widens what the safety checker allows,
     so until its ADR is accepted the tool is the team's decision (ADR 0037). The verb keeps reads like "list high
     priority tickets" out of it. */
  const toolAskIn = (t) => /\b(put|set|add|create|raise|open|file|assign|move)\b/i.test(t) && TOOL_ASKS.find((x) => x.draft && x.re.test(t));
  const watchFor = (hit, text, word) => {
    if (hit && onList(hit[0])) return { kind: 'listed', name: hit[0] };
    const name = hit ? hit[0] : cap(text.trim().replace(/[.?!]+$/, '').replace(/^(watch|track|keep track of)\s+/i, '').slice(0, 40));
    /* A known project on a registry counts as known only when registries are a source; otherwise the person gives its GitHub project. */
    const known = hit && (shows('registries') || !hit[2] || hit[2] === 'github');
    return { kind: 'watch', name, src: known ? hit[2] || 'github' : 'github', repo: known ? hit[1] : '', via: known && shows('registries') ? hit[3] : null, repoState: known ? 'guess' : 'edit', repoDraft: known ? hit[1] : '', version: '', newest: false, word, security: isSecurityAsk(text), done: false };
  };
  /* Where the guess came from, and that it was checked, so the person confirms a fact and not a hunch. */
  const guessNote = (c) => `${c.via ? `From ${srcName(c.via[0])}’s ${esc(c.via[1])} package, which points to ${esc(c.repo)}.` : 'From our list of known projects.'} Checked: it exists and publishes ${c.src === 'github' ? 'releases' : `versions on ${srcName(c.src)}`}.`;
  /* A reply to the one chat question that backs out of it. */
  const BACK_OUT = /^(never ?mind|cancel|no( thanks| thank you)?|forget it|skip( it)?|nothing|stop|leave it|not now|none)\b[.!]?$/i;
  function classify(text, force) {
    const t = text.trim();
    const c = S.chat;
    if (force === 'setup') return startDraft(t, parseIntent(t));
    if (UNSAFE.test(t)) return { kind: 'refuse', text: t, next: t.replace(UNSAFE, '').replace(/\s{2,}/g, ' ').replace(/[,\s]+(and|but|then|so)?[,\s]*$/i, '') };
    const hit = namedIn(t);
    const word = (t.match(RELEASE_WORDS) || [''])[0];
    if (c.pending === 'software') {
      c.pending = null;
      if (BACK_OUT.test(t)) return { kind: 'back' };
      /* A known name, or a short name-like reply, answers the question. Anything longer is a new request. */
      if (hit || (t.split(/\s+/).length <= 3 && !/ticket|jira|every|list|sum/i.test(t))) return watchFor(hit, t, word);
    }
    /* Questions about her workflows (spec 6.2) are answered from platform state. Word rules stand in for the model. */
    const about = aboutWorkflows(t);
    if (about) return about;
    if (word || (hit && /keep track|\bwatch\b|\btrack\b|monitor/i.test(t))) {
      if (hit) return watchFor(hit, t, word);
      c.pending = 'software';
      return { kind: 'which', word };
    }
    const it = parseIntent(t);
    if (it.dest && it.dest !== 'jira') return { kind: 'cant', what: it.dest, sys: CANT[it.dest].sys, text: t, it };
    if (it.action === 'nudge') return { kind: 'cant', what: 'nudge', sys: CANT.nudge.sys, text: t, it };
    if (/\b(close|closes|delete|remove|edit|move|assign|reassign|resolve|archive)\b/i.test(t) && /ticket|issue|bug|story|task/i.test(t)) return { kind: 'cant', what: 'tickets', sys: CANT.tickets.sys, text: t, it };
    const ta = toolAskIn(t);
    if (ta) return { kind: 'part', cap: ta.draft, can: 'find these Jira tickets', cant: `not ${CAPS[ta.draft].cant}`, instead: 'The same tickets, without the component, after a yes.', next: t.replace(/\s*\b(in|into|under|with|to) (the )?[\w-]+ component\b/i, ''), text: t, it };
    /* A request that needs a field the Jira read doesn't return (CAPS.updated) gets the part the registry can do. */
    if (it.needs) {
      const verb = it.action === 'summary' ? 'sum up' : 'list';
      const when = whenAsked(it) || 'Every week';
      const alt = it.needs === 'updated' ? `open tickets created more than ${it.days} days ago` : (it.tickets ? ticketLabel(it.tickets.kind, it.days) : 'open tickets').toLowerCase();
      const instead = { updated: `${cap(verb)} ${alt} instead, in one Jira ticket, after a yes.`, owners: 'The same tickets, without their owners, in one Jira ticket, after a yes.', type: 'The same tickets, of every type, in one Jira ticket, after a yes.' }[it.needs];
      return { kind: 'part', cap: 'updated', can: 'find tickets by when they were created or closed', cant: NEEDS[it.needs], instead, next: `${when}, ${verb} ${alt}`, text: t, it };
    }
    const jiraAsk = it.tickets || it.action || it.freq || it.badSource || /ticket|jira|bug|summar|report|list|stale|closed|open/i.test(t);
    /* Jira is down: the Planner says so and offers to keep the request as a draft, instead of a card it can't check. */
    if (jiraAsk && jiraDown()) return { kind: 'down', text: t, it };
    if (jiraAsk) return startDraft(t, it);
    return { kind: 'abilities', unknown: !/what can|what do you|help|can you|abilit/i.test(t) };
  }
  /* ---------- Answers about her workflows (spec 6.2, the three new kinds) ----------
     Check my workflows, why it stopped and what needs me read the same state as Workflows and Needs you. In the
     prototype, word rules pick them; in the built app, the model picks the kind and code fills it from platform-api. */
  const workflowNamed = (t) => routineIds().find((id) => t.toLowerCase().includes(R(id).name.toLowerCase()));
  const ABOUT = [
    [/\bwhy\b.*\b(stop|stopped|fail|failed|broke|broken|went wrong)\b|\bwhat (went wrong|happened)\b/i, (t) => ({ kind: 'why', id: workflowNamed(t) || stoppedIds()[0] || null })],
    [/\bwhat needs me\b|\bneeds? (my|me)\b|\banything (to approve|waiting|for me)\b|\bwaiting for me\b|\bmy (to-?do|approvals?)\b|\bwhat('s| is) waiting\b|\bto approve\b/i, () => ({ kind: 'mine' })],
    [/\banother workflow\b|\bnew workflow\b|\bwhat else\b|\bstarting points?\b|\bideas?\b/i, () => ({ kind: 'starts' })],
    [/\b(check|how are|status of|state of|see)\b.*\bworkflows?\b|\b(is|are)\b.*\b(running|working|on)\b\s*\?*$/i, () => ({ kind: 'check' })],
  ];
  const aboutWorkflows = (t) => { const hit = ABOUT.find(([re]) => re.test(t)); return hit ? hit[1](t) : null; };
  /* A workflow's state in the spec's words (15.9), as a pill tone and a word. */
  const stateOf = (id) => (S.paused[id] ? ['off', 'Paused'] : { bad: ['bad', 'Stopped'], wait: ['wait', 'Waiting for a yes'], off: ['off', 'No answer'] }[status(id).tone] || ['ok', 'Running']);
  const STATE_ORDER = ['Stopped', 'Waiting for a yes', 'Running', 'Paused', 'No answer'];
  function checkSay() {
    const ids = routineIds();
    if (!ids.length) return 'You have no workflows yet. Tell me a task, and I’ll set it up.';
    const count = {};
    ids.forEach((id) => { const w = stateOf(id)[1]; count[w] = (count[w] || 0) + 1; });
    const said = (w, k) => (w === 'Running' ? `${k} ${k === 1 ? 'is' : 'are'} running` : w === 'Waiting for a yes' ? `${k} ${k === 1 ? 'is' : 'are'} waiting for a yes` : w === 'No answer' ? `${k} got no answer` : `${k} ${w.toLowerCase()}`);
    return `You have ${ids.length} workflow${ids.length === 1 ? '' : 's'}. ${andList(STATE_ORDER.filter((w) => count[w]).map((w) => said(w, count[w])))}.`;
  }
  function checkCard() {
    return `<div class="pcard wfcheck" data-unbuilt="Planner answers about your workflows"><ul class="rows">${comingUp().map(([id, r]) => {
      const [tone, label] = stateOf(id);
      return `<li class="row"><div><button class="linkbtn" data-act="workflow" data-arg="${id}">${esc(r.name)}</button><span class="row-sub">${pill({ tone, label })}${S.paused[id] ? '' : `<span>Next run ${r.next}</span>`}</span></div>${actionFor(id)}</li>`;
    }).join('')}</ul></div>`;
  }
  /* The AI troubleshooter's four answers for each stop in the sample data (spec 10.3). The run page shows the same four. */
  const TROUBLE = {
    issues: () => ({ happened: 'Jira didn’t answer at 8:00. It was down for maintenance, and it’s working again now.', affected: 'Today’s check didn’t run. Nothing was written.', safe: 'Yes. A retry reads the tickets again, and its ticket still waits for a yes.', next: 'Retry the run.', act: '<button class="btn primary sm" data-act="retryIssues">Retry the run</button>' }),
    nudge: () => ({
      happened: 'The step that reads tickets stopped on MOCK-31. Its description is in a form the platform couldn’t read.', affected: 'Last Friday’s summary wasn’t made. Nothing was written.', safe: 'Not from here. This is a problem in the platform, not in your workflow, so a retry would stop in the same place.',
      next: S.report === 0 ? 'Report it. Support gets the run and this explanation.' : S.report === 4 ? 'The fix is live. Retry the run.' : `Support has it as case ${S.supportCase.id}. Follow it under Following up on Workflows.`,
      act: S.report === 0 ? '<button class="btn primary sm" data-act="report" data-unbuilt="Report to support">Report to support</button>' : S.report === 4 ? '<button class="btn primary sm" data-act="retryNudge">Retry the run</button>' : '',
    }),
  };
  const stoppedNow = (id) => !!id && !!TROUBLE[id] && stoppedIds().includes(id);
  function whySay(a) {
    if (stoppedNow(a.id)) return `${R(a.id).name} stopped. Here’s what the AI troubleshooter found.`;
    if (a.id) return `${R(a.id).name} hasn’t stopped. ${S.paused[a.id] ? 'It’s paused.' : `It’s ${stateOf(a.id)[1].toLowerCase()}, and its next run is ${R(a.id).next}.`}`;
    return 'Nothing has stopped. Here’s how your workflows are doing.';
  }
  function whyCard(m) {
    const id = m.card.id;
    if (!stoppedNow(id)) return id ? `<div class="btns"><button class="btn sm" data-act="workflow" data-arg="${id}">See the workflow</button></div>` : checkCard();
    const t = TROUBLE[id]();
    return `<div class="pcard why" data-pres="why:${m.id}" data-unbuilt="Planner answers about your workflows">
      <div class="pcard-h">${face('trouble', 32)}<h3>AI troubleshooter</h3></div>
      <div class="pcard-s"><dl class="qa"><dt>What happened</dt><dd>${t.happened}</dd></dl><dl class="qa"><dt>What was affected</dt><dd>${t.affected}</dd></dl><dl class="qa"><dt>Can it be fixed safely</dt><dd>${t.safe}</dd></dl><dl class="qa"><dt>What to do</dt><dd>${t.next}</dd></dl></div>
      <div class="pcard-f">${me().op ? t.act : ''}<button class="btn sm" data-act="run" data-arg="${id}">See the run</button></div>
    </div>`;
  }
  const mineSay = () => { const n = needs().length; return n ? `${n === 1 ? '1 thing needs' : `${n} things need`} you.` : 'Nothing needs you right now.'; };
  const mineCard = () => (needs().length ? needsStrip(needs(), 99, 'Planner answers about your workflows') : '');
  const startsCard = () => `<div class="chips starts" role="group" aria-label="Starting points" data-unbuilt="Planner answers about your workflows">${starts().map((t) => `<button class="chip" data-act="say" data-arg="${esc(t)}">${esc(t)}</button>`).join('')}</div>`;

  /* The answers (spec 6.2). Each covers what I understood, what I can do, what I need from you, and what happens next
     (6.1): the sentence carries the first two, the card the other two. The set-up reply carries no count: the card's
     footer is the only count (I8). */
  const ANSWERS = {
    setup: { say: () => 'Here’s what I understood. I filled in what I could.', card: (m) => setupCard(m) },
    watch: { say: (a) => `${a.word ? `You mentioned “${esc(a.word)}”, so this` : `${esc(a.name)} is software, so it`} belongs on the Software watchlist, which checks all your software every Monday.${a.security ? (shows('registries') ? ' Known vulnerabilities are checked too.' : ' Known vulnerabilities aren’t checked yet, but new releases are.') : ''}`, card: (m) => watchCard(m) },
    listed: { say: (a) => `${esc(a.name)} is already on the Software watchlist.`, card: () => '<div class="btns"><button class="btn sm" data-act="go" data-arg="software">Open it</button></div>' },
    which: { say: (a) => `You mentioned “${esc(a.word)}”, so this belongs on the Software watchlist. Which software should I watch?` },
    back: { say: () => 'No problem. Ask for something else whenever you like.' },
    part: { say: (a) => `I can ${a.can}, but ${a.cant}. ${a.cap === 'jiraComp' ? NEW_TOOL : CAPS[a.cap].why}`, card: (m) => partCard(m), mood: 'sorry' },
    cant: { say: cantSay, card: (m) => cantCard(m), mood: 'sorry' },
    down: { say: () => 'Jira isn’t answering right now, so I can’t check that. I’ll be able to once it’s back.', card: (m) => downCard(m), mood: 'sorry' },
    refuse: { say: () => 'I can’t set that up. Anything that changes data waits for a yes, every time.', card: (m) => refuseCard(m), mood: 'sorry' },
    abilities: { say: (a) => (a.unknown ? 'I can’t help with that here. I set up tasks your team repeats. Here’s what I can do.' : 'Here’s what I can do today, and what I can’t do yet.'), card: () => abilitiesHTML(), mood: (a) => (a.unknown ? 'sorry' : 'idle') },
    check: { say: checkSay, card: () => checkCard() },
    why: { say: whySay, card: (m) => whyCard(m), mood: (a) => (stoppedNow(a.id) ? 'sorry' : 'idle') },
    mine: { say: mineSay, card: () => mineCard() },
    starts: { say: () => 'Here are three places to start. Pick one, or tell me something else.', card: () => startsCard() },
  };
  const cardHTML = (m) => (ANSWERS[m.card.kind].card ? ANSWERS[m.card.kind].card(m) : '');

  /* ---------- Drafts ----------
     The chat is not the record. The set-up card still being filled in edits the one live draft in S.wiz. A new request
     or a new chat saves that draft to S.drafts, listed on Workflows, and opening one brings it back to S.wiz. Turning
     a draft on empties S.wiz, so it is gone from the list. */
  const liveSetup = () => S.chat.msgs.find((m) => m.card && m.card.kind === 'setup' && !m.card.done && !m.card.saved && !m.card.discarded);
  /* A draft row for the request in S.wiz, or for one built from a request the Planner couldn't check. */
  const draftRow = (wiz = S.wiz) => {
    const keep = S.wiz;
    S.wiz = wiz;
    const row = { id: (S.draftSeq += 1), wiz, name: wiz.name.trim() || draftNr().name, left: setupLeft().length };
    S.wiz = keep;
    return row;
  };
  function saveLive() {
    const m = liveSetup();
    if (!m) return false;
    S.drafts.push(draftRow());
    m.card.saved = true;
    S.wiz = newWiz();
    return true;
  }
  const draftRows = () => (liveSetup() ? [{ id: 'live', name: S.wiz.name.trim() || draftNr().name, left: setupLeft().length }] : []).concat(S.drafts.map((d) => ({ id: d.id, name: d.name, left: d.left })));
  function startDraft(text, it) {
    saveLive();
    S.wiz = { ...newWiz(), text, intent: it, sched: { freq: it.freq || '', day: it.day || '', time: it.time || '', monthDay: '1' } };
    return { kind: 'setup' };
  }
  /* What still stops Turn it on: the amber and red parts, by name. */
  function setupLeft() {
    const left = [];
    if (Object.keys(schedProblems(S.wiz.sched)).length) left.push('when it runs');
    const names = { source: 'what it reads', tickets: 'which tickets', project: 'the Jira project', action: 'what it does' };
    intentRows().filter((r) => r.key !== 'when' && (r.state === 'missing' || r.state === 'cant')).forEach((r) => left.push(names[r.key]));
    return left;
  }
  const leftWords = (n) => (n === 1 ? '1 choice left' : `${n} choices left`);
  /* The promises live in the confirmation, where they matter (spec 7.2). */
  const PROMISES = 'You can pause, change or delete it at any time. If it stops, the AI troubleshooter tells you why.';

  /* The set-up card (spec 7): what will happen, when, what needs a yes, then how it works, collapsed, and Turn it on. */
  function setupCard(m) {
    const c = m.card;
    if (c.done) return `<div class="pdone"><span class="tick">${I.check(14)}</span><div><b>${esc(c.done.name)} is on.</b><span>First run ${c.done.next}, Singapore time. Before its ticket is created, any Approver on your team except you is asked for a yes in Teams.${c.done.newAgent ? ` The ${AGENTS[c.done.newAgent].name} is saved in the Agent library.` : ''}</span><span>${PROMISES}</span><span class="btns"><button class="btn primary sm" data-act="testRun">Do a test run</button><button class="linkbtn" data-act="go" data-arg="workflows">See it in Workflows</button><span class="small muted">A test run does the real work once, so it still waits for a yes.</span></span></div></div>`;
    if (c.discarded) return '<p class="small muted">Discarded.</p>';
    if (c.saved) return '<p class="small muted">Saved as a draft. Open it from Workflows to carry on.</p>';
    const w = S.wiz;
    const f = draftNr();
    const rows = intentRows();
    const left = setupLeft();
    const similar = f.tickets === 'closed' && f.action === 'summary' && has('nudge');
    const writer = writerOf(f);
    const steps = planOf(f).map((s, i) => s.concat(i === 0 ? 'jira' : i === 1 ? writer : 'platform', i === 1 && isNewAgent(writer)));
    const title = w.name.trim() || f.name;
    const timeOk = !Object.keys(schedProblems(w.sched)).length;
    const picker = whenShown() ? `<div class="whenpick" id="whenpick">${schedFields('sched', w.sched, w.schedErr)}<div class="btns"><button class="btn sm" data-act="whenDone">Done</button></div></div>` : '';
    const job = { list: 'lists them', compare: 'compares them with the week before' }[f.action] || 'sums them up';
    return `<div class="pcard" data-pres="setup:${m.id}">
      <div class="pcard-h">${w.renaming
        ? `<label class="vh" for="rname">Workflow name</label><input type="text" id="rname" data-input="name" value="${esc(w.name || f.name)}"><button class="btn sm" data-act="renameDone">Done</button>`
        : `<h3 tabindex="-1">${esc(title)}</h3><button class="linkbtn" data-act="rename">Rename</button>`}</div>
      <section class="pcard-s"><h4>What will happen</h4>
        ${understoodSentence(rows)}
        ${similar ? `<p class="similar">${I.info(16)}<span>You already have a similar workflow, <i>Weekly closed-ticket summary</i>. <button class="linkbtn" data-act="workflow" data-arg="nudge">Open it</button></span></p>` : ''}
      </section>
      <section class="pcard-s"><h4>When</h4>
        <p class="when-line">${I.clock(16)}<span data-val="when">${timeOk ? `${schedText(w.sched)}, Singapore time` : '<span class="schip missing">Choose when it runs</span>'}</span>${picker ? '' : '<button class="btn sm" data-act="whenOpen" aria-expanded="false" aria-controls="whenpick">Change</button>'}</p>
        ${picker}
      </section>
      <section class="pcard-s"><h4>What needs a yes</h4><p class="apsum">${I.shield(16)}<span>Creating the Jira ticket changes data, so each run waits for a yes in Teams. Any Approver on your team except you can say yes.${shows('namedApprovers') ? ` Named Approvers, with a backup and a stop time, come later. ${PLANNED_TAG}` : ''}</span></p></section>
      <details class="more how" data-unbuilt="How this workflow works"><summary>How this workflow works</summary><div class="more-body">
        ${stepsList(steps, true, 'plan:draft')}
        <p class="agents-line">${face('jira', 26)}<span><b>${AGENTS.jira.name}</b> reads the tickets.</span>${face(writer, 26)}<span><b>${AGENTS[writer].name}</b> ${job}.${isNewAgent(writer) ? ' <span class="tag">New agent, saved to the Agent library when you turn this on</span>' : ''}</span></p>
        <p class="note">Tools: ${TOOLS.jiraSearch[0]} and ${TOOLS.jiraRead[0]} read Jira. ${TOOLS.jiraCreate[0]} writes to Jira, after a yes.</p>
      </div></details>
      <div class="pcard-f"><button class="btn primary" data-act="turnOn"${left.length ? ' disabled' : ''}>Turn it on</button>
        ${left.length ? `<span class="left">${leftWords(left.length)}: ${andList(left)}.</span>` : '<span class="note">Nothing is unclear. One yes turns it on.</span>'}</div>
    </div>`;
  }

  const watchLeft = (c) => (c.repoState !== 'ok' ? 1 : 0) + (!c.newest && !c.version.trim() ? 1 : 0);
  function watchCard(m) {
    const c = m.card;
    const id = m.id;
    if (c.done) return `<div class="pdone"><span class="tick">${I.check(14)}</span><div><b>${esc(c.name)} is on the Software watchlist.</b><span>First check ${R('sw').next}, with the rest of your software. ${apprOf('sw') ? apprText(apprOf('sw')).replace(/,.*$/, '') : R('sw').approves} is asked before any ticket is created.</span><span class="btns"><button class="linkbtn" data-act="go" data-arg="software">Open Software watchlist</button></span></div></div>`;
    const src = srcName(c.src);
    const [label, ph, help] = SRC_FIELD[c.src];
    const repo = c.repoState === 'ok' ? `<b>${esc(c.repo)}</b><span class="schip changed">Checked by you</span>`
      : c.repoState === 'guess' ? `<b>${esc(c.repo)}</b><span class="schip missing">I guessed this</span><span class="fld-note">${guessNote(c)}</span><span class="btns"><button class="btn sm" data-act="repoOk" data-mid="${id}">Looks right</button><button class="linkbtn" data-act="repoEdit" data-mid="${id}">Change</button></span>`
        : `<label class="vh" for="repo-${id}">${label}</label><input type="text" class="inp" id="repo-${id}" data-card="repoDraft" data-mid="${id}" value="${esc(c.repoDraft)}" placeholder="${ph}"${c.repoErr ? ' aria-invalid="true"' : ''}><button class="btn sm" data-act="repoUse" data-mid="${id}">Use this</button><span class="schip missing">Please tell me</span><span class="fld-note">${c.repoErr || help}</span>`;
    const ver = c.newest ? `<b>Start from the newest version</b><span class="schip changed">Chosen by you</span><button class="linkbtn" data-act="verType" data-mid="${id}">Change</button><span class="fld-note">The first check records the newest version as yours. You can correct it on the watchlist.</span>`
      : `<label class="vh" for="ver-${id}">Version you run</label><input type="text" class="inp" id="ver-${id}" data-card="version" data-mid="${id}" value="${esc(c.version)}" placeholder="For example 1.2.14" inputmode="decimal">${c.version.trim() ? '' : '<span class="schip missing">Please tell me</span>'}<button class="linkbtn" data-act="verNewest" data-mid="${id}">Not sure? Start from the newest</button>`;
    const n = watchLeft(c);
    return `<div class="pcard" data-pres="watch:${id}" data-unbuilt="Adding software from the Planner">
      <div class="pcard-h"><h3>Add ${esc(c.name)} to the Software watchlist</h3><span class="kind">${I.box(16)}Software watchlist</span></div>
      <div class="flds">
        <div class="fld"><div class="fld-k">Software</div><div class="fld-v"><b>${esc(c.name)}</b><span class="schip ok">From your words</span></div></div>
        <div class="fld${c.repoState === 'ok' ? '' : ' needs'}"><div class="fld-k">Published on</div><div class="fld-v"><span>${src}</span>${repo}</div></div>
        <div class="fld${!c.newest && !c.version.trim() ? ' needs' : ''}"><div class="fld-k">Version you run</div><div class="fld-v">${ver}</div></div>
        <div class="fld"><div class="fld-k">Checked</div><div class="fld-v"><span>${R('sw').when}</span><span class="schip filled">Same for all software</span></div></div>
        <div class="fld"><div class="fld-k">Who says yes</div><div class="fld-v"><span>${R('sw').approves}</span><span class="schip filled">Same for all software</span>${apprOf('sw') ? PLANNED_TAG : ''}</div></div>
      </div>
      <div class="pcard-f"><button class="btn primary" data-act="watchAdd" data-mid="${id}"${n ? ' disabled' : ''}>Add ${esc(c.name)}</button>${n ? `<span class="left">${leftWords(n)}</span>` : ''}<button class="linkbtn push" data-act="watchOwn" data-mid="${id}">No, set it up as a new workflow</button></div>
    </div>`;
  }

  /* The team decides on new systems and new tools. The request is kept under "Asked the team" on Tools. */
  const askTeam = (m, sys) => (sentToTeam(sys) ? `<span class="pill wait">${I.check(12)}Asked the team</span>` : `<button class="linkbtn" data-act="teamReq" data-arg="${esc(sys)}|chat:${m.id}">Ask the team</button>`);
  function cantCard(m) {
    const c = m.card;
    const k = CANT[c.what];
    return `<div class="pcard" data-pres="cant:${m.id}">
      <div class="pcard-h"><h3>What I can do instead</h3><span class="schip cant">Can’t do this yet</span></div>
      <div class="alt"><p>${esc(k.instead)}</p><button class="btn primary sm" data-act="instead" data-mid="${m.id}">Set that up</button></div>
      <div class="alt"><p class="muted">Want ${c.what === 'tickets' ? 'it' : esc(c.sys)} anyway? The team decides.</p>${askTeam(m, c.sys)}</div>
    </div>`;
  }
  /* Part I can do (spec 6.2): the nearest real alternative, and Ask the team for the rest. */
  function partCard(m) {
    const c = m.card;
    const sys = c.cap === 'jiraComp' ? `A new Jira tool: ${TOOLS.jiraComp[0]}` : CAPS[c.cap].name;
    return `<div class="pcard" data-pres="part:${m.id}">
      <div class="pcard-h"><h3>The part I can do</h3><span class="schip cant">${c.cap === 'jiraComp' ? 'Needs a new tool' : 'Can’t do all of it yet'}</span></div>
      <div class="alt"><p>${esc(c.instead)}</p><button class="btn primary sm" data-act="instead" data-mid="${m.id}">Set up the part I can do</button></div>
      <div class="alt"><p class="muted">Want the rest? The team decides.</p>${askTeam(m, sys)}</div>
    </div>`;
  }
  /* Jira isn't answering: the request is kept as a draft, so nothing is lost and nothing is claimed. */
  function downCard(m) {
    if (m.card.saved) return '<p class="small muted">Saved as a draft. Find it on Workflows, and open it once Jira is back.</p>';
    return `<div class="pcard" data-pres="down:${m.id}">
      <div class="pcard-h"><h3>Keep it for later?</h3><span class="schip cant">Jira isn’t answering</span></div>
      <div class="alt"><p>I can save this as a draft on Workflows. Once Jira is back, open it and I’ll fill in what I can.</p><button class="btn sm" data-act="draftNow" data-mid="${m.id}">Save as a draft</button></div>
    </div>`;
  }
  function refuseCard(m) {
    return `<div class="pcard" data-pres="refuse:${m.id}">
      <div class="pcard-h"><h3>What I can do instead</h3><span class="schip cant">Not allowed</span></div>
      <div class="alt"><p>The same workflow, with a yes in Teams before anything is created or changed.</p><button class="btn primary sm" data-act="instead" data-mid="${m.id}">Set it up with a yes</button></div>
    </div>`;
  }

  /* The conversation. The person's words sit right; the Planner's replies carry its face in the state it is in. */
  const threadHTML = () => `<ol class="chat thread" aria-label="Conversation with the Planner" data-flip-group="chat">${S.chat.msgs.map(msgHTML).join('')}</ol>`;
  function msgHTML(m) {
    if (m.from === 'me') return `<li class="cmsg me" data-flip="msg:${m.id}" data-mid="${m.id}"><div class="cmsg-body"><div class="cmsg-bubble"><span class="vh">You: </span>${esc(m.text)}</div></div></li>`;
    const st = m.thinking ? 'thinking' : m.mood || 'idle';
    const body = m.thinking ? '<div class="cmsg-bubble"><span class="dots" role="status" aria-label="The Planner is thinking"><i></i><i></i><i></i></span></div>'
      : `${m.say != null ? `<div class="cmsg-bubble" data-say>${esc(m.say)}</div>` : ''}${m.card ? `<div data-pres="card:${m.id}">${cardHTML(m)}</div>` : ''}`;
    return `<li class="cmsg" data-flip="msg:${m.id}" data-mid="${m.id}"><span class="cmsg-av">${face('lead', 40, st, { k: `chat:${m.id}` })}</span><div class="cmsg-body"><span class="cmsg-who" style="color:${AGENTS.lead.hue}">Planner</span>${body}</div></li>`;
  }
  const msgById = (id) => S.chat.msgs.find((m) => m.id === +id);
  const onHome = () => S.view.name === 'home' && me().op;
  function scrollToMsg(id, block = 'nearest') {
    const el = $app.querySelector(`[data-mid="${id}"]`);
    if (el) el.scrollIntoView({ block, behavior: motionQuery.matches ? 'auto' : 'smooth' });
  }
  /* A request goes in, the Planner thinks for a moment, then its answer shows at once: the card, and the sentence
     written word by word with the speaking face. Nothing waits for the words. Reduced motion shows it all at once.
     force: 'setup' makes a set-up card whatever the words say, for "No, set it up as a new workflow". */
  function ask(text, force) {
    const t = text.trim();
    const c = S.chat;
    if (!t || c.busy) return;
    c.text = '';
    c.busy = true;
    c.hero = 'thinking';
    const wait = { id: c.seq + 2, from: 'planner', thinking: true };
    c.msgs.push({ id: c.seq + 1, from: 'me', text: t }, wait);
    c.seq += 2;
    if (S.view.name !== 'home') go('home'); else render();
    scrollToMsg(wait.id);
    setTimeout(() => {
      const a = classify(t, force);
      const ans = ANSWERS[a.kind];
      const say = ans.say(a);
      const mood = typeof ans.mood === 'function' ? ans.mood(a) : ans.mood || 'idle';
      /* The finished sentence is announced once (spec 15.8). A card answer takes focus at its heading; any other
         answer hands focus back to the box. */
      const done = () => {
        Object.assign(wait, { say, mood });
        c.hero = 'idle';
        c.busy = false;
        announce(say);
        if (onHome()) {
          render();
          const h = ['setup', 'watch'].includes(a.kind) ? $app.querySelector(`[data-mid="${wait.id}"] .pcard-h h3`) : null;
          if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); } else focusComposer();
        }
        if (mood === 'sorry') setTimeout(() => { wait.mood = 'idle'; if (onHome()) render(); }, 1800);
      };
      Object.assign(wait, { thinking: false, say: '', mood: 'speaking', card: ans.card ? a : null });
      if (motionQuery.matches) { done(); scrollToMsg(wait.id, wait.card ? 'start' : 'nearest'); return; }
      if (onHome()) { render(); scrollToMsg(wait.id, wait.card ? 'start' : 'nearest'); }
      const words = say.split(' ');
      let i = 0;
      const tick = () => {
        i += 1;
        wait.say = words.slice(0, i).join(' ');
        const el = $app.querySelector(`[data-mid="${wait.id}"] [data-say]`);
        if (el) el.textContent = wait.say;
        if (i < words.length) setTimeout(tick, 45); else setTimeout(done, 120);
      };
      tick();
    }, motionQuery.matches ? 250 : 900);
  }
  /* While you type, the Planner on Home leans in, its eyes follow the caret and its ear lights pulse on each key. */
  function listen(ta, on = !!ta.value.trim()) {
    const hero = document.getElementById('hero');
    if (!hero || S.chat.busy) return;
    hero.classList.toggle('fs-listening', on);
    hero.classList.toggle('fs-idle', !on);
    hero.classList.remove('live');
    if (!on || motionQuery.matches) { hero.style.removeProperty('--lx'); hero.style.removeProperty('--ly'); return; }
    const ratio = Math.min(1, (ta.selectionStart || 0) / Math.max(30, ta.value.length));
    hero.style.setProperty('--lx', `${(ratio * 4 - 2).toFixed(2)}px`);
    hero.style.setProperty('--ly', '1.6px');
    hero.querySelectorAll('.f-ear').forEach((e) => { e.classList.remove('on'); void e.getBoundingClientRect(); e.classList.add('on'); });
  }

  /* ---------- What the Planner can do ----------
     The registry, grouped by state: I can, Needs setup, Not working right now, Not yet. A planned line says so. The
     approval request isn't listed, because the platform does it for every workflow. */
  function abilitiesHTML() {
    const caps = Object.keys(CAPS).filter((id) => !CAPS[id].platform).map((id) => ({ id, st: capState(id) }));
    const groups = [['ready', 'I can', I.check(14)], ['setup', 'Needs setup', I.alert(14)], ['down', 'Not working right now', I.alert(14)], ['not', 'Not yet', I.x(13)]];
    const note = (c) => (c.st === 'down' ? `<small class="cap-note">Last seen working ${lastOk(c.id)}</small>` : c.st === 'setup' ? '<small class="cap-note">Replace the key in Settings</small>' : c.st === 'planned' ? '<small class="cap-note">Planned</small>' : '');
    return `<div class="abil">
      ${groups.map(([g, title, icon]) => { const list = caps.filter((c) => (g === 'not' ? ['planned', 'unsupported'].includes(c.st) : c.st === g)); return list.length ? `<div class="abil-${g}"><h3>${title}</h3><ul>${list.map((c) => `<li>${icon}<span>${CAPS[c.id].name}${note(c)}</span></li>`).join('')}</ul></div>` : ''; }).join('')}
      <p class="abil-foot">Anything that changes data waits for a yes in Teams. Need something that isn’t here? Ask, and I’ll pass it to the team.</p>
    </div>`;
  }
  function focusComposer() {
    const ta = $app.querySelector('[data-ask]');
    if (ta) ta.focus({ preventScroll: true });
  }

  const canOkTool = () => me().ap && S.user !== 'alice';

  /* The agents' faces in every state, for the design note's figure. Reached only by opening the page at #faces. */
  function facesView() {
    const fig = (html, label, style = '') => `<figure${style ? ` style="${style}"` : ''}>${html}<figcaption>${label}</figcaption></figure>`;

  /* ---------- Settings: the AI model the agents use (ADR 0022) ----------
     Pick a provider, paste the key and Connect. The platform reads which models the key can use. Test and save sends
     one short question and saves only if an answer comes back within 10 seconds. The key is write-only: afterwards
     only its last 2 characters show. An address that isn't a known provider needs an Approver to confirm it once. */
  const PROVIDERS = {
    aisg: { name: 'AI Singapore gateway', found: 9, models: [['claude-sonnet-5-5', 'suggested: quick and capable', '1.6'], ['claude-haiku-5-5', 'fastest', '0.9'], ['claude-opus-5-5', 'most capable', '3.8']] },
    anthropic: { name: 'Anthropic', found: 9, models: [['claude-sonnet-5-5', 'suggested: quick and capable', '1.5'], ['claude-haiku-5-5', 'fastest', '0.8'], ['claude-opus-5-5', 'most capable', '3.6']] },
    openai: { name: 'OpenAI', found: 41, models: [['gpt-5-mini', 'suggested: quick and capable', '1.8'], ['gpt-5-nano', 'fastest', '1.1'], ['gpt-5', 'most capable', '4.2']] },
    azure: { name: 'Azure OpenAI', address: 'https://your-resource.openai.azure.com', found: 4, models: [['gpt-5-mini', 'suggested: quick and capable', '1.9'], ['gpt-5', 'most capable', '4.4']] },
    gemini: { name: 'Google Gemini', found: 27, models: [['gemini-2.5-flash', 'suggested: quick and capable', '1.7'], ['gemini-2.5-pro', 'most capable', '4.0']] },
    other: { name: 'Another address', address: 'https://', confirm: true, found: 6, models: [['llama-3.3-70b-instruct', 'suggested: quick and capable', '2.4'], ['qwen3-32b', '', '3.1']] },
  };
  /* The test control "AI model" stands for whether Settings has a working model. Day one has one too (I5). */
  const curModel = () => (S.modelOn ? S.model : null);
  const freshModelForm = (provider = 'aisg') => ({ provider, address: '', key: '', show: false, step: 'key', model: '', err: {}, busy: '' });
  function modelProblems(f) {
    const err = {};
    const p = PROVIDERS[f.provider];
    const a = f.address.trim();
    if (p.address) {
      if (!a || a === 'https://') err.address = 'Type the address your provider gave you.';
      else if (!/^https:\/\//i.test(a)) err.address = 'Use an address that starts with https://.';
      else if (/localhost|\/\/127\.|\/\/10\.|\/\/192\.168\.|\/\/172\.(1[6-9]|2\d|3[01])\./i.test(a)) err.address = 'That address is inside a private network. Runs can only use it if the deployment lists it.';
      else if (f.provider === 'azure' && !/\.openai\.azure\.com/i.test(a)) err.address = 'Azure OpenAI addresses end in .openai.azure.com.';
    }
    if (!f.key.trim()) err.key = 'Paste the API key from your provider.';

  }
  function modelPanel() {
    const cur = curModel();

    const now = cur ? `<div class="model-now"><span class="pill ok">${I.check(12)}Connected</span><div><b>${cur.provider === 'other' ? esc(cur.address.replace(/^https:\/\//, '').replace(/\/.*$/, '')) : PROVIDERS[cur.provider].name} · ${cur.model}</b><span class="small muted">API key ending ${cur.keyEnd}. ${S.modelTest === 'done' ? 'Tested just now: it answered in 1.7 s.' : `Last tested ${cur.checked}: it answered in ${cur.secs} s.`}</span></div>

    const q = S.modelPending;
    const canConfirm = q && me().ap && q.byId !== S.user;
    const pending = q ? `<div class="apprbar">${I.shield(20)}<div><b>A new address is waiting for an Approver</b><span>${esc(q.address)} · ${q.model}. Entered by ${nm(q.byId)}. Agents send their prompts to this address, so someone else must confirm it. Until then, runs keep using ${cur ? cur.model : 'templates'}.</span></div>
        ${canConfirm ? '<div class="btns"><button class="btn bad sm" data-act="modelNotNow">Not now</button><button class="btn good sm" data-act="modelConfirm">Confirm address</button></div>' : `<span class="note">${q.byId === S.user ? 'You entered it, so you can’t confirm it.' : 'Waiting for an Approver'}</span>`}</div>` : '';
    let form = '<p class="note">Only Operators change the AI model. Approvers confirm a new address before runs use it.</p>';
    if (me().op && f.step === 'key') {
      form = `<form class="model-form" data-submit="modelConnect" novalidate><h3>${cur ? 'Change the model or key' : 'Connect a model'}</h3>
        <div class="model-grid">
          <div class="field"><label for="mf-provider">Provider</label><select id="mf-provider" data-mf="provider">${Object.entries(PROVIDERS).map(([k, x]) => opt(k, x.name, f.provider)).join('')}</select></div>
          ${p.address ? `<div class="field"><label for="mf-address">Address</label><input type="url" id="mf-address" data-mf="address" placeholder="${p.address}" value="${esc(f.address)}"${fieldErr('mf-address', f.err.address, p.confirm ? 'An Approver must confirm a new address once before runs use it.' : '')}</div>` : ''}
          <div class="field model-key"><label for="mf-key">API key</label><span class="keybox"><input type="${f.show ? 'text' : 'password'}" id="mf-key" data-mf="key" autocomplete="off" spellcheck="false" value="${esc(f.key)}" placeholder="${cur ? `Paste a new key to replace the one ending ${cur.keyEnd}` : 'Paste the key from your provider'}"${fieldAttrs('mf-key', f.err.key, true)}><button type="button" class="btn sm" data-act="modelShowKey" aria-pressed="${f.show}" aria-controls="mf-key">${f.show ? 'Hide' : 'Show'}</button></span>${fieldNotes('mf-key', f.err.key, 'Kept encrypted. After saving, nobody can read it back, and only its last 2 characters show.')}</div>

        <div class="btns"><button type="submit" class="btn primary"${f.busy ? ' aria-disabled="true"' : ''}>${f.busy ? 'Connecting…' : 'Connect'}</button></div></form>`;
    } else if (me().op) {
      form = `<form class="model-form" data-submit="modelSave" novalidate><h3>${cur ? 'Change the model or key' : 'Connect a model'}</h3>
        <p class="model-found">${I.check(16)}Connected to ${p.name}. It offers ${p.found} models, and ${p.models.length} of them can chat. The suggested one is first.</p>
        <div class="field"><label for="mf-model">Model</label><select id="mf-model" data-mf="model">${p.models.map(([m, note]) => opt(m, `${m}${note ? ` (${note})` : ''}`, f.model)).join('')}</select><span class="help">Test and save sends one short question. It saves only if the model answers within 10 seconds.</span></div>
        <div class="btns"><button type="submit" class="btn primary"${f.busy ? ' aria-disabled="true"' : ''}>${f.busy ? 'Testing…' : 'Test and save'}</button><button type="button" class="btn" data-act="modelCancel">Cancel</button></div></form>`;
    }
    return `<section class="panel"><h2>AI model</h2><p class="note">The model the agents use to plan, write and explain.</p>
      ${now}${pending}${form}
      <details class="more"><summary>Change history (${S.modelLog.length})</summary><ol class="timeline">${S.modelLog.slice().reverse().map(([w, t]) => `<li><b>${w}</b><span>${t}</span></li>`).join('')}</ol><p class="small muted">The history never holds a key, only its last 2 characters.</p></details>
    </section>`;
  }
  const setLogOf = (area) => S.setLog.filter((x) => x[1] === area);
  const logSet = (area, text) => S.setLog.push(['Today', area, text]);
  /* What happened to a workflow in n8n, newest first, so nobody loses track of who has it. */
  const n8nLog = (id, when, text) => { (S.n8nLog[id] = S.n8nLog[id] || []).unshift({ when, text }); };
  const historyBox = (items, note = '') => `<details class="more"><summary>Change history (${items.length})</summary>${items.length ? `<ol class="timeline">${items.slice().reverse().map(([w, , t]) => `<li><b>${w}</b><span>${t}</span></li>`).join('')}</ol>` : '<p class="small muted">No changes yet.</p>'}${note ? `<p class="small muted">${note}</p>` : ''}</details>`;
  const onlyOps = '<p class="note">Only Operators change settings.</p>';

  /* Connections: the accounts the platform signs in to. Agents get read keys only; write keys stay with the platform (ADR 0008). */
  /* What each connection is used for comes from the registry (capsOn). These are the account and the test wording. */
  const CONNS = {
    github: { name: 'GitHub', account: 'codesparks-bot, read only', uses: 'Agents read with a read-only key.', test: 'GitHub answered, with 4,812 of this hour’s 5,000 reads left.' },

    teams: { name: 'Microsoft Teams', practice: true, account: 'the AI Workflow Builder app', uses: 'Sends approval requests to Approvers. Each request has one button, which opens the approval page here. Nothing else is posted in Teams.', test: 'Teams answered, and CODESparks Support was found. Nothing was posted.' },
  };
  const expiring = () => Object.keys(CONNS).filter((k) => S.conns[k].days <= 14);
  /* A connection's health in plain words (spec 13), from the same state capState() reads. */
  function connHealth(k) {
    const st = S.conns[k];

        : me().op ? `<div class="btns"><button class="btn${soon ? ' primary' : ''} sm" data-act="connReplace" data-arg="${k}">Replace key</button><button class="btn sm" data-act="connTest" data-arg="${k}"${test === 'busy' ? ' aria-disabled="true"' : ''}>${test === 'busy' ? 'Testing…' : 'Test'}</button></div>`
          : `<div class="btns"><button class="btn sm" data-act="connTest" data-arg="${k}"${test === 'busy' ? ' aria-disabled="true"' : ''}>${test === 'busy' ? 'Testing…' : 'Test'}</button></div>`;

          <label class="checkrow"><input type="checkbox" data-role="${u}:ap"${r.ap || r.pendingAp ? ' checked' : ''}${op && !r.pendingAp ? '' : ' disabled'}${err ? ` aria-describedby="role-err-${u}"` : ''}>Approver<span class="vh">, ${esc(p.name)}</span></label></div>
        ${r.pendingAp ? `<div class="person-note"><span class="pill wait">${I.lock(12)}Approver: waiting for another Approver to confirm</span>${canConfirm ? `<span class="btns"><button class="btn bad sm" data-act="roleNotNow" data-arg="${u}">Not now</button><button class="btn good sm" data-act="roleConfirm" data-arg="${u}">Confirm</button></span>` : `<span class="small muted">Asked by ${nm(r.pendingBy)}${S.user === r.pendingBy ? ', so you can’t confirm it' : ''}.</span>`}</div>` : ''}

        <div class="btns"><button type="submit" class="btn">Add</button></div></form>` : onlyOps}

  /* AI usage: this month's questions to the AI model, the estimated cost, and the monthly limit. */
  const USAGE_BY = [['Keep our software up to date', 590], ['Morning new-ticket check', 356], ['Weekly closed-ticket summary', 194], ['Planning new workflows', 144]];
  const usage = () => (S.firstDay ? { questions: 0, cost: 0, by: [] } : { questions: 1284, cost: 13.6, by: USAGE_BY });

  /* ---------- Agent library: every agent the Planner can bring in, and the tools each one may use ---------- */

  /* The draft states of the Jira component tool, in the tool-drafting flow (ADR 0037, shown only with Planned features). */

  const LIB = (id) => LIBRARY.find((a) => a.id === id);

  /* Plain-English changes to an agent. The real product asks the AI model to redraft the card. This mock uses a few word

  function toolLog(k) {
