    if (viewer && viewer === q.first) t = `You were asked${role ? `, as ${role},` : ' first'} ${on(q.asked)}.${B ? (q.escalated ? ` ${B}, the backup, was asked too ${on(q.backupAt)}.` : q.backupInTime ? ` If you haven’t answered by ${at(q.backupAt)}, ${B} is asked too.` : '') : ''}`;
    else if (viewer && viewer === q.backup) t = q.escalated ? `${F} was asked first and hasn’t answered, so you’re asked as the backup${role ? ` for ${role}` : ''}.` : `You’re the backup${role ? ` for ${role}` : ''}. ${F} was asked first. You can say yes now too.`;
    else if (q.escalated) t = B ? `${F} and ${B}, the backup, have both been asked in Teams${role ? `, as ${role}` : ''}.` : `${F} has been asked in Teams${role ? `, as ${role},` : ''} and sent a reminder.`;
    else t = `${F} has been asked in Teams${role ? `, as ${role}` : ''}.${B && q.backupInTime ? ` If ${F} hasn’t answered by ${at(q.backupAt)}, ${B} is asked too.` : ''}`;
    return `${t} ${stopText(q, ruleSaid)}`;
  }
  /* Named Approvers, backups and stop times are ADR 0024, so a line that names them carries the Planned tag. */
  const namedTag = (q) => (q.team ? '' : ` ${PLANNED_TAG}`);
  const askLineHtml = (q, viewer) => `<p class="askline">${I.clock(16)}<span>${askLine(q, viewer)}${namedTag(q)}</span></p>`;

  /* What the approval gate says in the run's feed while it waits. */
  function gateText(q, starter) {
    if (q.team) return `Asked every Approver on the team in Teams. ${starter}`;
    const F = nm(q.first);
    const B = q.backup ? nm(q.backup) : null;
    const said = q.step > 0 ? `${yesText(q.id)} said yes. ` : '';
    const whom = q.steps > 1 ? `${F}, the ${q.step === 0 ? 'first' : 'second'} Approver,` : F;
    const asked = q.escalated
      ? (B ? `Asked ${whom} in Teams. No answer by ${at(q.backupAt)}, so ${B}, the backup, was asked too.` : `Asked ${whom} in Teams, and sent a reminder ${on(q.backupAt)}.`)
      : `Asked ${whom} in Teams.${B && q.backupInTime ? ` If there’s no answer by ${at(q.backupAt)}, ${B}, the backup, is asked too.` : ''}`;
    return `${said}${asked} ${starter}${namedTag(q)}`;
  }

  /* ---------- Runs: the live activity view ---------- */
  function runModel(id) {
    /* A run that used a version published in n8n without Ask for a yes. It reaches the change step with no yes, and stops there. */
    if (id === 'edit') {
      const wf = S.editRun.wf;
      const helpers = R(wf).agents.filter((a) => a !== 'lead');
      const names = helpers.map((a) => `the ${AGENTS[a].name}`);
      return {
        workflow: wf, end: helpers.length + 2, fail: helpers.length + 2, state: 'failed',
        headline: 'Stopped before changing anything',
        stations: [
          { label: 'Started', sub: 'Today 9:15', who: 'p:carol', msg: { who: 'portal', text: 'The run started at 9:15 with the version Carol published in n8n at 9:12.' } },
          { label: 'Pick agents', who: 'lead', msg: { who: 'lead', text: `I’m bringing in ${andList(names)}.` } },
          ...helpers.map((a, i) => ({ label: AGENTS[a].name, who: a, msg: { who: a, text: i === helpers.length - 1 ? 'I drafted the changes. Nothing is written yet.' : 'I gathered what the next step needs.' } })),
          { label: 'Make the changes', who: 'platform', msg: { who: 'platform', tone: 'bad', text: 'The step Make the approved changes didn’t run, because nobody said yes to this run. Nothing was written.' } },
          { label: 'Done' },
        ],
      };
    }
    if (id === 'sw') {
      const st = S.sw;
      const gate = st === 'waiting' ? { tone: 'wait', who: 'gate', text: gateText(req('sw'), partiesLine('sw')) }
        : st === 'approved' ? { tone: 'ok', who: 'gate', text: `${nm(S.swBy)} approved 3 tickets.` }
          : { tone: 'bad', who: 'gate', text: `${nm(S.swBy)} declined. Nothing was written.` };
      const full = shows('registries');
      const by = starterOf('sw');
      const stations = [
        { label: 'Started', sub: 'Mon 9:00', who: `p:${by}`, msg: { who: 'portal', text: `${nm(by)}’s schedule started the Monday check.` } },
        { label: 'Pick agents', who: 'lead', msg: { who: 'lead', text: `14 tools to check. I’m bringing in the Version checker${full ? ', the Vulnerability checker' : ''} and the Ticket writer.${full ? ` ${PLANNED_TAG}` : ''}` } },
        { label: `Read ${TRACKED.length - UNREADABLE.length} of ${TRACKED.length}`, who: 'checker', msg: { who: 'checker', text: full ? 'I read each tool’s registry (Maven Central, PyPI, Docker Hub) and cross-checked GitHub. Log4j core, LangGraph and FastAPI have newer versions. For FastAPI, GitHub shows 0.120.2, but it isn’t on PyPI yet, so I used 0.120.1. Grafana couldn’t be read: Docker Hub and GitHub didn’t answer. From endoflife.date: PostgreSQL 14 stops getting fixes on 12 Nov, and Node.js 22 on 30 Apr. ' + PLANNED_TAG : 'I read each tool’s releases on GitHub. Log4j core, LangGraph and FastAPI have newer versions. Grafana couldn’t be read: GitHub’s hourly limit was reached.' } },
        ...(full ? [{ label: `Check vulnerabilities ${PLANNED_TAG}`, who: 'vuln', msg: { who: 'vuln', text: 'I matched the versions we run in OSV, read the official records from NVD, checked vendor advisories, and checked CISA’s list of actively exploited vulnerabilities. Log4j core 2.14.1 has 4 known vulnerabilities, found in OSV, NVD and Apache’s own advisory. The worst, CVE-2021-44228 (Log4Shell), is rated critical, 10.0, and CISA lists it as actively exploited. None are listed for the other tools. ' + PLANNED_TAG } }] : []),
        { label: 'Draft tickets', who: 'writer', msg: { who: 'writer', text: `I drafted 3 upgrade tickets.${full ? ' The Log4j core one is marked urgent.' : ''} Nothing is in Jira yet.${full ? ` ${PLANNED_TAG}` : ''}` } },
        { label: 'Approval gate', gate: true, msg: gate },
        { label: 'Create in Jira', who: 'platform', skip: st === 'declined', msg: { who: 'platform', text: 'Created MOCK-14, MOCK-15 and MOCK-16. Only the approved tickets were written.' } },
        { label: 'Done', msg: { who: 'portal', tone: 'ok', text: st === 'declined' ? 'Done. The tickets will be proposed again next Monday.' : `Done. 3 upgrade tickets are in Jira${urgentNote()}.${full ? ` ${PLANNED_TAG}` : ''}` } },
      ];
      const gi = stations.findIndex((s) => s.gate);
      return {
        workflow: 'sw', end: st === 'waiting' ? gi : stations.length - 1, state: st === 'waiting' ? 'waiting' : 'done',
        headline: st === 'waiting' ? '3 tickets are waiting for a yes' : st === 'approved' ? '3 tickets created in Jira' : 'Declined, nothing was written',
        stations,
      };
    }
    /* Stopped because Jira, an outside system, didn't answer. A retry is safe: it reads again, and its ticket still waits for a yes. */
    if (id === 'issues') {
      const ok = S.issues === 'fixed';
      const by = ok ? retriersOf('issues').slice(-1)[0] : starterOf('issues');
      return {
        workflow: 'issues', end: ok ? 6 : 2, fail: ok ? null : 2, state: ok ? 'done' : 'failed',
        headline: ok ? 'Done, nothing new today' : 'Stopped at Find new tickets',
        stations: [
          { label: 'Started', sub: ok ? 'Today, retry' : 'Today 8:00', who: `p:${by}`, msg: { who: 'portal', text: ok ? `${nm(by)} retried the run.` : `${nm(by)}’s schedule started the morning check.` } },
          { label: 'Pick agents', who: 'lead', msg: { who: 'lead', text: 'I’m bringing in the Jira reader and the Summary writer.' } },
          { label: 'Find new tickets', who: 'jira', msg: ok ? { who: 'jira', text: 'Jira answered. No tickets were created in MOCK in the last day.' } : { who: 'jira', tone: 'bad', text: 'Jira didn’t answer. I stopped here.' } },
          { label: 'Write summary', who: 'summary', skip: ok },
          { label: 'Approval gate', gate: true, skip: ok },
          { label: 'Create in Jira', who: 'platform', skip: ok },
          { label: 'Done', msg: { who: 'portal', tone: 'ok', text: 'Done. Nothing to write today.' } },
        ],
      };
    }
    if (id === 'nudge') {
      const ok = S.nudge !== 'failed';
      const by = ok ? retriersOf('nudge').slice(-1)[0] : starterOf('nudge');
      return {
        workflow: 'nudge', end: !ok ? 2 : S.nudge === 'waiting' ? 4 : 6, fail: ok ? null : 2, state: !ok ? 'failed' : S.nudge === 'waiting' ? 'waiting' : 'done',
        headline: !ok ? 'Stopped at Read closed tickets' : S.nudge === 'waiting' ? '1 ticket is waiting for a yes' : S.nudge === 'approved' ? 'Summary ticket created in Jira' : 'Declined, nothing was written',
        stations: [
          { label: 'Started', sub: ok ? 'Today, retry' : 'Fri 16:00', who: `p:${by}`, msg: { who: 'portal', text: ok ? `${nm(by)} retried the run after the fix went live.` : `${nm(by)}’s schedule started the Friday summary.` } },
          { label: 'Pick agents', who: 'lead', msg: { who: 'lead', text: 'I’m bringing in the Jira reader and the Summary writer.' } },
          { label: 'Read closed tickets', who: 'jira', msg: ok ? { who: 'jira', text: '11 tickets were closed in MOCK last week. MOCK-31’s description was read this time.' } : { who: 'jira', tone: 'bad', text: 'I stopped while reading MOCK-31. Its description is in a form the platform couldn’t read.' } },
          { label: 'Write summary', who: 'summary', msg: { who: 'summary', text: 'I wrote a short summary of the 11 tickets, with counts. Nothing is created yet.' } },
          { label: 'Approval gate', gate: true, msg: S.nudge === 'waiting' ? { who: 'gate', tone: 'wait', text: ok ? gateText(req('nudge'), partiesLine('nudge')) : '' } : S.nudge === 'approved' ? { who: 'gate', tone: 'ok', text: `${nm(S.nudgeBy)} approved the ticket.` } : { who: 'gate', tone: 'bad', text: `${nm(S.nudgeBy)} declined. Nothing was written.` } },
          { label: 'Create in Jira', who: 'platform', skip: S.nudge === 'declined', msg: { who: 'platform', text: 'Created MOCK-34 with the approved summary.' } },
          { label: 'Done', msg: { who: 'portal', tone: 'ok', text: S.nudge === 'declined' ? 'Done. Nothing was written, because it was declined.' : 'Done. The summary is in MOCK-34.' } },
        ],
      };
    }
    if (id === 'conf') {
      const f = S.nr;
      const w = confWrite(f);
      const st = S.conf;
      const q = req('conf');
      const writer = writerOf(f);
      const gateMsg = st === 'waiting' ? { who: 'gate', tone: 'wait', text: gateText(q, partiesLine('conf')) }
        : st === 'expired' ? { who: 'gate', text: `Nobody answered by ${at(q.expiresAt)}, so the request stopped. Nothing was written.` }
          : st === 'declined' ? { who: 'gate', tone: 'bad', text: `${nm(S.confBy)} declined. Nothing was written.` }
            : { who: 'gate', tone: 'ok', text: `${yesWho('conf')} approved it.` };
      const by = starterOf('conf');
      return {
        workflow: 'conf', end: st === 'waiting' ? 4 : 6, state: st === 'waiting' ? 'waiting' : st === 'expired' ? 'expired' : 'done',
        headline: st === 'waiting' ? w.waitHead : st === 'expired' ? 'No answer, nothing was written' : st === 'declined' ? 'Declined, nothing was written' : w.doneHead,
        stations: [
          { label: 'Started', sub: 'Today, test', who: `p:${by}`, msg: { who: 'portal', text: `${nm(by)} started a test run.` } },
          { label: 'Pick agents', who: 'lead', msg: { who: 'lead', text: `I’m bringing in the Jira reader and the ${AGENTS[writer].name}.` } },
          { label: { closed: 'Find closed tickets', created: 'Find new tickets', open: 'Find open tickets' }[f.tickets], who: 'jira', msg: { who: 'jira', text: { closed: `${f.period === 'day' ? 3 : 14} tickets were closed in ${f.project} ${PERIOD[f.period]}.`, created: `${f.period === 'day' ? 2 : 9} tickets were created in ${f.project} ${PERIOD[f.period]}${f.action === 'compare' ? ', and 12 the week before' : ''}.`, open: `18 tickets are open in ${f.project}.` }[f.tickets] } },
          { label: `Write ${thingOf(f)}`, who: writer, msg: { who: writer, text: `I wrote a short ${thingOf(f)}. Nothing is created yet.` } },
          { label: 'Approval gate', gate: true, msg: gateMsg },
          { label: w.stationWrite, who: 'platform', skip: st === 'expired' || st === 'declined', msg: st === 'expired' || st === 'declined' ? null : { who: 'platform', text: w.did } },
          { label: 'Done', msg: { who: 'portal', tone: 'ok', text: st === 'expired' ? 'Done. Nothing was written, because nobody said yes.' : st === 'declined' ? 'Done. Nothing was written, because it was declined.' : 'Done.' } },
        ],
      };
    }
    /* The access review (Planned): two writes, each behind a gate. Sending the confirmations was approved. Removing the
       access nobody confirmed waits for two Approvers in turn, Bob then Alice. */
    if (id === 'access') {
      const st = S.access;
      const by = starterOf('access');
      const gate = st === 'waiting' ? { who: 'gate', tone: 'wait', text: gateText(req('access'), partiesLine('access')) }
        : st === 'approved' ? { who: 'gate', tone: 'ok', text: `${yesWho('access')} approved the removals.` }
          : { who: 'gate', tone: 'bad', text: `${nm(S.accessBy)} declined. Nothing was removed.` };
      const stations = [
        { label: 'Started', sub: S.accessRun.sub, who: `p:${by}`, msg: { who: 'portal', text: `${nm(by)} started the review by hand.` } },
        { label: 'Pick agents', who: 'lead', msg: { who: 'lead', text: '48 people to review. I’m bringing in the Access checker and the Ticket writer.' } },
        { label: 'List who has access', who: 'access', msg: { who: 'access', text: 'I listed 48 people with access to Entra ID, the admin tools or GitLab, and the manager of each.' } },
        { label: 'Draft the questions', who: 'writer', msg: { who: 'writer', text: 'I drafted a question for each of 6 managers, asking them to confirm their people. Nothing is asked yet.' } },
        { label: 'Approval gate', gate: true, msg: { who: 'gate', tone: 'ok', text: 'Bob, then Alice, approved sending the questions.' } },
        { label: 'Ask the managers', who: 'platform', msg: { who: 'platform', text: 'Asked 6 managers in Teams. By Fri 23 Oct, 45 people were confirmed. 3 weren’t confirmed by anyone.' } },
        { label: 'Draft the removals', who: 'writer', msg: { who: 'writer', text: 'I drafted the removal of access for the 3 people nobody confirmed. Nothing is removed yet.' } },
        { label: 'Approval gate', gate: true, msg: gate },
        { label: 'Remove access', who: 'platform', skip: st === 'declined', msg: { who: 'platform', text: 'Removed access for 3 people. Only the approved removals were made.' } },
        { label: 'Done', msg: { who: 'portal', tone: 'ok', text: st === 'declined' ? 'Done. Nothing was removed, because it was declined.' : 'Done. 3 people lost access, and their managers were told in Teams.' } },
      ];
      return {
        workflow: 'access', end: st === 'waiting' ? 7 : stations.length - 1, state: st === 'waiting' ? 'waiting' : 'done',
        headline: st === 'waiting' ? '3 removals are waiting for a yes' : st === 'approved' ? '3 people lost access' : 'Declined, nothing was removed',
        stations,
      };
    }
  }
  /* The write of the access review's waiting request, and the people in it. */
  const ACCESS_WRITE = { panelTitle: '3 people will lose access', teamsVerb: 'remove access for 3 people' };
  const ACCESS_REMOVALS = ['Jun Wei: GitLab. Left the team in September.', 'Priya: the admin tools. Moved to another team.', 'Marcus: Entra ID. His contract ended.'];
  const accessPreview = () => `<div class="preview"><b>Nobody confirmed these 3</b><ul class="mini-list">${ACCESS_REMOVALS.map((x) => `<li>${x}</li>`).join('')}</ul></div><p class="note">Their managers were asked in Teams on Mon 19 Oct and hadn’t confirmed them by Fri 23 Oct. Access a manager confirmed is never removed.</p>`;

  const P = { run: null, at: 0, shown: 0, timer: null, speed: reduce ? 'instant' : '1x', feedSeen: 0, feedNext: 0 };
  let follow = false;
  const interval = () => (P.speed === '2x' ? 520 : 1050);
  function stopTimer() { if (P.timer) { clearInterval(P.timer); P.timer = null; } }
  function playTo(from) {
    stopTimer();
    follow = true;
    const m = runModel(P.run);
    P.at = from; P.shown = from;
    if (from === 0) P.feedSeen = 0;
    if (P.speed === 'instant') { P.at = m.end; P.shown = m.end; return; }
    P.timer = setInterval(() => {
      const end = runModel(P.run).end;
      if (P.at < end) { P.shown = P.at; P.at += 1; render(); } else stopTimer();
    }, interval());
  }
  function continueRun() {
    if (S.view.name !== 'run') return;
    playTo(P.at);
  }

  /* ---------- Small pieces ---------- */
  function whoAvatar(w, size = 36, state = 'idle', k = '') {
    if (!w) return '';
    if (w.startsWith('p:')) return pav(w.slice(2), size);
    if (w === 'platform') return `<span class="sysav app" style="width:${size}px;height:${size}px">${I.mark()}</span>`;
    return face(w, size + 12, state, { k });
  }
  const feedName = (w) => (w === 'portal' ? 'Workflow Builder' : w === 'platform' ? 'Platform' : w === 'gate' ? 'Approval gate' : AGENTS[w].name);
  const feedHue = (w) => (AGENTS[w] ? AGENTS[w].hue : 'var(--muted)');
  function fieldAttrs(id, err, help) {
    const ids = [help ? `${id}-help` : '', err ? `${id}-err` : ''].filter(Boolean).join(' ');
    return `${ids ? ` aria-describedby="${ids}"` : ''}${err ? ' aria-invalid="true"' : ''}`;
  }
  function fieldNotes(id, err, help) {
    return (help ? `<span class="help" id="${id}-help">${help}</span>` : '') + (err ? `<span class="err" id="${id}-err">${I.alert(16)}${err}</span>` : '');
  }
  const fieldErr = (id, err, help) => `${fieldAttrs(id, err, help)}>${fieldNotes(id, err, help)}`;
  const opt = (v, label, cur) => `<option value="${v}"${String(v) === String(cur) ? ' selected' : ''}>${label}</option>`;
  /* The same schedule fields in the set-up card and when changing a workflow's schedule. */
  function schedFields(attr, f, err) {
    const id = (k) => `${attr}-${k}`;
    return `<div class="sched-grid">
      <div class="field"><label for="${id('freq')}">How often${shows('monthly') ? ` ${PLANNED_TAG}` : ''}</label><select id="${id('freq')}" data-${attr}="freq"${fieldAttrs(id('freq'), err.freq)}>${opt('', 'Choose…', f.freq)}${Object.entries(FREQ_WORD).filter(([v]) => v !== 'month' || shows('monthly')).map(([v, l]) => opt(v, l, f.freq)).join('')}</select>${fieldNotes(id('freq'), err.freq)}</div>
      ${f.freq === 'week' ? `<div class="field"><label for="${id('day')}">Day</label><select id="${id('day')}" data-${attr}="day"${fieldAttrs(id('day'), err.day)}>${opt('', 'Choose…', f.day)}${DAYS.map((d) => opt(d, d, f.day)).join('')}</select>${fieldNotes(id('day'), err.day)}</div>` : ''}
      ${f.freq === 'month' ? `<div class="field"><label for="${id('mday')}">Day of the month</label><select id="${id('mday')}" data-${attr}="monthDay">${Array.from({ length: 28 }, (_, i) => opt(i + 1, ordinal(i + 1), f.monthDay)).join('')}</select></div>` : ''}
      <div class="field"><label for="${id('time')}">Time</label><input type="time" id="${id('time')}" data-${attr}="time" value="${f.time || ''}"${fieldAttrs(id('time'), err.time, TZ)}>${fieldNotes(id('time'), err.time, TZ)}</div>
    </div>`;
  }
  /* The Approver fields on a workflow's page. The owner is never offered. */
  function apprFields(attr, a, err, owner, sched) {
    const id = (k) => `${attr}-${k}`;
    const pool = approverPool().filter((u) => u !== owner);
    const steps = a.steps.map((s, i) => {
      const elsewhere = a.steps.filter((_, j) => j !== i).flatMap((o) => [o.first, o.backup]);
      const firsts = pool.filter((u) => !elsewhere.includes(u));
      const backups = firsts.filter((u) => u !== s.first);
      const fk = `first-${i}`;
      const bk = `backup-${i}`;
      const legend = a.steps.length > 1 ? `<legend>${i === 0 ? 'First yes' : 'Second yes, after the first'}</legend>` : '<legend class="vh">Who is asked</legend>';
      return `<fieldset class="apstep">${legend}<div class="sched-grid">
        <div class="field"><label for="${id(fk)}">Asked first</label><select id="${id(fk)}" data-${attr}="first:${i}"${fieldAttrs(id(fk), err[fk])}>${opt('', 'Choose…', s.first)}${firsts.map((u) => opt(u, nm(u), s.first)).join('')}</select>${fieldNotes(id(fk), err[fk])}</div>
        <div class="field"><label for="${id(bk)}">Backup</label><select id="${id(bk)}" data-${attr}="backup:${i}"${fieldAttrs(id(bk), err[bk])}>${opt('', 'Choose…', s.backup)}${backups.map((u) => opt(u, nm(u), s.backup)).join('')}${opt('none', 'Nobody else', s.backup)}</select>${fieldNotes(id(bk), err[bk])}</div>
      </div></fieldset>`;
    });
    const more = S.apprMore || !!(err.after || err['first-1'] || err['backup-1']);
    return `${steps.join('')}
      <p class="apsum">${I.info(16)}<span>${apprSummary(a, sched)}</span></p>
      <details class="more"${more ? ' open' : ''}><summary data-act="moreAppr">More approval options</summary><div class="more-body">
        <div class="sched-grid">
          <div class="field"><label for="${id('after')}">Ask the backup after</label><select id="${id('after')}" data-${attr}="after"${fieldAttrs(id('after'), err.after)}>${AFTER.map(([v, l]) => opt(v, l, a.after)).join('')}</select>${fieldNotes(id('after'), err.after)}</div>
          <div class="field"><label for="${id('expire')}">Stop waiting after</label><select id="${id('expire')}" data-${attr}="expire">${EXPIRE.map(([v, l]) => opt(v, l, a.expire)).join('')}</select></div>
        </div>
        <p class="note">Working hours are Monday to Friday, 9:00 to 18:00, ${TZ}. Either the first person or the backup can say yes. A request never says yes by itself, and it always stops before the next run, so two never wait at once.</p>
      </div></details>`;
  }
  /* The whole approval rule in one sentence, so the default needs no extra reading. */
  function apprSummary(a, sched) {
    const [s0, s1] = a.steps;
    if (!s0.first || !s0.backup) return 'Choose who is asked first, and a backup or Nobody else.';
    if (s1 && (!s1.first || !s1.backup)) return 'Choose who gives the second yes, and their backup or Nobody else.';
    const who = s1 ? `${nm(s0.first)} is asked first, then ${nm(s1.first)} gives the second yes.` : `${nm(s0.first)} is asked first.`;
    return `${who} ${escalationSentence(a, sched)}`;
  }
  function apprEditor(id) {
    const steps = S.apprForm.steps.length;
    return `<div class="panel" style="margin-top:16px"><h2>Change who approves</h2>
      ${steps > 1 ? '<p class="note">This workflow needs 2 Approvers, one after the other.</p>' : ''}
      ${apprFields('af', S.apprForm, S.apprErr, ownerOf(id), R(id).sched)}
      <div class="btns"><button class="btn primary sm" data-act="saveAppr" data-arg="${id}">Save</button><button class="btn sm" data-act="cancelAppr">Cancel</button></div>
      <p class="note">${waitingReq(id) ? 'The request that’s waiting now keeps the people it was sent to. Your change starts with the next run.'
        : req(id) ? 'This change starts with the next run. The stopped test run isn’t started again by itself.' : 'This change starts with the next run.'}</p></div>`;
  }

  /* ---------- Views ---------- */
  function header() {
    const v = S.view.name;
    const n = teamsCount();
    return `<header class="hdr"><div class="hdr-in">
      <button class="brand" data-act="go" data-arg="home">${I.mark(22)}<span class="brand-text"><span class="brand-ai">AI </span>Workflow Builder</span></button>
      <div class="tools">
        <button class="iconbtn" data-act="teams" aria-label="Teams, practice copy${n ? `, ${approvalsWord(n)} waiting for you` : ''}" title="${n ? `${approvalsWord(n)} waiting for you` : 'Teams, practice copy'}">${I.chat(20)}<span class="lbl">Teams</span>${n ? `<span class="badge" data-val="teams-n">${n}</span>` : ''}</button>
        <button class="iconbtn" data-act="go" data-arg="settings" aria-label="Settings" title="Settings"${v === 'settings' ? ' aria-current="page"' : ''}>${I.gear(20)}</button>
        <div class="me" title="${me().name}, ${me().role}">${pav(S.user)}<span class="me-text"><b>${me().name}</b><small>${me().role}</small></span></div>
      </div>
    </div></header>`;
  }
  const approvalsWord = (n) => (n === 1 ? '1 approval' : `${n} approvals`);

  /* The rail (ADR 0043): Chat, Workflows and Watchlist, each with a count. A slim column on the left; on a phone it is a bar across the top.
     Workflows counts what needs you. The Watchlist counts software that needs action. An Approver who can't set up workflows
     sees what needs them on Chat, where their approvals are. */
  /* What the Software page lists under Needs attention. The rail's badge and the page's heading both read it. */
  function swAttnCount(hit = () => true) {
    const full = shows('registries');
    const lj = full && watchRows().some((r) => r.key === 'lj' && !S.removed.includes('lj') && hit(r.name, r.repo));
    const ending = full && !S.firstDay ? SUPPORT_ENDING.filter((x) => hit(x.name, '')).length : 0;
    return (has('sw') && S.sw === 'waiting' ? 1 : 0) + (lsProblem() ? 1 : 0) + (lj ? 1 : 0) + ending;
  }
  const swLive = () => watchRows().filter((r) => !S.removed.includes(r.key));
  /* What has a newer version: the watchlist's count line and the Planner's answer both read it. */
  const behindRows = () => swLive().filter((r) => r.rank === 0);
  function rail() {
    const v = S.view.name;
    const swRun = v === 'run' && S.view.id === 'sw';
    const k = needs().length;
    const count = (n, what) => (n ? `<span class="badge" data-val="${what}-n"><span class="vh">, </span>${n}<span class="vh"> ${what === 'needs' ? 'need you' : 'need action'}</span></span>` : '');
    const items = [
      ['home', 'Chat', I.chat(22), v === 'home', count(me().op ? 0 : k, 'needs')],
      ['workflows', 'Workflows', I.grid(22), ['workflows', 'workflow'].includes(v) || (v === 'run' && !swRun), count(me().op ? k : 0, 'needs')],
      ['software', 'Watchlist', I.box(22), v === 'software' || swRun, count(swAttnCount(), 'sw')],
    ];
    return `<nav class="rail" aria-label="Main">${items.map(([arg, label, icon, on, n]) => `<button class="rail-a" data-act="go" data-arg="${arg}"${on ? ' aria-current="page"' : ''}>${icon}<span>${label}</span>${n}</button>`).join('')}</nav>`;
  }

  /* One main button per screen: only the first card keeps it. */
  const demote = (html) => html.replace(/btn primary/g, 'btn');

  function needs() {
    const out = [];
    const u = S.user;
    const op = PEOPLE[u].op;
    /* Stopped runs and a platform that can't run come first, then approvals, then keys and confirmations. */
    if (op) {
      if (!curModel()) out.push({ id: 'model', kind: 'bad', icon: I.alert(22), title: 'No AI model connected', meta: 'Settings, AI model', body: '<p class="small muted">Until a model is connected, the Planner can’t read new requests and agent workflows can’t run. Only the Software watchlist keeps going, with a simple summary.</p>', actions: '<button class="btn primary" data-act="setGo" data-arg="model">Connect a model</button>' });
      if (jiraDown()) out.push({ kind: 'bad', icon: I.alert(22), title: 'Jira isn’t answering', meta: `Last seen working ${lastOk('jiraRead')}`, body: '<p class="small muted">Workflows that read or write Jira wait until it’s back. Nothing is lost.</p>', actions: '<button class="btn primary" data-act="setGo" data-arg="connections">See Connections</button>' });
      if (has('issues') && S.issues === 'failed') out.push({ wf: 'issues', kind: 'bad', icon: I.alert(22), title: 'Morning new-ticket check stopped', meta: 'Today, 8:00', body: '', why: `${TROUBLE.issues().happened} ${TROUBLE.issues().safe}`, held: heldWhy('issues'), actions: `${troubleBtn(TROUBLE.issues())}<button class="btn" data-act="run" data-arg="issues">See the run</button>` });
      if (has('nudge') && S.nudge === 'failed' && S.report === 0) out.push({ wf: 'nudge', kind: 'bad', icon: I.alert(22), title: 'Weekly closed-ticket summary stopped', meta: 'Fri 23 Oct, 16:00', body: '', why: 'This is a problem in the platform, not in your workflow. You can’t fix it from here. Report it and support gets everything they need.', actions: `<button class="btn primary" data-act="report" data-unbuilt="Report to support">Report to support</button><button class="btn" data-act="run" data-arg="nudge">See the run</button>` });
      if (has('nudge') && S.nudge === 'failed' && S.report === 4) out.push({ wf: 'nudge', kind: 'ok', icon: I.check(22), title: 'The fix for Weekly closed-ticket summary is live', meta: `Case ${S.supportCase.id} · fixed by Dana`, held: heldWhy('nudge'), body: heldWhy('nudge') ? '' : '<p class="small muted">Retry the run to catch up on last week.</p>', actions: troubleBtn(TROUBLE.nudge()) });
    }
    /* The approvals this person can decide, from the same request records as the Teams badge. */
    mayDecide().forEach((id) => { const c = NEED_CARD[id](); out.push({ wf: id, kind: 'wait', icon: I.shield(22), ...c, body: `${c.body || ''}${askLineHtml(req(id), u)}`, actions: `<button class="btn primary" data-act="run" data-arg="${id}">Review and decide</button>` }); });
    if (op && lsProblem()) out.push({ kind: 'wait', rank: 3, icon: I.alert(22), ...lsProblem() });
    if (has('conf') && S.conf === 'declined' && u === 'alice') out.push({ kind: 'wait', rank: 4, icon: I.x(22), title: `${nm(S.confBy)} declined your test run`, meta: `${esc(S.nr.name)} · nothing was written`, body: '', held: heldWhy('conf'), actions: `<button class="btn primary" data-act="run" data-arg="conf">See the run</button>${testAgain('Do a test run again', 'btn')}` });
    if (has('conf') && S.conf === 'expired' && u === 'alice') out.push({ wf: 'conf', kind: 'wait', rank: 4, icon: I.clock(22), title: 'Nobody answered on your test run', meta: `${esc(S.nr.name)} · stopped ${at(req('conf').expiresAt)}`, held: heldWhy('conf'), body: `<p class="small muted">${whoAnd(askedOf(req('conf')))} didn’t answer in time, so nothing was written.${heldWhy('conf') ? '' : ` Run it again${shows('namedApprovers') ? ', or choose other Approvers' : ''}.`}</p>`, actions: `${testAgain('Do a test run again')}${changeApproversBtn('conf', 'apprFromRun')}` });
    Object.entries(S.roles).filter(([w, r]) => r.pendingAp && PEOPLE[u].ap && u !== r.pendingBy && u !== w).forEach(([w]) => out.push({ kind: 'tool', icon: I.shield(22), title: `Confirm ${nm(w)} as an Approver`, meta: `Asked by ${nm(S.roles[w].pendingBy)}`, body: '<p class="small muted">Approvers say yes or no to the changes a workflow wants to make.</p>', actions: '<button class="btn primary" data-act="setGo" data-arg="people">Review in Settings</button>' }));
    if (op) expiring().forEach((k) => out.push({ kind: 'wait', rank: 3, icon: I.clock(22), title: `The ${CONNS[k].name} key expires in ${S.conns[k].days} days`, meta: `Expires ${S.conns[k].expires}`, body: `<p class="small muted">Ask whoever looks after the platform to replace it before then, or everything that uses ${CONNS[k].name} stops.</p>`, actions: '<button class="btn primary" data-act="setGo" data-arg="connections">See it in Settings</button>' }));
    if (op && shows('usage') && usagePct() >= 80) out.push({ kind: 'wait', rank: 3, icon: I.alert(22), title: usagePct() >= 100 ? 'The AI usage limit is reached' : `AI usage is at ${usagePct()}% of this month’s limit`, meta: `US$${usage().cost.toFixed(2)} of US$${S.usageLimit}`, body: `<p class="small muted">${usagePct() >= 100 ? 'Agents have stopped asking the AI model until the 1st of next month, or until someone raises the limit.' : 'At 100%, agents stop asking the AI model until the 1st of next month.'}</p>`, actions: '<button class="btn primary" data-act="setGo" data-arg="usage">See usage in Settings</button>' });
    if (S.modelPending && PEOPLE[u].ap && u !== S.modelPending.byId) out.push({ kind: 'tool', icon: I.shield(22), title: 'Confirm a new AI model address', meta: `${esc(S.modelPending.address)} · entered by ${nm(S.modelPending.byId)}`, body: '<p class="small muted">Agents would send their prompts to this address. Until you confirm it, runs keep using the current model.</p>', actions: '<button class="btn primary" data-act="go" data-arg="settings">Review in Settings</button>' });
    if (shows('toolDraft') && S.jiraComp === 'asked' && canOkTool() && u !== S.jiraCompAsker) out.push({ kind: 'tool', icon: I.tool(22), title: `OK a new tool: ${TOOLS.jiraComp[0]}`, meta: `Asked by ${nm(S.jiraCompAsker)} for the Ticket writer`, body: `<p class="small muted">It changes data, so an Approver must OK it once before any agent can use it.</p>${PLANNED_TAG}`, actions: '<button class="btn primary" data-act="toolOpen" data-arg="jiraComp">Review the tool</button>' });
    if (shows('toolDraft') && S.jiraComp === 'ok' && u === S.jiraCompAsker && !S.jiraCompSeen) out.push({ kind: 'ok', icon: I.check(22), title: `${nm(S.jiraCompBy)} OK’d the new tool. You can give it to the Ticket writer.`, meta: TOOLS.jiraComp[0], body: PLANNED_TAG, actions: '<button class="btn primary" data-act="toolAddTo" data-arg="writer">Give it to the Ticket writer</button>' });
    if (op) Object.entries(S.n8nChg).forEach(([id, c]) => out.push({ wf: id, kind: 'wait', icon: I.alert(22), title: `${nm(c.by)}’s change in n8n removed Ask for a yes`, meta: `${esc(R(id).name)} · published ${c.when}`, body: `<p class="small muted">The next run will stop before it changes anything. Undo the change, or put the step back in n8n.</p>${PLANNED_TAG}`, actions: `<button class="btn primary" data-act="n8nUndo" data-arg="${id}">Undo ${nm(c.by)}’s change</button><button class="btn" data-act="workflow" data-arg="${id}">See the workflow</button>` }));
    /* A paused workflow asks nothing of anyone until it's resumed. Most urgent first (spec 5.1): stopped runs, then
       approvals (urgent ones first), then keys and usage, then confirmations. */
    return out.filter((x) => !x.wf || !S.paused[x.wf]).sort((a, b) => (a.rank ?? NEED_RANK[a.kind]) - (b.rank ?? NEED_RANK[b.kind]));
  }
  const NEED_RANK = { bad: 0, wait: 2, ok: 2, tool: 4 };
  /* What each waiting request asks of the reader, in Needs you. The ask line and the button are added by needs(). */
  const NEED_CARD = {
    sw: () => ({ rank: urgentNote() ? 1 : 2, title: `3 upgrade tickets are waiting for your yes${urgentNote()}`, meta: 'Keep our software up to date · Software watchlist, Mon 26 Oct, 9:00', body: `<ul class="mini-list"><li>${shows('registries') ? `<b>Log4j core 2.14.1 → 2.25.2, urgent: critical and actively exploited</b> ${PLANNED_TAG}` : 'Log4j core 2.14.1 → 2.25.2'}</li><li>LangGraph 1.2.14 → 1.2.17</li><li>FastAPI 0.118.0 → 0.120.1</li></ul>` }),
    nudge: () => ({ title: '1 summary ticket is waiting for your yes', meta: 'Weekly closed-ticket summary · retried today after the fix' }),
    conf: () => ({ title: confWrite(S.nr).needTitle, meta: `${esc(S.nr.name)} · test run by ${nm(starterOf('conf'))}` }),
    access: () => ({ title: `3 people would lose access. Your yes is ${req('access').step === 0 ? 'the first of two' : 'the second of two'}`, meta: `Quarterly access review · started by ${nm(starterOf('access'))}, ${S.accessRun.sub}`, body: `<ul class="mini-list">${ACCESS_REMOVALS.map((x) => `<li>${x}</li>`).join('')}</ul>${PLANNED_TAG}` }),
  };
  /* The watchlist's moved project, as one item for Needs you and the watchlist's Needs attention. */
  function lsProblem() {
    if (S.firstDay || S.lsFixed || S.removed.includes('ls')) return null;
    return { title: `GitHub can’t find ${LS_OLD}. It moved to ${LS_NEW}.`, meta: 'Software watchlist · LangServe', body: '<p class="small muted">LangServe is skipped until this is fixed. The AI troubleshooter suggests reading it from the new address.</p>', actions: `<button class="btn primary" data-act="useNewAddress" data-unbuilt="Use the new address (only a GitHub rename is built; a 404 names no new home, so the platform refuses it)">Use the new address<span class="vh"> for LangServe</span></button><button class="btn" data-act="go" data-arg="software">See the watchlist</button>` };
  }
  /* Change who approves exists only with named Approvers (ADR 0024), so it is tagged Planned wherever it shows. */
  const changeApproversBtn = (id, act = 'editAppr', cls = 'btn') => (shows('namedApprovers') ? `<button class="${cls}" data-act="${act}" data-arg="${id}" data-unbuilt="Named Approvers (ADR 0024)">${cls.includes('sm') ? I.edit() : ''}Change who approves ${PLANNED_TAG}</button>` : '');
  function says(text) { return `<div class="says">${face('trouble', 32)}<div><b>AI troubleshooter</b>${text}</div></div>`; }
  function taskCard(t, i = 0) {
    return `<article class="task" data-flip="h:${keyOf(t.title)}" data-stagger style="--i:${i}"><span class="ico ${t.kind}">${t.icon}</span><div class="task-body"><h3 class="task-title">${t.title}</h3><div class="task-meta">${t.meta}</div>${t.body}${t.why ? says(t.why) : t.held ? `<p class="small muted">${t.held}</p>` : ''}${t.actions ? `<div class="btns">${t.actions}</div>` : ''}</div></article>`;
  }
  /* A compact row keeps only its item's first button, as a small secondary one. */
  const firstButton = (html) => ((html.match(/<button[\s\S]*?<\/button>/) || [''])[0]).replace(/class="btn[^"]*"/, 'class="btn sm"');
  function queueRow(t, i = 1) {
    return `<li class="qrow" data-flip="h:${keyOf(t.title)}" data-stagger style="--i:${i}"><span class="ico ${t.kind}">${t.icon}</span><div class="qrow-text"><b>${t.title}</b><span class="qrow-meta">${t.meta}</span>${t.why ? `<span class="qrow-why"><b>AI troubleshooter:</b> ${t.why}</span>` : t.held ? `<span class="qrow-why">${t.held}</span>` : ''}</div>${firstButton(t.actions)}</li>`;
  }

  /* A support case moves through S.report 1 to 4. The coding-agent stages (2 and 3) are a design that needs NCS's
     agreement, so by default the track is Reported, Support is looking at it, Fixed. Each stage names the first
     S.report value it covers, and a coding-agent stage is marked planned. */
  const REPORT_STAGES_PLANNED = [
    [1, 'Reported', 'Sent to support with the run and the troubleshooter’s notes.'],
    [2, 'Agents are writing a fix', 'Coding agents found the cause and are testing a fix.', true],
    [3, 'Fix ready, waiting for the support developer', 'Dana reads the fix and decides. Agents can’t put it live themselves.', true],
    [4, 'Fixed', 'The fix is live. Retry the run.'],
  ];
  const REPORT_STAGES_TODAY = [
    [1, 'Reported', 'Sent to support with the run and the troubleshooter’s notes.'],
    [2, 'Support is looking at it', 'Dana has the run and the troubleshooter’s notes.'],
    [4, 'Fixed', 'The fix is live. Retry the run.'],
  ];
  const reportStages = () => (shows('codingAgents') ? REPORT_STAGES_PLANNED : REPORT_STAGES_TODAY);
  function reportTrack(compact) {
    const stages = reportStages();
    return `<ol class="track4">${stages.map(([from, t, d, planned], i) => {
      const next = stages[i + 1] ? stages[i + 1][0] : 5;
      const cls = S.report >= next || S.report === 4 ? 'done' : S.report >= from ? 'now' : 'todo';
      return `<li class="${cls}"><span class="dot">${cls === 'done' ? I.check(13) : ''}</span><div><b>${t}${planned ? ` ${PLANNED_TAG}` : ''}</b>${compact && cls !== 'now' ? '' : `<span>${d}</span>`}</div></li>`;
    }).join('')}</ol>`;
  }
  function caseBox() {
    const c = S.supportCase;
    return `<div class="casebox"><div class="case-top"><b>Case ${c.id}</b><span class="tag">Owner: ${c.owner}</span></div>
      <dl class="kv"><dt>Sent</dt><dd>${c.sent}</dd><dt>First reply by</dt><dd>${c.target}</dd><dt>Updates</dt><dd>Shown here, under Following up on Workflows</dd>${c.note ? `<dt>Your note</dt><dd>${esc(c.note)}</dd>` : ''}</dl></div>`;
  }

  /* What needs the person reading, as one full card and then one-line rows. Shared by Workflows and an Approver's Home. */
  /* Needs you is grouped (ADR 0043): Do now holds stops and approvals, Set up holds keys and missing sources. needs() stays the one list. */
  const NEED_GROUPS = [['now', 'Do now'], ['set', 'Set up']];
  const needGroup = (t) => (t.kind === 'tool' || t.rank === 3 ? 'set' : 'now');
  const byGroup = (items) => NEED_GROUPS.flatMap(([g]) => items.filter((t) => needGroup(t) === g));
  function needsSection(items) {
    const n = items.length;
    const sorted = byGroup(items);
    const body = NEED_GROUPS.map(([g, label]) => {
      const list = sorted.filter((t) => needGroup(t) === g);
      if (!list.length) return '';
      const lead = list[0] === sorted[0];
      const rest = lead ? list.slice(1) : list;
      return `<div class="ngroup" role="group" aria-labelledby="ng-${g}"><h3 id="ng-${g}">${label}</h3>${lead ? taskCard(list[0]) : ''}${rest.length ? `<ul class="queue" aria-label="${label}" data-flip-group="queue-${g}">${rest.map((x, i) => queueRow(x, i + 1)).join('')}</ul>` : ''}</div>`;
    }).join('');
    return `<section class="section" aria-labelledby="needs-h" data-flip-group="needs">
      <h2 id="needs-h">Needs you <span class="count" data-val="needs-count">${n}</span></h2>
      ${body}
    </section>`;
  }
  /* The workflows in the order they run next, paused ones last. */
  const comingUp = () => routineIds().map((id) => [id, R(id)]).sort((a, b) => (S.paused[a[0]] ? 1 : 0) - (S.paused[b[0]] ? 1 : 0) || a[1].sort - b[1].sort);
  const nextUp = (first) => `<button class="linkbtn" data-act="workflow" data-arg="${first[0]}">${esc(first[1].name)}</button>, ${first[1].next}`;

  /* Needs you on Home (spec 5.1): one line each, most urgent first, with one action. Only the first row's action is
     primary (rule 1). The "what" is the item's title; the "why" is the troubleshooter's first sentence, or where it came
     from. Also the Planner's "what needs me". The built Home has Needs you, so the strip carries no mark of its own. */
  const firstSentence = (s) => s.replace(/<[^>]+>/g, '').split(/(?<=\.)\s/)[0];
  const oneAction = (html) => firstButton(html).replace('class="btn sm"', 'class="btn primary sm"');
  function needRow(t, i, primary) {
    return `<li class="nrow" data-flip="n:${keyOf(t.title)}" data-stagger style="--i:${i}"><span class="ico ${t.kind}">${t.icon}</span><div class="nrow-text"><b>${t.title}</b><span class="nrow-why">${t.held || (t.why ? firstSentence(t.why) : t.meta)}</span></div>${i === 0 && primary ? oneAction(t.actions) : firstButton(t.actions)}</li>`;
  }
  /* o.total: the count shown when the strip leaves an item out. o.primary: false when the screen's one primary action sits elsewhere. */
  function needsStrip(items, max = 3, unbuilt = '', o = {}) {
    const n = items.length;
    const primary = o.primary !== false;
    const shown = byGroup(items).slice(0, max);
    return `<section class="section needs" aria-labelledby="needs-h" data-flip-group="needs"${unbuilt ? ` data-unbuilt="${unbuilt}"` : ''}>
      <h2 id="needs-h">Needs you <span class="count" data-val="needs-count">${o.total || n}</span></h2>
      ${NEED_GROUPS.map(([g, label]) => { const list = shown.filter((t) => needGroup(t) === g); return list.length ? `<div class="ngroup" role="group" aria-labelledby="ng-${g}"><h3 id="ng-${g}">${label}</h3><ul class="queue" data-flip-group="nrows-${g}">${list.map((t) => needRow(t, shown.indexOf(t), primary)).join('')}</ul></div>` : ''; }).join('')}
      ${n > max ? '<p class="small"><button class="linkbtn" data-act="go" data-arg="workflows">See all on Workflows</button></p>' : ''}
    </section>`;
  }

  /* Home for an Approver who can't set up workflows (spec 5.3): what waits for their yes, with no box. */
  function approverHome() {
    const items = needs();
    const n = items.length;
    const waits = items.filter((t) => t.kind === 'wait').length;
    const coming = comingUp();
    const firstLive = coming.find(([id]) => !S.paused[id]);
    const line = !coming.length ? 'Nothing needs you yet. When a workflow wants to change something, it shows up here and in Teams.'
      : n === 0 ? 'Nothing needs you right now.' : n === waits ? `${n === 1 ? '1 request is' : `${n} requests are`} waiting for your yes.` : `${n === 1 ? '1 thing needs' : `${n} things need`} you.`;
    return `<div class="home">
      <div class="hello"><h1 tabindex="-1">Good morning! ${me().name}</h1><p>${line}</p></div>
      ${n ? needsSection(items) : `<div class="quiet"><b>All quiet</b>${firstLive ? `Next up: ${nextUp(firstLive)}.` : 'Nothing is scheduled yet.'}</div>`}
      <p class="note" style="margin-top:28px">You’re an Approver, so you decide on requests. Operators set up workflows.</p>
    </div>`;
  }

  /* One row at the top of a conversation names the most urgent item (ADR 0043). Open goes to that item, and N more opens the list. */
  function needOpen(t) {
    if (t.wf) return { act: S.n8nChg[t.wf] ? 'workflow' : 'run', arg: t.wf };
    if (/^GitHub can’t find/.test(t.title)) return { act: 'go', arg: 'software' };
    const m = t.actions.match(/data-act="([^"]+)"(?: data-arg="([^"]*)")?/);
    return m ? { act: m[1], arg: m[2] } : null;
  }
  function pinnedLine() {
    const items = byGroup(needs());
    if (!items.length) return '';
    const t = items[0];
    const o = needOpen(t);
    const more = items.length - 1;
    return `<div class="pinned" role="region" aria-label="Most urgent">
      <span class="ico ${t.kind}">${t.icon}</span>
      <div class="pinned-text"><b>${t.title}</b><span>${t.held || (t.why ? firstSentence(t.why) : t.meta)}</span></div>
      ${o ? `<button class="btn sm" data-act="${o.act}"${o.arg !== undefined ? ` data-arg="${o.arg}"` : ''}>Open<span class="vh">: ${firstSentence(t.title)}</span></button>` : ''}
      ${more ? `<button class="linkbtn" data-act="go" data-arg="workflows">${more} more<span class="vh"> that need you</span></button>` : ''}
    </div>`;
  }
  const chatMode = () => S.view.name === 'home' && me().op && !!curModel() && S.chat.msgs.length > 0;
  /* The side panel (ADR 0043) shows one item opened from a card in the chat, as a summary. It keeps no history. */
  const dockVar = () => {
    const d = $app.querySelector('.chatdock');
    if (d) document.documentElement.style.setProperty('--dock', `${d.offsetHeight}px`);
    const n = $app.querySelector('.chatnew');
    if (n) { const r = n.getBoundingClientRect(); document.documentElement.style.setProperty('--ctl-top', `${Math.round(r.top + r.height / 2 - 20)}px`); }
  };
  window.addEventListener('resize', dockVar);
  /* One breakpoint, 900 px, for the rail's top bar, the full-screen panel and the panel opening by itself. */
  const narrow = () => window.matchMedia('(max-width: 900px)').matches;
  window.matchMedia('(max-width: 900px)').addEventListener('change', () => { if (S.panel) render(); });
  function itemOf(act, arg, el) {
    if (el && el.dataset.open) { const [kind, id] = el.dataset.open.split(':'); return { kind, id }; }
    if (act === 'workflow' && arg !== 'sw') return { kind: 'workflow', id: arg };
    if (act === 'run') return { kind: 'run', id: arg };
    return null;
  }
  const sameItem = (a, b) => !!a && !!b && a.id === b.id && a.kind === b.kind;
  const swRow = (key) => watchRows().concat(S.added.map((a, i) => ({ key: `add${i}`, name: a.name, kind: a.kind, repo: a.repo, ours: a.ours || 'Not known', newest: '?' }))).find((r) => r.key === key && !S.removed.includes(key));
  const runTone = { waiting: { tone: 'wait', label: 'Waiting for a yes' }, failed: { tone: 'bad', label: 'Stopped' }, expired: { tone: 'off', label: 'No answer' }, done: { tone: 'ok', label: 'Done' } };
  function panelView(p) {
    /* The workflow being set up, while the Planner builds it (ADR 0043): its steps go in one by one, as plain steps. */
    if (p.kind === 'build') {
      const f = draftNr();
      const steps = draftSteps(f);
      const shown = Math.min(p.shown, steps.length);
      return { title: esc(S.wiz.name.trim() || f.name), body: `<div><span class="pill">Draft</span></div><p${shown < steps.length ? ' class="muted"' : ''}>${shown < steps.length ? 'Adding the steps…' : 'It runs once you turn it on from the card in the chat.'}</p>${stepsList(steps.slice(0, shown), true, 'build')}` };
    }
    if (p.kind === 'workflow') {
      if (!has(p.id)) return { title: 'Workflow', body: '<p class="muted">That workflow isn’t here any more.</p>' };
      const r = R(p.id);
      const st = status(p.id);
      const t = stoppedNow(p.id) ? TROUBLE[p.id]() : null;
      const problem = t ? `<div class="sp-problem">${says(`${t.happened} ${t.next}`)}${me().op && t.act ? `<div class="btns">${troubleBtn(t)}</div>` : ''}</div>` : '';
      const flip = !me().op || p.id === 'sw' ? '' : S.paused[p.id] ? `<button class="btn sm" data-act="resume" data-arg="${p.id}">Resume</button>` : `<button class="btn sm" data-act="pause" data-arg="${p.id}">${I.pause(14)}Pause</button>`;
      return { title: esc(r.name), page: `workflow:${p.id}`, body: `<div>${pills(p.id)}</div><p>${r.what}</p>${problem}
        <dl class="kv"><dt>Last run</dt><dd>${st.last}</dd><dt>Next run</dt><dd>${S.paused[p.id] ? 'Paused' : r.next}</dd></dl>
        <div class="btns">${hasRun(p.id) ? `<button class="linkbtn" data-act="panelPage" data-arg="run:${p.id}">Open the run</button>` : ''}${flip}</div>` };
    }
    if (p.kind === 'software') {
      const row = swRow(p.id);
      if (!row) return { title: 'Software', body: '<p class="muted">That software isn’t on the Software watchlist any more.</p>' };
      const state = row.newest === '?' ? '<span class="pill bad">Can’t check</span>' : row.ours === row.newest ? '<span class="pill ok">Up to date</span>' : '<span class="pill wait">New version</span>';
      return { title: esc(row.name), page: 'software', body: `<div>${state}</div>
        <dl class="kv"><dt>You run</dt><dd>${esc(row.ours)}</dd><dt>Newest</dt><dd>${row.newest === '?' ? 'Not known' : esc(row.newest)}</dd><dt>Checked by</dt><dd>The Version checker, ${swDays()}, on ${srcName(row.kind || 'github')}</dd></dl>` };
    }
    const m = runModel(p.id);
    const r = R(m.workflow);
    if (m.state === 'waiting' && canApprove(p.id)) return { title: esc(r.name), page: `run:${p.id}`, body: approvePanel(p.id, true) };
    const steps = m.stations.map((s, i) => {
      const st = s.skip && i <= m.end ? 'skip' : i < m.end ? 'done' : i === m.end ? ({ failed: 'fail', waiting: 'wait', expired: 'noans' }[m.state] || 'done') : 'todo';
      const said = { done: 'Done: ', fail: 'Stopped: ', wait: 'Waiting: ', noans: 'No answer: ', skip: 'Not needed: ', todo: 'Not reached yet: ' }[st];
      return `<li class="${st}"><span class="vh">${said}</span>${s.label}</li>`;
    }).join('');
    const t = m.state === 'failed' && TROUBLE[p.id] ? TROUBLE[p.id]() : null;
    const answers = t ? `<dl class="qa"><dt>What happened</dt><dd>${t.happened}</dd></dl><dl class="qa"><dt>What was affected</dt><dd>${t.affected}</dd></dl><dl class="qa"><dt>Can it be fixed safely</dt><dd>${t.safe}</dd></dl>${t.act && me().op ? `<div class="btns">${troubleBtn(t)}</div>` : t.act ? `<p class="note">${t.deny}</p>` : ''}` : '';
    return { title: esc(r.name), page: `run:${p.id}`, body: `<div>${pill(runTone[m.state] || runTone.done)}</div><p>${m.headline}</p><ol class="sp-steps" aria-label="Steps of this run">${steps}</ol>${answers}` };
  }
  /* The build view follows its card: it becomes the workflow once the card turns it on, and closes when the draft is
     saved or discarded, or when the window becomes as narrow as a phone, where the panel never opens by itself. */
  let buildTimer = null;
  function syncBuild() {
    const p = S.panel;
    if (!p || p.kind !== 'build') { clearInterval(buildTimer); return; }
    const m = msgById(p.id);
    if (m && m.card && m.card.done) S.panel = { kind: 'workflow', id: m.card.done.id };
    else if (!m || liveSetup() !== m || narrow()) S.panel = null;
    if (S.panel !== p) clearInterval(buildTimer);
  }
  /* Wider than 900 px the panel opens by itself while the Planner builds. With reduced motion the steps are all there at once. */
  function openBuild(mid) {
    if (narrow() || !onHome()) return;
    clearInterval(buildTimer);
    const n = draftSteps(draftNr()).length;
    S.panel = { kind: 'build', id: String(mid), shown: motionQuery.matches ? n : 0 };
    if (motionQuery.matches) return;
    /* Each step redraws the panel only, so nothing in the chat, focus included, moves while the steps go in. */
    buildTimer = setInterval(() => {
      const p = S.panel;
      const body = $app.querySelector('#sidepanel .sp-body');
      if (!p || p.kind !== 'build' || p.shown >= n || !body) { clearInterval(buildTimer); return; }
      p.shown += 1;
      body.innerHTML = panelView(p).body;
      const added = [...body.querySelectorAll('.steps > li')].pop();
      if (added) added.classList.add('m-appear');
    }, 320);
  }
  function sidePanel() {
    if (!S.panel) return '';
    const v = panelView(S.panel);
    return `<aside class="sidepanel" id="sidepanel" aria-labelledby="sp-h"${narrow() ? ' role="dialog" aria-modal="true"' : ''}>
      <div class="sp-bar"><h2 id="sp-h" tabindex="-1">${v.title}</h2><div class="sp-btns">${v.page ? `<button class="btn sm" data-act="panelPage" data-arg="${v.page}">More details</button>` : '<span></span>'}<button class="btn sm" data-act="panelClose">Close</button></div></div>
      <div class="sp-body">${v.body}</div>
    </aside>`;
  }

  /* Home for an Operator (spec 5): a greeting with the state in one line, the Planner's box, three suggestions from that
     state, and Needs you while something needs her. Day one has three starting points and the capability lists instead. */
  const DAY_ONE = ['Keep track of the LangGraph version', 'What can you do?'];
  const WATCHED = ['Which software has a newer version?', 'Watch another software for new versions', 'What can you do?'];
  const stoppedIds = () => routineIds().filter((id) => !S.paused[id] && status(id).tone === 'bad');
  /* The rows Home shows under the box. Offline, the hero already carries Connect a model, so its row is left out. */
  const homeNeeds = () => needs().filter((t) => curModel() || t.id !== 'model');
  /* Software versioning is the front door (8 Nov). With software on the watchlist the chips are about it; with none, the
     day-one pair. The general workflow builder is frozen, so no chip sets up a general workflow. */
  function suggestions() {
    return onWatchlist() ? WATCHED : DAY_ONE;
  }
  const onWatchlist = () => (S.firstDay ? [] : TRACKED).length + S.added.length > 0;
  /* Starting points for "Set up another workflow": the first three she doesn't already have. */
  const STARTS = [
    ['Keep track of the LangGraph version', () => onList('LangGraph')],
    ['Keep track of the React version', () => onList('React')],
  ];
  const starts = () => STARTS.filter(([, had]) => !(typeof had === 'function' ? had() : routineIds().some((id) => had.test(R(id).name)))).map(([t]) => t).slice(0, 3);
  /* The one line under the greeting. It never repeats the count: the Needs you heading under it carries that. */
  function stateLine(items) {
    const n = items.length;
    const first = comingUp().find(([id]) => !S.paused[id]);
    if (!n) return `Nothing needs you. ${first ? `Next up: ${nextUp(first)}.` : 'Nothing is scheduled yet.'}`;
    const fine = routineIds().some((id) => !S.paused[id] && status(id).tone === 'ok');
    return `${n === 1 ? 'Something needs' : 'Some things need'} you.${fine ? ' Your other workflows are on.' : ''}`;
  }
  /* The box, disabled and labelled while the Planner answers (spec 5.5). */
  function composer(c, empty) {
    const busy = c.busy;
    const label = busy ? 'The Planner is answering' : 'Ask the Planner about software versions';
    /* The phone box is too narrow for the full question, so it asks a shorter one that fits. */
    const phone = window.matchMedia('(max-width: 600px)').matches;
    const ph = busy ? 'The Planner is answering' : empty ? (phone ? 'Ask about your software versions' : 'Ask about your software versions, or name software to watch') : 'Ask for something else';
    return `<form class="composer" data-submit="ask"><label class="vh" for="ask">${label}</label><textarea id="ask" data-ask rows="1" placeholder="${ph}" enterkeyhint="send"${busy ? ' disabled aria-disabled="true"' : ''}>${esc(c.text)}</textarea><button class="send" type="submit" aria-label="Send to the Planner"${c.text.trim() && !busy ? '' : ' disabled'}>${I.send(20)}</button></form>`;
  }
  /* Day one starts with nothing in Needs you because its keys are fresh and nothing has run. Anything real that comes
     up, such as Jira not answering, shows here like any other day, so Home and the tab count never disagree. */
  function plannerHome() {
    const c = S.chat;
    const empty = !c.msgs.length;
    const dayOne = !routineIds().length;
    if (!curModel()) return offlineHome();
    const items = homeNeeds();
    if (!empty) {
      return `<div class="home planner chatlayout" data-unbuilt="The Planner’s box on Home (ADR 0037)">
        <div class="chatcol"${S.panel && narrow() ? ' inert' : ''}>
          <div class="chatbar"><h1 class="vh" tabindex="-1">Planner</h1>${pinnedLine()}<div class="btns chatnew"><button class="linkbtn" data-act="newChat">New chat</button></div></div>
          <div class="chatscroll"><div class="chatin">${threadHTML()}</div></div>
          <div class="chatdock">${composer(c, false)}</div>
        </div>
        ${sidePanel()}
      </div>`;
    }
    const hello = dayOne
      ? '<h1 tabindex="-1">Which software should we keep up to date?</h1><p class="lead">Ask about your watchlist, or tell me what software to watch.</p>'
        : `<h1 tabindex="-1">Good morning! ${me().name}</h1><p class="lead">${stateLine(items)}</p>`;
    return `<div class="home planner" data-unbuilt="The Planner’s box on Home (ADR 0037)">
      <div class="welcome">${face('lead', 128, c.hero, { live: c.hero === 'idle', id: 'hero' })}<div class="hello-text">${hello}</div></div>
      ${composer(c, true)}
      <div class="chips examples" role="group" aria-label="${onWatchlist() ? 'Suggestions' : 'Starting points'}">${suggestions().map((e, i) => `<button class="chip" data-act="example" data-arg="${i}">${e}</button>`).join('')}</div>
      ${items.length ? needsStrip(items) : ''}
      ${dayOne || c.abil ? abilitiesHTML() : ''}
      ${!dayOne ? `<p class="small muted" style="text-align:center"><button class="linkbtn" data-act="abil" data-unbuilt="What can I ask for">${c.abil ? 'Hide what I can do' : 'What can I ask for?'}</button></p>` : ''}
    </div>`;
  }
  /* Home with no AI model (spec 5.4), in the built app's words: agent workflows can't run and new ones can't be planned
     until a model is connected; only the Software watchlist's summary uses a simple template. What it can do, and
     asking the team, still work, because neither needs the model. Needs you still shows, because it is read from the
     platform, without the model row, which the hero already is. */
  function offlineHome() {
    const items = homeNeeds();
    return `<div class="home planner" data-unbuilt="The offline Home (ADR 0037)">
      <div class="welcome offline">${face('lead', 128, 'sorry', { id: 'hero' })}<div class="hello-text"><h1 tabindex="-1">I can’t read new requests until an AI model is connected</h1><p class="lead">Without an AI model, the Planner can’t answer questions. The Software watchlist keeps checking for new releases.</p>
        <div class="btns"><button class="btn primary" data-act="setGo" data-arg="model">Connect a model</button></div></div></div>
      ${items.length ? needsStrip(items, 3, '', { total: needs().length, primary: false }) : ''}
      ${abilitiesHTML()}
    </div>`;
  }

  /* The one action a workflow row or page offers (rule 1). */
  function actionFor(id) {
    if (canApprove(id)) return `<button class="btn primary sm" data-act="run" data-arg="${id}">Review and decide</button>`;
    if (!me().op) return '';
    if (S.paused[id]) return `<button class="btn primary sm" data-act="resume" data-arg="${id}">Resume</button>`;
    if (id === 'conf' && S.conf === 'expired') return testAgain('Test it again', 'btn primary sm');
    if ((id === 'issues' && S.issues === 'failed') || (id === 'nudge' && S.nudge === 'failed')) return troubleBtn(TROUBLE[id](), true);
    return '';
  }

  /* Workflows opens with what needs you, your drafts, what you're waiting on and any report you follow (spec 8).
     Each section shows only when it has something. */
  function attention() {
    const items = needs();
    const n = items.length;
    const waitingOn = [];
    if (S.user === 'alice') {
      if (shows('toolDraft') && S.jiraComp === 'asked' && S.jiraCompAsker === 'alice') waitingOn.push(['An Approver to OK the new tool', `${TOOLS.jiraComp[0]} · for the Ticket writer`, 'toolOpen', 'jiraComp']);
      if (S.conf === 'waiting' && has('conf')) {
        const q = req('conf');
        const who = q.team ? 'A yes from any Approver' : q.escalated && q.backup ? `A yes from ${whoOr(askedOf(q))}` : `${nm(q.first)}’s yes`;
        const next = q.team ? 'waits until an Approver decides' : q.escalated || !q.backup || !q.backupInTime ? `stops waiting ${at(q.expiresAt)}` : `${nm(q.backup)} is asked ${on(q.backupAt)} if there’s no answer`;

          <article class="panel"><div><div class="task-title">Weekly closed-ticket summary: reported to support</div><div class="task-meta">Support has the run and the troubleshooter’s notes. Updates show here.</div></div>${caseBox()}${reportTrack(true)}</article></section>` : '';

    const rowList = (items) => `<div class="rows">${items.map(([a, b, act, arg]) => `<button class="row-btn" data-act="${act}" data-arg="${arg}"><div><div class="row-name">${a}</div><div class="row-sub">${b}</div></div>${I.right(16)}</button>`).join('')}</div>`;
    const needLine = (d) => (d.need.length ? `Needs ${andList(d.need)}` : d.crossed ? 'Ready to set up the part I can.' : 'Nothing is unclear. Turn it on when you’re ready.');

      ${drafts.length ? `<section class="section" aria-labelledby="drafts-h" data-unbuilt="Drafts here (the built app lists them on Home)"><h2 id="drafts-h">Drafts <span class="count">${drafts.length}</span></h2>
        <div class="rows">${drafts.map((d) => `<div class="row draft-row" data-flip="draft:${d.id}"><div><div class="row-name">${esc(d.name)}</div><div class="row-sub">${needLine(d)}</div></div><span class="btns"><button class="btn sm" data-act="openDraft" data-arg="${d.id}">Resume<span class="vh"> ${esc(d.name)}</span></button><button class="btn sm" data-act="discardDraft" data-arg="${d.id}" data-unbuilt="Discard a draft">Discard<span class="vh"> ${esc(d.name)}</span></button></span></div>`).join('')}</div></section>` : ''}
      ${waitingOn.length ? `<section class="section" data-unbuilt="Waiting on others on Workflows (the built app has it on Home)"><h2>Waiting on others</h2>${rowList(waitingOn)}</section>` : ''}

  }

  const FILTERS = [['all', 'All'], ['stopped', 'Stopped'], ['paused', 'Paused']];
  /* All workflows: one row each with its name, purpose, status, next run and at most one action. No faces and no
     step details. Search and the filters stay behind the search button until asked for. */
  function boardView() {
    const ids = routineIds();
    const q = S.find.workflows.trim().toLowerCase();
    const shown = ids.filter((id) => {
      const r = R(id);
      if (q && !`${r.name} ${r.what}`.toLowerCase().includes(q)) return false;
      if (S.filter === 'stopped') return status(id).tone === 'bad';
      if (S.filter === 'paused') return !!S.paused[id];

    const inNeeds = new Set(needs().map((x) => x.wf));

      return `<li class="wf-row${S.paused[id] ? ' paused' : ''}${justOn === id ? ' m-changed' : ''}" data-flip="wf:${id}" data-stagger style="--i:${i}">

        <span class="wf-pills">${pills(id)}${BASE[id] && BASE[id].planned ? PLANNED_TAG : ''}</span>

      ${canAdd && shows('n8n') ? `<p class="small muted n8n-start" data-unbuilt="Start in n8n (ADR 0026, 0027)">Prefer to build it yourself? <button class="linkbtn" data-act="n8nNew">Start in n8n</button> ${PLANNED_TAG}</p>` : ''}

  /* A plan's steps. Each step keeps its place by position, so a step that changes is highlighted, and an added or removed one slides the rest. */
  function stepsList(steps, inline, key = 'steps') {
    const who = (w) => (!w ? '' : w === 'platform' ? `<span class="sysav app" style="width:26px;height:26px">${I.mark()}</span>` : face(w, 26));

    return `<ol class="steps${inline ? ' inline' : ''}" data-flip-group="${key}">${steps.map(([what, kind, how, w, isNew], i) => `<li data-flip="${key}:${i}"><div>${who(w)}<div class="what" data-val="${key}:${i}">${what}</div><div class="how"><span class="tag ${kind || ''}">${how}</span>${isNew ? newTag : ''}</div></div></li>`).join('')}</ol>`;
  }

  /* What happened to one tool over time. The backend already records where each "ours" came from. */
  function history(key) {
    const by = nm(S.swBy);
    const found = (v, t) => (S.sw === 'waiting' ? `Found ${v}. Upgrade ticket proposed, waiting for a yes.` : S.sw === 'approved' ? `Found ${v}. ${t} created, approved by ${by}.` : `Found ${v}. Ticket declined by ${by}, so it is proposed again next Monday.`);
    const full = shows('registries');
    return {
      lj: [['Mon 26 Oct', `${found('2.25.2', 'MOCK-16')}${full ? ' The Vulnerability checker found 4 known vulnerabilities in our version, one of them actively exploited, so the ticket is urgent.' : ''}`], ['Thu 15 Oct', `Added by Carol from ${full ? 'Maven Central' : 'GitHub'}, with our version 2.14.1.`]],
      lg: [['Mon 26 Oct', found('1.2.17', 'MOCK-14')], ['Thu 8 Oct', 'Our version set to 1.2.14, because MOCK-6 was marked Done.'], ['Mon 5 Oct', 'Found 1.2.14. MOCK-6 created, approved by Bob.'], ['Thu 1 Oct', 'Added by Alice with our version 1.2.11.']],
      fa: [['Mon 26 Oct', found('0.120.1', 'MOCK-15')], ['Thu 22 Oct', 'Our version set to 0.118.0, because MOCK-9 was marked Done.'], ['Mon 19 Oct', 'Found 0.118.0. MOCK-9 created, approved by Alice.'], ['Thu 1 Oct', 'Added by Alice. Our version was left empty, so the first check took 0.117.1.']],
      gr: [['Mon 26 Oct', `Couldn’t check: ${full ? 'Docker Hub didn’t answer, and ' : ''}GitHub’s hourly limit was reached. It tries again next Monday.`], ['Mon 19 Oct', 'Up to date at 12.1.0.'], ['Thu 1 Oct', 'Added by Carol with our version 12.1.0.']],
