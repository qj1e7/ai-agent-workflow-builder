    down: { say: (a) => (a.saved || jiraDown() ? 'Jira isn’t answering right now, so I can’t check that. I’ll be able to once it’s back.' : 'Jira is answering again, so I can check that now.'), card: (m) => downCard(m), mood: 'sorry' },
    refuse: { say: () => 'I can’t set that up. Anything that changes data waits for a yes, every time.', card: (m) => refuseCard(m), mood: 'sorry' },
    abilities: { say: (a) => (a.unknown ? 'I can’t help with that here. I check software versions and watch for new releases. Here’s what I can do.' : 'Here’s what I can do for software versions.'), card: () => abilitiesHTML(), mood: (a) => (a.unknown ? 'sorry' : 'idle') },
    check: { say: checkSay, card: () => checkCard() },
    why: { say: whySay, card: (m) => whyCard(m), mood: (a) => (stoppedNow(a.id) ? 'sorry' : 'idle') },
    mine: { say: mineSay, card: () => mineCard() },
    starts: { say: () => 'Here are three places to start. Pick one, or tell me something else.', card: () => startsCard() },
    data: { say: dataSay, card: (m) => dataCard(m) },
    edit: { say: editSay, card: (m) => editCard(m) },
    nocheck: { say: nocheckSay, card: (m) => nocheckCard(m) },
  };
  const cardHTML = (m) => (ANSWERS[m.card.kind].card ? ANSWERS[m.card.kind].card(m) : '');

  /* ---------- Drafts ----------
     The chat is not the record. The set-up card still being filled in edits the one live draft in S.wiz. A new request
     or a new chat saves that draft to S.drafts, listed on Workflows, and opening one brings it back to S.wiz. Turning
     a draft on empties S.wiz, so it is gone from the list. */
  const liveSetup = () => S.chat.msgs.find((m) => m.card && m.card.kind === 'setup' && !m.card.done && !m.card.saved && !m.card.discarded);
  /* A draft row for the request in S.wiz, or for one built from a request the Planner couldn't check. */
  const draftRow = (wiz = S.wiz) => {
    const keep = S.wiz;
    S.wiz = wiz;
    const row = { id: (S.draftSeq += 1), wiz, name: wiz.name.trim() || draftNr().name, left: setupLeft().length, need: setupLeft(), crossed: hasCross(setupParts('d')) };
    S.wiz = keep;
    return row;
  };
  function saveLive() {
    const m = liveSetup();
    if (!m) return false;
    S.drafts.push(draftRow());
    m.card.saved = true;
    S.wiz = newWiz();
    return true;
  }
  const draftRows = () => (liveSetup() ? [{ id: 'live', name: S.wiz.name.trim() || draftNr().name, left: setupLeft().length, need: setupLeft(), crossed: hasCross(setupParts('d')) }] : []).concat(S.drafts.map((d) => ({ id: d.id, name: d.name, left: d.left, need: d.need || [], crossed: d.crossed })));
  function startDraft(text, it) {
    saveLive();
    S.wiz = { ...newWiz(), text, intent: it, sched: { freq: it.freq || '', day: it.day || '', time: it.time || '', monthDay: '1' } };
    return { kind: 'setup', crossed: hasCross(setupParts('new')) };
  }
  /* The watchlist's days in the words a sentence uses, such as "every Monday", read from its schedule. */
  const swDays = () => lc(R('sw').when).replace(/ at .*$/, '');
  const watchDoneSay = (a) => (S.removed.includes(a.done) ? `${a.name} isn’t on the Software watchlist any more.` : `${a.name} is on the Software watchlist. It’s checked at the next check, ${R('sw').next}.`);
  const doneSay = (d) => (!has(d.id) ? `${d.name} isn’t here any more.` : S.paused[d.id] ? `${R(d.id).name} is paused.` : `${R(d.id).name} is on. Its first run is ${R(d.id).next}.`);
  /* What still stops Turn it on: the amber and red parts, by name. */
  function setupLeft() {
    const left = [];
    if (Object.keys(schedProblems(S.wiz.sched)).length) left.push('when it runs');
    const names = { source: 'what it reads', tickets: 'which tickets', project: 'the Jira project', action: 'what it does' };
    intentRows().filter((r) => r.key !== 'when' && (r.state === 'missing' || r.state === 'cant')).forEach((r) => left.push(names[r.key]));
    return left;
  }
  const leftWords = (n) => (n === 1 ? '1 choice left' : `${n} choices left`);
  /* The promises live in the confirmation, where they matter (spec 7.2). */
  const PROMISES = 'You can pause, change or delete it at any time. If it stops, the AI troubleshooter tells you why.';

  /* The steps of the workflow being set up, each with who does it. The card and the side panel show the same list. */
  const draftSteps = (f) => planOf(f).map((x, i) => x.concat(i === 0 ? 'jira' : i === 1 ? writerOf(f) : 'platform', i === 1 && isNewAgent(writerOf(f))));
  /* The set-up card (spec 7, ADR 0043): each part of the request with its mark, what needs a yes, then how it works,
     collapsed, and one button. While any part has a cross, the button sets up the part I can, and the footer never says
     "Nothing is unclear". */
  function setupCard(m) {
    const c = m.card;
    if (c.done) return setupDone(c.done);
    if (c.discarded) return '<p class="small muted">Discarded.</p>';
    if (c.saved) return '<p class="small muted">Saved as a draft. Open it from Workflows to carry on.</p>';
    const w = S.wiz;
    const f = draftNr();
    const parts = setupParts(m.id);
    const left = setupLeft();
    const crossed = hasCross(parts);
    const similar = f.tickets === 'closed' && f.action === 'summary' && has('nudge');
    const writer = writerOf(f);
    const title = w.name.trim() || f.name;
    const job = { list: 'lists them', compare: 'compares them with the week before' }[f.action] || 'sums them up';
    return `<div class="pcard" data-pres="setup:${m.id}" data-unbuilt="The set-up card (ADR 0037)">
      <div class="pcard-h">${w.renaming
        ? `<label class="vh" for="rname">Workflow name</label><input type="text" id="rname" data-input="name" value="${esc(w.name || f.name)}"><button class="btn sm" data-act="renameDone">Done</button>`
        : `<h3 tabindex="-1" id="card-h-${m.id}">${esc(title)}</h3><button class="linkbtn" data-act="rename">Rename</button>`}</div>
      ${partsList(parts)}
      ${similar ? `<p class="similar pcard-s">${I.info(16)}<span>You already have a similar workflow, <i>Weekly closed-ticket summary</i>. <button class="linkbtn" data-act="workflow" data-arg="nudge">Open it</button></span></p>` : ''}
      <section class="pcard-s"><h4>What needs a yes</h4><p class="apsum">${I.shield(16)}<span>Creating the Jira ticket changes data, so each run waits for a yes in Teams. Any Approver on your team except you can say yes.${shows('namedApprovers') ? ` Named Approvers, with a backup and a stop time, come later. ${PLANNED_TAG}` : ''}</span></p></section>
      <details class="more how" data-flow-of="build:${m.id}" data-unbuilt="How this workflow works"><summary>How this workflow works</summary><div class="more-body">
        ${stepsList(draftSteps(f), true, 'plan:draft')}
        <p class="note">${readsLimit(f.tickets === 'open' ? '' : f.period)}</p>
        <p class="agents-line">${face('jira', 26)}<span><b>${AGENTS.jira.name}</b> reads the tickets.</span>${face(writer, 26)}<span><b>${AGENTS[writer].name}</b> ${job}.${isNewAgent(writer) ? ' <span class="tag">New agent, saved under How it works, in Settings, when you turn this on</span>' : ''}</span></p>
        <p class="note">Tools: ${TOOLS.jiraSearch[0]} and ${TOOLS.jiraRead[0]} read Jira. ${TOOLS.jiraCreate[0]} writes to Jira, after a yes.</p>
      </div></details>
      <div class="pcard-f"><button class="btn primary" data-act="turnOn"${left.length ? ' disabled' : ''}>${crossed ? 'Set up the part I can' : 'Turn it on'}</button>
        ${left.length ? `<span class="left">${leftWords(left.length)}: ${andList(left)}.</span>` : `<span class="note">${crossed ? `${crossed === 1 ? 'The part with a cross is' : `The ${crossed} parts with a cross are`} left out.` : 'Nothing is unclear. Turn it on when you’re ready.'}</span>`}</div>
    </div>`;
  }
  /* A workflow the card turned on, read from the workflow itself, so a pause, a new schedule or a delete shows here too. */
  function setupDone(d) {
    if (!has(d.id)) return `<p class="small muted">${esc(d.name)} isn’t here any more.</p>`;
    const r = R(d.id);
    return `<div class="pdone"><span class="tick">${I.check(14)}</span><div><b>${esc(r.name)} ${S.paused[d.id] ? 'is paused.' : 'is on.'}</b><span>${S.paused[d.id] ? 'It won’t run until you resume it.' : `First run ${r.next}, Singapore time.`} Before its ticket is created, any Approver on your team except you is asked for a yes in Teams.${d.newAgent ? ` The ${AGENTS[d.newAgent].name} is saved under How it works, in Settings.` : ''}</span><span>${PROMISES}</span><span class="btns">${d.id === 'conf' ? '<button class="btn primary sm" data-act="testRun">Do a test run</button>' : ''}<button class="linkbtn" data-act="go" data-arg="workflows">See it in Workflows</button>${d.id === 'conf' ? '<span class="small muted">A test run does the real work once, so it still waits for a yes.</span>' : ''}</span></div></div>`;
  }

  const watchLeft = (c) => (c.repoState !== 'ok' ? 1 : 0) + (!c.newest && !c.version.trim() ? 1 : 0);
  /* The parts of a request to watch software (ADR 0043). The watchlist checks every software together, so a time in
     the request either matches its schedule or gets a cross. One question at a time: the project, then the version. */
  function watchParts(m) {
    const c = m.card;
    const id = m.id;
    const text = c.text || c.name;
    const sw = R('sw');
    const it = parseIntent(text);
    const src = srcName(c.src);
    const [label, ph, help] = SRC_FIELD[c.src];
    const parts = [{ key: 'name', mark: 'ok', label: 'Software', body: `<b>${esc(c.name)}</b><span class="schip ok">From your words</span>` }];
    if (c.repoState === 'guess') parts.push({ key: 'repo', mark: 'ask', label: 'Published on', body: `<span class="pq" id="q-${id}">Is this the right project?</span><span>${src}</span><b>${esc(c.repo)}</b><span class="pnote">${guessNote(c)}</span><span class="pick" role="group" aria-labelledby="q-${id}"><button type="button" class="chip" data-act="repoOk" data-mid="${id}">Looks right</button><button type="button" class="chip" data-act="repoEdit" data-mid="${id}">Change</button></span>` });
    else if (c.repoState === 'edit') parts.push({ key: 'repo', mark: 'ask', label: 'Published on', body: `<label class="pq" for="repo-${id}">Which ${lc(label)} is it?</label><input type="text" class="inp" id="repo-${id}" data-card="repoDraft" data-mid="${id}" value="${esc(c.repoDraft)}" placeholder="${ph}"${c.repoErr ? ' aria-invalid="true"' : ''}><button class="btn sm" data-act="repoUse" data-mid="${id}">Use this</button><span class="pnote">${c.repoErr || help}</span>` });
    else {
      parts.push({ key: 'repo', mark: 'ok', label: 'Published on', body: `<span>${src}</span><b>${esc(c.repo)}</b><span class="schip changed">Checked by you</span>` });
      if (c.newest) parts.push({ key: 'version', mark: 'ok', label: 'Version you run', body: `<b>Not known</b><span class="schip changed">Chosen by you</span><button class="linkbtn" data-act="verType" data-mid="${id}">Add it<span class="vh">, the version you run</span></button><span class="pnote">I’ll tell you about releases newer than today’s. Add the version you run to compare against it.</span>` });
      else parts.push({ key: 'version', mark: c.version.trim() ? 'ok' : 'ask', label: 'Version you run', body: `${c.version.trim() ? '' : `<label class="pq" for="ver-${id}">Which version do you run?</label>`}<input type="text" class="inp" id="ver-${id}" data-card="version" data-mid="${id}" value="${esc(c.version)}" placeholder="For example 1.2.14" inputmode="decimal"${c.version.trim() ? ' aria-label="Version you run"' : ''}><button type="button" class="chip" data-act="verNewest" data-mid="${id}">Not sure? Start from the newest</button>` });
    }
    const said = ['freq', 'day', 'time'].filter((k) => it[k]);
    const fits = said.every((k) => it[k] === sw.sched[k]);
    parts.push({ key: 'when', mark: 'ok', label: 'Checked', body: `<span>${sw.when}</span><span class="schip ${said.length && fits ? 'ok">From your words' : 'filled">Same for all software'}</span>` });
    const ticket = spansOf(text, [HEARD.watch[2]]).length > 0;
    parts.push({ key: 'then', mark: 'ok', label: 'Then', body: `<span>An upgrade ticket in Jira for each newer version</span><span class="schip ${ticket ? 'ok">From your words' : 'filled">Same for all software'}</span>` });
    parts.push({ key: 'approves', mark: 'ok', label: 'Who says yes', body: `<span>${sw.approves}</span><span class="schip filled">Same for all software</span>${apprOf('sw') ? PLANNED_TAG : ''}` });
    return parts.concat(watchCrosses(c));
  }
  /* What a request to watch software asks that the watchlist can't do: its own time, and any clause no rule read. */
  function watchCrosses(c) {
    const text = c.text || c.name;
    const sw = R('sw');
    const it = parseIntent(text);
    const said = ['freq', 'day', 'time'].filter((k) => it[k]);
    const whenSpans = spansOf(text, HEARD.when);
    const own = said.length && !said.every((k) => it[k] === sw.sched[k]) ? [{ key: 'own', mark: 'no', label: quote(text.slice(Math.min(...whenSpans.map((x) => x[0])), Math.max(...whenSpans.map((x) => x[1])))), body: `The Software watchlist checks all your software together, ${lc(sw.when)}. I can’t give one software its own time yet.` }] : [];
    const names = [c.name, c.said].filter(Boolean).flatMap((n) => { const i = text.toLowerCase().indexOf(n.toLowerCase()); return i < 0 ? [] : [[i, i + n.length]]; });
    return own.concat(leftoverParts(text, [...whenSpans, ...spansOf(text, HEARD.watch), ...names]));
  }
  function watchCard(m) {
    const c = m.card;
    const id = m.id;
    if (c.done && S.removed.includes(c.done)) return `<p class="small muted">${esc(c.name)} isn’t on the Software watchlist any more.</p>`;
    if (c.done) return `<div class="pdone"><span class="tick">${I.check(14)}</span><div><b>${esc(c.name)} is on the Software watchlist.</b><span>First check ${R('sw').next}, with the rest of your software. ${apprOf('sw') ? apprText(apprOf('sw')).replace(/,.*$/, '') : R('sw').approves} is asked before any ticket is created.</span><span class="btns"><button class="linkbtn" data-act="go" data-arg="software">Open Software watchlist</button></span></div></div>`;
    const parts = watchParts(m);
    const n = watchLeft(c);
    return `<div class="pcard" data-pres="watch:${id}" data-unbuilt="Adding software from the Planner">
      <div class="pcard-h"><h3 tabindex="-1" id="card-h-${id}">Add ${esc(c.name)} to the Software watchlist</h3><span class="kind">${I.box(16)}Software watchlist</span></div>
      ${partsList(parts)}
      <div class="pcard-f"><button class="btn primary" data-act="watchAdd" data-mid="${id}"${n ? ' disabled' : ''}>${hasCross(parts) ? 'Set up the part I can' : `Add ${esc(c.name)}`}</button>${n ? `<span class="left">${leftWords(n)}</span>` : ''}<button class="linkbtn push" data-act="watchOwn" data-mid="${id}">No, set it up as a new workflow</button></div>
    </div>`;
  }

  /* The team decides on new systems and new tools. The request is kept under "Asked the team" on Tools. */
  const askTeam = (m, sys) => (sentToTeam(sys) ? `<span class="pill wait">${I.check(12)}Asked the team</span>` : `<button class="linkbtn" data-act="teamReq" data-arg="${esc(sys)}|chat:${m.id}" data-unbuilt="Ask the team (ADR 0038)">Ask the team</button>`);
  /* The watch a release request keeps: the software is already watched, or adding it is the part I can do. */
  function watchAlt(m) {
    const w = m.card.watch;
    return w.listed ? `<div class="alt"><p>${esc(w.name)} is already on the Software watchlist, which checks it for new releases ${swDays()}.</p><button class="btn primary sm" data-act="go" data-arg="software">Open the Software watchlist</button></div>`
      : `<div class="alt"><p>Watch ${w.name ? esc(w.name) : 'your software'} for new releases on the Software watchlist. New releases show there, and each upgrade ticket waits for a yes.</p><button class="btn primary sm" data-act="instead" data-mid="${m.id}">Set that up</button></div>`;
  }
  /* Can't (spec 6.2): the nearest real alternative when there is one, else only Ask the team. */
  function cantCard(m) {
    const c = m.card;
    const k = CANT[c.what];
    const unsupported = capState(k.cap) === 'unsupported';
    const alt = c.watch ? watchAlt(m) : c.next ? `<div class="alt"><p>${esc(k.instead)}</p><button class="btn primary sm" data-act="instead" data-mid="${m.id}">Set that up</button></div>` : '';
    return `<div class="pcard" data-pres="cant:${m.id}">
      <div class="pcard-h"><h3>${alt ? 'What I can do instead' : 'What happens next'}</h3><span class="schip cant">${unsupported ? 'Can’t do this' : 'Can’t do this yet'}</span></div>
      ${alt}
      <div class="alt"><p class="muted">${c.watch ? 'Want the rest? The team decides.' : alt ? `Want ${c.what === 'tickets' ? 'it' : esc(c.sys)} anyway? The team decides.` : `${c.what === 'tickets' ? 'Only people change tickets here' : `${esc(c.sys)} is the team’s decision`}.`}</p>${askTeam(m, c.sys)}</div>
    </div>`;
  }
  /* Part I can do (spec 6.2): the nearest real alternative, and Ask the team for the rest. */
  function partCard(m) {
    const c = m.card;
    const sys = c.cap === 'jiraComp' ? `A new Jira tool: ${TOOLS.jiraComp[0]}` : CAPS[c.cap].name;
    return `<div class="pcard" data-pres="part:${m.id}">
      <div class="pcard-h"><h3>${c.next ? 'The part I can do' : 'What happens next'}</h3><span class="schip cant">${c.cap === 'jiraComp' ? 'Needs a new tool' : 'Can’t do all of it yet'}</span></div>
      ${c.next ? `<div class="alt"><p>${esc(c.instead)}</p><button class="btn primary sm" data-act="instead" data-mid="${m.id}">Set up the part I can do</button></div>` : ''}
      <div class="alt"><p class="muted">Want the rest? The team decides.</p>${askTeam(m, sys)}</div>
    </div>`;
  }
  /* Jira isn't answering: the request is kept as a draft, so nothing is lost and nothing is claimed. */
  function downCard(m) {
    if (m.card.saved) return '<p class="small muted">Saved as a draft. Find it on Workflows, and open it once Jira is back.</p>';
    if (!jiraDown()) return `<div class="btns"><button class="btn sm" data-act="say" data-arg="${esc(m.card.text)}">Ask again</button></div>`;
    return `<div class="pcard" data-pres="down:${m.id}">
      <div class="pcard-h"><h3>Keep it for later?</h3><span class="schip cant">Jira isn’t answering</span></div>
      <div class="alt"><p>I can save this as a draft on Workflows. Once Jira is back, open it and I’ll fill in what I can.</p><button class="btn sm" data-act="draftNow" data-mid="${m.id}">Save as a draft</button></div>
    </div>`;
  }
  /* Refusal (spec 6.2): the same workflow with a yes, when a workflow is left once the unsafe part goes. A request to
     approve automatically, or to approve your own requests, leaves nothing to set up, so the card states the rule. */
  function refuseCard(m) {
    const c = m.card;
    return `<div class="pcard" data-pres="refuse:${m.id}">
      <div class="pcard-h"><h3>${c.next ? 'What I can do instead' : 'How approvals work'}</h3><span class="schip cant">Not allowed</span></div>
      ${c.next ? `<div class="alt"><p>The same workflow, with a yes in Teams before anything is created or changed.</p><button class="btn primary sm" data-act="instead" data-mid="${m.id}">Set it up with a yes</button></div>`
        : '<div class="alt"><p>Any Approver on your team except you decides on your requests, in Teams. Nobody approves their own work, and nothing approves itself.</p></div>'}
    </div>`;
  }

  /* The conversation. The person's words sit right; the Planner's replies carry its face in the state it is in. */
  /* The heading is for screen readers: the answers' card headings sit under it, not straight under the page's h1. */
  const threadHTML = () => `<h2 class="vh" id="thread-h">Conversation with the Planner</h2><ol class="chat thread" aria-labelledby="thread-h" data-flip-group="chat">${S.chat.msgs.map(msgHTML).join('')}</ol>`;
  /* While an answer is pending (principle 8): plain words, no step named, because none is known. After 8 seconds the
     words say why it takes longer. They are static, so reduced motion needs nothing. */
  const WAIT_SHORT = 'Working on it…';
  const WAIT_LONG = 'Still working. Questions about your data take a little longer.';
  function msgHTML(m) {
    if (m.from === 'me') return `<li class="cmsg me" data-flip="msg:${m.id}" data-mid="${m.id}"><div class="cmsg-body"><div class="cmsg-bubble"><span class="vh">You: </span>${esc(m.text)}</div></div></li>`;
    const st = m.thinking ? 'thinking' : m.mood || 'idle';
    /* Every answer with a card is read from live state on every redraw, so a change made anywhere shows in older answers
       too, and the sentence and its card never disagree (I8, ADR 0043). While the words are typed, the partial text shows. */
    const say = m.card && !m.typing ? ANSWERS[m.card.kind].say(m.card) : m.say;
    const body = m.thinking ? `<div class="cmsg-bubble"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><p class="wait small muted" role="status">${m.slow ? WAIT_LONG : WAIT_SHORT}</p></div>`
      : `${say != null ? `<div class="cmsg-bubble" data-say>${esc(say)}</div>` : ''}${m.card ? `<div data-pres="card:${m.id}">${cardHTML(m)}</div>` : ''}`;
    return `<li class="cmsg" data-flip="msg:${m.id}" data-mid="${m.id}"><span class="cmsg-av">${face('lead', 40, st, { k: `chat:${m.id}` })}</span><div class="cmsg-body"><span class="cmsg-who" style="color:${AGENTS.lead.hue}">Planner</span>${body}</div></li>`;
  }
  const msgById = (id) => S.chat.msgs.find((m) => m.id === +id);
  const onHome = () => S.view.name === 'home' && me().op;
  /* The chat column scrolls itself. scrollIntoView and a plain focus() also scroll #app, which moved the whole app up
     on a phone, header and box included, so neither is used in the chat. */
  function scrollToMsg(id, block = 'nearest') {
    const el = $app.querySelector(`[data-mid="${id}"]`);
    const sc = $app.querySelector('.chatscroll');
    if (!el || !sc) return;
    const r = el.getBoundingClientRect();
    const v = sc.getBoundingClientRect();
    let top = sc.scrollTop;
    if (block === 'start' || r.top < v.top) top += r.top - v.top - 8;
    else if (r.bottom > v.bottom) top += Math.min(r.bottom - v.bottom + 8, r.top - v.top - 8);
    sc.scrollTo({ top, behavior: motionQuery.matches ? 'auto' : 'smooth' });
  }
  function focusChat(el) {
    if (!el) return;
    el.focus({ preventScroll: true });
    const sc = el.closest('.chatscroll');
    if (!sc) return;
    const r = el.getBoundingClientRect();
    const v = sc.getBoundingClientRect();
    if (r.top < v.top + 8) sc.scrollTop -= v.top + 8 - r.top;
    else if (r.bottom > v.bottom - 8) sc.scrollTop += r.bottom - v.bottom + 8;
  }
  /* A request goes in, the Planner thinks for a moment, then its answer shows at once: the card, and the sentence
     written word by word with the speaking face. Nothing waits for the words. Reduced motion shows it all at once.
     force: 'setup' makes a set-up card whatever the words say, for "No, set it up as a new workflow". */
  function ask(text, force) {
    const t = text.trim();
    const c = S.chat;
    if (!t || c.busy) return;
    c.text = '';
    c.busy = true;
    c.hero = 'thinking';
    const wait = { id: c.seq + 2, from: 'planner', thinking: true };
    c.msgs.push({ id: c.seq + 1, from: 'me', text: t }, wait);
    setTimeout(() => { if (wait.thinking) { wait.slow = true; if (onHome()) render(); } }, 8000);
    c.seq += 2;
    if (S.view.name !== 'home') go('home'); else render();
    scrollToMsg(wait.id);
    setTimeout(() => {
      const a = classify(t, force);
      const ans = ANSWERS[a.kind];
      const say = ans.say(a);
      const mood = typeof ans.mood === 'function' ? ans.mood(a) : ans.mood || 'idle';
      /* The finished sentence is announced once (spec 15.8). A card answer takes focus at its heading; any other
         answer hands focus back to the box. */
      const done = () => {
        Object.assign(wait, { say, mood, typing: false });
        c.hero = 'idle';
        c.busy = false;
        announce(say);
        if (onHome()) {
          render();
          const h = ['setup', 'watch'].includes(a.kind) ? $app.querySelector(`[data-mid="${wait.id}"] .pcard-h h3`) : null;
          if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); } else focusComposer();
        }
        if (mood === 'sorry') setTimeout(() => { wait.mood = 'idle'; if (onHome()) render(); }, 1800);
      };
      Object.assign(wait, { thinking: false, say: '', mood: 'speaking', card: ans.card ? a : null, typing: true });
      if (a.kind === 'setup' && !a.resumed) openBuild(wait.id);
      if (motionQuery.matches) { done(); scrollToMsg(wait.id, wait.card ? 'start' : 'nearest'); return; }
      if (onHome()) { render(); scrollToMsg(wait.id, wait.card ? 'start' : 'nearest'); }
      const words = say.split(' ');
      let i = 0;
      const tick = () => {
        i += 1;
        wait.say = words.slice(0, i).join(' ');
        const el = $app.querySelector(`[data-mid="${wait.id}"] [data-say]`);
        if (el) el.textContent = wait.say;
        if (i < words.length) setTimeout(tick, 45); else setTimeout(done, 120);
      };
      tick();
    }, motionQuery.matches ? 250 : 900);
  }
  /* While you type, the Planner on Home leans in, its eyes follow the caret and its ear lights pulse on each key. */
  function listen(ta, on = !!ta.value.trim()) {
    const hero = document.getElementById('hero');
    if (!hero || S.chat.busy) return;
    hero.classList.toggle('fs-listening', on);
    hero.classList.toggle('fs-idle', !on);
    hero.classList.remove('live');
    if (!on || motionQuery.matches) { hero.style.removeProperty('--lx'); hero.style.removeProperty('--ly'); return; }
    const ratio = Math.min(1, (ta.selectionStart || 0) / Math.max(30, ta.value.length));
    hero.style.setProperty('--lx', `${(ratio * 4 - 2).toFixed(2)}px`);
    hero.style.setProperty('--ly', '1.6px');

  /* ---------- What the Planner can do ----------
     The registry's software versioning lines, grouped by state: I can, Needs setup, Not working right now. The approval request is listed too, as Ask Approvers for a yes in Teams. The lists hold only what software versioning uses, so the first screen stays light. */
  const GROUP_ICON = { ready: I.check(14), setup: I.alert(14), down: I.alert(14), not: I.x(13) };
  const groupTitle = (g) => stateWord(g === 'not' ? 'planned' : g);
  const capNote = (c) => (c.st === 'down' ? `Last seen working ${lastOk(c.id)}` : c.st === 'setup' ? setupFix(c.id) : '');
  function abilitiesHTML() {
    const caps = Object.keys(CAPS).filter((id) => CAPS[id].focus).map((id) => ({ id, st: capState(id) }));
    const line = (c, note) => `<li>${GROUP_ICON[c.st === 'planned' || c.st === 'unsupported' ? 'not' : c.st]}<span>${CAPS[c.id].name}${c.st === 'planned' && shows(c.id) ? ` ${PLANNED_TAG}` : ''}${note ? `<small class="cap-note">${note}</small>` : ''}</span></li>`;
    const group = (g, states) => {
      const list = caps.filter((c) => states.includes(c.st));
      if (!list.length) return '';
      /* One fix shared by the whole group is said once, under its heading. */
      const notes = list.map(capNote);
      const shared = list.length > 1 && notes.every((x) => x && x === notes[0]) ? notes[0] : '';
      const body = `<ul>${list.map((c, i) => line(c, shared ? '' : notes[i])).join('')}</ul>`;
      return `<div class="abil-${g}"><h3>${groupTitle(g)}${shared ? `<small class="cap-note">${shared}</small>` : ''}</h3>${body}</div>`;
    };
    return `<div class="abil"><h2 class="vh">What I can do</h2>
      ${STATE_GROUPS.map(([g, states]) => group(g, states)).join('')}
      <p class="abil-foot">Anything that changes data waits for a yes in Teams.</p>

  }

  /* ---------- Settings: the AI model the agents use (ADR 0022) ----------

  const PROVIDERS = {

  /* People and roles. Two roles only. Making someone an Approver needs another Approver to confirm. */

  const approverCount = () => Object.values(S.roles).filter((r) => r.ap).length;
  function peoplePanel() {

      const canConfirm = r.pendingAp && me().ap && S.user !== r.pendingBy && S.user !== u;
      const err = S.roleErr[u];
      return `<li class="person">
        <span class="pav t${p.tone}" aria-hidden="true">${p.name.charAt(0)}</span>
        <div class="person-name"><b>${esc(p.name)}${u === S.user ? ' <span class="tag">You</span>' : ''}</b><span class="small muted">${r.added ? 'Hasn’t signed in yet' : named.length ? `Named as an Approver on ${named.length === 1 ? '1 workflow' : `${named.length} workflows`} ${PLANNED_TAG}` : r.ap ? (shows('namedApprovers') ? 'Not named on any workflow' : 'Can decide on any workflow except their own') : ''}</span></div>
        <div class="roles"><label class="checkrow"><input type="checkbox" data-role="${u}:op"${r.op ? ' checked' : ''}${op ? '' : ' disabled'}${err ? ` aria-describedby="role-err-${u}"` : ''}>Operator<span class="vh">, ${esc(p.name)}</span></label>

    if (UNSAFE.test(text)) return { type: 'refuse' };
    const c = changesFor(id).find((x) => x.re.test(text));
    if (!c) return { type: 'unclear' };
    if (c.team) return { type: 'team', sys: c.team, why: c.why };
    if (c.target) return { type: 'target' };
    const plan = agentNow(id).plan.slice();
    if (c.tool) {
      /* A new tool is the team's decision (I3). Drafting one is the ADR 0037 flow, shown only with Planned features. */
      if (!shows('toolDraft')) return { type: 'newtool', sys: `A new Jira tool: ${TOOLS[c.tool][0]}` };
      if (!toolLive(c.tool)) return { type: 'tool', tool: c.tool };
      const raw = agentNow(id).tools || LIB(id).tools;
      if (raw.includes(c.tool) && plan[c.step] === c.to) return { type: 'same' };
      const from = plan[c.step];
      plan[c.step] = c.to;
      return { type: 'change', plan, changed: c.step, from, effect: c.effect, tools: raw.includes(c.tool) ? null : raw.concat(c.tool), addTool: raw.includes(c.tool) ? null : c.tool };
    }
    if (c.add) {
      if (plan.includes(c.add)) return { type: 'same' };
      const at = /approval gate|wait for a yes|needs 2 Approvers/.test(plan[plan.length - 1]) ? plan.length - 1 : plan.length;
      plan.splice(at, 0, c.add);
      return { type: 'change', plan, changed: at, added: true, effect: c.effect };
    }
    if (plan[c.step] === c.to) return { type: 'same' };
    const from = plan[c.step];
    plan[c.step] = c.to;
    return { type: 'change', plan, changed: c.step, from, effect: c.effect };
  }

  function toolsList(keys) {
    return `<ul class="tool-list">${keys.map((k) => { const [n, kind] = TOOLS[k]; return `<li><span class="tag ${kind}">${kind === 'read' ? 'Reads' : 'Changes data'}</span><button class="linkbtn" data-act="toolOpen" data-arg="${k}">${n}</button></li>`; }).join('')}</ul>`;
  }
  const toolKeysOf = (id) => (agentNow(id).tools || LIB(id).tools).filter(toolLive);
  const agentTools = (a) => toolKeysOf(a.id).map((t) => TOOLS[t]);
  const agentUsedBy = (id) => routineIds().filter((w) => (R(w).agents || []).includes(id));
  /* A link to a workflow from an agent or a tool. A Planned sample workflow carries its tag wherever it is named. */
  const wfLink = (w) => `<button class="linkbtn" data-act="agentWorkflow" data-arg="${w}">${esc(R(w).name)}</button>${BASE[w] && BASE[w].planned ? ` ${PLANNED_TAG}` : ''}`;
  const usedByText = (a) => (a.id === 'lead' ? 'Plans every workflow.' : a.id === 'trouble' ? 'Steps in whenever a run stops.'

  const versionText = (id) => { const n = agentNow(id); return n.v > 1 ? `Version ${n.v}, changed by ${n.by} ${n.when.toLowerCase()}` : `Version 1. ${LIB(id).made || 'Ships with the platform'}`; };

  const visibleAgents = () => LIBRARY.filter((a) => (!a.planned || shows(a.planned)) && (!a.drafted || savedAgents().includes(a.id)));
  /* The agents that use one capability: the agents whose tools carry it. Summing up needs no tool, so it is named by hand. */
  const capUsers = (id) => (id === 'summarise' ? ['summary', 'wow'] : visibleAgents().filter((a) => (agentNow(a.id).tools || a.tools).some((t) => CAPS[id].tools.includes(t))).map((a) => a.id)).filter((a) => visibleAgents().some((v) => v.id === a));
  /* What it can do (spec 12): the registry in plain words, grouped by state, each line naming the agents that use it. */
  function capabilitiesTab() {
    const caps = Object.keys(CAPS).filter((id) => CAPS[id].focus).map((id) => ({ id, st: capState(id) }));

      const cp = CAPS[c.id];

  const oneLine = (a) => a.what.split(/(?<=\.)\s/)[0];
  function libraryView() {

  /* Nobody is named yet as the reader of team requests (ADR 0038, proposed), so the confirmation claims no delivery. */
  const TEAM_SAVED = 'Saved as a request for the team. You can follow it on Tools, under How it works in Settings.';
  function toolLog(k) {
    if (S.firstDay) return [];

  /* Asking for a tool in plain English. The Planner checks the tools you have first. A new tool on a system that's

    { re: /github|bug report|issue/i, exists: (t) => (/release|version/i.test(t) ? 'ghReleases' : 'ghIssues') },

          : `${r.sys} isn’t connected to the platform yet. A new system is a new outside service, so the team decides on it first. ${sentToTeam(r.sys) ? 'You’ve already sent this to the team.' : 'I can send your request to the team.'}`,

  /* One tool, in a dialog: what it does and can't do, whether it's working, which agents use it, and what it did. */

        <section><h3>What it can’t do</h3><ul class="checks cant">${i.cant.map((c) => `<li>${I.x(14)}<span>${c}</span></li>`).join('')}</ul></section>
      </div>
      <section><h3>Agents that use it</h3>${users.length ? `<div class="agent-chips">${users.map((a) => `<button class="agent-chip" data-act="agent" data-arg="${a.id}">${face(a.id, 32)}<span>${AGENTS[a.id].name}</span></button>`).join('')}</div>${wfs.length ? `<p class="small muted">Used in ${wfs.map(wfLink).join(', ')}.</p>` : ''}` : '<p class="small muted">No agent uses it yet.</p>'}${give}</section>
      <section><h3>${kind === 'write' ? 'Recent changes, and who said yes' : 'Recent use'}</h3>${log.length ? `<ol class="timeline">${log.map(([w, t]) => `<li><b>${w}</b><span>${t}</span></li>`).join('')}</ol>` : '<p class="small muted">Not used yet.</p>'}</section>
      <p class="small muted">${i.origin ? i.origin() : 'Ships with the platform. The team built and tested it.'}</p>
    </div>`;
  }

  /* One agent, in a dialog: how it works, its limits, where it's used, and a plain-English way to change it. */
  function agentDialog(id) {
    const a = LIB(id);
    const now = agentNow(id);
    const vs = agentVersions(id);
    const d = S.agentDraft && S.agentDraft.id === id ? S.agentDraft : { text: '', result: null };
    const r = d.result;
    const name = AGENTS[id].name;
    const used = agentUsedBy(id);
    const say = (html) => `<div class="bubble small-bubble">${face('lead', 40)}<p><span class="vh">Planner: </span>${html}</p></div>`;
    let result = '';
    if (r && r.type === 'change') {
      result = `<div class="proposal" id="agent-proposal" tabindex="-1" data-pres="prop:${id}:${keyOf(d.text)}:${r.type}">
        ${say(`Here’s the exact difference for the ${name}. The old step is crossed out and the new one is marked.`)}
        <ol class="plan">${r.plan.map((step, i) => (i !== r.changed ? `<li>${step}</li>` : r.added ? `<li class="chg"><span class="chip-new">New</span> <ins>${step}</ins></li>` : `<li class="chg"><del>${r.from}</del><ins>${step}</ins></li>`)).join('')}</ol>
        <ul class="checks"><li>${I.check(16)}<span>${r.addTool ? `Adds one tool from the tool list: <b>${TOOLS[r.addTool][0]}</b>. It still waits for a yes, every time` : 'Uses only the tools already on its card'}</span></li><li>${I.check(16)}<span>Doesn’t change what needs a yes, or who approves</span></li><li>${I.check(16)}<span>Doesn’t reach anything it couldn’t reach before</span></li></ul>
        ${S.firstDay ? '' : `<p><b>On its last run:</b> ${r.effect}</p>`}
        <p class="small muted">${used.length ? `${used.length === 1 ? '1 workflow uses' : `${used.length} workflows use`} this agent. Their next runs use version ${now.v + 1}. A run that’s already going keeps the version it started with.` : 'No workflow uses this agent yet.'}</p>
        <div class="btns"><button class="btn primary" data-act="agentSave">Save as version ${now.v + 1}</button><button class="btn" data-act="agentDiscard">Discard</button></div>
      </div>`;
    } else if (r) {
      const msg = {
        refuse: 'I can’t make that change. Anything that changes data always waits for a yes. That’s a platform rule, so no agent or workflow can change it.',
        tool: r.tool ? `${toolState(r.tool) === 'asked' ? `That needs a new tool, <b>${TOOLS[r.tool][0]}</b>, and it’s waiting for an Approver’s OK. Ask me again once it’s OK’d.`
          : `The ${name}’s tools can’t set a component today. I can draft a new tool from Jira’s published API: <b>${TOOLS[r.tool][0]}</b>. It changes data, so an Approver who isn’t you must OK it once.`} ${PLANNED_TAG}` : '',
        newtool: `The ${name}’s tools can’t do that today. ${NEW_TOOL} ${sentToTeam(r.sys) ? 'You’ve already asked the team. You can follow it on Tools.' : 'I can pass your request to the team.'}`,
        team: r.sys ? `${r.why} ${sentToTeam(r.sys) ? 'You’ve already sent this to the team. You can follow it on Tools.' : 'I can send your request to the team.'}` : '',
        target: `The Jira project comes from each workflow, not from the agent. That keeps every agent to the place its workflow names. To read OPS, change the project on that workflow, or set up a workflow for OPS.`,
        unclear: `I couldn’t turn that into a safe change. Say what the ${name} should do differently, for example: “${(agentChips(id)[0] || { ex: '' }).ex}”.`,
        same: `That’s already how the ${name} works.`,
      }[r.type];
      const next = r.type === 'tool' ? `<button class="btn" data-act="toolDraft" data-arg="${r.tool}">${toolState(r.tool) === 'asked' ? 'See the tool request' : 'Draft the tool'}</button>`
        : r.type === 'newtool' && !sentToTeam(r.sys) ? `<button class="btn" data-act="teamReq" data-arg="${esc(r.sys)}|${id}">Ask the team</button>`
          : r.type === 'team' && !sentToTeam(r.sys) ? `<button class="btn" data-act="teamReq" data-arg="${r.sys}|${id}">Send to the team</button>` : '';
      result = `<div class="proposal" id="agent-proposal" tabindex="-1" data-pres="prop:${id}:${keyOf(d.text)}:${r.type}">${say(msg)}${next ? `<div class="btns">${next}</div>` : ''}</div>`;
    }
    const change = canChangeAgent(id) ? `<section class="agent-change" data-unbuilt="Changing an agent (read only in the Portal)"><h3>Change how it works ${PLANNED_TAG}</h3>
        <p class="small muted">Say what should be different, in plain English. The Planner redrafts the agent, the platform checks the draft, and you decide whether to save it.</p>
        <div class="field"><label class="vh" for="agent-text">What should change?</label><textarea id="agent-text" data-agent="text" rows="2" placeholder="For example: ${esc((agentChips(id)[0] || { ex: '' }).ex)}"${fieldAttrs('agent-text', d.err)}>${esc(d.text)}</textarea>${fieldNotes('agent-text', d.err)}</div>
        <div class="chips">${agentChips(id).map((c) => `<button class="chip" data-act="agentChip" data-arg="${esc(c.ex)}">${c.ex}</button>`).join('')}</div>
        <div class="btns"><button class="btn primary" data-act="agentSuggest">Suggest a change</button></div>
        ${result}
      </section>`
      : `<p class="note">${a.platform ? 'This agent is part of the platform, so only the team that runs the platform can change it.' : shows('agentChange') ? 'Only Operators can change agents.' : 'Agents are read only here. Ask the Planner on Home for a workflow that works differently.'}</p>`;
    return `<div class="agent-dlg">${backBtn()}
      <div class="agent-top">${face(id, 56, 'idle', { live: true })}<div><h2 id="dlg-h">${name}${a.planned ? ` ${PLANNED_TAG}` : ''}</h2>${AGENTS[id].role ? `<span class="agent-role">${AGENTS[id].role}</span>` : ''}<span class="small muted">${versionText(id)}</span></div><button class="iconbtn dlg-close" data-act="closeModal" aria-label="Close">${I.x(18)}</button></div>
      <p>${a.what}</p>
      <section><h3>Where it’s used</h3><p class="small">${usedByText(a)}</p><p class="small muted">Last run: ${S.firstDay ? 'Hasn’t run yet.' : a.last}</p></section>
      ${change}
      <details class="tech agent-details"><summary>Details</summary>
        <section><h3>How it works</h3><ol class="plan" data-flip-group="aplan:${id}">${now.plan.map((step) => `<li data-flip="aplan:${id}:${keyOf(step)}">${step}</li>`).join('')}</ol></section>
        <div class="agent-cols">
          <section><h3>Tools it may use</h3>${toolKeysOf(id).length ? toolsList(toolKeysOf(id)) : `<p class="small muted">${a.none}</p>`}</section>
          <section><h3>Permissions and rules</h3><ul class="checks">${agentRules(a).map((x) => `<li>${I.shield(16)}<span>${x}</span></li>`).join('')}</ul></section>
        </div>
        <details class="versions"><summary>Version history (${vs.length})</summary><ol class="timeline">${vs.slice().reverse().map((x) => `<li><b>Version ${x.v}</b><span>${x.when ? `${x.when}, ${x.by}: “${esc(x.text)}”` : esc(x.text)}${x.v !== now.v && canChangeAgent(id) ? ` <button class="linkbtn" data-act="agentRestore" data-arg="${id}:${x.v}">Go back to this version</button>` : ''}</span></li>`).join('')}</ol></details>
      </details>
    </div>`;
  }

  /* ---------- Teams drawer ---------- */
  /* The approval card ADR 0036 describes (spec 14): what needs approval, the workflow and its owner, each change, what
     the agents found, who can decide, and one button that opens the approval page. Nobody approves inside Teams. After
     a decision the card shows the request's state, read from the platform. Teams carries nothing else. */
  /* What each request's card says: when it was posted, what it wants, each change and what the agents found. The
     workflow, its owner, who can decide and who can't come from the request record and partiesOf. */
  const TEAMS_CARD = {
    sw: () => ({ time: 'Mon 9:41', what: 'Keep our software up to date wants to create 3 Jira tickets on the practice Jira',
      changes: [`Upgrade Log4j core to 2.25.2${shows('registries') ? ` (urgent: critical and actively exploited) ${PLANNED_TAG}` : ''}`, 'Upgrade LangGraph to 1.2.17', 'Upgrade FastAPI to 0.120.1'],
      found: shows('registries') ? `Newer versions on the registries and GitHub, and 4 known vulnerabilities in Log4j core 2.14.1. ${PLANNED_TAG}` : 'Newer releases on GitHub for 3 of the 14 projects on the Software watchlist.' }),
    nudge: () => ({ time: `Today ${hm(NOW)}`, what: 'Weekly closed-ticket summary wants to create 1 Jira ticket on the practice Jira', changes: ['Create one ticket in MOCK with the summary of the week of 19 Oct'], found: '11 tickets closed in MOCK in the week of 19 Oct.' }),
    conf: () => ({ time: 'Today 9:10', what: `${esc(S.nr.name)} wants to ${confWrite(S.nr).teamsVerb} on the practice Jira (test run)`, changes: [`Create one ticket in ${S.nr.project} with the ${thingOf(S.nr)}`], found: confPreview(S.nr).replace(/<p class="note">[\s\S]*$/, '').replace(/<\/?div[^>]*>/g, '') }),
    access: () => ({ time: 'Mon 9:30', what: `Quarterly access review wants to ${ACCESS_WRITE.teamsVerb}`, changes: ACCESS_REMOVALS.map((x) => `Remove ${x.replace(/\. .*$/, '')}`), found: '48 people reviewed. Their managers confirmed 45 in Teams. Nobody confirmed these 3.', planned: true }),
  };
  function teamsCard(id) {
    const c = TEAMS_CARD[id]();
    const q = req(id);
    const cant = partiesOf(id).map((u) => `${nm(u)}, who ${partyWhy(id, u)}`);
    return `<b>${c.what}</b>${c.planned ? ` ${PLANNED_TAG}` : ''}<dl class="kv tcard"><dt>Workflow</dt><dd>${esc(R(id).name)}, set up by ${nm(ownerOf(id))}</dd><dt>Changes</dt><dd><ul class="mini-list">${c.changes.map((x) => `<li>${x}</li>`).join('')}</ul></dd><dt>Found</dt><dd>${c.found}</dd><dt>Who can decide</dt><dd>${q ? `${whoOr(q.may)}${q.steps > 1 ? `, as the ${q.step === 0 ? 'first' : 'second'} of 2 Approvers` : ''}` : R(id).approves}</dd><dt>Who can’t</dt><dd>${cant.join('; ')}. Nobody approves their own work.</dd></dl>`;
  }
  const decidedAt = (by) => `${nm(by)} at ${hm(NOW)} today`;
  /* The request's outcome, read from the platform, as the card shows it after a decision. */
  const decidedLine = (rec) => (rec.state === 'approved' ? `Approved by ${rec.yes.map(decidedAt).join(', then ')}` : rec.state === 'declined' ? `Declined by ${decidedAt(rec.by)}` : rec.state === 'expired' ? 'No answer' : null);
  function teamsItems() {
    const list = [];
    const card = (id) => { const rec = reqRecord(id); return { time: TEAMS_CARD[id]().time, id, html: teamsCard(id), decided: decidedLine(rec), decidedTone: rec.state === 'expired' ? 'off' : rec.state === 'declined' ? 'bad' : 'ok' }; };
    if (reqRecord('sw')) {
      const q = req('sw');
      list.push(card('sw'));
      if (q && shows('namedApprovers') && q.backup) list.push({ time: `Mon ${hm(q.backupAt)}`, html: `${nm(q.first)} hasn’t answered yet, so ${nm(q.backup)} is asked as the backup for <b>Keep our software up to date</b>. ${PLANNED_TAG}` });
    }
    if (reqRecord('access')) list.push(card('access'));
    if (reqRecord('nudge')) list.push(card('nudge'));
    if (shows('toolDraft') && ['asked', 'ok'].includes(S.jiraComp)) list.push({ time: 'Today', html: `${nm(S.jiraCompAsker)} asked for a new tool: <b>${TOOLS.jiraComp[0]}</b>. It changes data, so an Approver must OK it once. ${PLANNED_TAG}`, jtool: true, decided: S.jiraComp === 'ok' ? `OK’d by ${nm(S.jiraCompBy)}` : null });
    if (reqRecord('conf')) {
      const q = req('conf');
      list.push(card('conf'));
      if (q && q.escalated) list.push({ time: `Today ${hm(q.backupAt)}`, html: `${q.backup ? `${nm(q.first)} hasn’t answered yet, so ${nm(q.backup)} is asked as the backup.` : `A reminder for ${nm(q.first)}: <b>${esc(S.nr.name)}</b> is still waiting for a yes.`} ${PLANNED_TAG}` });
      if (q && q.expired) list.push({ time: at(q.expiresAt), html: `<b>${esc(S.nr.name)}</b>: nobody answered in time, so the request stopped. Nothing was written. ${PLANNED_TAG}` });
    }
    return list;
  }
  /* The requests in Teams this person can decide: the same records Needs you reads, plus a tool waiting for an OK. */
  const teamsCount = () => mayDecide().length + (shows('toolDraft') && S.jiraComp === 'asked' && canOkTool() && S.user !== S.jiraCompAsker ? 1 : 0);
  function teamsDrawer() {
    if (!S.teams) return '';
    const msgs = teamsItems().map((m) => {
      let actions = '';
      if (m.decided) actions = m.decidedTone === 'off' ? `<span class="pill off">${I.clock(12)}${m.decided}</span>` : m.decidedTone === 'bad' ? `<span class="pill bad">${I.x(12)}${m.decided}</span>` : `<span class="pill ok">${I.check(12)}${m.decided}</span>`;
      else if (m.jtool) actions = '<div class="btns"><button class="btn sm" data-act="toolOpen" data-arg="jiraComp">Open in AI Workflow Builder</button></div>';
      else if (m.id) actions = `<div class="btns"><button class="btn primary sm" data-act="run" data-arg="${m.id}">Open in AI Workflow Builder</button></div>`;
      return `<article class="msg"><span class="sysav app">${I.mark()}</span><div><div class="msg-meta"><b>AI Workflow Builder</b> · ${m.time}</div><div class="msg-card"><div>${m.html}</div><div data-val="tm:${keyOf(m.time + m.html.slice(0, 60))}">${actions}</div></div></div></article>`;
    }).join('');
    return `<div class="scrim${drawerNew ? ' in' : ''}" data-act="teams"></div><div class="drawer" role="dialog" aria-modal="true" aria-label="Teams, practice copy">
      <div class="drawer-head"><div><b>Microsoft Teams</b><small>Practice copy. Nothing reaches the real Teams.</small></div><button class="iconbtn" data-act="teams" aria-label="Close Teams">${I.x(18)}</button></div>
      <div class="chan"># CODESparks Support <span class="muted small">· signed in as ${me().name}</span></div>
      <p class="note" style="padding:10px 18px 0">Teams carries approval requests only. The button opens the approval page, where the decision is made.</p>
      <div class="msgs">${msgs}</div></div>`;
  }

  /* ---------- Dialogs ---------- */
  function reportDialog() {
    return `<h2 id="dlg-h" style="font-size:1.4rem">Report to support</h2>
      <p class="muted">We send this to the support team. You don’t need to add anything.</p>
      <dl class="kv">
        <dt>Problem</dt><dd>Weekly closed-ticket summary stops on a Jira ticket the platform can’t read</dd>
        <dt>Run</dt><dd>Fri 23 Oct, 16:00 · stopped at Read closed tickets</dd>
        <dt>The AI troubleshooter found</dt><dd>Reading MOCK-31 failed. Its description is in a form the platform couldn’t read, and the platform crashed instead of skipping it.</dd>
        <dt>Attached</dt><dd>The run’s full record</dd>
      </dl>
      <div class="field"><label for="extra">Anything to add? <span class="muted">(optional)</span></label><textarea id="extra" data-note rows="3" style="min-height:80px">${esc(S.reportNote)}</textarea><span class="help">Support sees your note with the case.</span></div>
      <div class="btns" style="justify-content:flex-end"><button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" data-act="sendReport">Send report</button></div>`;
  }
  /* Sent. The reference shows at once; the bar and the mark only confirm what the text already says. */
  function reportSentDialog() {
    const c = S.supportCase;
    return `<div class="sent"><span class="sent-mark" data-pres="sentmark:${c.id}">${I.check(28)}</span>
        <h2 id="dlg-h" style="font-size:1.4rem">Reported to support</h2>
        <p class="muted" style="margin:0">Your case reference</p>
        <p class="sent-ref" style="margin:0">${c.id}</p>
        <div class="sent-bar" aria-hidden="true" data-pres="sentbar:${c.id}"><span></span></div>
        <dl class="kv"><dt>Who has it</dt><dd>${c.owner}</dd><dt>First reply by</dt><dd>${c.target}</dd><dt>Updates</dt><dd>Under Following up on Workflows, at each stage.</dd></dl></div>
      <div class="btns" style="justify-content:flex-end"><button class="btn primary" data-act="closeModal">Done</button></div>`;
  }
  function deleteDialog(id) {
    return `<h2 id="dlg-h" style="font-size:1.4rem">Delete ${esc(R(id).name)}?</h2>
      <p id="dlg-d">It stops running and leaves Workflows. Its schedule and settings go with it. Its past runs and their records stay. You can undo this from the message that follows.</p>
      <div class="btns" style="justify-content:flex-end"><button class="btn" data-act="closeModal">Cancel</button><button class="btn bad" data-act="confirmDelete" data-arg="${id}">${I.trash()}Delete workflow</button></div>`;
  }
  /* Open in n8n: staff can change a workflow's steps in n8n. One person has it at a time, every published change is kept, and the rules still hold. */
  function n8nDialog(id) {
    const r = R(id);
    const held = S.n8n[id];
    const other = held && held.by !== S.user;
    const gone = !!S.n8nChg[id];
    const boxes = [`${I.clock(16)}${r.when}`, ...r.agents.filter((a) => a !== 'lead').map((a) => `${face(a, 24)}${AGENTS[a].name}`)];
    /* Each arrow sits inside the step it points to, so a wrapped row never starts or ends on a loose arrow. */
    const writes = planFor(id).filter(([, k]) => k === 'write').map(([t]) => t);
    const two = !!apprOf(id) && apprOf(id).steps.length > 1;
    const pairs = writes.flatMap((t, i) => [
      [`gate${gone && !i ? ' gone' : ''}`, `${I.shield(16)}Ask for a yes${two && i === writes.length - 1 ? ', 2 people in order' : ''}`],
      ['', `${I.check(16)}${writes.length > 1 ? `<span>Make the approved changes<small>${esc(t)}</small></span>` : 'Make the approved changes'}`],
    ]);
    const canvas = [...boxes.map((b) => ['', b]), ...pairs]
      .map(([cls, b], i) => `<li>${i ? `<span class="n8n-arrow" aria-hidden="true">${I.right(14)}</span>` : ''}<span class="n8n-node${cls ? ` ${cls}` : ''}">${b}</span></li>`).join('');
    return `<h2 id="dlg-h" style="font-size:1.4rem">Open “${esc(r.name)}” in n8n</h2>
      <p class="muted">In n8n you can change its schedule, its conditions and the order of its steps, using our blocks. n8n’s own Jira, web and code steps aren’t there. This is how it looks there.</p>
      <ol class="n8n-canvas" aria-label="Steps in n8n">${canvas}</ol>
      <ul class="n8n-promises">
        <li>${I.lock(16)}<span>${other ? `${nm(held.by)} has it now. If you take it, ${nm(held.by)} can’t change it in n8n any more. Changes already published stay.` : 'While you have it, only you can change it in n8n.'}</span></li>
        <li>${I.clock(16)}<span>A change goes live when you publish it in n8n. Every published change is kept here, and you can undo it.</span></li>
        <li>${I.shield(16)}<span>Nothing is written without a yes, whatever you change. If <b>Ask for a yes</b> goes missing, the next run stops before it changes anything.</span></li>
        <li>${I.alert(16)}<span>Trying it in n8n is a real run. Approvers get a real request in Teams.</span></li>
      </ul>
      <div class="btns" style="justify-content:flex-end"><button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" data-act="n8nOpen" data-arg="${id}">${other ? 'Take it and open n8n' : 'Open n8n'}${I.ext(14)}</button></div>`;
  }
  function n8nNewDialog() {
    return `<h2 id="dlg-h" style="font-size:1.4rem">Start a workflow in n8n</h2>
      <p class="muted">You build it yourself in n8n, from our blocks and n8n’s steps. The Planner doesn’t draft it, so there’s no set-up card to check.</p>
      <ul class="n8n-promises">
        <li>${I.check(16)}<span>When you publish it, it appears on Workflows, marked <b>Made in n8n</b>.</span></li>
        <li>${I.lock(16)}<span>Until you name Approvers for it here, any Approver on the team can answer its requests.</span></li>
        <li>${I.shield(16)}<span>Nothing is written without a yes.</span></li>
      </ul>
      <div class="btns" style="justify-content:flex-end"><button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" data-act="n8nNewOpen">Open n8n${I.ext(14)}</button></div>`;
  }
  function ticketDialog(key) {
    const x = releases().find((r) => r.key === key);
    return `<h2 id="dlg-h" style="font-size:1.3rem">${key}: Upgrade ${x.tool} from ${x.from} to ${x.to}</h2>
      <p class="muted">Practice Jira project MOCK. Created by the platform after ${nm(S.swBy)} approved this week’s check.</p>
      <dl class="kv"><dt>Status</dt><dd>To Do</dd><dt>Created</dt><dd>Mon 26 Oct</dd><dt>Source</dt><dd>${srcName(x.kind || 'github')} · ${srcLink(x.kind, x.repo, x.repo)}</dd>${x.cve ? `<dt>Priority</dt><dd>Urgent. ${nvdLink(x.cve)} is rated critical, and CISA lists it as actively exploited.</dd>` : ''}</dl>
      <div class="preview">${x.tool} has ${x.count} releases on ${srcName(x.kind || 'github')} newer than our version ${x.from}. Newest: ${x.to}, released ${x.date}. ${x.notes}</div>
      <p class="note">When this ticket is marked Done in Jira, our version of ${x.tool} changes to ${x.to} by itself.</p>
      <div class="btns" style="justify-content:flex-end"><button class="btn" data-act="watchFromTicket">Watch the run that made it</button><button class="btn primary" data-act="closeModal">Close</button></div>`;
  }
  function modal() {
    if (!S.modal) return '';
    const body = S.modal === 'report' ? reportDialog() : S.modal === 'reportSent' ? reportSentDialog() : S.modal === 'n8n' ? n8nDialog(S.modalArg) : S.modal === 'n8nNew' ? n8nNewDialog() : S.modal === 'delete' ? deleteDialog(S.modalArg) : S.modal === 'agent' ? agentDialog(S.modalArg) : S.modal === 'tool' ? toolDialog(S.modalArg) : ticketDialog(S.modalArg);
    return `<div class="scrim${scrimIn ? ' in' : ''}" data-act="closeModal"></div><div class="dialog${['agent', 'tool', 'n8n'].includes(S.modal) ? ' wide' : ''}${dlgIn ? ' in' : ''}${dlgSwap ? ' swap' : ''}" role="${S.modal === 'delete' ? 'alertdialog' : 'dialog'}" aria-modal="true" aria-labelledby="dlg-h"${S.modal === 'delete' ? ' aria-describedby="dlg-d"' : ''}>${body}</div>`;
  }

  /* ---------- Test controls: not part of the product ---------- */
  function testControls() {
    const sims = [];

  document.addEventListener('visibilitychange', () => document.documentElement.classList.toggle('tab-hidden', document.hidden));

  let toastTimer = null;

  /* A toast stays long enough to read. One with Undo has no time limit: it stays until the next toast, leaving the page, or Escape. */
  const readMs = (text) => Math.min(10000, 2000 + String(text).replace(/<[^>]+>/g, '').length * 45);
  /* A named region, so the message sits in a landmark. It is announced through $live, which outlives the redraws. */
  const toastMarkup = (isNew) => (S.toast ? `<div class="toast${isNew ? ' in' : ''}" role="region" aria-label="Message">${S.toast}${S.toastAct ? `<button class="toast-act" data-act="${S.toastAct.act}" data-arg="${S.toastAct.arg}">${S.toastAct.label}</button>` : ''}</div>` : '');

  function hideToast() {
    S.toast = null;

    if (t) { t.classList.remove('in'); t.classList.add('leave'); t.setAttribute('aria-hidden', 'true'); t.inert = true; const gone = () => t.remove(); t.addEventListener('animationend', gone, { once: true }); setTimeout(gone, 400); }

  /* o.live plays a run from its start, for a run just started or Watch. o.back comes from browser Back or Forward. */
  function go(name, id, o = {}) {

  /* One yes, from the person reading or from someone the test controls act for. */

    n8nNew: () => openModal('n8nNew', null, '.btn.primary'),
    n8nNewOpen: () => { closeModal(); toast('Opened n8n in a new tab, with a new, empty workflow in your space.'); render(); },
    n8nUndo: (id) => { const c = S.n8nChg[id]; if (!c) return; delete S.n8nChg[id]; n8nLog(id, 'Today', `${me().name} undid ${nm(c.by)}’s change. The version before it is live again.`); toast(`Undone. The version before ${nm(c.by)}’s change is live again.`); render(); },
    /* The More actions menu on a workflow page. Picking an item closes it and hands focus back to the menu button
       first, so a dialog the item opens returns there when it closes. */
    menu: (id) => { S.menu = S.menu === id ? null : id; render(); const el = $app.querySelector(S.menu ? '.menu [role="menuitem"]' : `[data-act="menu"][data-arg="${id}"]`); if (el) el.focus(); },
    menuClose: () => { if (!S.menu) return; const id = S.menu; S.menu = null; render(); const b = $app.querySelector(`[data-act="menu"][data-arg="${id}"]`); if (b) b.focus(); },
    menuPick: (arg) => { const at = arg.indexOf(':'); const act = arg.slice(0, at); const id = arg.slice(at + 1); S.menu = null; const b = $app.querySelector(`[data-act="menu"][data-arg="${id}"]`); if (b) b.focus(); A[act](id); },
    /* Run now does what the prototype can show for this workflow, and says so when it can't. */
    runNow: (id) => {
      if (id === 'sw') { A.checkNow(); return; }
      if (waitingReq(id)) { toast('This run is still waiting for a yes. Decide on it first.'); render(); return; }
      if (runBlocked(id)) return;
      if (id === 'issues' && S.issues === 'failed') { A.retryIssues(); return; }
      if (id === 'nudge' && S.nudge === 'failed') { if (S.report === 4) A.retryNudge(); else { toast('It would stop in the same place until support fixes the platform. Report it first.'); render(); } return; }
      if (id === 'conf') { A.testRun(); return; }
      /* Starting the access review by hand makes the starter a party to it, so they can't approve its removals. */
      if (id === 'access') { S.access = 'waiting'; S.accessYes = []; S.accessBy = null; S.accessRun = { by: S.user, sub: 'Today, 9:10' }; }
      toast(`Started. ${esc(R(id).name)} asks for a yes before it writes anything.`);
      go('run', id, { live: true });
    },
    pause: (id) => { S.paused[id] = true; toast(`Paused. ${esc(R(id).name)} won’t run until you resume it.`); render(); },
    resume: (id) => { delete S.paused[id]; toast(`Resumed. Next run ${R(id).next}.`); render(); },
    askDelete: (id) => openModal('delete', id, '[data-act="closeModal"].btn'),
    confirmDelete: (id) => {
      const name = R(id).name;
      S.deleted[id] = true;
      S.modal = null;
      toast(`Deleted ${esc(name)}.`, { label: 'Undo', act: 'undoDelete', arg: id });
      go('workflows');
    },
    undoDelete: (id) => { delete S.deleted[id]; toast('Put back.'); render(); },
    filter: (k) => { S.filter = k; render(); },
    findOpen: () => { S.findOpen = !S.findOpen; if (!S.findOpen) { S.find.workflows = ''; S.filter = 'all'; } render(); const el = $app.querySelector(S.findOpen ? '#find-workflows' : '[data-act="findOpen"]'); if (el) el.focus(); },
    clearFind: (k) => { S.find[k] = ''; if (k === 'workflows') S.filter = 'all'; render(); const i = $app.querySelector(`#find-${k}`); if (i) i.focus(); },
    focusAdd: () => { const i = $app.querySelector('#sw-name'); if (i) { i.scrollIntoView({ block: 'center' }); i.focus({ preventScroll: true }); } },
    testToggle: () => { S.testOpen = !S.testOpen; testNew = S.testOpen; render(); const t = $app.querySelector('.testctl-toggle'); if (t) t.focus(); },
    day: (d) => { S.firstDay = d === 'one'; S.conns = connsFor(S.firstDay); if (['workflow', 'run'].includes(S.view.name)) go('home'); else render(); },
    user: (u) => { S.user = u; S.panel = null; if (!mayOpen(S.view.name)) S.view = { name: 'home' }; render(); },
    /* The spec 16 controls. Planned features hidden means nothing planned shows, so a page about one goes back to its list. */
    modelOn: (v) => { S.modelOn = v === 'on'; render(); },
    preview: (v) => { S.preview = v === 'on'; if (!S.preview && ['workflow', 'run'].includes(S.view.name) && !has(S.view.id)) go('workflows'); else render(); },
    markUnbuilt: (v) => { S.markUnbuilt = v === 'on'; render(); },
    jiraDown: () => { S.conns.jira.down = true; toast('Jira stopped answering. Everything that reads or writes Jira waits until it’s back.'); render(); },
    jiraUp: () => { S.conns.jira.down = false; toast('Jira is answering again.'); render(); },
    reset: () => { stopTimer(); clearTimeout(toastTimer); P.run = null; const keep = { firstDay: S.firstDay, preview: S.preview, markUnbuilt: S.markUnbuilt, modelOn: S.modelOn }; S = fresh(); Object.assign(S, keep); S.conns = connsFor(S.firstDay); S.testOpen = true; focusHeading = true; render(); },
    toast: (t) => { toast(t); render(); },
  };

  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-act]');
    if (!t) return;
    if (e.detail > 1 && t.classList.contains('scrim')) return;
    if (t.getAttribute('aria-disabled') === 'true') { e.preventDefault(); return; }
    const fromChat = !!t.closest('.thread, .pinned');
    const item = fromChat ? itemOf(t.dataset.act, t.dataset.arg, t) : null;
    if (item) { e.preventDefault(); A.panelOpen(item, t); return; }
    if (fromChat && t.dataset.act === 'setGo') { e.preventDefault(); S.setTab = t.dataset.arg; go('settings', undefined, { fromChat: true }); return; }
    if (fromChat && (t.dataset.act === 'workflow' || (t.dataset.act === 'go' && t.dataset.arg !== 'home'))) { e.preventDefault(); go(t.dataset.act === 'workflow' ? 'software' : t.dataset.arg, undefined, { fromChat: true }); return; }
    const fn = A[t.dataset.act];
    viaPanel = !!t.closest('.sidepanel');
    if (fn) { e.preventDefault(); fn(t.dataset.arg, t.dataset.mid ? msgById(t.dataset.mid) : undefined); }
    viaPanel = false;
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { if (S.modal) closeModal(); else if (S.teams) A.teams(); else if (S.menu) A.menuClose(); else if (S.panel && chatMode()) A.panelClose(); else if (S.toast) hideToast(); else if (S.testOpen) A.testToggle(); return; }
    if (S.menu && ['ArrowDown', 'ArrowUp', 'Home', 'End'].includes(e.key) && e.target.closest('.menu')) {
      e.preventDefault();
      const items = [...$app.querySelectorAll('.menu [role="menuitem"]')];
      const at = items.indexOf(e.target);
      const to = e.key === 'Home' ? 0 : e.key === 'End' ? items.length - 1 : (at + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
      items[to].focus();
      return;
    }
    /* Enter sends to the Planner; Shift+Enter makes a new line. Enter in a card's text field presses its button. */
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.target.matches('[data-ask]')) { e.preventDefault(); A.ask(); return; }
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.target.matches('[data-askteam]')) { e.preventDefault(); A.askTeamOffline(); return; }
    if (e.key === 'Enter' && e.target.matches('input[data-input="name"]')) { e.preventDefault(); A.renameDone(); return; }
    if (e.key === 'Enter' && e.target.matches('input[data-card="repoDraft"]')) { e.preventDefault(); const b = $app.querySelector(`[data-act="repoUse"][data-mid="${e.target.dataset.mid}"]`); if (b) b.click(); return; }
    // Keep Tab inside an open dialog.
    if (e.key === 'Tab' && (S.modal || S.teams || (S.panel && chatMode() && narrow()))) {
      const box = $app.querySelector(S.modal ? '.dialog:not(.leave)' : S.teams ? '.drawer:not(.leave)' : '.sidepanel');
      const items = box ? [...box.querySelectorAll('button, [href], input, textarea, select, summary')].filter((x) => !x.disabled && shown(x)) : [];
      if (items.length) {
        const first = items[0];
        const last = items[items.length - 1];
        if (!box.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
        else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    }
  });
  /* A press anywhere outside the More actions menu closes it. */
  document.addEventListener('pointerdown', (e) => { if (S.menu && !(e.target instanceof Element && e.target.closest('.menuwrap'))) { S.menu = null; render(); } }, true);
  let findTimer = null;
  let findRender = null;
  let cardRender = null;
  document.addEventListener('input', (e) => {
    const d = e.target.dataset;
    if (d.ask !== undefined) {
      const ta = e.target;
      S.chat.text = ta.value;
      ta.style.height = 'auto';
      ta.style.height = `${Math.min(ta.scrollHeight, 160)}px`;
      dockVar();
      ta.closest('form').querySelector('.send').disabled = !ta.value.trim();
      listen(ta);
      return;
    }
    if (d.card) {
      const m = msgById(d.mid);
      m.card[d.card] = e.target.value;
      if (d.card === 'repoDraft') m.card.repoErr = '';
      clearTimeout(cardRender);
      cardRender = setTimeout(render, 250);
      return;
    }
    if (d.askteam !== undefined) { S.teamAskText = e.target.value; return; }
    if (d.note !== undefined) { S.reportNote = e.target.value; return; }
    if (d.sw) { S.swForm[d.sw] = e.target.value; return; }
    if (d.agent) { S.agentDraft.text = e.target.value; return; }
    if (d.toolask) { S.toolAsk.text = e.target.value; return; }
    if (d.mf && e.target.tagName !== 'SELECT') { S.modelForm[d.mf] = e.target.value; return; }
    if (d.ck) { S.connForm.key = e.target.value; return; }
    if (d.np === 'name' || d.np === 'email') { S.newPerson[d.np] = e.target.value; return; }
    if (d.limit) { S.limitForm.value = e.target.value; return; }
    if (d.find) {
      S.find[d.find] = e.target.value;
      clearTimeout(findRender);
      findRender = setTimeout(render, 250);
      clearTimeout(findTimer);
      findTimer = setTimeout(() => {
        const main = $app.querySelector('main');
        const n = d.find === 'workflows' ? new Set([...main.querySelectorAll('[data-act="workflow"]')].map((x) => x.dataset.arg)).size : main.querySelectorAll('tr[data-flip^="sw:"]').length;
        announce(n ? `${n} ${d.find === 'workflows' ? (n === 1 ? 'workflow' : 'workflows') : 'found'}` : 'Nothing matches');
      }, 600);
      return;
    }
    if (d.sched && e.target.type === 'time') { S.wiz.sched.time = e.target.value; S.wiz.whenOpen = true; return; }
    if (d.sf && e.target.type === 'time') { S.schedForm.time = e.target.value; return; }
    if (d.input) S.wiz[d.input] = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
  });
  document.addEventListener('submit', (e) => {
    e.preventDefault();
    if (e.submitter && e.submitter.getAttribute('aria-disabled') === 'true') return;
    const a = e.target.dataset.submit;
    if (a && A[a]) A[a]();
  });
  document.addEventListener('change', (e) => {
    const d = e.target.dataset;
    if (d.fix === 'tickets' && e.target.value) { pickTickets(e.target.value); render(); return; }
    if (d.fix) { if (e.target.value) S.wiz.edits[d.fix] = e.target.value; else delete S.wiz.edits[d.fix]; render(); return; }
    if (d.sched) { S.wiz.sched[d.sched] = e.target.value; S.wiz.whenOpen = true; if (S.wiz.schedErr[d.sched]) delete S.wiz.schedErr[d.sched]; render(); return; }
    if (d.sf) { S.schedForm[d.sf] = e.target.value; if (S.schedErr[d.sf]) delete S.schedErr[d.sf]; render(); return; }
    if (d.sw === 'kind') { S.swForm.kind = e.target.value; delete S.swErr.repo; render(); return; }
    if (d.sw === 'pick') { S.swForm.pick = +e.target.value; render(); const r = $app.querySelector('input[name="sw-pick"]:checked'); if (r) r.focus(); return; }
    if (d.mf === 'provider') { const key = S.modelForm.key; S.modelForm = { ...freshModelForm(e.target.value), key }; render(); const el = document.getElementById('mf-provider'); if (el) el.focus(); return; }
    if (d.mf === 'model') { S.modelForm.model = e.target.value; return; }
    if (d.role) { A.roleToggle(d.role, e.target.checked); return; }
    if (d.np === 'op' || d.np === 'ap') { S.newPerson[d.np] = e.target.checked; return; }
    if (d.af) {
      const a = S.apprForm;
      const errs = S.apprErr;
      const [key, i] = d.af.split(':');
      if (i === undefined) a[key] = +e.target.value;
      else a.steps[+i][key] = e.target.value;
      cleanAppr(a);
      delete errs[i === undefined ? key : `${key}-${i}`];
      if (key === 'after' || key === 'expire') delete errs.after;
      render();
    }
  });

  render();
  /* For the check script only: the refusal rule and the plan-step renderer, called through page.evaluate. */
  window.mock = { UNSAFE, stepsList };
})();
</script>
