<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Workflow Builder Prototype</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-17 -63.5 270 270'%3E%3Crect x='-17' y='-63.5' width='270' height='270' rx='60' fill='%23fff'/%3E%3Cpath d='M30 57C34.5 75.5 34.5 75.5 53 80C34.5 84.5 34.5 84.5 30 103C25.5 84.5 25.5 84.5 7 80C25.5 75.5 25.5 75.5 30 57Z' fill='%23121417'/%3E%3Cg fill='%2302a7e1' stroke='%2302a7e1' stroke-width='6' stroke-linejoin='round'%3E%3Cpolygon points='52,58 94,58 116.6,89.4 94.4,121.6'/%3E%3Cpolygon points='132.6,140 117.6,97.5 182.7,3.5 226.8,3.5'/%3E%3C/g%3E%3C/svg%3E">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* v3 look, "framed sheet": the Taste skill's app-screen rules, Emil Kowalski's motion rules and ibelick's UI Skills baseline, on the real Portal's typeface.
   Light only, on purpose: the page stays light whatever the viewer's theme. Running text is at least 4.5:1, secondary text about 7:1.
   The header and a thin frame share one blue-grey; the work sits on a white sheet. Teal is the one accent: the current tab, links and data.
   Colour goes on status and data, never on chrome. Cards are flat (a 1px edge, no shadow); only what floats casts a shadow. */
:root {
  color-scheme: light;
  --frame: #eef1f4;
  --bg: #ffffff;
  --surface: #ffffff;
  --sunk: #f3f5f7;
  --active: #e7ebef;
  --ink: #121417;
  --on-ink: #ffffff;
  --primary: #121417;
  --primary-hover: #2e3238;
  --muted: #4d535b;
  --rail: #c5cbd2;
  --edge: #7d858e;  /* edges a person must see, such as form fields: 3:1 or more on white and grey */
  --hair: #e1e5e9;
  --rule: #eaedf0;
  --link: #1b6c80;
  --accent: #1b6c80;
  --accent-soft: #e2f0f3;
  --accent-ink: #0f4a59;
  --nav-mark: #1b6c80;
  --brand: #02a7e1; /* NCS blue, for the logo only */
  --info-bg: #e9f3f5;
  --info-ink: #0f4a59;
  --float: 0 1px 2px rgba(18, 20, 23, 0.06), 0 12px 32px rgba(18, 20, 23, 0.14);
  --focus: #2f6bff;
  --amber: #e89a0c;
  --amber-ink: #7e4a00;
  --amber-soft: #fff6e0;
  --amber-line: #efd08c;
  --red: #c4242a;
  --red-ink: #a51f1f;
  --red-soft: #fdeeed;
  --red-line: #f2c4c1;
  --green: #1d7a42;
  --green-ink: #1b6b3b;
  --green-soft: #e6f4eb;
  --green-line: #b2dbbf;
  --on-status: #ffffff;
  --lead: #3e5bd8;
  --lead-tint: #dfe5ff;
  --checker: #0a7068;
  --checker-tint: #d3f0ec;
  --trouble: #7a4bd6;
  --trouble-tint: #ece3ff;
  --agent-1: #b02a6b;
  --agent-1-tint: #fbe3ee;
  --agent-2: #1f6f9f;
  --agent-2-tint: #ddeffb;
  --agent-3: #526d10;
  --agent-3-tint: #ebf2d3;
  --agent-4: #b2520a;
  --agent-4-tint: #ffe7d3;
  --face-ink: #16233a;
  --face-lens: rgba(255, 255, 255, 0.55);
  --person-1-bg: #ffe0cc;
  --person-1-ink: #7a3410;
  --person-2-bg: #d7e3ff;
  --person-2-ink: #1e3b8a;
  --person-3-bg: #d8efdf;
  --person-3-ink: #1d5a33;
  --person-4-bg: #f9dde8;
  --person-4-ink: #7a1f45;
  --mock-bg: #2a2140;
  --mock-ink: #f3efff;
  --mock-dim: #b9addb;
  --mock-on: #f3efff;
  --mock-on-ink: #2a2140;
  --scrim: rgba(15, 20, 28, 0.4);

  /* Radius is tight and chosen once: cards 8, controls and wells 6, the sheet 16. */
  --r-card: 8px;
  --r-ctl: 6px;
  --r-well: 6px;
  --r-sheet: 16px;

  /* One stacking scale; nothing uses a z-index outside it. */
  --z-raised: 1;
  --z-nav: 20;
  --z-safe-area: 30;
  --z-mock: 35;
  --z-scrim: 40;
  --z-overlay: 41;
  --z-toast: 45;

  --font: 'Atkinson Hyperlegible Next', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  /* Emil Kowalski's curves: a strong ease-out for anything entering or answering a press, ease-in-out for things moving on screen. */
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
  --ease-move: var(--ease-in-out);
  /* Motion durations. Every animation and transition uses one of these. */
  --dur-press: 120ms;   /* a control answers a press, hover or focus */
  --dur-small: 200ms;   /* something small appears, moves or changes */
  --dur-panel: 260ms;   /* a dialog, drawer or section opens */
  --dur-attn: 380ms;    /* something needs a look: a new error, a request waiting */
  --dur-success: 560ms; /* a one-off positive reaction, never longer than 600ms */
  --stagger: 40ms;      /* gap between cards arriving on a new screen */
  --move: var(--dur-panel); /* the run line travelling to the next step */
}
* { box-sizing: border-box; }
/* Keeps focused and scrolled-to things clear of the sticky header, and of the tab bar on a phone. */
html { scroll-padding-top: 84px; }
@media (max-width: 900px) { html { scroll-padding-top: 76px; scroll-padding-bottom: 84px; } }
body {
  margin: 0; background: var(--frame); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.5;
  font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: var(--z-safe-area); background: var(--frame); }
h1, h2, h3, p, ul, ol, dl, dd { margin: 0; }
h1, h2, h3 { font-weight: 700; line-height: 1.2; text-wrap: balance; }
p, li, dd { text-wrap: pretty; }
h1 { font-size: 1.75rem; letter-spacing: -0.015em; }
h2 { font-size: 1.125rem; }
h3 { font-size: 1rem; }
ul, ol { padding: 0; list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.skiplink { position: fixed; left: 16px; top: -80px; z-index: var(--z-toast); padding: 10px 16px; border: 0; border-radius: var(--r-ctl); background: var(--primary); color: var(--on-ink); font: inherit; font-weight: 700; cursor: pointer; }
.skiplink:focus { top: 12px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Header: part of the frame. No rule under it in the sheet look; the sheet's own edge does that job. */
.hdr { position: sticky; top: env(safe-area-inset-top, 0px); z-index: var(--z-nav); background: var(--frame); border-bottom: 1px solid transparent; }
.hdr-in {
  max-width: 1198px; margin: 0 auto; min-height: 60px; display: flex; align-items: center; gap: 8px 24px; flex-wrap: wrap;
  padding-left: max(25px, env(safe-area-inset-left, 0px)); padding-right: max(25px, env(safe-area-inset-right, 0px));
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 1.125rem; background: none; border: 0; padding: 6px 0; cursor: pointer; }
.nav { display: flex; gap: 2px; align-items: center; }
.nav-a {
  position: relative; display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 12px; border: 0; border-radius: var(--r-ctl);
  background: none; color: var(--muted); font-weight: 600; font-size: 0.95rem; cursor: pointer; white-space: nowrap;
  transition: background-color var(--dur-press) ease, color var(--dur-press) ease;
}
.nav-a[aria-current="page"] { color: var(--ink); }
.nav-a[aria-current="page"]::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -11px; height: 2px; border-radius: 2px; background: var(--nav-mark); }
.nav-new { color: var(--ink); border: 1px solid var(--rail); background: var(--surface); margin-left: 8px; }
.nav-new[aria-current="page"]::after { display: none; }
.nav-new[aria-current="page"] { border-color: var(--ink); }
.tools { margin-left: auto; display: flex; gap: 4px; align-items: center; }
/* Header tools are quiet: no box until you point at them. */
.iconbtn {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 40px; height: 40px; padding: 0 10px;
  border: 1px solid transparent; border-radius: var(--r-ctl); background: transparent; cursor: pointer; font-weight: 600; font-size: 0.9rem; color: var(--ink);
  transition: background-color var(--dur-press) ease, transform var(--dur-press) var(--ease-out);
}
.iconbtn:active { transform: scale(0.96); }
.iconbtn[aria-current="page"] { background: var(--active); }
/* The waiting count sits after the label ("Teams 1"), not on a corner: the button has no box for a corner badge to sit on. */
.badge {
  min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--amber);
  color: #1d1400; font-size: 0.75rem; font-weight: 700; display: inline-grid; place-items: center;
}
.me { display: flex; align-items: center; gap: 10px; padding: 3px 10px 3px 3px; border-radius: 999px; margin-left: 4px; }
.me b { display: block; font-size: 0.9rem; line-height: 1.2; }
.me small { display: block; font-size: 0.8125rem; color: var(--muted); line-height: 1.2; }
.pav { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; font-weight: 700; font-size: 0.9rem; flex: none; }
.pav.t1 { background: var(--person-1-bg); color: var(--person-1-ink); }
.pav.t2 { background: var(--person-2-bg); color: var(--person-2-ink); }
.pav.t3 { background: var(--person-3-bg); color: var(--person-3-ink); }
.pav.t4 { background: var(--person-4-bg); color: var(--person-4-ink); }
/* The header gives up text in steps as the screen narrows, so it stays on one row. Hidden text is still read out.
   The signed-in person's role is always read out but not shown; it also shows on hover. */
.me small { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-width: 1150px) { .me-text { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; } .me { padding-right: 3px; } }
@media (max-width: 1100px) { .iconbtn .lbl { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; } }
@media (min-width: 901px) and (max-width: 1045px), (max-width: 380px) { .brand-text { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; } }
@media (max-width: 900px) {
  .hdr-in { padding-block: 8px; gap: 6px 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .nav { display: none; }
  .me-text, .iconbtn .lbl { display: none; }
  .brand { font-size: 1rem; }
  .brand-ai { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
}
/* Phones and small tablets: the main menu moves to a tab bar at the bottom of the screen. */
.tabbar { display: none; }
@media (max-width: 900px) {
  .tabbar {
    position: fixed; z-index: var(--z-nav); left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(var(--tabs), minmax(0, 1fr));
    background: var(--surface); border-top: 1px solid var(--hair);
    padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
  }
  .tab { display: grid; justify-items: center; align-content: center; gap: 2px; min-height: 58px; padding: 6px 2px; border: 0; background: none; color: var(--muted); font-size: 0.8125rem; font-weight: 600; cursor: pointer; }
  .tab[aria-current="page"] { color: var(--ink); font-weight: 700; }
  .tab[aria-current="page"] svg { color: var(--nav-mark); }
}

/* The sheet: the page sits on white, inset 8px from the frame, with a hairline edge and no shadow. dvh, not vh, so phone toolbars don't cut it. */
.sheet { margin: 0 8px 8px; min-height: calc(100dvh - 68px); background: var(--bg); border: 1px solid var(--hair); border-radius: var(--r-sheet); }
@media (max-width: 900px) { .sheet { margin: 0; border-width: 1px 0 0; border-radius: 0; } }

/* Page */
.wrap {
  max-width: 1180px; margin: 0 auto; padding-block: 32px 150px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.narrow { max-width: 860px; margin: 0 auto; }
.pagehead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 28px; }
.pagehead p { color: var(--muted); margin-top: 6px; font-size: 1.05rem; max-width: 65ch; }
.eyebrow { font-size: 0.875rem; font-weight: 600; color: var(--muted); }
.back { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 14px; background: none; border: 0; padding: 4px 0; color: var(--muted); font-weight: 600; cursor: pointer; transition: color var(--dur-press) ease; }
.section { display: grid; gap: 12px; }
.section + .section { margin-top: 40px; }
.section > h2 { display: flex; align-items: center; gap: 10px; }
.count { display: inline-grid; place-items: center; min-width: 24px; height: 24px; padding: 0 7px; border-radius: 999px; background: var(--active); font-size: 0.8125rem; font-weight: 700; }
.muted { color: var(--muted); }
.small { font-size: 0.875rem; }

/* Buttons. A press scales to 0.97 so the screen answers the finger at once (Emil Kowalski); transitions name their properties. */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 16px; border: 1px solid var(--rail);
  border-radius: var(--r-ctl); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 0.95rem; cursor: pointer; white-space: nowrap; text-align: center;
  transition: transform var(--dur-press) var(--ease-out), background-color var(--dur-press) ease, border-color var(--dur-press) ease;
}
.btn:active:not([disabled], [aria-disabled="true"]) { transform: scale(0.97); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-ink); }
.btn.good { background: var(--green); border-color: var(--green); color: var(--on-status); }
.btn.bad { color: var(--red-ink); border-color: var(--red-line); }
.btn.sm { min-height: 34px; padding: 0 12px; font-size: 0.875rem; }
/* Disabled stays readable. The words around it say why. */
.btn[disabled], .btn[aria-disabled="true"] { background: var(--sunk); border-color: var(--hair); color: var(--muted); cursor: not-allowed; }
.btn.mock { border: 1.5px dashed var(--trouble); color: var(--trouble); background: transparent; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.linkbtn { display: inline-flex; align-items: center; min-height: 32px; margin: 0 -4px; background: none; border: 0; padding: 0 4px; color: var(--muted); text-decoration: underline; text-decoration-color: var(--rail); text-underline-offset: 3px; font-weight: 600; cursor: pointer; font-size: 0.9rem; transition: color var(--dur-press) ease, text-decoration-color var(--dur-press) ease; }

/* Hover only where there is a real pointer, so a tap on a phone doesn't leave a stuck hover. */
@media (hover: hover) and (pointer: fine) {
  .nav-a:hover { color: var(--ink); background: var(--active); }
  .iconbtn:hover { background: var(--active); }
  .back:hover { color: var(--ink); }
  .btn:hover { border-color: var(--muted); background: var(--sunk); }
  .btn.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
  .btn.good:hover { background: #17673a; border-color: #17673a; }
  .btn.bad:hover { background: var(--red-soft); border-color: var(--red); }
  .btn[disabled]:hover { background: var(--sunk); border-color: var(--hair); }
  .linkbtn:hover { color: var(--ink); text-decoration-color: currentColor; }
  .row-btn:hover { background: var(--sunk); }
  .agent-lg:hover, .tool-row:hover { border-color: var(--rail); }
  .wf-row:hover, .wf-add:hover { background: var(--sunk); }
  .schip:has(select):hover { border-color: currentColor; }
  .agent-chip:hover, .chip:hover, .filters button:hover { border-color: var(--ink); }
}

@media (pointer: coarse) {
  .btn, .btn.sm, .chip, .seg button, .nav-a, .linkbtn, .back, .iconbtn { min-height: 44px; }
}

/* Pills: a pale tint with dark text of the same hue. "On" is the normal state, so it stays grey. */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 1px 10px 1px 8px; border: 1px solid var(--hair); border-radius: 999px; font-size: 0.8125rem; font-weight: 600; white-space: nowrap; line-height: 1.6; flex: none; background: var(--surface); }
.pill.wait { color: var(--amber-ink); background: var(--amber-soft); border-color: var(--amber-line); }
.pill.bad { color: var(--red-ink); background: var(--red-soft); border-color: var(--red-line); }
.pill.ok { color: var(--green-ink); background: var(--green-soft); border-color: var(--green-line); }
.pill.off, .pill.on { color: var(--muted); background: var(--sunk); border-color: var(--hair); }
.pill.new { color: var(--accent-ink); background: var(--accent-soft); border-color: transparent; }
.tag { display: inline-flex; align-items: center; gap: 6px; padding: 1px 8px; border-radius: 4px; font-size: 0.8125rem; font-weight: 600; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.tag.write { background: var(--amber-soft); color: var(--amber-ink); }
.tag.read { background: var(--sunk); color: var(--muted); }

/* Home */
/* Home is one column. The most urgent item is a full card; the rest are one-line rows with one button each. */
.home { max-width: 820px; margin: 0 auto; }
.hello { margin-bottom: 28px; }
.hello h1 { font-size: 1.875rem; }
.hello p { font-size: 1.1rem; color: var(--muted); margin-top: 6px; max-width: 65ch; }
/* A task card: the status is one plain coloured icon in the gutter, not an icon in a tinted circle. */
.task {
  display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 14px; padding: 20px 24px 22px 20px; background: var(--surface);
  border: 1px solid var(--hair); border-radius: var(--r-card);
}
.task .ico { width: 20px; height: 24px; display: grid; place-items: center; }
.task .ico svg { width: 20px; height: 20px; }
.ico.wait { color: var(--amber-ink); }
.ico.bad { color: var(--red); }
.ico.ok { color: var(--green); }
.ico.tool { color: var(--muted); }
.task-body { display: grid; gap: 8px; min-width: 0; }
.task-title { font-size: 1.125rem; font-weight: 700; }
.task-meta { font-size: 0.875rem; color: var(--muted); }
.task .btns { margin-top: 6px; }
.says { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 10px; align-items: start; padding: 10px 14px 12px 10px; border-radius: var(--r-well); background: var(--sunk); font-size: 0.95rem; }
.says b { display: block; font-size: 0.8125rem; font-weight: 700; color: var(--muted); }
.mini-list { display: grid; gap: 4px; font-size: 0.95rem; }
.mini-list li { display: flex; gap: 8px; align-items: baseline; }
.mini-list li::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--muted); flex: none; transform: translateY(-3px); }
.coming { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; align-items: center; gap: 4px 10px; margin-top: 16px; padding: 10px 16px; border-radius: var(--r-well); background: var(--sunk); font-size: 0.9rem; color: var(--muted); }
.coming b { color: var(--ink); font-weight: 600; }
@media (max-width: 600px) { .coming { grid-template-columns: 16px minmax(0, 1fr); align-items: start; } .coming > svg { margin-top: 3px; } .coming > .linkbtn { grid-column: 2; justify-self: start; } }
.queue { margin-top: 4px; border: 1px solid var(--hair); border-radius: var(--r-card); background: var(--surface); }
.qrow { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 20px; }
.qrow + .qrow { border-top: 1px solid var(--rule); }
.qrow .ico { width: 20px; height: 24px; display: grid; place-items: center; align-self: start; }
.qrow .ico svg { width: 20px; height: 20px; }
.qrow-text { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; min-width: 0; }
.qrow-meta { font-size: 0.875rem; color: var(--muted); }
.qrow-why { flex-basis: 100%; font-size: 0.875rem; color: var(--muted); }
.qrow-why b { color: var(--ink); font-weight: 600; }
@media (max-width: 600px) { .qrow { grid-template-columns: 20px minmax(0, 1fr); } .qrow > .btn { grid-column: 2; justify-self: start; } }
.rows { display: grid; border-top: 1px solid var(--rule); }
/* Plain rows share the 6px inset of clickable rows, so their text lines up in a mixed list. */
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 6px; border-bottom: 1px solid var(--rule); }
.row-name { font-weight: 600; }
.row-sub { font-size: 0.875rem; color: var(--muted); }

.track4 li:not(:last-child)::before { content: ""; position: absolute; left: 12px; top: 26px; bottom: 0; width: 2px; background: var(--hair); }

/* Board */

}

}
details summary { cursor: pointer; font-weight: 600; color: var(--muted); padding: 8px 0; }

/* Run page: the live activity view */
.runhead { display: grid; gap: 10px; margin-bottom: 8px; }

.line-track { right: calc(100% / var(--n) / 2); background: var(--hair); }
.line-fill { width: calc(100% - 100% / var(--n)); background: var(--ink); transform-origin: left center; transform: scaleX(var(--f)); transition: transform var(--move) var(--ease-move); }

.st { position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; min-width: 0; }

/* Cause, then effect: the line travels for --move, then the step it reaches lands and its message arrives. */

@keyframes land { from { opacity: 0.45; transform: scale(0.85); } }
.chat > .in { animation-delay: var(--move); animation-fill-mode: backwards; }

.st.todo .st-who { opacity: 0.45; }
.st.todo .st-label { color: var(--muted); }
.st.skip .st-who { opacity: 0.25; }
.st.skip .st-label { color: var(--muted); }

@media (max-width: 760px) {

  .st { flex-direction: row; text-align: left; height: 64px; gap: 12px; }

}
.runbody { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 24px; align-items: start; }
@media (max-width: 960px) { .runbody { grid-template-columns: minmax(0, 1fr); } .runbody .act { order: -1; } }

.tab-dot { display: inline-block; width: 8px; height: 8px; margin-left: 8px; border-radius: 50%; background: var(--amber); vertical-align: 1px; }
.conns { display: grid; gap: 14px; margin-top: 14px; }

/* Usage figures: one container split by hairlines, label over value. No tile per figure. */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr)); gap: 1px; margin: 14px 0 20px; background: var(--hair); border: 1px solid var(--hair); border-radius: var(--r-card); overflow: hidden; }

.ubars { display: grid; gap: 10px; margin: 0 0 18px; }
.ubars li { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr) auto; gap: 12px; align-items: center; font-size: 0.9rem; }
.ub-track { display: block; height: 10px; }
.ub-track i { display: block; height: 100%; border-radius: 0 3px 3px 0; background: var(--accent); }
.ub-val { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
@media (max-width:600px) { .person { grid-template-columns: 34px minmax(0, 1fr); } .person .roles { grid-column: 2; } .ubars li { grid-template-columns: minmax(0, 1fr) auto; } .ubars .ub-track { grid-column: 1 / -1; grid-row: 2; } .conn .kv { grid-template-columns: minmax(0, 1fr); gap: 2px 0; } .conn .kv dd { margin-bottom: 6px; } }
.model-now { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin: 14px 0; padding: 12px 16px; border-radius: var(--r-card); background: var(--sunk); }
.model-now > div { display: grid; gap: 2px; flex: 1 1 240px; }
.model-form { display: grid; gap: 14px; margin-top: 4px; padding-top: 16px; border-top: 1px solid var(--rule); }

.model-grid .model-key { grid-column: 1 / -1; }
.keybox { display: flex; gap: 8px; align-items: stretch; }
.keybox input { flex: 1; min-width: 0; }
.keybox .btn { flex: none; }
.model-found { display: flex; gap: 8px; align-items: flex-start; margin: 0; color: var(--green-ink); font-weight: 600; }

.panel .apprbar { margin: 0 0 14px; }
.seg-n { color: var(--muted); font-weight: 400; }
.sec-sub { margin: -6px 0 10px; }
.tool-rows { display: grid; gap: 8px; }
/* A tool row has no icon: the same glyph on every row says nothing. Whether it changes data is the tag's job. */
.tool-row { position: relative; display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1.4fr) minmax(0, 1.5fr) minmax(0, 0.9fr); align-items: center; gap: 14px; padding: 12px 18px; border: 1px solid var(--hair); border-radius: var(--r-card); background: var(--surface); transition: border-color var(--dur-press) ease; }

.tool-name { display: grid; gap: 2px; min-width: 0; }

.tool-name .rcard-link::after { border-radius: var(--r-card); }
.tool-ic { display: grid; place-items: center; width: 24px; height: 24px; color: var(--muted); flex: none; }
.tool-ic.write { color: var(--amber-ink); }
.tool-ic.lg { width: 48px; height: 48px; border-radius: var(--r-card); background: var(--sunk); color: var(--ink); }
.tool-ic.lg.write { background: var(--amber-soft); color: var(--amber-ink); }
.tool-users { line-height: 1.4; }
.health { display: inline-flex; align-items: center; gap: 6px; font-size: 0.875rem; font-weight: 600; }

.health.warn { color: var(--amber-ink); }
.tool-status { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; padding: 12px 16px; border-radius: var(--r-card); border: 1px solid var(--green-line); background: var(--green-soft); }
.tool-status.warn { border-color: var(--amber-line); background: var(--amber-soft); }
.tool-status > div { display: grid; gap: 4px; flex: 1 1 260px; }
.checks.cant svg { color: var(--muted); }
.agent-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.agent-chip { display: inline-flex; align-items: center; gap: 8px; padding: 4px 14px 4px 4px; border: 1px solid var(--rail); border-radius: 999px; background: var(--surface); font: inherit; font-weight: 600; cursor: pointer; min-height: 44px; transition: border-color var(--dur-press) ease, transform var(--dur-press) var(--ease-out); }

.dlg-back { margin-bottom: -6px; }
.agent-dlg .timeline li { grid-template-columns: 136px minmax(0, 1fr); }
@media (max-width:600px) { .agent-dlg .timeline li { grid-template-columns: minmax(0, 1fr); gap: 2px; } }
.tool-ask h2 { font-size: 1.05rem; margin: 0; }
@media (max-width:760px) { .tool-row, .tool-row.team { grid-template-columns: minmax(0, 1fr); gap: 6px; } }
.agentgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 16px; }
.agentgrid.duo { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 700px) { .agentgrid.duo { grid-template-columns: minmax(0, 1fr); } }
.agent-lg { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 18px 20px; border: 1px solid var(--hair); border-radius: var(--r-card); background: var(--surface); transition: border-color var(--dur-press) ease; }
.agent-lg .linkbtn, .agent-lg .btn { position: relative; z-index: var(--z-raised); }
.agent-lg p { margin: 0; }
.agent-lg > .btns:last-child { margin-top: auto; padding-top: 4px; }
.agent-top { display: flex; gap: 12px; align-items: center; }

.preview { padding: 14px 16px; border-radius: var(--r-well); background: var(--sunk); font-size: 0.95rem; }

.lock { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 10px; padding: 12px 14px; border-radius: var(--r-well); background: var(--sunk); font-size: 0.95rem; }
.note { font-size: 0.875rem; color: var(--muted); max-width: 75ch; }

@media (max-width: 480px) { .btn { white-space: normal; } }
.result-chips { display: flex; flex-wrap: wrap; gap: 8px; }

/* Software */
.sched, .apprbar { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 14px 18px; border-radius: var(--r-card); margin-bottom: 24px; }
.sched { background: var(--surface); border: 1px solid var(--hair); }
.apprbar { background: var(--amber-soft); border: 1px solid var(--amber-line); color: var(--amber-ink); }
.sched span, .apprbar span { display: block; font-size: 0.875rem; }
.sched span { color: var(--muted); }
@media (max-width: 560px) { .sched, .apprbar { grid-template-columns: 24px minmax(0, 1fr); } .sched > :last-child, .apprbar > :last-child { grid-column: 2; justify-self: start; } }
.sw-table tr.hist td { border-top: 0; padding-top: 0; }
.timeline { display: grid; margin: 0 0 6px; padding: 10px 16px; background: var(--sunk); border-radius: var(--r-well); }
.timeline li { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; padding: 6px 0; font-size: 0.9rem; }
.addgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 0.8fr) minmax(0, 1.4fr) minmax(0, 0.9fr); gap: 16px; margin-bottom: 4px; align-items: start; }
@media (max-width: 1000px) and (min-width: 761px) { .addgrid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
@media (max-width: 760px) { .addgrid { grid-template-columns: minmax(0, 1fr); } }

/* Wizard */
.stepper { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 28px; }
.stepper li { display: grid; gap: 6px; font-size: 0.875rem; font-weight: 600; color: var(--muted); }
.stepper li::before { content: ""; height: 3px; border-radius: 3px; background: var(--hair); }
.stepper li.done::before, .stepper li.now::before { background: var(--ink); }
.stepper li.now { color: var(--ink); font-weight: 700; }
.stepnow { display: none; }
@media (max-width: 560px) { .stepper { margin-bottom: 10px; } .stepper li span { display: none; } .stepnow { display: block; font-weight: 700; margin-bottom: 24px; } }
.ask { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 0.8fr); gap: 24px; align-items: start; }
@media (max-width: 860px) { .ask { grid-template-columns: minmax(0, 1fr); } }
.field { display: grid; gap: 8px; }
.field label, .field .lab { font-weight: 600; }
.field .help { font-size: 0.875rem; color: var(--muted); }
.err { display: flex; gap: 6px; align-items: center; color: var(--red-ink); font-size: 0.875rem; font-weight: 600; }
[aria-invalid="true"] { border-color: var(--red) !important; }
textarea, input[type="text"], input[type="password"], input[type="url"], select {
  width: 100%; border: 1px solid var(--edge); border-radius: var(--r-ctl); background: var(--surface); padding: 10px 12px; font-size: 1rem; line-height: 1.5;
  transition: border-color var(--dur-press) ease;
}
textarea { min-height: 150px; resize: vertical; }
select { padding: 9px 12px; width: auto; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--rail); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: border-color var(--dur-press) ease, transform var(--dur-press) var(--ease-out); }
.chip:active { transform: scale(0.97); }
.thinking { display: grid; gap: 12px; }
.thinking li { display: flex; gap: 10px; align-items: center; font-weight: 600; }
.thinking li.in { animation: rise var(--dur-small) var(--ease-out); }
/* A spinner reads as faster when it spins faster. */
.thinking .spin { width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--lead-tint); border-top-color: var(--lead); animation: spin 0.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.bubble { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 12px; align-items: start; }
.bubble p { padding: 12px 16px; background: var(--lead-tint); color: #1b2a6b; border-radius: 4px 14px 14px 14px; font-size: 1rem; }
.agentrow { display: flex; flex-wrap: wrap; gap: 12px; }
.agentcard { display: flex; align-items: center; gap: 10px; padding: 10px 14px 10px 10px; border: 1px solid var(--hair); border-radius: var(--r-card); background: var(--surface); }
.agentcard b { display: block; font-size: 0.95rem; }
.agentcard small { display: block; font-size: 0.85rem; color: var(--muted); }
.toolcard { border: 1px solid var(--hair); border-radius: var(--r-card); background: var(--surface); overflow: hidden; }
.toolcard.ok { border-color: var(--hair); }
.toolcard-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding: 12px 20px; background: var(--amber-soft); border-bottom: 1px solid var(--amber-line); color: var(--amber-ink); font-weight: 600; }
.toolcard.ok .toolcard-head { background: var(--green-soft); border-bottom-color: var(--green-line); color: var(--green-ink); }
.toolcard-body { padding: 20px; display: grid; gap: 16px; }
.kv { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 8px 16px; font-size: 0.95rem; }
.kv dt { color: var(--muted); font-weight: 600; }
@media (max-width: 560px) { .kv { grid-template-columns: minmax(0, 1fr); } .kv dd { margin-bottom: 6px; } }
.checks { display: grid; gap: 6px; }
.checks li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; font-size: 0.95rem; }
.checks svg { color: var(--green); margin-top: 2px; }
.nocode { padding: 12px 14px; border-radius: var(--r-well); background: var(--sunk); font-size: 0.9rem; }
.wfoot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: center; margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--rule); }
.inline-sel { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: 1.05rem; font-weight: 600; }
.sentence { font-size: 1.25rem; line-height: 1.55; padding: 22px 24px; border-radius: var(--r-card); background: var(--surface); border: 1px solid var(--hair); }
.sentence mark { background: var(--lead-tint); color: #1b2a6b; padding: 0 4px; border-radius: 4px; }
/* Turning a workflow on is rare, so it may celebrate: the tick grows from 0.9, never from nothing. */
.done-hero { text-align: center; display: grid; justify-items: center; gap: 14px; padding: 40px 0 10px; }
.done-hero .big { width: 80px; height: 80px; border-radius: 50%; background: var(--green); color: var(--on-status); display: grid; place-items: center; }
.done-hero .big.m-reveal { animation: pop var(--dur-success) var(--ease-out) both; animation-delay: var(--ad, 0ms); }
.done-hero h1 { font-size: 2rem; }
.done-hero p { font-size: 1.1rem; color: var(--muted); max-width: 34em; }
@keyframes pop { from { transform: scale(0.9); opacity: 0; } to { transform: none; opacity: 1; } }

/* Teams drawer, modal, toast: the only things that float, so the only things with a shadow. */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: var(--z-scrim); }
.scrim.in { animation: fade var(--dur-small) var(--ease-out); }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100%); z-index: var(--z-overlay); background: var(--sunk); border-left: 1px solid var(--hair);
  display: grid; grid-template-rows: auto auto 1fr; box-shadow: var(--float);
  padding-top: env(safe-area-inset-top, 0px); padding-right: env(safe-area-inset-right, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
/* The drawer slides in by its own width, on the iOS drawer curve. */
.drawer.in { animation: slide var(--dur-panel) var(--ease-drawer); }
@keyframes slide { from { transform: translateX(100%); } to { transform: none; } }
.drawer-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 18px; background: #4b53bc; color: #fff; }
.drawer-head b { font-size: 1.05rem; }
.drawer-head small { display: block; opacity: 0.85; font-size: 0.8rem; }
.drawer-head .iconbtn { background: transparent; border-color: rgba(255,255,255,.4); color: #fff; }
.drawer-head .iconbtn:focus-visible { outline-color: #fff; }
.chan { padding: 10px 18px; font-weight: 700; border-bottom: 1px solid var(--hair); background: var(--surface); }
.msgs { overflow-y: auto; padding: 16px 18px 40px; display: grid; gap: 16px; align-content: start; }
.msg { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 10px; }
.msg-card { background: var(--surface); border: 1px solid var(--hair); border-radius: var(--r-card); padding: 12px 14px; display: grid; gap: 10px; }
.msg-meta { font-size: 0.85rem; color: var(--muted); }
.msg-meta b { color: var(--ink); }
.dialog {
  position: fixed; z-index: var(--z-overlay); left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(560px, calc(100% - 32px)); max-height: calc(100% - 48px);
  overflow-y: auto; background: var(--surface); border-radius: 12px; box-shadow: var(--float); padding: 24px; display: grid; gap: 16px;
}
/* A dialog has no trigger to grow from, so it stays centred and grows from 0.96. */
.dialog.in { animation: dlg var(--dur-panel) var(--ease-out); }
/* One dialog leading to another (an agent to its tool, and Back) swaps its content instead of closing and opening. */
.dialog.swap > * { animation: fade var(--dur-small) var(--ease-out); }
/* A toast never covers a dialog's buttons. */
.dialog:not(.leave) ~ .toast { top: calc(16px + env(safe-area-inset-top, 0px)); bottom: auto; }
@keyframes dlg { from { opacity: 0; transform: translate(-50%, -50%) scale(0.96); } to { opacity: 1; transform: translate(-50%, -50%); } }
.toast {
  position: fixed; z-index: var(--z-toast); left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px));
  background: var(--primary); color: var(--on-ink); padding: 12px 18px; border-radius: 10px; font-weight: 600; box-shadow: var(--float);
  max-width: calc(100% - 32px);
}
.toast.in { animation: toast var(--dur-small) var(--ease-out); }
@keyframes toast { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }


/* Mock controls: not part of the app */
.mockbar {
  position: fixed; z-index: var(--z-mock); left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 14px; padding: 10px 14px; width: max-content; max-width: calc(100% - 24px);
  background: var(--mock-bg); color: var(--mock-ink); border-radius: 16px; box-shadow: 0 10px 30px rgba(20, 10, 50, 0.35); font-size: 0.85rem;
}
.mockbar .tagm { font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; font-size: 0.72rem; color: var(--mock-dim); }
.mockbar .grp { display: flex; align-items: center; gap: 6px; }
.mockbar .grp > span { color: var(--mock-dim); font-weight: 600; }
.mseg { display: inline-flex; border: 1px solid var(--mock-dim); border-radius: 10px; padding: 2px; }
.mseg button { border: 0; background: none; color: var(--mock-ink); font-weight: 700; padding: 5px 10px; border-radius: 8px; cursor: pointer; font-size: 0.82rem; white-space: nowrap; }
.mseg button[aria-pressed="true"] { background: var(--mock-on); color: var(--mock-on-ink); }
.mreset { border: 1px solid var(--mock-dim); background: none; color: var(--mock-ink); border-radius: 10px; padding: 5px 10px; font-weight: 700; cursor: pointer; font-size: 0.82rem; }
@media (max-width: 560px) { .mockbar .grp > span, .mockbar .hide-sm { display: none; } }

@media (max-width: 900px) {
  .wrap { padding-bottom: 210px; }
  .toast { bottom: calc(160px + env(safe-area-inset-bottom, 0px)); }
}

/* v2: checking what was understood, schedules, search, support cases, test controls */
a { color: var(--link); font-weight: 600; text-decoration-color: color-mix(in srgb, currentColor 40%, transparent); text-underline-offset: 3px; transition: text-decoration-color var(--dur-press) ease; }
@media (hover: hover) and (pointer: fine) { a:hover { text-decoration-color: currentColor; } }
a svg { vertical-align: -2px; margin-left: 3px; }
.links { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 4px; font-size: 0.9rem; }
.pillbtn { font-family: inherit; cursor: pointer; }
.pillbtn:hover { text-decoration: underline; }
.asked { margin: 0; padding: 12px 16px; background: var(--sunk); border-radius: var(--r-well); font-size: 0.95rem; }
.asked span { display: block; font-size: 0.8125rem; font-weight: 600; color: var(--muted); margin-bottom: 2px; }
/* New workflow, step 2: what was understood, as one sentence. Each chip is a real select laid over its text, so it opens the native picker. */
.sentence-line { font-size: 1.1rem; line-height: 2.3; }
.schip { position: relative; display: inline-flex; align-items: center; gap: 4px; padding: 1px 10px; border: 1px solid; border-radius: 999px; font-size: 1rem; font-weight: 600; line-height: 1.7; transition: border-color var(--dur-press) ease; }

/* ---------- Agents: one face, eight states, driven by the real state of the work ----------
   idle      calm. Where one agent is the focus (.live): it breathes once when it appears, then holds still.
   thinking  eyes look from side to side, with 3 dots. The Planner choosing agents, or planning a task.
   working   eyes scan, and its tool moves a little (writers type). The step running now.
   waiting   eyes up, still, with an amber badge. Its work waits for a yes.
   success   one quick check and a small lift, then back to idle. Its work went through.
   error     one worried flinch, then a red badge that stays. Its step stopped.

.face.react.fs-success .f-happy { animation: shown var(--dur-success) ease-out both; animation-delay: var(--ad, 0ms); }
.face.react.fs-success .f-eyes { animation: hidden var(--dur-success) ease-out both; animation-delay: var(--ad, 0ms); }

      { cve: 'CVE-2021-45046', score: 9.0, sev: 'Critical', what: 'The first fix for Log4Shell didn’t cover every setup, so code can still be run in some.' },
      { cve: 'CVE-2021-44832', score: 6.6, sev: 'Medium', what: 'Someone who can change the logging settings can run code.' },
      { cve: 'CVE-2021-45105', score: 5.9, sev: 'Medium', what: 'A crafted message can crash the app.' },
    ] },
  };
  const sevClass = (sev) => (sev === 'Critical' ? 'crit' : sev === 'High' ? 'high' : 'med');
  /* Four answers an Operator needs at a glance, then the detail for whoever wants it. */
  function riskFacts(k, inTicket) {
    const v = VULNS[k];
    const worst = v.list[0];
    const n = v.list.length;
    const fact = (lab, val, sub, cls = '', extra = '') => `<div class="rf"><span class="rf-lab">${lab}</span><span class="rf-val ${cls}">${val}</span>${extra}${sub ? `<span class="rf-sub">${sub}</span>` : ''}</div>`;
    return `<div class="risk-facts">
        ${fact('How serious', `${worst.sev} <b>${worst.score.toFixed(1)}</b><span class="rf-of">/10</span>`, '', sevClass(worst.sev), `<span class="meter" aria-hidden="true"><i class="${sevClass(worst.sev)}" style="width:${worst.score * 10}%"></i></span>`)}
        ${fact('Attackers using it?', v.list.some((x) => x.kev) ? 'Yes, right now' : 'Not known to be', 'From CISA’s list', v.list.some((x) => x.kev) ? 'crit' : '')}
        ${fact('Known vulnerabilities', String(n), `In our version, ${v.ours}`)}
        ${inTicket ? '' : fact('The fix', `Upgrade to ${v.fix}`, `Fixes all ${n}`, 'ok')}
      </div>
      <details class="risk-more"><summary>See all ${n}, and where they were found</summary>
        <ul class="vlist">${v.list.map((x) => `<li><span class="sev ${sevClass(x.sev)}"><b>${x.score.toFixed(1)}</b><small>${x.sev}</small></span><div><span class="vname">${x.nick ? `<b>${x.nick}</b> · ` : ''}${nvdLink(x.cve)}</span><span>${x.what}</span>${x.kev ? `<span class="pill bad">${I.alert(12)}Attackers are using it now</span>` : ''}</div></li>`).join('')}</ul>
        <p class="small muted">Found in OSV. Scores from NVD. Checked against Apache’s own advisory and CISA’s list of actively exploited vulnerabilities.</p>
        ${inTicket ? '' : `<div class="links">${nvdLink(worst.cve, `NVD: ${worst.cve}`)}${extLink('https://www.cisa.gov/known-exploited-vulnerabilities-catalog', 'CISA: actively exploited', 'CISA')}${extLink('https://logging.apache.org/security.html', 'Apache advisory', 'Apache')}${extLink(`https://osv.dev/list?q=log4j-core&ecosystem=Maven`, 'OSV', 'OSV')}</div>`}
      </details>`;
  }
  function riskCard(k, status) {
    const v = VULNS[k];
    const kev = v.list.some((x) => x.kev);
    return `<article class="risk" id="risk-${k}" tabindex="-1">
      <div class="risk-top"><span class="risk-ic">${I.alert(24)}</span>
        <div><h3>${v.tool} ${v.ours}</h3><p>${v.list[0].sev} security risk${kev ? ' that attackers are using now' : ''}. Upgrade to ${v.fix}.</p></div>
        <div class="risk-act">${status}</div></div>
      ${riskFacts(k, false)}
    </article>`;
  }
  const ticketBtn = (key, tool) => `<button class="pill ok pillbtn" data-act="ticket" data-arg="${key}">${I.check(12)}${key}${tool ? ` ${tool}` : ' open'}</button>`;

  function status(id) {
    switch (id) {
      case 'sw':
        if (S.sw === 'waiting') return { tone: 'wait', label: 'Needs a yes', last: 'Mon 26 Oct: 3 upgrade tickets are waiting for a yes, 1 urgent.' };
        if (S.sw === 'approved') return { tone: 'ok', last: `Mon 26 Oct: 3 tickets created, approved by ${nm(S.swBy)}.` };
        return { tone: 'ok', last: `Mon 26 Oct: declined by ${nm(S.swBy)}. Nothing was written.` };
      case 'issues':
        return S.issues === 'failed' ? { tone: 'bad', label: 'Stopped', last: 'Today 8:00: stopped. GitHub can’t find the project.' } : { tone: 'ok', last: 'Today: no new bug reports. Nothing to write.' };
      case 'nudge':
        if (S.nudge === 'fixed') return { tone: 'ok', last: 'Today: done after the fix. Nothing to send.' };
        if (S.report > 0) return { tone: 'bad', label: 'Stopped', last: `Wed 21 Oct: stopped. Reported to support as ${S.supportCase.id}.` };
        return { tone: 'bad', label: 'Stopped', last: 'Wed 21 Oct: stopped on a ticket with no owner.' };
      case 'conf': {
        if (S.conf === 'waiting') return { tone: 'wait', label: 'Needs a yes', last: `Test run today: waiting for ${whoOr(req('conf').may)}.` };
        if (S.conf === 'expired') return { tone: 'off', label: 'No answer', last: 'Test run today: nobody answered in time, so nothing was written.' };
        if (S.conf === 'approved') return { tone: 'ok', last: `Test run today: ${confWrite(S.nr).shortDone}, approved by ${confYesText()}.` };
        if (S.conf === 'declined') return { tone: 'ok', last: `Test run today: declined by ${nm(S.confBy)}. Nothing was written.` };
        return { tone: 'ok', last: `Turned on today. First run ${R('conf').next}.` };
      }
      case 'access':
        return { tone: 'ok', last: 'Mon 5 Oct: 3 people lost access, approved by Bob, then Alice.' };
    }
  }
  /* Which agents on a workflow need a different face, from its real state. Everyone else stays calm. */
  function agentStates(id) {
    const out = {};
    if (S.paused[id]) { R(id).agents.forEach((a) => { out[a] = 'stopped'; }); return out; }
    const tone = status(id).tone;
    if (tone !== 'bad' && tone !== 'wait') return out;
    let m = null;
    try { m = runModel(id); } catch (e) { m = null; }
    if (!m || !m.stations) return out;
    if (tone === 'bad' && m.fail != null && AGENTS[m.stations[m.fail].who]) out[m.stations[m.fail].who] = 'error';
    if (tone === 'wait') { const g = m.stations.findIndex((s) => s.gate); const w = g > 0 ? m.stations[g - 1].who : null; if (AGENTS[w]) out[w] = 'waiting'; }
    return out;
  }
  const pill = (st) => `<span class="pill ${st.tone}">${st.tone === 'ok' ? I.check(12) : st.tone === 'bad' ? I.x(12) : st.tone === 'off' ? I.clock(12) : I.lock(12)}${st.label}</span>`;
  /* Two separate facts: whether the workflow is switched on, and whether its latest run needs someone. */
  const lifePill = (id) => (S.paused[id] ? `<span class="pill off">${I.pause(12)}Paused</span>` : `<span class="pill on">${I.check(12)}On</span>`);
  const pills = (id) => { const st = status(id); return `<span class="btns" style="gap:6px">${lifePill(id)}${st.tone === 'ok' ? '' : pill(st)}</span>`; };

  /* ---------- Who can approve ---------- */
  const starterOf = { sw: 'carol', conf: 'alice' };
  /* This week's software check asked Bob on Monday at 9:41. Nobody answered in 4 working hours, so Alice was asked too. */
  const SW_ASKED = new Date(2026, 9, 26, 9, 41);
  /* A waiting approval request. It keeps the people and waits it was sent with, even if the workflow changes later. */
  function req(id) {
    let a; let asked; let escalated; let step = 0;
    if (id === 'sw') {
      if (!has('sw') || S.sw !== 'waiting') return null;
      a = BASE_APPR.sw; asked = SW_ASKED; escalated = true;
    } else if (id === 'conf') {
      if (!has('conf') || !['waiting', 'expired'].includes(S.conf)) return null;
      a = S.confReq; asked = NOW; escalated = S.confAsk > 0; step = Math.min(S.confYes.length, a.steps.length - 1);
    } else return null;
    const s = a.steps[step];
    const backup = hasBackup(s) ? s.backup : null;
    const backupAt = addWorkHours(asked, a.after);
    let expiresAt = addWorkHours(asked, a.expire * (DAY_END - DAY_START));
    const next = S.paused[id] ? null : nextRunDate(R(id).sched);
    const capped = !!next && next < expiresAt;
    if (capped) expiresAt = next;
    return {
      id, step, steps: a.steps.length, first: s.first, backup, asked, backupAt, expiresAt, capped,
      escalated, expired: id === 'conf' && S.conf === 'expired', backupInTime: backupAt < expiresAt,
      may: [s.first, backup].filter((u) => u && u !== starterOf[id]),
    };
  }
  /* A request that is still waiting, not one that already stopped. */
  const waitingReq = (id) => { const q = req(id); return q && !q.expired ? q : null; };
  const canApprove = (id, user = S.user) => {
    const q = req(id);
    return !!q && !q.expired && PEOPLE[user].ap && starterOf[id] !== user && q.may.includes(user);
  };
  const confYesText = () => S.confYes.map(nm).join(', then ');
  /* The same names as the subject of a sentence: "Siti, then Arun, approved". */
  const confYesWho = () => `${confYesText()}${S.confYes.length > 1 ? ',' : ''}`;
  /* The people a request has actually asked so far. */
  const askedOf = (q) => (q.escalated && q.backup ? [q.first, q.backup] : [q.first]);
  const stopText = (q) => `If nobody says yes by ${at(q.expiresAt)}${q.capped ? ', before the next run' : ''}, it stops and nothing is written.`;
  /* Who has been asked and what happens next, said to the person reading it. */
  function askLine(q, viewer) {
    if (q.expired) return `Nobody answered by ${at(q.expiresAt)}, so it stopped. Nothing was written.`;
    const F = nm(q.first);
    const B = q.backup ? nm(q.backup) : null;
    const role = q.steps > 1 ? (q.step === 0 ? 'the first Approver' : 'the second Approver') : '';
    let t;
    if (viewer && viewer === q.first) t = `You were asked${role ? `, as ${role},` : ' first'} ${on(q.asked)}.${B ? (q.escalated ? ` ${B}, the backup, was asked too ${on(q.backupAt)}.` : q.backupInTime ? ` If you haven’t answered by ${at(q.backupAt)}, ${B} is asked too.` : '') : ''}`;
    else if (viewer && viewer === q.backup) t = q.escalated ? `${F} was asked first and hasn’t answered, so you’re asked as the backup${role ? ` for ${role}` : ''}.` : `You’re the backup${role ? ` for ${role}` : ''}. ${F} was asked first. You can say yes now too.`;
    else if (q.escalated) t = B ? `${F} and ${B}, the backup, have both been asked in Teams${role ? `, as ${role}` : ''}.` : `${F} has been asked in Teams${role ? `, as ${role},` : ''} and sent a reminder.`;
    else t = `${F} has been asked in Teams${role ? `, as ${role}` : ''}.${B && q.backupInTime ? ` If ${F} hasn’t answered by ${at(q.backupAt)}, ${B} is asked too.` : ''}`;
    return `${t} ${stopText(q)}`;
  }
  const askLineHtml = (q, viewer) => `<p class="askline">${I.clock(16)}<span>${askLine(q, viewer)}</span></p>`;

  /* What the approval gate says in the run's feed while it waits. */
  function gateText(q, starter) {
    const F = nm(q.first);
    const B = q.backup ? nm(q.backup) : null;
    const said = q.step > 0 ? `${confYesText()} said yes. ` : '';
    const whom = q.steps > 1 ? `${F}, the ${q.step === 0 ? 'first' : 'second'} Approver,` : F;
    const asked = q.escalated
      ? (B ? `Asked ${whom} in Teams. No answer by ${at(q.backupAt)}, so ${B}, the backup, was asked too.` : `Asked ${whom} in Teams, and sent a reminder ${on(q.backupAt)}.`)
      : `Asked ${whom} in Teams.${B && q.backupInTime ? ` If there’s no answer by ${at(q.backupAt)}, ${B}, the backup, is asked too.` : ''}`;
    return `${said}${asked} ${starter}`;
  }

  /* ---------- Runs: the live activity view ---------- */
  function runModel(id) {
    /* A run that used a version published in n8n without Ask for a yes. It reaches the change step with no yes, and stops there. */
    if (id === 'edit') {
      const wf = S.editRun.wf;
      const helpers = R(wf).agents.filter((a) => a !== 'lead');
      const names = helpers.map((a) => `the ${AGENTS[a].name}`);
      return {
        workflow: wf, end: helpers.length + 2, fail: helpers.length + 2, state: 'failed',
        headline: 'Stopped before changing anything',
        stations: [
          { label: 'Started', sub: 'Today 9:15', who: 'p:carol', msg: { who: 'portal', text: 'The run started at 9:15 with the version Carol published in n8n at 9:12.' } },
          { label: 'Pick agents', who: 'lead', msg: { who: 'lead', text: `I’m bringing in ${andList(names)}.` } },
          ...helpers.map((a, i) => ({ label: AGENTS[a].name, who: a, msg: { who: a, text: i === helpers.length - 1 ? 'I drafted the changes. Nothing is written yet.' : 'I gathered what the next step needs.' } })),
          { label: 'Make the changes', who: 'platform', msg: { who: 'platform', tone: 'bad', text: 'The step Make the approved changes didn’t run, because nobody said yes to this run. Nothing was written.' } },
          { label: 'Done' },
        ],
      };
    }
    if (id === 'sw') {
      const st = S.sw;
      const gate = st === 'waiting' ? { tone: 'wait', who: 'gate', text: gateText(req('sw'), 'Carol can’t approve, because Carol’s schedule started this run.') }
        : st === 'approved' ? { tone: 'ok', who: 'gate', text: `${nm(S.swBy)} approved 3 tickets.` }
          : { tone: 'bad', who: 'gate', text: `${nm(S.swBy)} declined. Nothing was written.` };
      return {
        workflow: 'sw', end: st === 'waiting' ? 5 : 7, state: st === 'waiting' ? 'waiting' : 'done',
        headline: st === 'waiting' ? '3 tickets are waiting for a yes' : st === 'approved' ? '3 tickets created in Jira' : 'Declined, nothing was written',
        stations: [
          { label: 'Started', sub: 'Mon 9:00', who: 'p:carol', msg: { who: 'portal', text: 'Carol’s schedule started the Monday check.' } },
          { label: 'Pick agents', who: 'lead', msg: { who: 'lead', text: '14 tools to check. I’m bringing in the Version checker, the Vulnerability checker and the Ticket writer.' } },
          { label: 'Read 14 sources', who: 'checker', msg: { who: 'checker', text: 'I read each tool’s registry (Maven Central, PyPI, Docker Hub) and cross-checked GitHub. Log4j core, LangGraph and FastAPI have newer versions. For FastAPI, GitHub shows 0.120.2, but it isn’t on PyPI yet, so I used 0.120.1. Grafana couldn’t be read: Docker Hub and GitHub didn’t answer. From endoflife.date: PostgreSQL 14 stops getting fixes on 12 Nov, and Node.js 22 on 30 Apr.' } },
          { label: 'Check vulnerabilities', who: 'vuln', msg: { who: 'vuln', text: 'I matched the versions we run in OSV, read the official records from NVD, checked vendor advisories, and checked CISA’s list of actively exploited vulnerabilities. Log4j core 2.14.1 has 4 known vulnerabilities, found in OSV, NVD and Apache’s own advisory. The worst, CVE-2021-44228 (Log4Shell), is rated critical, 10.0, and CISA lists it as actively exploited. None are listed for the other tools.' } },
          { label: 'Draft tickets', who: 'writer', msg: { who: 'writer', text: 'I drafted 3 upgrade tickets. The Log4j core one is marked urgent. Nothing is in Jira yet.' } },
          { label: 'Approval gate', gate: true, msg: gate },
          { label: 'Create in Jira', who: 'platform', skip: st === 'declined', msg: { who: 'platform', text: 'Created MOCK-14, MOCK-15 and MOCK-16. Only the approved tickets were written.' } },
          { label: 'Done', msg: { who: 'portal', tone: 'ok', text: st === 'declined' ? 'Done. The tickets will be proposed again next Monday.' : 'Done. 3 upgrade tickets are in Jira, 1 urgent.' } },
        ],
      };
    }
    if (id === 'issues') {
      const ok = S.issues === 'fixed';
      return {
        workflow: 'issues', end: ok ? 6 : 2, fail: ok ? null : 2, state: ok ? 'done' : 'failed',
        headline: ok ? 'Done, nothing new today' : 'Stopped at Read bug reports',
        stations: [
          { label: 'Started', sub: ok ? 'Today, retry' : 'Today 8:00', who: 'p:alice', msg: { who: 'portal', text: ok ? 'Alice retried the run with the new project name.' : 'Alice’s schedule started the morning check.' } },
          { label: 'Pick agents', who: 'lead', msg: { who: 'lead', text: 'I’m bringing in the Issue reader and the Ticket writer.' } },
          { label: 'Read bug reports', who: 'issues', msg: ok ? { who: 'issues', text: 'Read langchain-ai/langchain. No new bug reports since yesterday.' } : { who: 'issues', tone: 'bad', text: 'GitHub says langchain-ai/langserve doesn’t exist any more. I stopped here.' } },
          { label: 'Draft tickets', who: 'writer', skip: ok },
          { label: 'Approval gate', gate: true, skip: ok },
          { label: 'Create in Jira', who: 'platform', skip: ok },
          { label: 'Done', msg: { who: 'portal', tone: 'ok', text: 'Done. Nothing to write today.' } },
        ],
      };
    }
    if (id === 'nudge') {
      const ok = S.nudge === 'fixed';
      return {
        workflow: 'nudge', end: ok ? 6 : 2, fail: ok ? null : 2, state: ok ? 'done' : 'failed',
        headline: ok ? 'Done, nothing to send' : 'Stopped at Read stale tickets',
        stations: [
          { label: 'Started', sub: ok ? 'Today, retry' : 'Wed 10:00', who: 'p:alice', msg: { who: 'portal', text: ok ? 'Alice retried the run after the fix went live.' : 'Alice’s schedule started the Wednesday nudge.' } },
          { label: 'Pick agents', who: 'lead', msg: { who: 'lead', text: 'I’m bringing in the Jira reader and the Message writer.' } },
          { label: 'Read stale tickets', who: 'jira', msg: ok ? { who: 'jira', text: 'Found 1 stale ticket, MOCK-31. It has no owner, so there’s nobody to ask. I listed it for you instead.' } : { who: 'jira', tone: 'bad', text: 'I stopped while reading MOCK-31. Something went wrong inside the platform.' } },
          { label: 'Draft messages', who: 'msg', skip: ok },
          { label: 'Approval gate', gate: true, skip: ok },
          { label: 'Send in Teams', who: 'platform', skip: ok },
          { label: 'Done', msg: { who: 'portal', tone: 'ok', text: 'Done. Nothing to send this week.' } },
        ],
      };
    }
    if (id === 'conf') {
      const f = S.nr;
      const w = confWrite(f);
      const st = S.conf;
      const agent = f.action === 'nudge' ? 'msg' : 'summary';
      const q = req('conf');
      const gateMsg = st === 'waiting' ? { who: 'gate', tone: 'wait', text: gateText(q, 'Alice started this run, so Alice can’t approve it.') }
        : st === 'expired' ? { who: 'gate', text: `Nobody answered by ${at(q.expiresAt)}, so the request stopped. Nothing was written.` }
          : st === 'declined' ? { who: 'gate', tone: 'bad', text: `${nm(S.confBy)} declined. Nothing was written.` }
            : { who: 'gate', tone: 'ok', text: `${confYesWho()} approved it.` };
      return {
        workflow: 'conf', end: st === 'waiting' ? 4 : 6, state: st === 'waiting' ? 'waiting' : st === 'expired' ? 'expired' : 'done',
        headline: st === 'waiting' ? w.waitHead : st === 'expired' ? 'No answer, nothing was written' : st === 'declined' ? 'Declined, nothing was written' : w.doneHead,
        stations: [
          { label: 'Started', sub: 'Today, test', who: 'p:alice', msg: { who: 'portal', text: 'Alice started a test run.' } },
          { label: 'Pick agents', who: 'lead', msg: { who: 'lead', text: `I’m bringing in the Jira reader and the ${AGENTS[agent].name}.` } },
          { label: { closed: 'Find closed tickets', stale: 'Find stale tickets', open: 'Find open tickets' }[f.tickets], who: 'jira', msg: { who: 'jira', text: { closed: '14 tickets were closed in MOCK this week.', stale: `4 open tickets in MOCK have had no update for ${f.days} days or more.`, open: '18 tickets are open in MOCK.' }[f.tickets] } },
          { label: f.action === 'nudge' ? 'Draft messages' : 'Write summary', who: agent, msg: { who: agent, text: f.action === 'nudge' ? 'I drafted 3 messages, one for each owner. Nothing is sent yet.' : 'I wrote a short summary. Nothing is posted yet.' } },
          { label: 'Approval gate', gate: true, msg: gateMsg },
          { label: w.stationWrite, who: 'platform', skip: st === 'expired' || st === 'declined', msg: st === 'expired' || st === 'declined' ? null : { who: 'platform', text: w.did } },
          { label: 'Done', msg: { who: 'portal', tone: 'ok', text: st === 'expired' ? 'Done. Nothing was written, because nobody said yes.' : st === 'declined' ? 'Done. Nothing was written, because it was declined.' : 'Done.' } },
        ],
      };
    }
  }

  const P = { run: null, at: 0, shown: 0, timer: null, speed: reduce ? 'instant' : '1x', feedSeen: 0, feedNext: 0 };
  let follow = false;
  const interval = () => (P.speed === '2x' ? 520 : 1050);
  function stopTimer() { if (P.timer) { clearInterval(P.timer); P.timer = null; } }
  function playTo(from) {
    stopTimer();
    follow = true;
    const m = runModel(P.run);
    P.at = from; P.shown = from;
    if (from === 0) P.feedSeen = 0;
    if (P.speed === 'instant') { P.at = m.end; P.shown = m.end; return; }
    P.timer = setInterval(() => {
      const end = runModel(P.run).end;
      if (P.at < end) { P.shown = P.at; P.at += 1; render(); } else stopTimer();
    }, interval());
  }
  function continueRun() {
    if (S.view.name !== 'run') return;
    playTo(P.at);
  }

  /* ---------- Small pieces ---------- */
  function whoAvatar(w, size = 36, state = 'idle', k = '') {
    if (!w) return '';
    if (w.startsWith('p:')) return pav(w.slice(2), size);
    if (w === 'platform') return `<span class="sysav app" style="width:${size}px;height:${size}px">${I.mark()}</span>`;
    return face(w, size + 12, state, { k });
  }
  const feedName = (w) => (w === 'portal' ? 'Workflow Builder' : w === 'platform' ? 'Platform' : w === 'gate' ? 'Approval gate' : AGENTS[w].name);
  const feedHue = (w) => (AGENTS[w] ? AGENTS[w].hue : 'var(--muted)');
  function fieldAttrs(id, err, help) {
    const ids = [help ? `${id}-help` : '', err ? `${id}-err` : ''].filter(Boolean).join(' ');
    return `${ids ? ` aria-describedby="${ids}"` : ''}${err ? ' aria-invalid="true"' : ''}`;
  }
  function fieldNotes(id, err, help) {
    return (help ? `<span class="help" id="${id}-help">${help}</span>` : '') + (err ? `<span class="err" id="${id}-err">${I.alert(16)}${err}</span>` : '');
  }
  const fieldErr = (id, err, help) => `${fieldAttrs(id, err, help)}>${fieldNotes(id, err, help)}`;
  const opt = (v, label, cur) => `<option value="${v}"${String(v) === String(cur) ? ' selected' : ''}>${label}</option>`;
  /* The same schedule fields in New workflow and when changing a workflow's schedule. */
  function schedFields(attr, f, err) {
    const id = (k) => `${attr}-${k}`;
    return `<div class="sched-grid">
      <div class="field"><label for="${id('freq')}">How often</label><select id="${id('freq')}" data-${attr}="freq"${fieldAttrs(id('freq'), err.freq)}>${opt('', 'Choose…', f.freq)}${Object.entries(FREQ_WORD).map(([v, l]) => opt(v, l, f.freq)).join('')}</select>${fieldNotes(id('freq'), err.freq)}</div>
      ${f.freq === 'week' ? `<div class="field"><label for="${id('day')}">Day</label><select id="${id('day')}" data-${attr}="day"${fieldAttrs(id('day'), err.day)}>${opt('', 'Choose…', f.day)}${DAYS.map((d) => opt(d, d, f.day)).join('')}</select>${fieldNotes(id('day'), err.day)}</div>` : ''}
      ${f.freq === 'month' ? `<div class="field"><label for="${id('mday')}">Day of the month</label><select id="${id('mday')}" data-${attr}="monthDay">${Array.from({ length: 28 }, (_, i) => opt(i + 1, ordinal(i + 1), f.monthDay)).join('')}</select></div>` : ''}
      <div class="field"><label for="${id('time')}">Time</label><input type="time" id="${id('time')}" data-${attr}="time" value="${f.time || ''}"${fieldAttrs(id('time'), err.time, TZ)}>${fieldNotes(id('time'), err.time, TZ)}</div>
    </div>`;
  }
  /* The same Approver fields in New workflow and when changing a workflow. The owner is never offered. */
  function apprFields(attr, a, err, owner, extra = '', sched) {
    const id = (k) => `${attr}-${k}`;
    const pool = approverPool().filter((u) => u !== owner);
    const steps = a.steps.map((s, i) => {
      const elsewhere = a.steps.filter((_, j) => j !== i).flatMap((o) => [o.first, o.backup]);
      const firsts = pool.filter((u) => !elsewhere.includes(u));
      const backups = firsts.filter((u) => u !== s.first);
      const fk = `first-${i}`;
      const bk = `backup-${i}`;
      const legend = a.steps.length > 1 ? `<legend>${i === 0 ? 'First yes' : 'Second yes, after the first'}</legend>` : '<legend class="vh">Who is asked</legend>';
      return `<fieldset class="apstep">${legend}<div class="sched-grid">
        <div class="field"><label for="${id(fk)}">Asked first</label><select id="${id(fk)}" data-${attr}="first:${i}"${fieldAttrs(id(fk), err[fk])}>${opt('', 'Choose…', s.first)}${firsts.map((u) => opt(u, nm(u), s.first)).join('')}</select>${fieldNotes(id(fk), err[fk])}</div>
        <div class="field"><label for="${id(bk)}">Backup</label><select id="${id(bk)}" data-${attr}="backup:${i}"${fieldAttrs(id(bk), err[bk])}>${opt('', 'Choose…', s.backup)}${backups.map((u) => opt(u, nm(u), s.backup)).join('')}${opt('none', 'Nobody else', s.backup)}</select>${fieldNotes(id(bk), err[bk])}</div>
      </div></fieldset>`;
    });
    /* In New workflow the second Approver is optional, so it sits with the other options. */
    const optional = !!extra;
    const more = (attr === 'ap' ? S.wiz.more : S.apprMore) || !!(err.after || err['first-1'] || err['backup-1']);
    return `${(optional ? steps.slice(0, 1) : steps).join('')}
      <p class="apsum">${I.info(16)}<span>${apprSummary(a, sched)}</span></p>
      <details class="more"${more ? ' open' : ''}><summary data-act="moreAppr" data-arg="${attr}">More approval options</summary><div class="more-body">
        ${extra}${optional ? steps.slice(1).join('') : ''}
        <div class="sched-grid">
          <div class="field"><label for="${id('after')}">Ask the backup after</label><select id="${id('after')}" data-${attr}="after"${fieldAttrs(id('after'), err.after)}>${AFTER.map(([v, l]) => opt(v, l, a.after)).join('')}</select>${fieldNotes(id('after'), err.after)}</div>
          <div class="field"><label for="${id('expire')}">Stop waiting after</label><select id="${id('expire')}" data-${attr}="expire">${EXPIRE.map(([v, l]) => opt(v, l, a.expire)).join('')}</select></div>
        </div>
        <p class="note">Working hours are Monday to Friday, 9:00 to 18:00, ${TZ}. Either the first person or the backup can say yes. A request never says yes by itself, and it always stops before the next run, so two never wait at once.</p>
      </div></details>`;
  }
  /* The whole approval rule in one sentence, so the default needs no extra reading. */
  function apprSummary(a, sched) {
    const [s0, s1] = a.steps;
    if (!s0.first || !s0.backup) return 'Choose who is asked first, and a backup or Nobody else.';
    if (s1 && (!s1.first || !s1.backup)) return 'Choose who gives the second yes, and their backup or Nobody else.';
    const who = s1 ? `${nm(s0.first)} is asked first, then ${nm(s1.first)} gives the second yes.` : `${nm(s0.first)} is asked first.`;
    return `${who} ${escalationSentence(a, sched)}`;
  }
  function apprEditor(id) {
    const steps = apprOf(id).steps.length;
    return `<div class="panel" style="margin-top:16px"><h2>Change who approves</h2>
      ${steps > 1 ? '<p class="note">This workflow needs 2 Approvers, one after the other.</p>' : ''}
      ${apprFields('af', S.apprForm, S.apprErr, OWNER[id](), '', R(id).sched)}
      <div class="btns"><button class="btn primary sm" data-act="saveAppr" data-arg="${id}">Save</button><button class="btn sm" data-act="cancelAppr">Cancel</button></div>
      <p class="note">${waitingReq(id) ? 'The request that’s waiting now keeps the people it was sent to. Your change starts with the next run.'
        : req(id) ? 'This change starts with the next run. The stopped test run isn’t started again by itself.' : 'This change starts with the next run.'}</p></div>`;
  }

  /* ---------- Views ---------- */
  function header() {
    const v = S.view.name;
    const swRun = v === 'run' && S.view.id === 'sw';
    const cur = (on) => (on ? ' aria-current="page"' : '');
    const nav = [
      `<button class="nav-a" data-act="go" data-arg="home"${cur(v === 'home')}>Home</button>`,
      `<button class="nav-a" data-act="go" data-arg="workflows"${cur(['workflows', 'workflow'].includes(v) || (v === 'run' && !swRun))}>Workflows</button>`,
      `<button class="nav-a" data-act="go" data-arg="software"${cur(v === 'software' || swRun)}>Software watchlist</button>`,
      `<button class="nav-a" data-act="go" data-arg="agents"${cur(v === 'agents')}>Agent library</button>`,
      me().op ? `<button class="nav-a nav-new" data-act="go" data-arg="new"${cur(['new', 'done'].includes(v))}>${I.plus(16)}New workflow</button>` : '',
    ].join('');
    const n = teamsCount();
    return `<header class="hdr"><div class="hdr-in">
      <button class="brand" data-act="go" data-arg="home">${I.mark(22)}<span class="brand-text"><span class="brand-ai">AI </span>Workflow Builder</span></button>
      <nav class="nav" aria-label="Main">${nav}</nav>
      <div class="tools">
        <button class="iconbtn" data-act="teams" aria-label="Teams, practice copy${n ? `, ${approvalsWord(n)} waiting for you` : ''}" title="${n ? `${approvalsWord(n)} waiting for you` : 'Teams, practice copy'}">${I.chat(20)}<span class="lbl">Teams</span>${n ? `<span class="badge" data-val="teams-n">${n}</span>` : ''}</button>
        <button class="iconbtn" data-act="go" data-arg="settings" aria-label="Settings" title="Settings"${v === 'settings' ? ' aria-current="page"' : ''}>${I.gear(20)}</button>
        <div class="me" title="${me().name}, ${me().role}">${pav(S.user)}<span class="me-text"><b>${me().name}</b><small>${me().role}</small></span></div>
      </div>
    </div></header>`;
  }
  const approvalsWord = (n) => (n === 1 ? '1 approval' : `${n} approvals`);

  /* Phones: the same menu as the header, as a tab bar at the bottom. */
  function tabbar() {
    const v = S.view.name;
    const swRun = v === 'run' && S.view.id === 'sw';
    const tabs = [
      ['home', 'Home', I.home(22), v === 'home'],
      ['workflows', 'Workflows', I.grid(22), ['workflows', 'workflow'].includes(v) || (v === 'run' && !swRun)],
      ['software', 'Watchlist', I.box(22), v === 'software' || swRun],
      ['agents', 'Agents', I.bot(22), v === 'agents'],
    ].concat(me().op ? [['new', 'New workflow', I.plus(22), ['new', 'done'].includes(v)]] : []);
    return `<nav class="tabbar" aria-label="Main" style="--tabs:${tabs.length}">${tabs.map(([arg, label, icon, on]) => `<button class="tab" data-act="go" data-arg="${arg}"${on ? ' aria-current="page"' : ''}>${icon}<span>${label}</span></button>`).join('')}</nav>`;
  }

  /* One main button per screen: only the first card keeps it. */
  const demote = (html) => html.replace(/btn primary/g, 'btn');

  function needs() {
    const out = [];
    const u = S.user;
    if (has('sw') && S.sw === 'waiting' && canApprove('sw')) out.push({ kind: 'wait', icon: I.shield(22), title: '3 upgrade tickets are waiting for your yes, 1 urgent', meta: 'Keep our software up to date · Software watchlist, Mon 26 Oct, 9:00', body: `<ul class="mini-list"><li><b>Log4j core 2.14.1 → 2.25.2, urgent: critical and actively exploited</b></li><li>LangGraph 1.2.14 → 1.2.17</li><li>FastAPI 0.118.0 → 0.120.1</li></ul>${askLineHtml(req('sw'), u)}`, actions: `<button class="btn primary" data-act="run" data-arg="sw">Review and decide</button><button class="btn" data-act="teams">Open in Teams</button>` });
    if (has('conf') && S.conf === 'waiting' && canApprove('conf')) out.push({ kind: 'wait', icon: I.shield(22), title: confWrite(S.nr).needTitle, meta: `${esc(S.nr.name)} · test run by Alice`, body: askLineHtml(req('conf'), u), actions: `<button class="btn primary" data-act="run" data-arg="conf">Review and decide</button>` });
    if (has('conf') && S.conf === 'declined' && u === 'alice') out.push({ kind: 'wait', icon: I.x(22), title: `${nm(S.confBy)} declined your test run`, meta: `${esc(S.nr.name)} · nothing was written`, body: '', actions: '<button class="btn primary" data-act="run" data-arg="conf">See the run</button><button class="btn" data-act="testRun">Do a test run again</button>' });
    if (has('conf') && S.conf === 'expired' && u === 'alice') out.push({ kind: 'wait', icon: I.clock(22), title: 'Nobody answered on your test run', meta: `${esc(S.nr.name)} · stopped ${at(req('conf').expiresAt)}`, body: `<p class="small muted">${whoAnd(askedOf(req('conf')))} didn’t answer in time, so nothing was written. Run it again, or choose other Approvers.</p>`, actions: `<button class="btn primary" data-act="testRun">Do a test run again</button><button class="btn" data-act="apprFromRun" data-arg="conf">Change who approves</button>` });
    if (S.tool === 'asked' && PEOPLE[u].ap && u !== 'alice') out.push({ kind: 'tool', icon: I.tool(22), title: 'OK a new tool: Update a Confluence page', meta: `Asked by Alice for ${esc(draftNr().name)}`, body: `<p class="small muted">It changes data, so an Approver must OK it once before any workflow can use it.</p>`, actions: `<button class="btn primary" data-act="go" data-arg="tool">Review the tool</button>` });
    Object.entries(S.roles).filter(([w, r]) => r.pendingAp && PEOPLE[u].ap && u !== r.pendingBy && u !== w).forEach(([w]) => out.push({ kind: 'tool', icon: I.shield(22), title: `Confirm ${nm(w)} as an Approver`, meta: `Asked by ${nm(S.roles[w].pendingBy)}`, body: '<p class="small muted">Approvers can say yes to changes in Jira, Teams and other systems.</p>', actions: '<button class="btn primary" data-act="setGo" data-arg="people">Review in Settings</button>' }));
    if (PEOPLE[u].op) expiring().forEach((k) => out.push({ kind: 'wait', icon: I.clock(22), title: `The ${CONNS[k].name} key expires in ${S.conns[k].days} days`, meta: `Expires ${S.conns[k].expires}`, body: `<p class="small muted">Replace it before then, or everything that uses ${CONNS[k].name} stops.</p>`, actions: '<button class="btn primary" data-act="setGo" data-arg="connections">Replace it in Settings</button>' }));
    if (S.modelPending && PEOPLE[u].ap && u !== S.modelPending.byId) out.push({ kind: 'tool', icon: I.shield(22), title: 'Confirm a new AI model address', meta: `${esc(S.modelPending.address)} · entered by ${nm(S.modelPending.byId)}`, body: '<p class="small muted">Agents would send their prompts to this address. Until you confirm it, runs keep using the current model.</p>', actions: '<button class="btn primary" data-act="go" data-arg="settings">Review in Settings</button>' });
    if (S.jiraComp === 'asked' && canOkTool() && u !== S.jiraCompAsker) out.push({ kind: 'tool', icon: I.tool(22), title: `OK a new tool: ${TOOLS.jiraComp[0]}`, meta: `Asked by ${nm(S.jiraCompAsker)} for the Ticket writer`, body: '<p class="small muted">It changes data, so an Approver must OK it once before any agent can use it.</p>', actions: '<button class="btn primary" data-act="toolOpen" data-arg="jiraComp">Review the tool</button>' });
    if (S.jiraComp === 'ok' && u === S.jiraCompAsker && !S.jiraCompSeen) out.push({ kind: 'ok', icon: I.check(22), title: `${nm(S.jiraCompBy)} OK’d the new tool. You can give it to the Ticket writer.`, meta: TOOLS.jiraComp[0], body: '', actions: '<button class="btn primary" data-act="toolAddTo" data-arg="writer">Give it to the Ticket writer</button>' });
    if (PEOPLE[u].op) Object.entries(S.n8nChg).forEach(([id, c]) => out.push({ kind: 'wait', icon: I.alert(22), title: `${nm(c.by)}’s change in n8n removed Ask for a yes`, meta: `${esc(R(id).name)} · published ${c.when}`, body: '<p class="small muted">The next run will stop before it changes anything. Undo the change, or put the step back in n8n.</p>', actions: `<button class="btn primary" data-act="n8nUndo" data-arg="${id}">Undo ${nm(c.by)}’s change</button><button class="btn" data-act="workflow" data-arg="${id}">See the workflow</button>` }));
    if (PEOPLE[u].op) {
      if (S.tool === 'ok' && !S.toolSeen && S.draft && S.conf === 'none') out.push({ kind: 'ok', icon: I.check(22), title: 'Bob OK’d the new tool. You can finish your workflow.', meta: `${esc(draftNr().name)} · Update a Confluence page`, body: '', actions: `<button class="btn primary" data-act="go" data-arg="new">Continue setting up</button>` });
      if (has('issues') && S.issues === 'failed') out.push({ kind: 'bad', icon: I.alert(22), title: 'Morning bug report check stopped', meta: 'Today, 8:00', body: '', why: 'GitHub can’t find langchain-ai/langserve. It moved to langchain-ai/langchain. You can fix this yourself.', actions: `<button class="btn primary" data-act="run" data-arg="issues">See why and fix it</button>` });
      if (has('nudge') && S.nudge === 'failed' && S.report === 0) out.push({ kind: 'bad', icon: I.alert(22), title: 'Stale ticket nudge stopped', meta: 'Wed 21 Oct, 10:00', body: '', why: 'This is a problem in the platform, not in your workflow. You can’t fix it from here. Report it and support gets everything they need.', actions: `<button class="btn primary" data-act="report">Report to support</button><button class="btn" data-act="run" data-arg="nudge">See the run</button>` });
      if (has('nudge') && S.nudge === 'failed' && S.report === 4) out.push({ kind: 'ok', icon: I.check(22), title: 'The fix for Stale ticket nudge is live', meta: `Case ${S.supportCase.id} · fixed by Dana`, body: `<p class="small muted">Retry the run to catch up on this week.</p>`, actions: `<button class="btn primary" data-act="retryNudge">Retry the run</button>` });
    }
    return out;
  }
  function says(text) { return `<div class="says">${face('trouble', 32)}<div><b>AI troubleshooter</b>${text}</div></div>`; }
  function taskCard(t, i = 0) {
    return `<article class="task" data-flip="h:${keyOf(t.title)}" data-stagger style="--i:${i}"><span class="ico ${t.kind}">${t.icon}</span><div class="task-body"><h3 class="task-title">${t.title}</h3><div class="task-meta">${t.meta}</div>${t.body}${t.why ? says(t.why) : ''}<div class="btns">${t.actions}</div></div></article>`;
  }
  /* A compact row keeps only its item's first button, as a small secondary one. */
  const firstButton = (html) => ((html.match(/<button[\s\S]*?<\/button>/) || [''])[0]).replace(/class="btn[^"]*"/, 'class="btn sm"');
  function queueRow(t, i = 1) {
    return `<li class="qrow" data-flip="h:${keyOf(t.title)}" data-stagger style="--i:${i}"><span class="ico ${t.kind}">${t.icon}</span><div class="qrow-text"><b>${t.title}</b><span class="qrow-meta">${t.meta}</span>${t.why ? `<span class="qrow-why"><b>AI troubleshooter:</b> ${t.why}</span>` : ''}</div>${firstButton(t.actions)}</li>`;
  }

  const REPORT_STAGES = [
    ['Reported', 'Sent to support with the run and the troubleshooter’s notes.'],
    ['Agents are writing a fix', 'Coding agents found the cause and are testing a fix.'],
