    ['Fix ready, waiting for the support developer', 'Dana reads the fix and decides. Agents can’t put it live themselves.'],
    ['Fixed', 'The fix is live. Retry the run.'],
  ];
  function reportTrack(compact) {
    return `<ol class="track4">${REPORT_STAGES.map(([t, d], i) => {
      const n = i + 1;
      const cls = n < S.report || S.report === 4 ? 'done' : n === S.report ? 'now' : 'todo';
      return `<li class="${cls}"><span class="dot">${cls === 'done' ? I.check(13) : ''}</span><div><b>${t}</b>${compact && cls !== 'now' ? '' : `<span>${d}</span>`}</div></li>`;
    }).join('')}</ol>`;
  }
  function caseBox() {
    const c = S.supportCase;
    return `<div class="casebox"><div class="case-top"><b>Case ${c.id}</b><span class="tag">Owner: ${c.owner}</span></div>
      <dl class="kv"><dt>Sent</dt><dd>${c.sent}</dd><dt>First reply by</dt><dd>${c.target}</dd><dt>Updates</dt><dd>A Teams message to you at each stage</dd>${c.note ? `<dt>Your note</dt><dd>${esc(c.note)}</dd>` : ''}</dl></div>`;
  }

  function todayView() {
    const items = needs();
    const n = items.length;
    const waitingOn = [];
    if (S.user === 'alice') {
      if (S.tool === 'asked') waitingOn.push(['An Approver to OK the new tool', `${esc(draftNr().name)} · Update a Confluence page`, 'go', 'new']);
      if (S.jiraComp === 'asked' && S.jiraCompAsker === 'alice') waitingOn.push(['An Approver to OK the new tool', `${TOOLS.jiraComp[0]} · for the Ticket writer`, 'toolOpen', 'jiraComp']);
      if (S.conf === 'waiting' && has('conf')) {
        const q = req('conf');
        const who = q.escalated && q.backup ? `A yes from ${whoOr(askedOf(q))}` : `${nm(q.first)}’s yes`;
        const next = q.escalated || !q.backup || !q.backupInTime ? `stops waiting ${at(q.expiresAt)}` : `${nm(q.backup)} is asked ${on(q.backupAt)} if there’s no answer`;
        waitingOn.push([`${who} on your test run`, `${esc(S.nr.name)} · ${next}`, 'run', 'conf']);
      }
    }
    const ids = routineIds();
    const coming = ids.map((id) => [id, R(id)]).sort((a, b) => (S.paused[a[0]] ? 1 : 0) - (S.paused[b[0]] ? 1 : 0) || a[1].sort - b[1].sort);
    const dayOne = ids.length === 0;
    const line = dayOne
      ? (me().op ? 'Welcome. Set up your first workflow, and it runs by itself from then on.' : 'Nothing needs you yet. When a workflow wants to change something, it shows up here and in Teams.')
      : n === 0 ? 'Nothing needs you right now. Your workflows are running.' : `${n === 1 ? '1 thing needs' : `${n} things need`} you. Everything else is running.`;
    const firstLive = coming.find(([id]) => !S.paused[id]);
    /* On day one an Operator's first workflow comes first. Anything that already needs them, such as a key about to expire,
       follows as short rows, so the page keeps one main button. */
    const starterFirst = dayOne && me().op;
    const needsSec = `<section class="section" aria-labelledby="needs-h" data-flip-group="home-needs">
          <h2 id="needs-h">Needs you <span class="count" data-val="home-needs">${n}</span></h2>
          ${starterFirst ? `<ul class="queue" aria-label="Needs you" data-flip-group="home-queue">${items.map((x, i) => queueRow(x, i + 1)).join('')}</ul>` : n ? `${taskCard(items[0])}${n > 1 ? `<ul class="queue" aria-label="Also needs you" data-flip-group="home-queue">${items.slice(1).map((x, i) => queueRow(x, i + 1)).join('')}</ul>` : ''}` : `<div class="quiet"><b>All quiet</b>${firstLive ? `Next up: <button class="linkbtn" data-act="workflow" data-arg="${firstLive[0]}">${esc(firstLive[1].name)}</button>, ${firstLive[1].next}.` : 'Nothing is scheduled yet.'}</div>`}
        </section>`;
    const main = starterFirst ? `${firstRoutine()}${n ? needsSec : ''}` : needsSec;
    const following = has('nudge') && S.report > 0 && S.report < 4 && S.user === 'alice' ? `<section class="section" aria-labelledby="fu-h" data-pres="follow" data-stagger style="--i:3"><h2 id="fu-h">Following up</h2>
          <article class="panel"><div><div class="task-title">Stale ticket nudge: reported to support</div><div class="task-meta">Support has the run and the troubleshooter’s notes.</div></div>${caseBox()}${reportTrack(true)}</article></section>` : '';
    const draftSub = S.tool === 'asked' && S.wiz.intent && needsTool(draftNr()) ? 'Waiting for an Approver to OK a new tool.' : S.tool === 'ok' && S.wiz.intent && needsTool(draftNr()) ? 'The new tool is OK’d. Ready to carry on.' : `Step ${S.wiz.step} of 4. Pick up where you left off.`;
    /* "Coming up" folds into one line under the greeting. When nothing needs you, the "All quiet" box says what runs next instead. */
    const comingNext = n && firstLive ? `<div class="coming">${I.clock(16)}<span><b>Coming up next:</b> <button class="linkbtn" data-act="workflow" data-arg="${firstLive[0]}">${esc(firstLive[1].name)}</button>, ${firstLive[1].next}${coming.length > 1 ? `, and ${coming.length - 1} more` : ''}.</span><button class="linkbtn" data-act="go" data-arg="workflows">See all workflows</button></div>` : '';
    return `<div class="home">
      <div class="hello">
        <h1 tabindex="-1">Good morning, ${me().name}</h1>
        <p>Tuesday 27 October. ${line}</p>
        ${comingNext}
      </div>
      ${main}
      ${following}
      ${waitingOn.length ? `<section class="section"><h2>Waiting on others</h2><div class="rows">${waitingOn.map(([a, b, act, arg]) => `<button class="row-btn" data-act="${act}" data-arg="${arg}"><div><div class="row-name">${a}</div><div class="row-sub">${b}</div></div>${I.right(16)}</button>`).join('')}</div></section>` : ''}
      ${S.draft && S.conf === 'none' && me().op ? `<section class="section"><h2>Your drafts</h2><div class="rows"><button class="row-btn" data-act="go" data-arg="new"><div><div class="row-name">${S.wiz.intent ? esc(draftNr().name) : 'New workflow'}</div><div class="row-sub">${draftSub}</div></div>${I.right(16)}</button></div></section>` : ''}
      ${dayOne || S.showHow ? howItWorks() : '<p class="small muted" style="margin-top:32px"><button class="linkbtn" data-act="showHow">How it works</button></p>'}
    </div>`;
  }
  function firstRoutine() {
    return `<section class="section" aria-labelledby="first-h">
      <h2 id="first-h">Start your first workflow</h2>
      <p class="muted">Pick a ready-made one or describe your own. Nothing runs until you check the plan and turn it on.</p>
      <div class="starters">${STARTERS.map(([name, what, text, page]) => `<div class="starter"><h3>${name}</h3><p>${what}</p>${page ? `<button class="btn sm" data-act="go" data-arg="${page}">Add your software</button>` : `<button class="btn sm" data-act="starter" data-arg="${esc(text)}">Use this</button>`}</div>`).join('')}</div>
      <div><button class="btn primary" data-act="go" data-arg="new">${I.plus(18)}Describe your own</button></div>
    </section>`;
  }
  function howItWorks() {
    const steps = [
      ['Describe a task', 'In plain English, the way you would ask a colleague.'],
      ['Check what was understood', 'Fix anything that doesn’t match, then choose when it runs.'],
      ['Say yes in Teams', 'Nothing changes in Jira or Confluence until an Approver agrees.'],
      ['See the result here', 'If something stops, the AI troubleshooter tells you why.'],
    ];
    return `<section class="section" data-pres="how"><h2 id="how" tabindex="-1">How it works</h2><ol class="steps">${steps.map(([a, b]) => `<li><div><div class="what">${a}</div><div class="how">${b}</div></div></li>`).join('')}</ol></section>`;
  }

  function actionFor(id) {
    if (id === 'sw' && S.sw === 'waiting' && canApprove('sw')) return `<button class="btn primary sm" data-act="run" data-arg="sw">Review and decide</button>`;
    if (id === 'conf' && S.conf === 'waiting' && canApprove('conf')) return `<button class="btn primary sm" data-act="run" data-arg="conf">Review and decide</button>`;
    if (!me().op) return '';
    if (id === 'conf' && S.conf === 'expired') return `<button class="btn primary sm" data-act="testRun">Test it again</button>`;
    if (id === 'issues' && S.issues === 'failed') return `<button class="btn primary sm" data-act="run" data-arg="issues">Fix it</button>`;
    if (id === 'nudge' && S.nudge === 'failed' && S.report === 0) return `<button class="btn primary sm" data-act="report">Report to support</button>`;
    if (id === 'nudge' && S.nudge === 'failed' && S.report === 4) return `<button class="btn primary sm" data-act="retryNudge">Retry the run</button>`;
    return '';
  }

  const FILTERS = [['all', 'All'], ['needs', 'Needs you'], ['stopped', 'Stopped'], ['paused', 'Paused']];
  function boardView() {
    const ids = routineIds();
    const q = S.find.workflows.trim().toLowerCase();
    const shown = ids.filter((id) => {
      const r = R(id);
      if (q && !`${r.name} ${r.what}`.toLowerCase().includes(q)) return false;
      if (S.filter === 'needs') return !!actionFor(id);
      if (S.filter === 'stopped') return status(id).tone === 'bad';
      if (S.filter === 'paused') return !!S.paused[id];
      return true;
    });
    const order = shown.sort((a, b) => (actionFor(b) ? 1 : 0) - (actionFor(a) ? 1 : 0) || R(a).sort - R(b).sort);
    return `<div class="pagehead"><div><h1 tabindex="-1">Workflows</h1><p>Your team’s repeated tasks. Each one runs by itself and asks before it changes anything.</p></div></div>
      ${ids.length ? `<div class="findbar"><span class="findbox">${I.search()}<label class="vh" for="find-workflows">Find a workflow</label><input type="search" id="find-workflows" data-find="workflows" placeholder="Find a workflow" value="${esc(S.find.workflows)}"></span>
        <div class="filters btns" role="group" aria-label="Show">${FILTERS.map(([k, l]) => `<button data-act="filter" data-arg="${k}" aria-pressed="${S.filter === k}">${l}</button>`).join('')}</div></div>` : ''}
      ${ids.length === 0 && !me().op ? '<p class="quiet"><b>No workflows yet</b>An Operator sets them up. You approve their changes.</p>' : ''}
      ${ids.length && !order.length ? '<div class="quiet"><b>No workflows match</b>Try other words, or see them all.<div class="btns quiet-act"><button class="btn sm" data-act="clearFind" data-arg="workflows">Show all workflows</button></div></div>' : ''}
      ${(() => {
        let mainUsed = false;
        const rows = order.map((id, i) => {
          const r = R(id);
          let act = actionFor(id);
          if (act) { if (mainUsed) act = demote(act); mainUsed = true; }
          return `<li class="wf-row${S.paused[id] ? ' paused' : ''}" data-flip="wf:${id}" data-stagger style="--i:${i}">
            <span class="wf-pills">${pills(id)}</span>
            <div class="wf-main"><h2><button class="rcard-link" data-act="workflow" data-arg="${id}">${esc(r.name)}</button></h2><p>${status(id).last}</p></div>
            ${faces(r.agents, 26, agentStates(id), `wf:${id}`)}
            <span class="wf-next">Next: ${r.next}</span>
            <span class="wf-act">${act}</span>
          </li>`;
        }).join('');
        const add = me().op && !q && S.filter === 'all' ? `<li data-flip="wf:add"><button class="wf-add" data-act="go" data-arg="new">${I.plus(18)}<b>New workflow</b><span>Describe a task in plain English</span></button></li>` : '';
        return rows || add ? `<ul class="wf-list" aria-label="Workflows" data-flip-group="wf-list">${rows}${add}</ul>` : '';
      })()}`;
  }

  /* A plan's steps. Each step keeps its place by position, so a step that changes is highlighted, and an added or removed one slides the rest. */
  function stepsList(steps, inline, key = 'steps') {
    return `<ol class="steps${inline ? ' inline' : ''}" data-flip-group="${key}">${steps.map(([what, kind, how], i) => `<li data-flip="${key}:${i}"><div><div class="what" data-val="${key}:${i}">${what}</div><div class="how"><span class="tag ${kind || ''}">${how}</span></div></div></li>`).join('')}</ol>`;
  }

  /* What happened to one tool over time. The backend already records where each "ours" came from. */
  function history(key) {
    const by = nm(S.swBy);
    const found = (v, t) => (S.sw === 'waiting' ? `Found ${v}. Upgrade ticket proposed, waiting for a yes.` : S.sw === 'approved' ? `Found ${v}. ${t} created, approved by ${by}.` : `Found ${v}. Ticket declined by ${by}, so it is proposed again next Monday.`);
    return {
      lj: [['Mon 26 Oct', `${found('2.25.2', 'MOCK-16')} The Vulnerability checker found 4 known vulnerabilities in our version, one of them actively exploited, so the ticket is urgent.`], ['Thu 15 Oct', 'Added by Carol from Maven Central, with our version 2.14.1.']],
      lg: [['Mon 26 Oct', found('1.2.17', 'MOCK-14')], ['Thu 8 Oct', 'Our version set to 1.2.14, because MOCK-6 was marked Done.'], ['Mon 5 Oct', 'Found 1.2.14. MOCK-6 created, approved by Bob.'], ['Thu 1 Oct', 'Added by Alice with our version 1.2.11.']],
      fa: [['Mon 26 Oct', found('0.120.1', 'MOCK-15')], ['Thu 22 Oct', 'Our version set to 0.118.0, because MOCK-9 was marked Done.'], ['Mon 19 Oct', 'Found 0.118.0. MOCK-9 created, approved by Alice.'], ['Thu 1 Oct', 'Added by Alice. Our version was left empty, so the first check took 0.117.1.']],
      gr: [['Mon 26 Oct', 'Couldn’t check: Docker Hub didn’t answer, and GitHub’s hourly limit was reached. It tries again next Monday.'], ['Mon 19 Oct', 'Up to date at 12.1.0.'], ['Thu 1 Oct', 'Added by Carol with our version 12.1.0.']],
    }[key];
  }

  function schedEditor(id) {
    return `<div class="panel" style="margin-top:16px"><h2>Change schedule</h2>
      ${schedFields('sf', S.schedForm, S.schedErr)}
      <div class="btns"><button class="btn primary sm" data-act="saveSched" data-arg="${id}">Save</button><button class="btn sm" data-act="cancelSched">Cancel</button></div>
      ${id === 'sw' ? `<p class="note">Saving makes you the owner of this schedule. Its checks then count as your work, so you won’t be able to approve them.${apprOf('sw').steps.some((s) => s.first === S.user || s.backup === S.user) ? ' You’re one of its Approvers now, so you’d be taken off and need to choose someone else.' : ''}</p>` : ''}</div>`;
  }

  function softwareView() {
    const day1 = S.firstDay;
    const q = S.find.software.trim().toLowerCase();
    const hit = (name, repo) => !q || `${name} ${repo}`.toLowerCase().includes(q);
    const vulnNote = `<div class="src vuln">${I.alert(13)}<button class="linkbtn" data-act="toRisk" data-arg="lj">Critical security risk</button></div>`;
    const st = (key) => (S.sw === 'waiting' ? '<span class="pill wait">Ticket waiting for a yes</span>' : S.sw === 'approved' ? ticketBtn(key) : '<span class="pill off">Proposed again next Monday</span>');
    const needRows = (day1 ? [] : [
      { key: 'lj', name: 'Log4j core', kind: 'maven', repo: 'org.apache.logging.log4j:log4j-core', ours: '2.14.1', from: 'Given when added', newest: '2.25.2', cross: 'Maven Central and GitHub agree', status: `${st('MOCK-16')}${vulnNote}` },
      { key: 'lg', name: 'LangGraph', repo: 'langchain-ai/langgraph', ours: '1.2.14', from: 'From MOCK-6, marked Done', newest: '1.2.17', cross: 'GitHub and PyPI agree', status: st('MOCK-14') },
      { key: 'fa', name: 'FastAPI', kind: 'pypi', repo: 'fastapi', ours: '0.118.0', from: 'From MOCK-9, marked Done', newest: '0.120.1', cross: 'GitHub shows 0.120.2, not on PyPI yet. You install it from PyPI, so 0.120.1 counts.', status: st('MOCK-15') },
      { key: 'gr', name: 'Grafana', kind: 'docker', repo: 'grafana/grafana', ours: '12.1.0', from: 'Given when added', newest: '?', cross: 'Docker Hub and GitHub didn’t answer', status: `<span class="pill bad">${I.x(12)}Can’t check</span>` },
    ]).filter((r) => !S.removed.includes(r.key) && hit(r.name, r.repo));
    const newRows = S.added.map((a, i) => ({
      key: `add${i}`, name: a.name, kind: a.kind, repo: a.repo, ours: a.ours || '?', from: a.ours ? 'Given when added' : 'Taken from the first check', newest: '?',
      status: a.kind !== 'unknown' ? '<span class="pill off">Checked next Monday</span>'
        : a.suggest ? `<span class="pill wait">Source to confirm</span><div class="src suggest">The Version checker found it on the project’s official site: ${SOURCES[a.suggest[2] || 'github']} · ${srcLink(a.suggest[2], a.suggest[1], esc(a.suggest[1]))}.<span class="btns"><button class="btn sm" data-act="confirmSrc" data-arg="${i}">Confirm</button><button class="btn sm" data-act="chooseSrc" data-arg="${i}">Choose another</button></span></div>`
          : `<span class="pill bad">${I.x(12)}No trusted source found</span><div class="src suggest">The Version checker searched the vendor’s official site, but found no version list it can read.<span class="btns"><button class="btn sm" data-act="chooseSrc" data-arg="${i}">Choose where it’s published</button></span></div>`,
      hist: [['Today', `Added by ${nm(a.by)}. ${a.ours ? `Our version ${esc(a.ours)}.` : 'Our version was left empty, so the first check takes the newest.'}`]],
    })).filter((r) => !S.removed.includes(r.key) && hit(r.name, r.repo));
    const upToDate = UP_TO_DATE.filter((u) => hit(u, ''));
    const table = (rows, name) => `<div class="scroll-x"><table class="sw-table" role="table"><thead role="rowgroup"><tr role="row"><th role="columnheader">Software</th><th role="columnheader">Ours</th><th role="columnheader">Newest</th><th role="columnheader">Status</th><th role="columnheader"><span class="vh">Actions</span></th></tr></thead><tbody role="rowgroup" data-flip-group="swt:${name}">${rows.map((r) => {
      const open = S.swOpen === r.key;
      const hist = r.hist || history(r.key);
      return `<tr role="row" data-flip="sw:${r.key}"><td role="cell"><b>${esc(r.name)}</b><div class="src">${r.kind === 'unknown' ? 'Source not confirmed yet' : `${SOURCES[r.kind || 'github']} · ${srcLink(r.kind, r.repo, esc(r.repo))}`}</div></td><td role="cell" data-label="Ours" data-val="swv:${r.key}:ours">${esc(r.ours)}<div class="src">${r.from}</div></td><td role="cell" data-label="Newest" data-val="swv:${r.key}:new">${r.newest}${r.cross ? `<div class="src">${r.cross}</div>` : ''}</td><td role="cell" data-val="swv:${r.key}:st">${r.status}</td>
        <td role="cell" class="sw-acts"><button class="linkbtn" data-act="swHist" data-arg="${r.key}" aria-expanded="${open}"${open ? ` aria-controls="hist-${r.key}"` : ''}>${open ? 'Hide history' : 'History'}<span class="vh"> of ${esc(r.name)}</span></button>${me().op ? ` <button class="linkbtn" data-act="removeSw" data-arg="${r.key}">Remove<span class="vh"> ${esc(r.name)}</span></button>` : ''}</td></tr>
        ${open ? `<tr role="row" class="hist" id="hist-${r.key}" data-flip="swh:${r.key}" data-enter="reveal"><td role="cell" colspan="5"><ol class="timeline">${hist.map(([d, t]) => `<li><b>${d}</b><span>${t}</span></li>`).join('')}</ol></td></tr>` : ''}`;
    }).join('')}</tbody></table></div>`;
    const appr = has('sw') && S.sw === 'waiting';
    const r = R('sw');
    const owner = nm(S.swOwner);
    return `<div class="pagehead"><div><h1 tabindex="-1">Software watchlist</h1><p>Everything your team runs, in one list. Each check cross-checks versions, support dates and known vulnerabilities across trusted sources, and its upgrade tickets go out in one approval.</p></div>
        ${day1 ? '' : '<button class="btn" data-act="checkNow">Check now</button>'}</div>
      <div class="sched">${I.clock(20)}<div>${day1 ? '<b>Checks run every Monday at 9:00 once you add software.</b><span>Each check sends one approval for all its tickets.</span>' : `<b>${esc(r.name)} checks this list ${r.when.charAt(0).toLowerCase()}${r.when.slice(1)}, set by ${owner}.</b> Next check ${r.next}. <span>${TZ}. Scheduled checks count as ${owner}’s work, so ${owner} can’t approve them.</span><span>Who approves: ${apprText(apprOf('sw'))}.</span>`}</div>
        ${day1 || !me().op ? '' : `<div class="btns"><button class="btn sm" data-act="editSched" data-arg="sw">${I.edit()}Change schedule</button><button class="btn sm" data-act="editAppr" data-arg="sw">${I.edit()}Change who approves</button></div>`}</div>
      ${S.editing === 'sw' ? `<div data-flip="ed:s:sw" data-enter="reveal">${schedEditor('sw')}</div>` : ''}
      ${S.editingAppr === 'sw' ? `<div data-flip="ed:a:sw" data-enter="reveal">${apprEditor('sw')}</div>` : ''}
      ${appr ? `<div class="apprbar">${I.shield(20)}<div><b>This week’s check wants to raise 3 upgrade tickets, 1 of them urgent.</b><span>Started by Carol’s schedule, Mon 26 Oct, 9:00. ${askLine(req('sw'), S.user)}</span></div>${canApprove('sw') ? '<button class="btn primary sm" data-act="run" data-arg="sw">Review and decide</button>' : `<span class="note">Waiting for ${whoOr(req('sw').may)}</span>`}</div>` : ''}
      ${day1 ? '' : `<div class="findbar"><span class="findbox">${I.search()}<label class="vh" for="find-software">Find software</label><input type="search" id="find-software" data-find="software" placeholder="Find software" value="${esc(S.find.software)}"></span></div>`}
      ${needRows.some((x) => x.key === 'lj') ? `<section class="section"><h2>Security risks <span class="count">1</span></h2>${riskCard('lj', st('MOCK-16'))}</section>` : ''}
      ${needRows.length ? `<section class="section"><h2>Needs a person <span class="count" data-val="sw:need-n">${needRows.length}</span></h2><div class="panel">${table(needRows, 'need')}</div></section>` : ''}
      ${day1 ? '' : (() => { const ending = SUPPORT_ENDING.filter((x) => hit(x.name, '')); return ending.length ? `<section class="section"><h2>Support ending <span class="count">${ending.length}</span></h2><div class="panel"><p class="note">From endoflife.date, read by the Version checker. After these dates, these versions get no more fixes, including security fixes.</p><div class="rows">${ending.map((x) => `<div class="row"><div><div class="row-name">${x.name}</div><div class="row-sub">Security fixes end ${x.ends}, ${x.left}. ${extLink(`https://endoflife.date/${x.slug}`, 'Dates on endoflife.date', 'endoflife.date')}</div></div><span class="pill wait">${I.clock(12)}Plan an upgrade</span></div>`).join('')}</div></div></section>` : ''; })()}
      ${newRows.length ? `<section class="section"><h2>Not checked yet <span class="count" data-val="sw:new-n">${newRows.length}</span></h2><div class="panel">${table(newRows, 'new')}</div></section>` : ''}
      ${day1 ? (newRows.length ? '' : `<div class="quiet"><b>No software yet</b>Add the tools your team runs. Each one is checked every Monday for new versions and known vulnerabilities.${me().op ? '<div class="btns quiet-act"><button class="btn sm primary" data-act="focusAdd">Add your first software</button></div>' : ''}</div>`)
        : `<section class="section"><h2>Up to date <span class="count">${upToDate.length}</span></h2>${upToDate.length ? `<details${q ? ' open' : ''}><summary>Show all ${upToDate.length}</summary><div class="uptodate">${upToDate.map((u) => `<span class="tag">${u}</span>`).join('')}</div></details>` : '<p class="muted">None match.</p>'}</section>`}
      ${q && !needRows.length && !newRows.length && !upToDate.length ? '<div class="quiet"><b>Nothing matches</b>Try another name, or add it below.<div class="btns quiet-act"><button class="btn sm" data-act="clearFind" data-arg="software">Clear the search</button></div></div>' : ''}
      ${me().op ? `<section class="section"><h2>Add software</h2><div class="panel"><div class="addgrid">
          <div class="field"><label for="sw-name">Name</label><input type="text" id="sw-name" data-sw="name" value="${esc(S.swForm.name)}" placeholder="LangGraph"${fieldErr('sw-name', S.swErr.name)}</div>
          <div class="field"><label for="sw-kind">Published on</label><select id="sw-kind" data-sw="kind">${Object.entries(SOURCES).map(([v, l]) => opt(v, l, S.swForm.kind || 'github')).join('')}${opt('unknown', 'Not sure: let the Version checker find it', S.swForm.kind || 'github')}</select></div>
          ${(() => { const k = S.swForm.kind || 'github'; if (k === 'unknown') return '<div class="field"><span class="lab">Where it’s published</span><span class="help">The Version checker searches the vendor’s official site and suggests a source. You confirm it before any check uses it.</span></div>'; const [label, ph, help] = SRC_FIELD[k]; return `<div class="field"><label for="sw-repo">${label}</label><input type="text" id="sw-repo" data-sw="repo" value="${esc(S.swForm.repo)}" placeholder="${ph}"${fieldErr('sw-repo', S.swErr.repo, help)}</div>`; })()}
          <div class="field"><label for="sw-ours">Our version <span class="muted">(optional)</span></label><input type="text" id="sw-ours" data-sw="ours" value="${esc(S.swForm.ours)}" placeholder="1.2.14"${fieldErr('sw-ours', '', 'Left empty, the first check takes the newest.')}</div>
        </div><div class="btns"><button class="btn" data-act="addSoftware">Add</button></div></div></section>` : ''}
      <p class="note" style="margin-top:24px">Asking for a release or vulnerability check in New workflow adds the software here instead of making a new workflow.</p>`;
  }

  /* New workflow, step 2, when the task is a release check: the Planner sends it to the Software watchlist. */
  function releaseRedirect(text) {
    const hit = namedIn(text);
    const on = hit && onList(hit[0]);
    /* It says which word sent it here, so a person can tell when it guessed wrong. */
    const word = (text.match(RELEASE_WORDS) || [''])[0];
    const what = `You mentioned “${esc(word)}”, so I think ${isSecurityAsk(text) ? 'this is about known vulnerabilities in the software you run' : 'this is a release check'}`;
    const say = on
      ? `${hit[0]} is already on your Software watchlist, so it’s checked every Monday for new versions and known vulnerabilities. You don’t need a new workflow.`
      : `${what}. Your team keeps all its software in one list, the Software watchlist. Every Monday it’s checked for new versions and known vulnerabilities, and a critical vulnerability gets an urgent upgrade ticket. ${hit ? `I’ll add ${hit[0]} there instead of making a new workflow.` : 'You don’t need a new workflow.'}`;
    const card = hit && !on
      ? `<div class="panel"><h2>Add to the Software watchlist</h2><dl class="kv"><dt>Name</dt><dd>${hit[0]}</dd><dt>Published on</dt><dd>${SOURCES[hit[2] || 'github']} · ${srcLink(hit[2], hit[1], hit[1])}</dd><dt>Our version</dt><dd>Left empty, so the first check takes the newest</dd><dt>Checked</dt><dd>Every Monday at 9:00, with the rest of your software</dd></dl>
          <div class="btns"><button class="btn primary" data-act="addKnown" data-arg="${hit[0]}">Add ${hit[0]} to the watchlist</button></div></div>`
      : '<div class="btns"><button class="btn primary" data-act="go" data-arg="software">Open Software watchlist</button></div>';
    return `<div style="display:grid;gap:24px"><div class="bubble">${face('lead', 48, 'idle', { live: true })}<p><span class="vh">Planner: </span>${say}</p></div>
        <div class="panel who-checks">${faces(['checker', 'vuln'], 36)}<p><b>Who does the checking:</b> the Version checker reads each tool’s newest version from its official registry, cross-checks GitHub and checks support dates. The Vulnerability checker cross-checks OSV, NVD and vendor advisories, and CISA’s list of actively exploited vulnerabilities.</p></div>${card}
        <p class="note">One list means one check and one Teams approval a week, however many tools you add. Separate workflows would mean a separate approval for each tool.</p></div>
      <div class="wfoot"><button class="btn" data-act="wizBack">Back</button><button class="btn" data-act="notRelease">No, set it up as a new workflow</button></div>`;
  }

  /* What happened to a workflow in n8n: the warning when a change removed the yes step, and every published change. */
  function n8nWarn(id) {
    const chg = S.n8nChg[id];
    return chg ? `<article class="task" style="margin-top:16px" data-flip="n8nchg:${id}" data-enter="reveal"><span class="ico wait">${I.alert(22)}</span><div class="task-body"><h2 class="task-title">${nm(chg.by)}’s change in n8n removed Ask for a yes</h2><div class="task-meta">Published ${chg.when}</div><p>The next run will stop before it changes anything, because nothing is written without a yes.</p><div class="btns">${me().op ? `<button class="btn${actionFor(id) ? '' : ' primary'}" data-act="n8nUndo" data-arg="${id}">Undo ${nm(chg.by)}’s change</button>` : ''}</div></div></article>` : '';
  }
  function n8nPanel(id) {
    const held = S.n8n[id];
    return (S.n8nLog[id] || []).length ? `<div class="panel" style="margin-top:16px" data-pres="n8nlog:${id}"><h2>Changes in n8n</h2><ol class="timeline">${S.n8nLog[id].map((e) => `<li><b>${e.when}</b><span>${e.text}</span></li>`).join('')}</ol>${held && held.by === S.user ? '<div class="btns"><button class="btn sm" data-act="n8nGiveBack" data-arg="' + id + '">Give it back</button></div>' : ''}<p class="note">The Portal keeps every version published in n8n, with who published it.</p></div>` : '';
  }

  function routineView(id) {
    const r = R(id);
    const st = status(id);
    const hasRun = ['sw', 'issues', 'nudge'].includes(id) || (id === 'conf' && S.conf !== 'on');
    const caseId = S.supportCase ? S.supportCase.id : '';
    const recent = {
      sw: [['Mon 26 Oct, 9:00', cap(st.last.replace(/^Mon 26 Oct: /, '')), true], ['Mon 19 Oct, 9:00', '1 ticket created (MOCK-9)'], ['Mon 12 Oct, 9:00', 'Nothing to write']],
      issues: S.issues === 'fixed'
        ? [['Today, retry', 'No new bug reports. Nothing to write.', true], ['Today, 8:00', 'Stopped: GitHub couldn’t find langchain-ai/langserve.'], ['Mon 26 Oct, 8:00', '1 ticket created (MOCK-12)']]
        : [['Today, 8:00', 'Stopped: GitHub can’t find the project.', true], ['Mon 26 Oct, 8:00', '1 ticket created (MOCK-12)'], ['Fri 23 Oct, 8:00', 'Nothing to write']],
      nudge: S.nudge === 'fixed'
        ? [['Today, retry', 'Nothing to send. MOCK-31 listed for you.', true], ['Wed 21 Oct, 10:00', `Stopped on a ticket with no owner. Reported as ${caseId}.`], ['Wed 14 Oct, 10:00', '2 messages sent, approved by Bob']]
        : [['Wed 21 Oct, 10:00', S.report ? `Stopped on a ticket with no owner. Reported as ${caseId}.` : 'Stopped on a ticket with no owner.', true], ['Wed 14 Oct, 10:00', '2 messages sent, approved by Bob']],
      access: [['Mon 5 Oct, 9:00', '3 people lost access, approved by Bob, then Alice']],
      conf: S.conf === 'on' ? [] : [['Today, test run', cap(st.last.replace(/^Test run today: /, '')), true]],
    }[id];
    const manage = me().op && id !== 'sw' ? `<div class="rowacts">
        ${BASE[id] && BASE[id].fixedSchedule ? '' : `<button class="btn sm" data-act="editSched" data-arg="${id}">${I.edit()}Change schedule</button>`}
        <button class="btn sm" data-act="editAppr" data-arg="${id}">${I.edit()}Change who approves</button>
        <button class="btn sm" id="pause-${id}" data-act="${S.paused[id] ? 'resume' : 'pause'}" data-arg="${id}">${S.paused[id] ? `${I.play()}Resume` : `${I.pause()}Pause`}</button>
        <button class="btn sm" data-act="n8nAsk" data-arg="${id}">Open in n8n${I.ext(14)}</button>
        <button class="btn sm bad" data-act="askDelete" data-arg="${id}">${I.trash()}Delete</button></div>` : '';
    const held = S.n8n[id];
    const chg = S.n8nChg[id];
    return `<button class="back" data-act="go" data-arg="workflows">${I.left(16)}Workflows</button>
      <div class="pagehead"><div><div style="margin-bottom:8px">${pills(id)}</div><h1 tabindex="-1">${esc(r.name)}</h1><p>${r.what}</p></div><div class="btns">${actionFor(id)}</div></div>
      ${manage}
      <dl class="facts" style="margin-top:16px">
        <div><dt>When</dt><dd>${r.when}</dd></div>
        <div><dt>Next run</dt><dd>${r.next}</dd></div>
        <div><dt>Who approves</dt><dd>${r.approves}<small>${timingText(apprOf(id), r.sched)}</small></dd></div>
        <div class="fact-wide"><dt>Agents</dt><dd><div class="agent-chips">${r.agents.map((a) => { const st = agentStates(id)[a]; return `<button class="agent-chip" data-act="agent" data-arg="${a}">${face(a, 28, st || 'idle', { k: `wfp:${id}:${a}` })}<span>${AGENTS[a].name}${st ? `<span class="vh">, ${STATE_WORD[st]}</span>` : ''}</span></button>`; }).join('')}</div></dd></div>
        ${held ? `<div><dt>In n8n</dt><dd>${held.by === S.user ? 'You have it' : `${nm(held.by)} has it`}<small>Since ${held.since}</small></dd></div>` : ''}
      </dl>
      ${n8nWarn(id)}
      ${n8nPanel(id)}
      ${S.editing === id ? `<div data-flip="ed:s:${id}" data-enter="reveal">${schedEditor(id)}</div>` : ''}
      ${S.editingAppr === id ? `<div data-flip="ed:a:${id}" data-enter="reveal">${apprEditor(id)}</div>` : ''}
      ${id === 'nudge' && S.report > 0 && S.nudge === 'failed' ? `<div class="panel" style="margin-top:16px"><h2>Support case</h2>${caseBox()}${reportTrack(true)}</div>` : ''}
      <div class="runbody" style="margin-top:24px">
        <div class="panel"><h2>What it does</h2>${stepsList(planFor(id), false, `plan:${id}`)}</div>
        <div class="panel"><h2>Recent runs</h2>${S.editRun && S.editRun.wf === id ? `<div class="rows"><button class="row-btn" data-act="watch" data-arg="edit"><div><div class="row-name">Today, 9:15</div><div class="row-sub">Stopped before changing anything: Carol’s change removed Ask for a yes.</div></div><span class="btns small" style="font-weight:700">Watch ${I.right(16)}</span></button></div>` : ''}${recent.length ? `<div class="rows">${recent.map(([when, what, live]) => live && hasRun
          ? `<button class="row-btn" data-act="watch" data-arg="${id}"><div><div class="row-name">${when}</div><div class="row-sub">${what}</div></div><span class="btns small" style="font-weight:700">Watch ${I.right(16)}</span></button>`
          : `<div class="row"><div><div class="row-name">${when}</div><div class="row-sub">${what}</div></div></div>`).join('')}</div>` : `<p class="muted">No runs yet. The first one is ${r.next}.</p>`}</div>
      </div>`;
  }

  /* The live activity view of one run. */
  function runView(id) {
    const m = runModel(id);
    const r = R(m.workflow);
    const n = m.stations.length;
    const finished = P.at >= m.end;
    const stateOf = (s, i) => {
      if (i === m.fail && P.at >= i) return 'fail';
      if (s.skip && (P.at >= i || finished)) return 'skip';
      if (s.gate && i === m.end && m.state === 'waiting' && P.at >= i) return 'wait';
      if (s.gate && m.state === 'expired' && P.at >= i) return 'noans';
      if (i < P.at || (finished && i <= m.end)) return 'done';
      if (i === P.at) return 'now';
      return 'todo';
    };
    /* Each face says what that agent is doing in this run. Only the step running now moves. */
    const gi = m.stations.findIndex((s) => s.gate);
    const declined = (m.workflow === 'sw' && S.sw === 'declined') || (m.workflow === 'conf' && S.conf === 'declined');
    let lastAgent = -1;
    m.stations.forEach((s, i) => { if (i <= m.end && AGENTS[s.who] && !s.skip) lastAgent = i; });
    const faceOf = (s, i, st) => {
      if (st === 'now') return s.who === 'lead' ? 'thinking' : 'working';
      if (st === 'fail') return 'error';
      if (st === 'skip') return 'stopped';
      if (finished && i === gi - 1 && m.state === 'waiting') return 'waiting';
      if (finished && i === gi - 1 && m.state === 'expired') return 'stopped';
      if (finished && m.state === 'done' && !declined && i === lastAgent) return 'success';
      return 'idle';
    };
    const line = m.stations.map((s, i) => {
      const st = stateOf(s, i);
      const dot = s.gate ? (st === 'wait' ? I.lock(18) : st === 'noans' ? I.clock(18) : I.shield(18)) : st === 'done' ? I.check(14) : st === 'fail' ? I.x(14) : '';
      const sub = st === 'skip' ? 'Not needed' : st === 'fail' ? 'Stopped here' : st === 'wait' ? 'Waiting for a yes' : st === 'noans' ? 'No answer' : s.sub || '';
      const said = { done: 'Done: ', now: 'Now: ', todo: 'Not reached yet: ' }[st];
      return `<li class="st ${st}${s.gate ? ' gate' : ''}${i === P.at && P.shown < P.at ? ' arrive' : ''}"${st === 'now' ? ' aria-current="step"' : ''}><div class="st-who">${s.gate ? '' : whoAvatar(s.who, 44, faceOf(s, i, st), `st:${id}:${i}`)}</div><div class="st-dotwrap"><span class="st-dot">${dot}</span></div><div class="st-label">${said ? `<span class="vh">${said}</span>` : ''}${s.label}${sub ? `<small>${sub}</small>` : ''}</div></li>`;
    }).join('');
    const msgs = m.stations.slice(0, Math.min(P.at, m.end) + 1).map((s) => s.msg).filter(Boolean);
    P.feedNext = msgs.length;
    P.latest = msgs.length ? `${feedName(msgs[msgs.length - 1].who)}: ${msgs[msgs.length - 1].text}` : '';
    const chat = msgs.map((g, i) => chatItem(g, i >= P.feedSeen, m)).join('');
    /* While a finished run replays, the heading describes the replay, so it never claims "Done" before the line gets there. */
    const pillTone = !finished ? { tone: 'ok', label: 'Replaying' } : m.state === 'waiting' ? { tone: 'wait', label: 'Waiting for a yes' } : m.state === 'failed' ? { tone: 'bad', label: 'Stopped' } : m.state === 'expired' ? { tone: 'off', label: 'No answer' } : { tone: 'ok', label: 'Done' };
    const headline = finished ? m.headline : 'Replaying the run';
    return `<button class="back" data-act="workflow" data-arg="${m.workflow}">${I.left(16)}${m.workflow === 'sw' ? 'Software watchlist' : esc(r.name)}</button>
      <div class="runhead">
        <div class="runhead-top"><div class="runtitle"><h1 tabindex="-1">${headline}</h1>${finished ? pill(pillTone) : `<span class="tag">${I.play(12)}Replaying</span>`}</div>
          <div class="btns">${finished ? `<button class="btn sm" data-act="replay">${I.play(12)}Replay the run</button>` : ''}<div class="seg" role="group" aria-label="Speed">${['1x', '2x', 'instant'].map((sp) => `<button data-act="speed" data-arg="${sp}" aria-pressed="${P.speed === sp}">${sp === 'instant' ? 'Instant' : sp}</button>`).join('')}</div></div></div>
      </div>
      <div class="stage"><ol class="line" style="--n:${n}" aria-label="Steps of this run"><li class="line-track" aria-hidden="true"></li><li class="line-fill" aria-hidden="true" style="--f:${P.shown / (n - 1)}"></li>${line}</ol></div>
      <ol class="chat" aria-label="What the agents said">${chat}${finished ? chatAct(id, m) : chatTyping(m)}</ol>`;
  }

  const andList = (xs) => (xs.length < 2 ? xs.join('') : `${xs.slice(0, -1).join(', ')} and ${xs[xs.length - 1]}`);
  const chatAvatar = (w, state = 'idle') => (w === 'portal' || w === 'platform' ? `<span class="sysav app">${I.mark()}</span>` : w === 'gate' ? `<span class="sysav gate">${I.shield(20)}</span>` : face(w, 40, state));
  /* The run as a group chat. Events from the platform and the approval gate are quiet markers; agents speak in bubbles.
     When the Planner speaks, the agents it brings in join the chat. */
  function chatItem(g, isNew, m) {
    const cls = `${g.tone || ''}${isNew ? ' in' : ''}`;
    if (g.who === 'portal' || g.who === 'platform') return `<li class="chat-marker ${cls}"><span>${g.text}</span></li>`;
    if (g.who === 'gate') return `<li class="chat-marker gate-said ${cls}" data-gate="1" tabindex="-1"><span>${I.shield(14)}${g.text}</span></li>`;
    const joined = g.who === 'lead' ? R(m.workflow).agents.filter((a) => a !== 'lead') : [];
    return `<li class="cmsg ${cls}"><span class="cmsg-av">${face(g.who, 40, g.tone === 'bad' ? 'error' : 'idle', { k: `chat:${keyOf(g.text)}` })}</span><div class="cmsg-body"><span class="cmsg-who" style="color:${feedHue(g.who)}">${feedName(g.who)}</span><div class="cmsg-bubble">${g.text}</div></div></li>${joined.length ? `<li class="chat-marker${isNew ? ' in' : ''}"><span>${faces(joined, 22)}${andList(joined.map((a) => AGENTS[a].name))} joined</span></li>` : ''}`;
  }
  /* The last word goes to whoever needs the person: the approval gate with the buttons, the AI troubleshooter with the fix, or Workflow Builder when it's done. */
  function chatAct(id, m) {
    const w = m.state === 'waiting' || m.state === 'expired' ? 'gate' : m.state === 'failed' ? 'trouble' : 'portal';
    return `<li class="cmsg" id="decision" tabindex="-1" data-pres="act:${id}:${m.state}:${id === 'sw' ? S.sw : ''}"><span class="cmsg-av">${chatAvatar(w)}</span><div class="cmsg-body"><span class="cmsg-who"${w === 'trouble' ? ` style="color:${feedHue(w)}"` : ''}>${feedName(w)}</span>${actPanel(id, m)}</div></li>`;
  }
  /* While a run replays, the next speaker shows as working. */
  function chatTyping(m) {
    const next = m.stations.slice(P.at + 1, m.end + 1).find((s) => s.msg);
    if (!next) return '';
    return `<li class="cmsg typing" aria-hidden="true"><span class="cmsg-av">${chatAvatar(next.msg.who, next.msg.who === 'lead' ? 'thinking' : 'working')}</span><div class="cmsg-body"><span class="cmsg-who">${feedName(next.msg.who)} is working</span><div class="cmsg-bubble"><span class="dots"><i></i><i></i><i></i></span></div></div></li>`;
  }

  function approvePanel(id) {
    const ok = canApprove(id);
    const self = starterOf[id] === S.user;
    const sw = id === 'sw';
    const w = sw ? null : confWrite(S.nr);
    const body = sw
      ? RELEASES.map((x) => `<div class="ticket${x.urgent ? ' urgent' : ''}"><b>Upgrade ${x.tool} from ${x.from} to ${x.to}</b>${x.urgent ? `<span class="pill bad">${I.alert(12)}Urgent security fix</span><div class="risk compact">${riskFacts(x.row, true)}</div>` : ''}
          <span>Newest release ${x.date}. ${x.count} releases since our version, on ${SOURCES[x.kind || 'github']}.</span>
          ${x.urgent ? '' : `<span>${x.notes}</span>`}
          <span class="links">${ticketLinks(x)}</span></div>`).join('')
      : confPreview(S.nr);
    const q = req(id);
    const why = self ? `You started this run, so you can’t approve it. Nobody approves their own work. ${askLine(q, null)}`
      : me().ap ? `Only ${whoOr(q.may)} can decide this one. ${nm(OWNER[id]())} chose who approves this workflow.`
        : 'Only an Approver can decide.';
    return `<div class="panel"><h2>${sw ? '3 tickets will be created in Jira project MOCK' : w.panelTitle}</h2>
      ${body}
      <p class="note">This is exactly what will be written, and nothing else.</p>
      ${ok ? `${askLineHtml(q, S.user)}<div class="btns"><button class="btn good" data-act="approve" data-arg="${id}">${I.check(16)}${sw ? 'Approve 3 tickets' : w.approveLabel}</button><button class="btn bad" data-act="decline" data-arg="${id}">Decline</button></div>`
        : `<div class="lock">${I.lock(20)}<div>${why}</div></div>`}
      ${sw ? '<p class="note">You approve or decline the whole check. If you decline, nothing is written and the tickets are proposed again next Monday. Carol’s schedule started this run, so Carol can’t approve it.</p>' : ''}
    </div>`;
  }

  function actPanel(id, m) {
    if (m.state === 'waiting') return approvePanel(id);
    if (id === 'edit') {
      const wf = S.editRun.wf;
      const live = S.n8nChg[wf];
      return `<div class="panel">
        <dl class="qa"><dt>What happened</dt><dd>Carol’s change in n8n at 9:12 removed <b>Ask for a yes</b>. This run reached the step that makes changes without a yes, so it stopped there. Nothing was written.</dd></dl>
        <dl class="qa"><dt>What to do</dt><dd>${live ? 'Undo Carol’s change, or put the step back yourself in n8n.' : 'Carol’s change has been undone. The next run asks for a yes again.'}</dd></dl>
        ${live ? (me().op ? `<div class="btns"><button class="btn primary" data-act="n8nUndo" data-arg="${wf}">Undo Carol’s change</button><button class="btn" data-act="n8nAsk" data-arg="${wf}">Fix it in n8n${I.ext(14)}</button></div>` : '<p class="note">An Operator can undo the change.</p>') : ''}
      </div>`;
    }
    if (id === 'issues' && S.issues === 'failed') {
      return `<div class="panel">
        <dl class="qa"><dt>What happened</dt><dd>GitHub says <b>langchain-ai/langserve</b> doesn’t exist any more. Its page now points to <b>langchain-ai/langchain</b>.</dd></dl>
        <dl class="qa"><dt>What to do</dt><dd>Use the new name and run it again. You can do this yourself.</dd></dl>
        <div class="btns"><button class="btn primary" data-act="fixIssues">Use langchain-ai/langchain and retry</button></div>
      </div>`;
    }
    if (id === 'nudge' && S.nudge === 'failed') {
      return `<div class="panel">
        <dl class="qa"><dt>What happened</dt><dd>The step that reads tickets stopped on <b>MOCK-31</b>, which has no owner. The platform should skip a ticket like this, but it crashed.</dd></dl>
        <dl class="qa"><dt>What to do</dt><dd>This is a problem in the platform, not in your workflow, so you can’t fix it from here. Report it and support gets the run and this explanation.</dd></dl>
        ${S.report === 0 ? `<div class="btns">${me().op ? '<button class="btn primary" data-act="report">Report to support</button>' : '<p class="note">An Operator can report this to support.</p>'}</div>`
          : `<div data-pres="case:${S.supportCase.id}"><h3>Reported to support</h3>${caseBox()}${reportTrack(false)}${S.report === 4 && me().op ? '<div class="btns"><button class="btn primary" data-act="retryNudge">Retry the run</button></div>' : ''}</div>`}
      </div>`;
    }
    if (id === 'conf' && S.conf === 'expired') {
      const q = req('conf');
      return `<div class="panel"><h2>No answer</h2>
        <p>${whoAnd(askedOf(q))} didn’t answer by ${at(q.expiresAt)}, so the request stopped. Nothing was written. A request never says yes by itself.</p>
        ${me().op ? `<div class="btns"><button class="btn primary" data-act="testRun">Do a test run again</button><button class="btn" data-act="apprFromRun" data-arg="conf">Change who approves</button></div>` : ''}</div>`;
    }
    const done = {
      sw: S.sw === 'approved'
        ? `<h2><span class="ok-mark">${I.check(18)}</span>Done</h2><p>${nm(S.swBy)} approved, and the platform created the tickets.</p><div class="result-chips">${ticketBtn('MOCK-16', 'Log4j core')}${ticketBtn('MOCK-14', 'LangGraph')}${ticketBtn('MOCK-15', 'FastAPI')}</div>`
        : `<h2>Declined</h2><p>${nm(S.swBy)} declined, so nothing was written. The tickets will be proposed again next Monday.</p>`,
      issues: `<h2><span class="ok-mark">${I.check(18)}</span>Fixed</h2><p>The workflow now reads <b>langchain-ai/langchain</b>. No new bug reports today, so there was nothing to write.</p>`,
      nudge: `<h2><span class="ok-mark">${I.check(18)}</span>Back to normal</h2><p>The fix from support is live. MOCK-31 has no owner, so it was listed for you instead of crashing the run.</p>`,
      conf: S.conf === 'declined' ? `<h2>Declined</h2><p>${nm(S.confBy)} declined, so nothing was written. Change what it does, or run the test again.</p>${me().op ? '<div class="btns"><button class="btn primary" data-act="testRun">Do a test run again</button></div>' : ''}`
        : S.nr ? `<h2><span class="ok-mark">${I.check(18)}</span>Done</h2><p>${confYesWho()} approved, and the platform ${confWrite(S.nr).doneText}.</p><div class="result-chips"><span class="pill ok">${I.check(12)}${confWrite(S.nr).result}</span></div>` : '',
    }[id];
    return `<div class="panel">${done}<div class="btns"><button class="btn" data-act="go" data-arg="home">Back to Home</button></div></div>`;
  }

  /* ---------- New workflow ---------- */
  const STEP_NAMES = ['Describe it', 'Check what I understood', 'When and who', 'Turn it on'];
  function stepper() {
    return `<ol class="stepper" aria-label="Steps">${STEP_NAMES.map((t, i) => `<li class="${i + 1 < S.wiz.step ? 'done' : i + 1 === S.wiz.step ? 'now' : ''}"${i + 1 === S.wiz.step ? ' aria-current="step"' : ''}><div>${i + 1}.<span> ${t}</span></div></li>`).join('')}</ol><p class="stepnow">Step ${S.wiz.step} of 4: ${STEP_NAMES[S.wiz.step - 1]}</p>`;
  }
  function toolCard() {
    const ok = S.tool === 'ok';
    const state = ok ? `${I.check(16)} OK’d by Bob. Your team can use it now.` : S.tool === 'asked' ? `${I.lock(16)} Waiting for an Approver to OK it` : `${I.tool(18)} This workflow needs something new`;
    return `<div class="toolcard ${ok ? 'ok' : ''}">
      <div class="toolcard-head"><span class="btns" style="gap:8px">${state}</span></div>
      <div class="toolcard-body">
        <h3 style="font-size:1.2rem">Update a Confluence page</h3>
        <p>Your team’s workflows can’t write to Confluence yet. I’ve prepared what’s needed, so an Approver can check it.</p>
        <dl class="kv">
          <dt>What it will do</dt><dd>Add each new summary to the top of the Weekly summary page. Earlier weeks stay on the page.</dd>
          <dt>What it can change</dt><dd>Only the page saved on the workflow. Nothing else in Confluence.</dd>
          <dt>When it changes anything</dt><dd>Only after an Approver says yes to the exact text, every time.</dd>
          <dt>Why it needs an OK</dt><dd>It’s new and it changes data, so an Approver who isn’t you must OK it once. After that, anyone on your team can use it.</dd>
        </dl>
        <details class="tech"><summary>Technical details</summary><ul class="checks">
          <li>${I.check(16)}<span>Uses one call from Confluence’s published API: update a page.</span></li>
          <li>${I.check(16)}<span>Counted as a change, so it can never skip approval.</span></li>
          <li>${I.check(16)}<span>Limited to the page saved on the workflow.</span></li>
          <li>${I.check(16)}<span>A trial read worked: found Weekly summary in Team space, last edited 23 Oct.</span></li>
          <li>${I.check(16)}<span>Runs on the platform’s own tested runner. No code written by the AI runs.</span></li>
        </ul></details>
        ${S.tool === 'none' ? '<div class="btns"><button class="btn primary" data-act="askTool">Ask an Approver to OK it</button></div>' : ''}
        ${S.tool === 'asked' ? '<p class="note">Bob and 2 other Approvers can OK it, and they’ve had a message in Teams. Your draft is saved on Home, so you can leave this page. You’ll see it there when it’s OK’d.</p>' : ''}
      </div></div>`;
  }
  const lc = (s) => s.charAt(0).toLowerCase() + s.slice(1);
  const CHIP_HINT = { ok: 'from your words', changed: 'changed by you', missing: 'please choose', cant: 'can’t do this yet', later: 'you’ll choose next' };
  function sentenceChip(r, text) {
    const hint = CHIP_HINT[r.state];
    if (!r.options) return `<span class="schip ${r.state}" title="${cap(hint)}">${text}</span>`;
    const inOpts = r.options.some(([v]) => v === r.selected);
    return `<span class="schip ${r.state}" title="${cap(hint)}"><span data-val="chip:${r.key}">${text}</span>${I.down(14)}<select id="fix-${r.key}" data-fix="${r.key}" aria-label="${r.label}: ${r.value ? esc(r.value) : 'not sure'}, ${hint}. Change it">${opt('', r.value ? 'Change…' : 'Choose…', inOpts ? null : '')}${r.options.map(([v, l]) => opt(v, l, inOpts ? r.selected : null)).join('')}</select></span>`;
  }
  /* What the Planner understood, as one sentence. Notes under it say what's missing, changed or not possible. */
  function understoodSentence(rows) {
    const k = Object.fromEntries(rows.map((r) => [r.key, r]));
    const chip = (key, fallback) => sentenceChip(k[key], k[key].value ? lc(esc(k[key].value)) : fallback);
    const notes = rows.filter((r) => r.note && !(r.key === 'when' && r.state === 'ok'));
    const icon = { cant: I.alert(16), missing: I.alert(16), later: I.clock(16), changed: I.edit(16), ok: I.info(16) };
    const glue = (html, mark) => `<span class="glue">${html}${mark}</span>`;
    return `<p class="sentence-line">${glue(sentenceChip(k.when, k.when.value ? esc(k.when.value) : 'On a schedule you choose next'), ',')} find ${chip('tickets', 'which tickets')} and ${glue(chip('action', 'what it does'), '.')} Then ${glue(chip('dest', 'where it goes'), '.')}</p>
      ${notes.length ? `<ul class="snotes">${notes.map((r) => `<li class="${r.state}">${icon[r.state]}<span><b>${r.label}:</b> ${r.note}</span></li>`).join('')}</ul>` : ''}`;
  }
  function checkList() {
    const w = S.wiz;
    const it = w.intent;
    const f = draftNr();
    const s = w.sched;
    const rows = [];
    const asked = whenAsked(it);
    const same = it.freq === s.freq && (s.freq !== 'week' || it.day === s.day) && it.time === s.time;
    rows.push(same ? ['ok', `When: ${schedText(s)}, as you asked.`] : asked ? ['changed', `When: ${schedText(s)}. You asked for “${asked}”.`] : ['changed', `When: ${schedText(s)}. You chose this.`]);
    const cmp = (label, val, askedVal, askedLabel) => (askedVal && val === askedLabel ? ['ok', `${label}: ${val}, as you asked.`] : askedVal ? ['changed', `${label}: ${val}. You asked for: ${askedLabel}.`] : ['changed', `${label}: ${val}. You chose this.`]);
    rows.push(cmp('Which tickets', ticketLabel(f.tickets, f.days), it.tickets, it.tickets ? ticketLabel(it.tickets.kind, f.days) : ''));

      { ex: 'Remind managers who haven’t answered after 3 working days', re: /remind|chase|follow|again|days/i, add: 'Remind managers who haven’t answered after 3 working days. The reminders wait for a yes too', effect: 'Mon 5 Oct: 2 managers answered late, so they would have had a reminder.' },
    ],
  };
  function suggestChange(id, text) {
    if (UNSAFE.test(text)) return { type: 'refuse' };
    const c = (CHANGES[id] || []).find((x) => x.re.test(text));
    if (!c) return { type: 'unclear' };
    if (c.team) return { type: 'team', sys: c.team, why: c.why };
    if (c.target) return { type: 'target' };
    const plan = agentNow(id).plan.slice();
    if (c.tool) {
      if (!toolLive(c.tool)) return { type: 'tool', tool: c.tool };
      const raw = agentNow(id).tools || LIB(id).tools;
      if (raw.includes(c.tool) && plan[c.step] === c.to) return { type: 'same' };
      const from = plan[c.step];
      plan[c.step] = c.to;
      return { type: 'change', plan, changed: c.step, from, effect: c.effect, tools: raw.includes(c.tool) ? null : raw.concat(c.tool), addTool: raw.includes(c.tool) ? null : c.tool };
    }
    if (c.add) {
      if (plan.includes(c.add)) return { type: 'same' };
      const at = /approval gate|wait for a yes|needs 2 Approvers/.test(plan[plan.length - 1]) ? plan.length - 1 : plan.length;
      plan.splice(at, 0, c.add);
      return { type: 'change', plan, changed: at, added: true, effect: c.effect };
    }
    if (plan[c.step] === c.to) return { type: 'same' };
    const from = plan[c.step];
    plan[c.step] = c.to;
    return { type: 'change', plan, changed: c.step, from, effect: c.effect };
  }

  function toolsList(keys) {
    return `<ul class="tool-list">${keys.map((k) => { const [n, kind] = TOOLS[k]; return `<li><span class="tag ${kind}">${kind === 'read' ? 'Reads' : 'Changes data'}</span><button class="linkbtn" data-act="toolOpen" data-arg="${k}">${n}</button></li>`; }).join('')}</ul>`;
  }
  const toolKeysOf = (id) => (agentNow(id).tools || LIB(id).tools).filter(toolLive);
  const agentTools = (a) => toolKeysOf(a.id).map((t) => TOOLS[t]);
  const agentUsedBy = (id) => routineIds().filter((w) => (R(w).agents || []).includes(id));
  const usedByText = (a) => (a.id === 'lead' ? 'Plans every workflow.' : a.id === 'trouble' ? 'Steps in whenever a run stops.'
    : agentUsedBy(a.id).length ? `Used by ${agentUsedBy(a.id).map((w) => `<button class="linkbtn" data-act="agentWorkflow" data-arg="${w}">${esc(R(w).name)}</button>`).join(', ')}.` : 'Not used by any workflow yet.');
  const versionText = (id) => { const n = agentNow(id); return n.v > 1 ? `Version ${n.v}, changed by ${n.by} ${n.when.toLowerCase()}` : `Version 1. ${LIB(id).made || 'Ships with the platform'}`; };

  const visibleAgents = () => LIBRARY.filter((a) => a.id !== 'summary' || (S.nr && S.nr.action !== 'nudge' && has('conf')));
  function libraryView() {
    const list = visibleAgents();
    const card = (a, i) => {
      const tools = agentTools(a);
      return `<article class="agent-lg" data-stagger style="--i:${i}">
        <div class="agent-top">${face(a.id, 52)}<div><h3><button class="rcard-link" data-act="agent" data-arg="${a.id}">${AGENTS[a.id].name}</button></h3>${AGENTS[a.id].role ? `<span class="agent-role">${AGENTS[a.id].role}</span>` : ''}</div></div>
        <p>${a.what}</p>
        <p class="small">${!tools.length ? '<span class="tag">No access to other systems</span>' : `${tools.some((t) => t[1] === 'write') ? '<span class="tag write">Changes data after a yes</span>' : '<span class="tag read">Reads only</span>'} <span class="muted">${tools.length === 1 ? '1 tool' : `${tools.length} tools`}</span>`}</p>
        <p class="small muted">${usedByText(a)}</p>
        ${agentNow(a.id).v > 1 ? `<p class="small"><span class="tag">Changed</span> ${versionText(a.id)}</p>` : ''}
        <div class="btns"><button class="btn sm" data-act="agent" data-arg="${a.id}">${canChangeAgent(a.id) ? 'Details and changes' : 'Details'}</button></div>
      </article>`;
    };
    const specialists = list.filter((a) => !a.platform);
    const tab = S.libTab;
    const head = `<div class="pagehead"><div><h1 tabindex="-1">Agent library</h1><p>${tab === 'tools' ? 'Tools are how agents reach other systems. An agent can use only the tools on its card, and a tool that changes data waits for a yes, every time.' : 'The agents your team can use. For each workflow, the Planner picks the ones it needs. An agent can use only the tools on its card, and anything that changes data waits for a yes.'}</p></div></div>
      <div class="seg lib-tabs" role="group" aria-label="Show">${[['agents', 'Agents', list.length], ['tools', 'Tools', Object.keys(TOOLS).filter(toolLive).length]].map(([k, l, n]) => `<button data-act="libTab" data-arg="${k}" aria-pressed="${tab === k}">${l} <span class="seg-n">${n}</span></button>`).join('')}</div>`;
    if (tab === 'tools') return head + toolsTab();
    return `${head}
      <section class="section"><h2>Platform agents</h2><div class="agentgrid duo">${list.filter((a) => a.platform).map(card).join('')}</div></section>
      <section class="section"><h2>Specialist agents <span class="count">${specialists.length}</span></h2><div class="agentgrid">${specialists.map(card).join('')}</div></section>
      <p class="note" style="margin-top:24px">Open an agent to see how it works and to change it in plain English. New agents come from New workflow: when you describe a task that none of these fits, the Planner drafts a new agent card for you to check and save.</p>`;
  }

  /* ---------- Tools: what each agent can reach, linked both ways with the agents ---------- */
  const toolUsers = (k) => visibleAgents().filter((a) => toolKeysOf(a.id).includes(k));
  const toolWorkflows = (k) => { const ids = toolUsers(k).map((a) => a.id); return routineIds().filter((w) => (R(w).agents || []).some((id) => ids.includes(id))); };
  const sentToTeam = (sys) => S.teamReqs.some((q) => q.sys === sys);
  function toolLog(k) {
    if (S.firstDay) return [];
    const l = TOOL_INFO[k].log.slice();
    if (k === 'jiraCreate' && S.sw === 'approved') l.unshift(['Today', `Created MOCK-14, MOCK-15 and MOCK-16 for Keep our software up to date. ${nm(S.swBy)} said yes.`]);
    if (k === 'jiraRead' && S.report === 4) l.unshift(['Today', `Fixed by Dana, case ${S.supportCase.id}. Tickets with no owner can be read now.`]);
    return l;
  }
  function toolHealth(k) {
    const i = TOOL_INFO[k];
    const fixed = k === 'jiraRead' && S.report === 4;
    if (S.toolChecks[k] === 'done') return i.checkBad && !fixed && !S.firstDay ? { ok: false, text: `Checked just now. ${i.checkBad}` } : { ok: true, text: `Checked just now. ${i.check}` };
    if (i.problem && !fixed && !S.firstDay) return { ok: false, text: i.problem + (k === 'jiraRead' && S.report > 0 ? ` Reported to support as case ${S.supportCase.id}.` : '') };
    const l = toolLog(k);
    return { ok: true, text: l.length ? `Last used ${l[0][0].replace(/, \d+:\d+$/, '').replace('Today', 'today')}.` : 'Ready. Not used yet.' };
  }
  function toolRow(k) {
    const [n, kind, x] = TOOLS[k];
    const users = toolUsers(k);
    const st = toolState(k);
    const h = st === 'ok' ? toolHealth(k) : null;
    return `<li class="tool-row">
      <div class="tool-name"><button class="rcard-link" data-act="toolOpen" data-arg="${k}">${n}</button><span class="small muted">${TOOL_INFO[k].sys}</span></div>
      <span class="small">${kind === 'write' ? `<span class="tag write">Needs a yes</span> <span class="muted">${x}</span>` : '<span class="tag read">Reads only</span>'}</span>
      <span class="small tool-users">${users.length ? `<span class="muted">Used by </span>${users.map((a) => AGENTS[a.id].name).join(', ')}` : '<span class="muted">No agent uses it yet</span>'}</span>
      ${h ? `<span class="health ${h.ok ? 'ok' : 'warn'}">${h.ok ? I.check(14) : I.alert(14)}${h.ok ? 'Working' : 'Had a problem'}</span>` : `<span class="pill wait">${st === 'asked' ? 'Waiting for an OK' : 'Draft, not sent'}</span>`}
    </li>`;
  }
  function toolsTab() {
    const live = Object.keys(TOOLS).filter(toolLive);
    const pending = ['confluence', 'jiraComp'].filter((k) => toolState(k) === 'asked' || (k === 'jiraComp' && S.jiraComp === 'draft' && me().op));
    const sec = (title, sub, keys) => (keys.length ? `<section class="section"><h2>${title} <span class="count">${keys.length}</span></h2><p class="small muted sec-sub">${sub}</p><ul class="tool-rows">${keys.map(toolRow).join('')}</ul></section>` : '');
    const team = S.teamReqs.length ? `<section class="section"><h2>Asked the team <span class="count">${S.teamReqs.length}</span></h2><p class="small muted sec-sub">New systems and anything that deletes data are the team’s decision.</p><ul class="tool-rows">${S.teamReqs.map((q) => `<li class="tool-row team"><div class="tool-name"><b>${esc(q.sys)}</b><span class="small muted">“${esc(q.text)}” Asked by ${q.by} today${q.for ? ` for the ${AGENTS[q.for].name}` : ''}.</span></div><span class="pill wait">With the team</span></li>`).join('')}</ul></section>` : '';
    return sec('Waiting for an OK', 'New tools the Planner drafted. Each one changes data, so an Approver must OK it once before any agent can use it.', pending)
      + sec('Tools that change data', 'Each one waits for a yes, every time.', live.filter((k) => TOOLS[k][1] === 'write'))
      + sec('Tools that only read', 'They never change anything, so they don’t need a yes.', live.filter((k) => TOOLS[k][1] === 'read'))
      + team + (me().op ? toolAskPanel() : '');
  }

  /* Asking for a tool in plain English. The Planner checks the tools you have first. A new tool on a system that's
     already connected is drafted for an Approver's OK. A new system, or deleting data, goes to the team. */
  const TOOL_ASKS = [
    { ex: 'Set a component on new Jira tickets', re: /component|label|epic|priorit|assignee|fix version/i, draft: 'jiraComp' },
    { ex: 'Open a ticket in ServiceNow', re: /servicenow|service now|slack|outlook|e-?mail|sharepoint|\bgo\b|golang|\baws\b|azure devops|jenkins|bitbucket/i, team: true },
    { ex: 'Find Jira tickets by status', re: /jira|ticket/i, exists: (t) => (/create|raise|open|new|add/i.test(t) ? 'jiraCreate' : 'jiraSearch') },
    { re: /confluence/i, exists: () => 'confluence' },
    { re: /teams|message|post/i, exists: () => 'teamsPost' },
    { re: /github|bug report|issue/i, exists: (t) => (/release|version/i.test(t) ? 'ghReleases' : 'ghIssues') },
    { re: /version|release|registry|maven|npm|pypi|nuget|docker/i, exists: () => 'registries' },
    { re: /vulnerab|cve|security/i, exists: () => 'vulns' },
  ];
  const SYS_NAMES = [[/servicenow|service now/i, 'ServiceNow'], [/slack/i, 'Slack'], [/outlook|e-?mail/i, 'Outlook email'], [/sharepoint/i, 'SharePoint'], [/\bgo\b|golang/i, 'Go modules'], [/\baws\b/i, 'AWS'], [/azure devops/i, 'Azure DevOps'], [/jenkins/i, 'Jenkins'], [/bitbucket/i, 'Bitbucket']];
  function askForTool(text) {
    if (UNSAFE.test(text)) return { type: 'refuse' };
    if (/delete|erase|wipe|purge/i.test(text)) return { type: 'team', sys: 'Deleting data', del: true };
    const c = TOOL_ASKS.find((x) => x.re.test(text));
    if (!c) return { type: 'unclear' };
    if (c.draft) return toolLive(c.draft) ? { type: 'exists', key: c.draft } : { type: 'draft', key: c.draft };
    if (c.team) return { type: 'team', sys: SYS_NAMES.find(([re]) => re.test(text))[1] };
    const key = c.exists(text);
    return toolLive(key) ? { type: 'exists', key } : { type: 'newwf', key };
  }
  function toolAskPanel() {
    const d = S.toolAsk;
    const r = d.result;
    const say = (html) => `<div class="bubble small-bubble">${face('lead', 40)}<p><span class="vh">Planner: </span>${html}</p></div>`;
    let reply = '';
    if (r) {
      const users = r.key ? toolUsers(r.key) : [];
      const msg = {
        exists: r.key ? `That’s already here: <b>${TOOLS[r.key][0]}</b>.${users.length ? ` The ${users.map((a) => AGENTS[a.id].name).join(' and ')} ${users.length > 1 ? 'use' : 'uses'} it.` : ' No agent uses it yet.'}` : '',
        draft: r.key ? (toolState(r.key) === 'asked' ? `I’ve already drafted <b>${TOOLS[r.key][0]}</b>. It’s waiting for an Approver’s OK.` : `I can draft this from Jira’s published API: <b>${TOOLS[r.key][0]}</b>. It changes data, so an Approver who isn’t you must OK it once. Nothing changes until then.`) : '',
        newwf: 'Writing to Confluence comes up when you set up a workflow that needs it. Start it in New workflow, and I’ll draft the tool there.',
        team: r.del ? `Tools that delete things aren’t drafted here, because deleting can’t be undone. ${sentToTeam(r.sys) ? 'You’ve already sent this to the team.' : 'I can send your request to the team.'}`
          : `${r.sys} isn’t connected to the platform yet. A new system is a new outside service, so the team decides on it first. ${sentToTeam(r.sys) ? 'You’ve already sent this to the team.' : 'I can send your request to the team.'}`,
        refuse: 'I can’t draft a tool that skips a yes. Anything that changes data waits for a yes, every time. That’s a platform rule.',
        unclear: `I couldn’t tell which system it’s for, or what it should do. Try, for example: “${TOOL_ASKS[0].ex}”.`,
      }[r.type];
      const btn = r.type === 'exists' ? `<button class="btn" data-act="toolOpen" data-arg="${r.key}">Open ${TOOLS[r.key][0]}</button>`
        : r.type === 'draft' ? `<button class="btn primary" data-act="toolDraft" data-arg="${r.key}">${toolState(r.key) === 'asked' ? 'See the request' : 'See the draft'}</button>`
          : r.type === 'newwf' ? '<button class="btn" data-act="go" data-arg="new">Go to New workflow</button>'
            : r.type === 'team' && !sentToTeam(r.sys) ? `<button class="btn" data-act="teamReq" data-arg="${r.sys}|ask">Send to the team</button>` : '';
      reply = `<div class="proposal" id="tool-reply" tabindex="-1">${say(msg)}${btn ? `<div class="btns">${btn}</div>` : ''}</div>`;
    }
    return `<section class="section"><div class="agent-change tool-ask"><h2>Need a tool that isn’t here?</h2>
      <p class="small muted">Say what an agent should be able to do, in plain English. The Planner checks the tools you have first. If it’s new, the Planner drafts it for an Approver to OK, or sends your request to the team.</p>
      <div class="field"><label class="vh" for="tool-ask">What should the tool do?</label><textarea id="tool-ask" data-toolask="text" rows="2" placeholder="For example: ${esc(TOOL_ASKS[0].ex)}"${fieldAttrs('tool-ask', d.err)}>${esc(d.text)}</textarea>${fieldNotes('tool-ask', d.err)}</div>
      <div class="chips">${TOOL_ASKS.filter((x) => x.ex).map((x) => `<button class="chip" data-act="toolAskChip" data-arg="${esc(x.ex)}">${x.ex}</button>`).join('')}</div>
      <div class="btns"><button class="btn primary" data-act="toolAskGo">Ask the Planner</button></div>
      ${reply}
    </div></section>`;
  }

  const backBtn = () => { const top = S.modalBack[S.modalBack.length - 1]; return top ? `<button class="back dlg-back" data-act="modalBack">${I.left(16)}Back to ${top.kind === 'agent' ? AGENTS[top.arg].name : TOOLS[top.arg][0]}</button>` : ''; };
  /* One tool, in a dialog: what it does and can't do, whether it's working, which agents use it, and what it did. */
  function toolDialog(k) {
    const [n, kind, x] = TOOLS[k];
    const i = TOOL_INFO[k];
    const st = toolState(k);
    const head = `${backBtn()}<div class="agent-top"><span class="tool-ic lg ${kind}">${I.tool(26)}</span><div><h2 id="dlg-h">${n}</h2><span class="agent-role">${i.sys}</span></div><button class="iconbtn dlg-close" data-act="closeModal" aria-label="Close">${I.x(18)}</button></div>`;
    if (st !== 'ok') {
      const asker = k === 'jiraComp' ? S.jiraCompAsker : 'alice';
      let act = '';
      if (st !== 'asked' && me().op) act = `<div class="btns"><button class="btn primary" data-act="toolSend" data-arg="${k}">Ask an Approver to OK it</button></div>`;
      else if (st === 'asked' && canOkTool() && S.user !== asker) act = `<div class="btns"><button class="btn bad" data-act="toast" data-arg="${nm(asker)} gets a Teams message that you said not now.">Not now</button><button class="btn good" data-act="toolOk" data-arg="${k}">${I.check(16)}OK this tool</button></div>`;
      else if (st === 'asked') act = `<p class="note">${S.user === asker ? 'You asked for this tool, so you can’t OK it. ' : ''}Bob and 2 other Approvers can OK it, and they’ve had a message in Teams.</p>`;
      return `<div class="agent-dlg">${head}
        <div>${st === 'asked' ? `<span class="pill wait">${I.lock(12)}Waiting for an Approver to OK it</span>` : `<span class="pill">${I.tool(12)}Draft, not sent yet</span>`}</div>
        <p>${i.does}</p>
        <dl class="kv"><dt>What it will do</dt><dd>${i.will}</dd><dt>What it can change</dt><dd>${i.change}</dd><dt>When it changes anything</dt><dd>${i.when}</dd><dt>Why it needs an OK</dt><dd>${i.why}</dd></dl>
        <details class="tech"><summary>Technical details</summary><ul class="checks">${i.tech.map((t) => `<li>${I.check(16)}<span>${t}</span></li>`).join('')}</ul></details>
        ${act}
      </div>`;
    }
    const h = toolHealth(k);
    const chk = S.toolChecks[k];
    const users = toolUsers(k);
    const wfs = toolWorkflows(k);
    const log = toolLog(k);
    const rule = kind === 'read' ? 'Only reads, so it never needs a yes' : `Needs a yes from ${x}, every time. No agent or workflow can lower that`;
    const give = k === 'jiraComp' && !users.length && me().op ? '<div class="btns"><button class="btn primary" data-act="toolAddTo" data-arg="writer">Give it to the Ticket writer</button></div>' : '';
    return `<div class="agent-dlg">${head}
      <p>${i.does}</p>
      <div class="tool-status ${h.ok ? 'ok' : 'warn'}"><div><span class="health ${h.ok ? 'ok' : 'warn'}">${h.ok ? I.check(16) : I.alert(16)}${h.ok ? 'Working' : 'Had a problem'}</span><p class="small">${h.text}</p></div>
        <button class="btn sm" data-act="toolCheck" data-arg="${k}"${chk === 'checking' ? ' disabled' : ''}>${chk === 'checking' ? 'Checking…' : 'Check it works'}</button></div>
      <div class="agent-cols">
        <section><h3>${kind === 'read' ? 'What it can reach' : 'What it can change'}</h3><ul class="checks"><li>${I.shield(16)}<span>${rule}</span></li><li>${I.shield(16)}<span>${i.reach}</span></li></ul></section>
        <section><h3>What it can’t do</h3><ul class="checks cant">${i.cant.map((c) => `<li>${I.x(14)}<span>${c}</span></li>`).join('')}</ul></section>
      </div>
      <section><h3>Agents that use it</h3>${users.length ? `<div class="agent-chips">${users.map((a) => `<button class="agent-chip" data-act="agent" data-arg="${a.id}">${face(a.id, 32)}<span>${AGENTS[a.id].name}</span></button>`).join('')}</div>${wfs.length ? `<p class="small muted">Used in ${wfs.map((w) => `<button class="linkbtn" data-act="agentWorkflow" data-arg="${w}">${esc(R(w).name)}</button>`).join(', ')}.</p>` : ''}` : '<p class="small muted">No agent uses it yet.</p>'}${give}</section>
      <section><h3>${kind === 'write' ? 'Recent changes, and who said yes' : 'Recent use'}</h3>${log.length ? `<ol class="timeline">${log.map(([w, t]) => `<li><b>${w}</b><span>${t}</span></li>`).join('')}</ol>` : '<p class="small muted">Not used yet.</p>'}</section>
      <p class="small muted">${i.origin ? i.origin() : 'Ships with the platform. The team built and tested it.'}</p>
    </div>`;
  }

  /* One agent, in a dialog: how it works, its limits, where it's used, and a plain-English way to change it. */
  function agentDialog(id) {
    const a = LIB(id);
    const now = agentNow(id);
    const vs = agentVersions(id);
    const d = S.agentDraft && S.agentDraft.id === id ? S.agentDraft : { text: '', result: null };
    const r = d.result;
    const name = AGENTS[id].name;
    const used = agentUsedBy(id);
    const say = (html) => `<div class="bubble small-bubble">${face('lead', 40)}<p><span class="vh">Planner: </span>${html}</p></div>`;
    let result = '';
    if (r && r.type === 'change') {
      result = `<div class="proposal" id="agent-proposal" tabindex="-1" data-pres="prop:${id}:${keyOf(d.text)}:${r.type}">
        ${say(`Here’s how I’d change the ${name}. The changed step is marked.`)}
        <ol class="plan">${r.plan.map((step, i) => (i !== r.changed ? `<li>${step}</li>` : r.added ? `<li class="chg"><span class="chip-new">New</span> <ins>${step}</ins></li>` : `<li class="chg"><del>${r.from}</del><ins>${step}</ins></li>`)).join('')}</ol>
        <ul class="checks"><li>${I.check(16)}<span>${r.addTool ? `Adds one tool from the tool list: <b>${TOOLS[r.addTool][0]}</b>. It still waits for a yes, every time` : 'Uses only the tools already on its card'}</span></li><li>${I.check(16)}<span>Doesn’t change what needs a yes, or who approves</span></li><li>${I.check(16)}<span>Doesn’t reach anything it couldn’t reach before</span></li></ul>
        ${S.firstDay ? '' : `<p><b>On its last run:</b> ${r.effect}</p>`}
        <p class="small muted">${used.length ? `${used.length === 1 ? '1 workflow uses' : `${used.length} workflows use`} this agent. Their next runs use version ${now.v + 1}. A run that’s already going keeps the version it started with.` : 'No workflow uses this agent yet.'}</p>
        <div class="btns"><button class="btn primary" data-act="agentSave">Save as version ${now.v + 1}</button><button class="btn" data-act="agentDiscard">Discard</button></div>
      </div>`;
    } else if (r) {
      const msg = {
        refuse: 'I can’t make that change. Anything that changes data always waits for a yes. That’s a platform rule, so no agent or workflow can change it.',
        tool: r.tool ? (toolState(r.tool) === 'asked' ? `That needs a new tool, <b>${TOOLS[r.tool][0]}</b>, and it’s waiting for an Approver’s OK. Ask me again once it’s OK’d.`
          : `The ${name}’s tools can’t set a component today. I can draft a new tool from Jira’s published API: <b>${TOOLS[r.tool][0]}</b>. It changes data, so an Approver who isn’t you must OK it once.`) : '',
        team: r.sys ? `${r.why} ${sentToTeam(r.sys) ? 'You’ve already sent this to the team. You can follow it on Tools.' : 'I can send your request to the team.'}` : '',
        target: `The Jira project comes from each workflow, not from the agent. That keeps every agent to the place its workflow names. To read OPS, change the project on that workflow, or set up a workflow for OPS.`,

  /* Open in n8n: staff can change a workflow's steps in n8n. One person has it at a time, every published change is kept, and the rules still hold. */

    const pairs = writes.flatMap((t, i) => [

  let dlgIn = false;

  /* PEOPLE carries the roles the rest of the prototype reads. Settings changes S.roles, and this copies them across. */
  function syncRoles() {
    Object.keys(PEOPLE).forEach((u) => { if (PEOPLE[u].added && !S.roles[u]) delete PEOPLE[u]; });
    Object.entries(S.roles).forEach(([u, r]) => {
      if (!PEOPLE[u]) PEOPLE[u] = { name: r.name, tone: 2, added: true };
      PEOPLE[u].op = r.op;
      PEOPLE[u].ap = r.ap;
      PEOPLE[u].role = r.op && r.ap ? 'Operator and Approver' : r.op ? 'Operator' : 'Approver';
    });
  }
  function render() {
    if (pressing) { pendingRender = true; return; }
    syncRoles();
    const v = S.view;
    let main = '';
    switch (v.name) {
      case 'home': main = todayView(); break;
      case 'workflows': main = boardView(); break;
      case 'workflow': main = routineView(v.id); break;
      case 'run': main = runView(v.id); break;
      case 'new': main = wizardView(); break;
      case 'done': main = doneView(); break;
