name: wab

x-platform-image: &platform-image
  build:
    context: ../platform-api
    target: runtime
  image: wab/platform-api:${WAB_IMAGE_TAG:-dev}

# The Cosmos DB emulator's published key.
x-cosmos: &cosmos-account
  COSMOS_ENDPOINT: http://cosmos:8081
  COSMOS_KEY: ${COSMOS_KEY:-C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw==}

services:
  postgres:
    image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run deploy/make-env.sh}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?run deploy/make-env.sh}
      WAB_OWNER_PASSWORD: ${WAB_OWNER_PASSWORD:?run deploy/make-env.sh}
      WAB_BUILDER_PASSWORD: ${WAB_BUILDER_PASSWORD:?run deploy/make-env.sh}
      WAB_ORCHESTRATION_PASSWORD: ${WAB_ORCHESTRATION_PASSWORD:?run deploy/make-env.sh}
      WAB_MONITORING_PASSWORD: ${WAB_MONITORING_PASSWORD:?run deploy/make-env.sh}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d platform"]
      interval: 3s
      timeout: 3s
      retries: 20

  cosmos:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview@sha256:db53613dae19d0a3d5ad50688d14aa6e957af082dafea56b52e1bd3a6b3f1406
    environment:
      GATEWAY_PUBLIC_ENDPOINT: cosmos
      ENABLE_EXPLORER: "false"
      ENABLE_TELEMETRY: "false"
    # Stops the emulator upgrading its own packages at each start. deploy/README.md says why.
    extra_hosts:
      - "packages.microsoft.com:127.0.0.1"
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080
          && printf 'GET /ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          && read -r status <&3 && [[ $$status == *' 200 '* ]]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 10s

  n8n:
    image: n8nio/n8n:2.42.6@sha256:526daa38b68e923cc00c5280d18b4da5d489f115a73bdbf3b8e452b184197a9a
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?run deploy/make-env.sh}
      WEBHOOK_URL: http://n8n:5678/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?run deploy/make-env.sh}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_HIRING_BANNER_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
    ports:
      - "${N8N_HOST_PORT:-5678}:5678"
    volumes:
      - n8ndata:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz/readiness || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40

  agent-runtime:
    build:
      context: ../agent-runtime
      target: runtime
    image: wab/agent-runtime:${WAB_IMAGE_TAG:-dev}
    environment:
      GITHUB_API_BASE: ${GITHUB_API_BASE:-https://api.github.com}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      AGENT_API_KEY: ${AGENT_API_KEY:?run deploy/make-env.sh}
      CALLBACK_ALLOWED_ORIGINS: http://platform-api:8000
      PRACTICE_JIRA_URL: http://platform-api:8000
      AGENT_SUMMARY_MODEL: ${AGENT_SUMMARY_MODEL:-}
      AGENT_MODEL_BASE_URL: ${AGENT_MODEL_BASE_URL:-}
      AGENT_MODEL_API_KEY: ${AGENT_MODEL_API_KEY:-}
      AGENT_MODEL_PRIVATE_HOSTS: ${AGENT_MODEL_PRIVATE_HOSTS:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/healthz', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20

  bootstrap:
    <<: *platform-image
    command: ["python", "-m", "platform_api.bootstrap"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      n8n:
        condition: service_healthy
    environment:
      DATABASE_URL_OWNER: postgresql://wab_owner:${WAB_OWNER_PASSWORD:?run deploy/make-env.sh}@postgres:5432/platform
      N8N_BASE_URL: http://n8n:5678
      N8N_OWNER_EMAIL: ${N8N_OWNER_EMAIL:?run deploy/make-env.sh}
      N8N_OWNER_PASSWORD: ${N8N_OWNER_PASSWORD:?run deploy/make-env.sh}
      STEP_KEY: ${STEP_KEY:?run deploy/make-env.sh}
      PLATFORM_INTERNAL_URL: http://platform-api:8000

  platform-api:
    <<: *platform-image
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      agent-runtime:
        condition: service_healthy
    environment:
      <<: *cosmos-account
      ACTIVITY_READER: ${ACTIVITY_READER:-cosmos}
      AUTH_MODE: dev
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:${PORTAL_HOST_PORT:-8080}}
      DATABASE_URL_BUILDER: postgresql://wab_builder:${WAB_BUILDER_PASSWORD:?run deploy/make-env.sh}@postgres:5432/platform
      DATABASE_URL_ORCHESTRATION: postgresql://wab_orchestration:${WAB_ORCHESTRATION_PASSWORD:?run deploy/make-env.sh}@postgres:5432/platform
      DATABASE_URL_MONITORING: postgresql://wab_monitoring:${WAB_MONITORING_PASSWORD:?run deploy/make-env.sh}@postgres:5432/platform
      AGENT_RUNTIME_URL: http://agent-runtime:8100
      AGENT_API_KEY: ${AGENT_API_KEY:?run deploy/make-env.sh}
      N8N_BASE_URL: http://n8n:5678
      STEP_KEY: ${STEP_KEY:?run deploy/make-env.sh}
      PLATFORM_INTERNAL_URL: http://platform-api:8000
      CALLBACK_SIGNING_KEY: ${CALLBACK_SIGNING_KEY:?run deploy/make-env.sh}
      # Optional: without it the Portal's AI model settings are off (ADR 0022).
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
      # The first deploy's people (ADR 0030). Read only while the People list is empty, and only
      # with real sign-in; dev mode seeds alice, bob and carol instead.
      FIRST_OPERATOR: ${FIRST_OPERATOR:-}
      FIRST_APPROVERS: ${FIRST_APPROVERS:-}
    ports:
      - "${PLATFORM_API_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20

  portal:
    build:
      context: ..
      dockerfile: portal/Dockerfile
    image: wab/portal:${WAB_IMAGE_TAG:-dev}
    depends_on:
      platform-api:
        condition: service_healthy
    environment:
      PORTAL_MODE: live
      API_UPSTREAM: http://platform-api:8000
    ports:
      - "${PORTAL_HOST_PORT:-8080}:8080"

volumes:
  pgdata:
  n8ndata:
