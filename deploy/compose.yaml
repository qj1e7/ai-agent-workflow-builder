name: wab

x-platform-image: &platform-image
  build:
    context: ../platform-api
    target: runtime
  image: wab/platform-api:${WAB_IMAGE_TAG:-dev}

# Langfuse's web app and worker read the same settings (ADR 0050). Every part listens only inside
# the network, except the web app on the host's localhost.
x-langfuse-env: &langfuse-env
  DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD:-}@postgres:5432/langfuse
  NEXTAUTH_URL: http://localhost:${LANGFUSE_HOST_PORT:-3000}
  SALT: ${LANGFUSE_SALT:-}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:-}
  TELEMETRY_ENABLED: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: langfuse
  CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_HOST: valkey
  REDIS_PORT: "6379"
  REDIS_AUTH: ${LANGFUSE_VALKEY_PASSWORD:-}
  LANGFUSE_USE_AZURE_BLOB: "true"
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://azurite:10000/devstoreaccount1
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: devstoreaccount1
  # Azurite's published development key.
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: &azurite-key ${AZURITE_KEY:-Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==}
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://azurite:10000/devstoreaccount1
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: devstoreaccount1
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: *azurite-key

x-langfuse-depends: &langfuse-depends
  langfuse-db:
    condition: service_completed_successfully
  clickhouse:
    condition: service_healthy
  valkey:
    condition: service_healthy
  azurite:
    condition: service_started

# The Cosmos DB emulator's published key.
x-cosmos: &cosmos-account
  COSMOS_ENDPOINT: http://cosmos:8081
  COSMOS_KEY: ${COSMOS_KEY:-C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw==}

services:
  postgres:
    image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run deploy/make-env.sh}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?run deploy/make-env.sh}
      WAB_OWNER_PASSWORD: ${WAB_OWNER_PASSWORD:?run deploy/make-env.sh}
      WAB_BUILDER_PASSWORD: ${WAB_BUILDER_PASSWORD:?run deploy/make-env.sh}
      WAB_ORCHESTRATION_PASSWORD: ${WAB_ORCHESTRATION_PASSWORD:?run deploy/make-env.sh}
      WAB_MONITORING_PASSWORD: ${WAB_MONITORING_PASSWORD:?run deploy/make-env.sh}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d platform"]
      interval: 3s
      timeout: 3s
      retries: 20

  cosmos:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview@sha256:db53613dae19d0a3d5ad50688d14aa6e957af082dafea56b52e1bd3a6b3f1406
    environment:
      GATEWAY_PUBLIC_ENDPOINT: cosmos
      ENABLE_EXPLORER: "false"
      ENABLE_TELEMETRY: "false"
    # Stops the emulator upgrading its own packages at each start. deploy/README.md says why.
    extra_hosts:
      - "packages.microsoft.com:127.0.0.1"
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080
          && printf 'GET /ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          && read -r status <&3 && [[ $$status == *' 200 '* ]]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 10s

  n8n:
    build:
      context: ..
      dockerfile: deploy/n8n/Dockerfile
    image: wab/n8n:${WAB_IMAGE_TAG:-dev}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?run deploy/make-env.sh}
      WEBHOOK_URL: http://n8n:5678/
      # A workflow set to n8n's default zone runs on the team's, as platform-api reads it.
      GENERIC_TIMEZONE: ${TEAM_TIME_ZONE:-Asia/Singapore}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?run deploy/make-env.sh}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_HIRING_BANNER_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
      # Stops n8n asking api.n8n.io for its list of MCP servers every 8 hours. We use no MCP servers in
      # n8n, and a locked-down network refuses the call (issue #86). n8n 2.42.6 reads this setting in
      # @n8n/backend-common's ModulesConfig, and docs/evidence/devnet/n8n-proxy.test.sh checks it.
      N8N_DISABLED_MODULES: mcp-registry
      # The keys below are in this container's environment, so nothing a person adds to a workflow may
      # read it: no $env in expressions, no Execute Command, no community packages. Execute Command and
      # Local File Trigger are n8n's own default exclusions, pinned here so an upgrade cannot drop them.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      NODES_EXCLUDE: '["n8n-nodes-base.executeCommand","n8n-nodes-base.localFileTrigger"]'
      N8N_COMMUNITY_PACKAGES_ENABLED: "false"
      # The allow list: n8n loads only these node types. scripts/nodes-include.sh writes it from
      # platform-api's node_classes.json (ADR 0045), and CI fails when the two differ.
      NODES_INCLUDE: '["CUSTOM.wabStartFromPortal","CUSTOM.wabRead","CUSTOM.wabAgent","CUSTOM.wabProposeChange","CUSTOM.wabAskForYes","CUSTOM.wabMakeApprovedChanges","CUSTOM.wabTell","CUSTOM.wabReportFailure","n8n-nodes-base.scheduleTrigger","n8n-nodes-base.manualTrigger","n8n-nodes-base.errorTrigger","n8n-nodes-base.if","n8n-nodes-base.merge","n8n-nodes-base.noOp","n8n-nodes-base.stickyNote","n8n-nodes-base.filter","n8n-nodes-base.switch","n8n-nodes-base.set","n8n-nodes-base.limit","n8n-nodes-base.aggregate","n8n-nodes-base.splitOut","n8n-nodes-base.removeDuplicates","n8n-nodes-base.summarize","n8n-nodes-base.renameKeys","n8n-nodes-base.dateTime","n8n-nodes-base.compareDatasets","n8n-nodes-base.splitInBatches","n8n-nodes-base.xml","n8n-nodes-base.markdown","n8n-nodes-base.executionData","n8n-nodes-base.stopAndError","n8n-nodes-base.jira","n8n-nodes-base.github","n8n-nodes-base.microsoftTeams","n8n-nodes-base.microsoftOutlook","n8n-nodes-base.gmail","n8n-nodes-base.slack"]'
      # n8n keeps 30 days of executions (ENGINE-PLAN D10). Our API keeps every node's answer, so the
      # Portal loses nothing, and n8n never prunes a waiting execution (P7 Q16).
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "720"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      # Our blocks call only this API, with this key, and check each start with the secret.
      WAB_API_URL: http://platform-api:8000
      WAB_NODE_KEY: ${WAB_NODE_KEY:?run deploy/make-env.sh}
      WAB_START_SECRET: ${WAB_START_SECRET:?run deploy/make-env.sh}
    ports:
      - "${N8N_HOST_PORT:-5678}:5678"
    volumes:
      - n8ndata:/home/node/.n8n
    # BusyBox wget ignores NO_PROXY and asks a proxy even for localhost, so the check never uses one.
    # That keeps it working wherever n8n is given a proxy, as in compose.lockdown.yaml.
    healthcheck:
      test: ["CMD-SHELL", "wget -Y off -qO- http://localhost:5678/healthz/readiness || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40

  agent-runtime:
    build:
      context: ../agent-runtime
      target: runtime
    image: wab/agent-runtime:${WAB_IMAGE_TAG:-dev}
    environment:
      GITHUB_API_BASE: ${GITHUB_API_BASE:-https://api.github.com}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      AGENT_API_KEY: ${AGENT_API_KEY:?run deploy/make-env.sh}
      CALLBACK_ALLOWED_ORIGINS: http://platform-api:8000
      # The Jira tools read through platform-api, never from Jira itself (ADR 0035). It must be one of
      # CALLBACK_ALLOWED_ORIGINS, because each read carries the task's callback token.
      PLATFORM_JIRA_URL: http://platform-api:8000
      AGENT_SUMMARY_MODEL: ${AGENT_SUMMARY_MODEL:-}
      AGENT_MODEL_BASE_URL: ${AGENT_MODEL_BASE_URL:-}
      AGENT_MODEL_API_KEY: ${AGENT_MODEL_API_KEY:-}
      AGENT_MODEL_PRIVATE_HOSTS: ${AGENT_MODEL_PRIVATE_HOSTS:-}
      # Tracing stays off until LANGFUSE_BASE_URL is set, for example to http://langfuse-web:3000 with
      # the langfuse profile on. The keys follow it, so all three are set or none is (ADR 0050).
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_BASE_URL:+${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:-}}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_BASE_URL:+${LANGFUSE_INIT_PROJECT_SECRET_KEY:-}}
      LANGFUSE_TRACING_ENVIRONMENT: local
      LANGFUSE_RELEASE: ${WAB_IMAGE_TAG:-dev}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/healthz', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20

  bootstrap:
    <<: *platform-image
    command: ["python", "-m", "platform_api.bootstrap"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      n8n:
        condition: service_healthy
    environment:
      DATABASE_URL_OWNER: postgresql://wab_owner:${WAB_OWNER_PASSWORD:?run deploy/make-env.sh}@postgres:5432/platform
      N8N_BASE_URL: http://n8n:5678
      N8N_OWNER_EMAIL: ${N8N_OWNER_EMAIL:?run deploy/make-env.sh}
      N8N_OWNER_PASSWORD: ${N8N_OWNER_PASSWORD:?run deploy/make-env.sh}
      STEP_KEY: ${STEP_KEY:?run deploy/make-env.sh}
      PLATFORM_INTERNAL_URL: http://platform-api:8000
      # The self-test runs on the team time zone, as every workflow does.
      TEAM_TIME_ZONE: ${TEAM_TIME_ZONE:-Asia/Singapore}

  platform-api:
    <<: *platform-image
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      agent-runtime:
        condition: service_healthy
    environment:
      <<: *cosmos-account
      ACTIVITY_READER: ${ACTIVITY_READER:-cosmos}
      AUTH_MODE: dev
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:${PORTAL_HOST_PORT:-8080}}
      DATABASE_URL_BUILDER: postgresql://wab_builder:${WAB_BUILDER_PASSWORD:?run deploy/make-env.sh}@postgres:5432/platform
      DATABASE_URL_ORCHESTRATION: postgresql://wab_orchestration:${WAB_ORCHESTRATION_PASSWORD:?run deploy/make-env.sh}@postgres:5432/platform
      DATABASE_URL_MONITORING: postgresql://wab_monitoring:${WAB_MONITORING_PASSWORD:?run deploy/make-env.sh}@postgres:5432/platform
      AGENT_RUNTIME_URL: http://agent-runtime:8100
      AGENT_API_KEY: ${AGENT_API_KEY:?run deploy/make-env.sh}
      # The same switch as the agent runtime's: scores go to Langfuse only once LANGFUSE_BASE_URL is set.
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_BASE_URL:+${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:-}}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_BASE_URL:+${LANGFUSE_INIT_PROJECT_SECRET_KEY:-}}
      LANGFUSE_TRACING_ENVIRONMENT: local
      TRACE_PSEUDONYM_KEY: ${TRACE_PSEUDONYM_KEY:-}
      N8N_BASE_URL: http://n8n:5678
      # n8n's owner, as bootstrap uses it: the platform lays each new workflow out in n8n as a draft.
      N8N_OWNER_EMAIL: ${N8N_OWNER_EMAIL:?run deploy/make-env.sh}
      N8N_OWNER_PASSWORD: ${N8N_OWNER_PASSWORD:?run deploy/make-env.sh}
      # on lets an Operator give a person n8n access: the platform makes their n8n account and
      # opens workflows in it, once bootstrap has proved the allow list (ENGINE-PLAN 2.9). It needs
      # SETTINGS_ENCRYPTION_KEY, which seals each password link. N8N_EDITOR_URL is where people open
      # n8n's editor from their browser.
      N8N_STAFF_ACCESS: ${N8N_STAFF_ACCESS:-off}
      N8N_EDITOR_URL: ${N8N_EDITOR_URL:-http://localhost:${N8N_HOST_PORT:-5678}}
      STEP_KEY: ${STEP_KEY:?run deploy/make-env.sh}
      PLATFORM_INTERNAL_URL: http://platform-api:8000
      CALLBACK_SIGNING_KEY: ${CALLBACK_SIGNING_KEY:?run deploy/make-env.sh}
      # The same two values n8n has: our API checks the node pack's key and signs each start.
      WAB_NODE_KEY: ${WAB_NODE_KEY:?run deploy/make-env.sh}
      WAB_START_SECRET: ${WAB_START_SECRET:?run deploy/make-env.sh}
      # Optional: without it the Portal's AI model settings are off (ADR 0022).
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
      # The Teams channel the approval card names. With TEAMS_WEBHOOK_URL set, the card goes to
      # that real channel through a Teams Workflows webhook; unset keeps the practice copy (ADR 0036).
      TEAMS_CHANNEL: ${TEAMS_CHANNEL:-CODESparks Ops}
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}
      # Optional: sends new team request cards to a different channel. Unset, they go to the
      # approvals channel above, and with neither set nothing is posted (ADR 0038).
      TEAMS_REQUESTS_WEBHOOK_URL: ${TEAMS_REQUESTS_WEBHOOK_URL:-}
      # Optional: the Tell flow, which posts a run's notice and emails it. Unset keeps the practice
      # copy. Set, it needs TELL_EMAIL_TO, the team's email list, separated by commas.
      TEAMS_TELL_WEBHOOK_URL: ${TEAMS_TELL_WEBHOOK_URL:-}
      TELL_EMAIL_TO: ${TELL_EMAIL_TO:-}
      # The first deploy's people (ADR 0030). Read only while the People list is empty, and only
      # with real sign-in; dev mode seeds alice, bob and carol instead.
      FIRST_OPERATOR: ${FIRST_OPERATOR:-}
      FIRST_APPROVERS: ${FIRST_APPROVERS:-}
      # The practice Jira's own pages are served while this is on (ADR 0035).
      PRACTICE_SYSTEMS: ${PRACTICE_SYSTEMS:-on}
      # A real Jira (ADR 0035). With JIRA_BASE_URL unset, platform-api serves and calls its own
      # practice Jira, which speaks both flavors. JIRA_EMAIL is for Cloud only.
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_API_FLAVOR: ${JIRA_API_FLAVOR:-datacenter}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_ISSUE_TYPE: ${JIRA_ISSUE_TYPE:-Task}
      JIRA_BROWSE_URL: ${JIRA_BROWSE_URL:-}
      # The Jira project the watchlist raises tickets in. MOCK is the practice Jira's.
      WATCHLIST_JIRA_PROJECT: ${WATCHLIST_JIRA_PROJECT:-MOCK}
      # The zone the team works in. The Portal's times, a new schedule, the agents' today and the
      # Jira days are in it, and n8n runs on it.
      TEAM_TIME_ZONE: ${TEAM_TIME_ZONE:-Asia/Singapore}
      # Confluence (ENGINE-PLAN E12). Unset keeps it not connected. The wiki's address, such as
      # https://your-site.atlassian.net/wiki, and the only pages read, as id=title separated by ;.
      CONFLUENCE_BASE_URL: ${CONFLUENCE_BASE_URL:-}
      CONFLUENCE_EMAIL: ${CONFLUENCE_EMAIL:-}
      CONFLUENCE_API_TOKEN: ${CONFLUENCE_API_TOKEN:-}
      CONFLUENCE_PAGES: ${CONFLUENCE_PAGES:-}
      # The keys the platform makes in n8n for n8n's own Jira, GitHub and Slack blocks (ADR 0045).
      # Each is made only once its system shows it can only read or post. With none for Jira, the
      # practice Jira lends its browse-only account. SLACK_API_URL is where the platform asks Slack.
      N8N_KEY_JIRA_URL: ${N8N_KEY_JIRA_URL:-}
      N8N_KEY_JIRA_EMAIL: ${N8N_KEY_JIRA_EMAIL:-}
      N8N_KEY_JIRA_TOKEN: ${N8N_KEY_JIRA_TOKEN:-}
      N8N_KEY_GITHUB_URL: ${N8N_KEY_GITHUB_URL:-}
      N8N_KEY_GITHUB_TOKEN: ${N8N_KEY_GITHUB_TOKEN:-}
      N8N_KEY_SLACK_TOKEN: ${N8N_KEY_SLACK_TOKEN:-}
      SLACK_API_URL: ${SLACK_API_URL:-}
    ports:
      - "${PLATFORM_API_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Makes Langfuse's role and database in our postgres, on a new volume or an old one.
  langfuse-db:
    image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    profiles: [langfuse]
    # A one-shot job: unless-stopped would start it again after every success.
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?run deploy/make-env.sh}
      LANGFUSE_DB_PASSWORD: ${LANGFUSE_DB_PASSWORD:-}
      LANGFUSE_SALT: ${LANGFUSE_SALT:-}
      LANGFUSE_ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:-}
      LANGFUSE_NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-}
      LANGFUSE_CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-}
      LANGFUSE_VALKEY_PASSWORD: ${LANGFUSE_VALKEY_PASSWORD:-}
    volumes:
      - ./postgres/langfuse-db.sh:/langfuse-db.sh:ro
    command: ["sh", "/langfuse-db.sh"]

  clickhouse:
    image: clickhouse/clickhouse-server:26.3.62.3@sha256:de3e47c64078aa196dae2349e048fc98ba81947f651f5c20e06e46baea8ae40a
    profiles: [langfuse]
    restart: unless-stopped
    user: "101:101"
    # Langfuse asks for more. The whole profile peaked at 3.3 GiB with this cap (ADR 0050).
    mem_limit: 1536m
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-}
    volumes:
      - clickhousedata:/var/lib/clickhouse
      - clickhouselogs:/var/log/clickhouse-server
      - ./langfuse/clickhouse.xml:/etc/clickhouse-server/config.d/langfuse.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40

  valkey:
    image: valkey/valkey:8.1.11@sha256:8f836008e0986c36adf50da714c7060cf689dbb335f61fe077939d90fa650809
    profiles: [langfuse]
    restart: unless-stopped
    command:
      - sh
      - -c
      - exec valkey-server --requirepass "$$VALKEY_PASSWORD" --maxmemory-policy noeviction
    environment:
      VALKEY_PASSWORD: ${LANGFUSE_VALKEY_PASSWORD:-}
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$VALKEY_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 20

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0@sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5
    profiles: [langfuse]
    restart: unless-stopped
    environment:
      AZURITE_KEY: *azurite-key
    # Langfuse does not make its blob container, so a small script makes it once Azurite answers.
    command:
      - sh
      - -c
      - node /opt/langfuse/blob-container.js & exec azurite-blob --blobHost 0.0.0.0 --location /data --skipApiVersionCheck
    volumes:
      - azuritedata:/data
      - ./langfuse/blob-container.js:/opt/langfuse/blob-container.js:ro

  langfuse-worker:
    image: langfuse/langfuse-worker:4.80.0@sha256:da9f618dd784219aa6508ab6941c4a89c4ef6fb429fb1734c4163df3baa8f1ca
    profiles: [langfuse]
    restart: unless-stopped
    depends_on: *langfuse-depends
    environment:
      <<: *langfuse-env

  langfuse-web:
    image: langfuse/langfuse:4.80.0@sha256:0814758db3db8e923f733be3884e7d7a9e3afd60568d874a610d78aae47476c5
    profiles: [langfuse]
    restart: unless-stopped
    depends_on: *langfuse-depends
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-}
      LANGFUSE_DISABLE_SIGNUP_ONBOARDING: "true"
      LANGFUSE_INIT_ORG_ID: codesparks
      LANGFUSE_INIT_ORG_NAME: CODESparks
      LANGFUSE_INIT_PROJECT_ID: ai-workflow-builder
      LANGFUSE_INIT_PROJECT_NAME: AI Workflow Builder
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:-}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-}
      LANGFUSE_INIT_USER_NAME: Team lead
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-}
    ports:
      - "127.0.0.1:${LANGFUSE_HOST_PORT:-3000}:3000"
    healthcheck:
      # The web app listens on the container's own name, not on localhost.
      test: ["CMD-SHELL", "wget -qO- http://$$HOSTNAME:3000/api/public/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s

  portal:
    build:
      context: ..
      dockerfile: portal/Dockerfile
    image: wab/portal:${WAB_IMAGE_TAG:-dev}
    depends_on:
      platform-api:
        condition: service_healthy
    environment:
      PORTAL_MODE: live
      API_UPSTREAM: http://platform-api:8000
    ports:
      - "${PORTAL_HOST_PORT:-8080}:8080"

volumes:
  pgdata:
  n8ndata:
  clickhousedata:
  clickhouselogs:
  valkeydata:
  azuritedata:
