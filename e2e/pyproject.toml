[project]
name = "e2e"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28,<0.29",
    "pytest>=8.4",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.14",
]

[tool.uv]
package = false
exclude-newer = "7 days"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.pyright]
include = ["tests", "mock_github"]
strict = ["tests", "mock_github"]
extraPaths = ["tests", "mock_github"]
pythonVersion = "3.14"
