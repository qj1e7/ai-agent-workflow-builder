[project]
name = "agent-runtime"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.120",
    "pydantic>=2.11",
    "uvicorn>=0.34",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pyright>=1.1.414",
    "pytest>=8.4",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
strict = ["src"]
pythonVersion = "3.14"
