[project]
name = "agent-runtime"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.12,<2",
    "fastapi>=0.120",
    "httpx>=0.28,<0.29",
    "httpx2>=2.15,<3",
    "langchain==1.4.3",
    "langchain-anthropic==1.7.5",
    "langchain-core==1.6.6",
    "langchain-openai==1.6.7",
    "langfuse==5.2.0",
    "langgraph==1.2.13",
    "pydantic>=2.11",
    "uvicorn>=0.34",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=8.4",
    "ruff>=0.14",
]
evals = [
    "langchain-google-genai==4.4.0",
    "langchain-ollama==1.1.0",
]
# Spike A (spike/dspy-free-reply): DSPy's GEPA searches for the free reply's instructions offline.
# Never installed in an image: the Dockerfile syncs the dev group, the evals group or none.
spike = [
    "dspy==3.4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.pyright]
include = ["src", "tests", "evals", "scripts"]
strict = ["src"]
pythonVersion = "3.14"

[tool.uv]
conflicts = [[{ group = "dev" }, { group = "evals" }]]

[tool.uv.exclude-newer-package]
anthropic = "2026-10-08T00:00:00Z"
google-auth = "2026-10-08T00:00:00Z"
google-genai = "2026-10-08T00:00:00Z"
openai = "2026-10-08T00:00:00Z"
pycparser = "2026-10-08T00:00:00Z"
# The spike group's packages, each only in that group, held to releases two weeks old or more.
aiohappyeyeballs = "2026-11-06T00:00:00Z"
