[extend]
useDefault = true

[allowlist]
description = "Azure built-in role definition IDs are public, not secrets, and Terraform names a variable for each n8n key setting, whose value is that variable, not a key"
regexes = [
  '''4633458b-17de-408a-b874-0445c86b69e6''',
  '''b86a8fe4-44ce-4948-aee5-eccb2c155cd7''',
  '''var\.n8n_key_[a-z_]+''',
]
