[extend]
useDefault = true

[allowlist]
description = "Azure built-in role definition IDs are public, not secrets. Terraform names a variable for each n8n key setting, whose value is that variable, not a key. It also maps each Langfuse password in Key Vault to the name of the setting that carries it on the VM, not to a password. The simulation n8n's Terraform maps each setting to the name of the key it generates for it, not to a password"
regexes = [
  '''4633458b-17de-408a-b874-0445c86b69e6''',
  '''b86a8fe4-44ce-4948-aee5-eccb2c155cd7''',
  '''var\.n8n_key_[a-z_]+''',
  '''^"?(LANGFUSE_DB|CLICKHOUSE|VALKEY|LANGFUSE_INIT_USER)_PASSWORD"?$''',
  '''^"?(postgres|n8n-db|owner|builder|orchestration|monitoring|n8n-owner)-password"?$''',
]
