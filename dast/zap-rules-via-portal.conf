# Added to zap-rules.conf for the scan of /api/ through the Portal's nginx only. Same format and same rule.

# ZAP also probes paths that are not in the API document, such as /.env and /WEB-INF/web.xml. nginx answers every unknown path
# with the Portal's index.html and status 200, which is how a single-page app works, and ZAP reports that page as the wrong content type.
# The page is the public shell and holds no data. The direct platform-api scan keeps this rule on and found nothing.
100001	IGNORE	(Unexpected Content-Type was returned)
