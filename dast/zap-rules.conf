# Rules for scripts/dast.sh, in ZAP's config format: rule id, TAB, action, TAB, (name).
# Giving ZAP a rules file also makes it run every active rule, not its small API policy.
# A rule that is not listed here fails the run when it raises an alert. Every IGNORE needs a reason on the line above it.
# Do not add a line to hide a real finding. Fix the finding instead.

# The scanner sends malformed input on purpose, so the API answers 4xx. That is the API refusing bad input, which is correct.
100000	IGNORE	(A Client Error response code was returned by the server)

# This rule drives a headless browser. In an 8 GB Docker VM it ran the scan container out of memory and the kernel killed ZAP, on 3 of 3 runs.
# The API answers JSON only, so there is no page for a browser to run script in. The Portal's DOM is a gap, written down in dast/README.md.
40026	IGNORE	(Cross Site Scripting (DOM Based))

# This is ZAP's hint that the Portal is a single-page app and its plain spider sees few pages. It is advice about scan coverage, not a weakness.
# The coverage gap is written down in dast/README.md.
10109	IGNORE	(Modern Web Application)
